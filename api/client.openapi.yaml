openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Latchway Client API
  version: 1.0.0
  summary: DPoP-bound client sessions and AI-compatible proxy routes.
  description: |
    Normative draft for current wire protocol version 2. Legacy wire protocol
    version 1 remains accepted for compatible installation/session clients.
    Identity, attestation and DPoP
    establish a short-lived installation session. Protected AI requests name an
    application feature; clients cannot select trusted users, routes, prices or
    upstream credentials. Browser requests carry one exact canonical HTTPS
    `Origin`; it is authorized against the active web-attestation selection on
    every session and protected data-plane operation. Native requests omit it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://gateway.example.test
    description: Documentation-only origin; deployments advertise their own origin.
tags:
  - name: Discovery
  - name: Sessions
  - name: Installations
  - name: Components
  - name: Features
  - name: Diagnostics
  - name: AI proxy
paths:
  /.well-known/jwks.json:
    get:
      tags: [Discovery]
      operationId: getGatewayJwks
      summary: Return public gateway session-signing keys.
      security: []
      responses:
        '200':
          description: JSON Web Key Set containing only public key members.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonWebKeySet'
        default:
          $ref: '#/components/responses/Problem'
  /.well-known/latchway:
    get:
      tags: [Discovery]
      operationId: getLatchwayDiscovery
      summary: Discover protocol and SDK compatibility.
      security: []
      responses:
        '200':
          description: Deployment discovery metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
        default:
          $ref: '#/components/responses/Problem'
  /client/v1/session-challenges:
    post:
      tags: [Sessions]
      operationId: createSessionChallenge
      summary: Verify application identity and create a one-time attestation challenge.
      description: The DPoP proof omits `ath` because no access token exists yet.
      security:
        - DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionChallengeRequest'
      responses:
        '201':
          description: One-time challenge bound to identity and the DPoP JWK thumbprint.
          headers:
            X-Latchway-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionChallenge'
        '401':
          $ref: '#/components/responses/Problem'
        '426':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /client/v1/sessions:
    post:
      tags: [Sessions]
      operationId: exchangeSessionChallenge
      summary: Consume a challenge, verify attestation and issue a DPoP-bound session.
      security:
        - DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionExchangeRequest'
      responses:
        '201':
          description: Access and one-time refresh credentials bound to the installation.
          headers:
            X-Latchway-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrant'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /client/v1/sessions/refresh:
    post:
      tags: [Sessions]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new access token.
      description: The DPoP proof is verified against the key bound to the stored refresh token.
      security:
        - DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshRequest'
      responses:
        '200':
          description: Rotated session credentials. The previous refresh token is invalid.
          headers:
            X-Latchway-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrant'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /client/v1/installation-families/current/components:
    post:
      tags: [Components]
      operationId: provisionComponent
      summary: Create or replace a configured delegated client component.
      description: |
        The authenticated root component registers only a public P-256 key.
        The returned opaque refresh grant is stored by the server only as a
        hash and is bound to that component key, feature scope and delegation.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/CurrentProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionComponentRequest' }
      responses:
        '201':
          description: Component key, delegation and one-time provisioning grant created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionComponentResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /client/v1/component-sessions:
    post:
      tags: [Components]
      operationId: createComponentSession
      summary: Consume a component provisioning grant and create its independent session family.
      security:
        - DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/CurrentProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentSessionRequest' }
      responses:
        '201':
          description: Initial independently rotating component session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentSessionResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /client/v1/installation-families/current/components/{component_id}/attestation-challenges:
    post:
      tags: [Components]
      operationId: createComponentAttestationChallenge
      summary: Create a one-use direct App Attest challenge for the current delegated component.
      description: |
        Available only to configured Action, SSO and watchOS components whose
        exact bundle identifier has a referenced App Attest policy. The
        version-2 binding includes the installation family, component
        definition, current component key and DPoP thumbprint. The current
        component access session authorizes this bodyless operation.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/ComponentIDPath'
        - $ref: '#/components/parameters/CurrentProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      responses:
        '201':
          description: One-use component-scoped App Attest challenge.
          headers:
            X-Latchway-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentAttestationChallenge' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /client/v1/installation-families/current/components/{component_id}/attestation-exchanges:
    post:
      tags: [Components]
      operationId: exchangeComponentAttestation
      summary: Verify direct component evidence and rotate that component's session family.
      description: |
        The path component, access-token principal, one-use challenge,
        component key and App Attest assertion must all describe the same
        durable component. Success preserves parent/delegation provenance,
        adds direct evidence and revokes the component's delegated-only
        sessions without affecting its parent or siblings.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/ComponentIDPath'
        - $ref: '#/components/parameters/CurrentProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentAttestationExchangeRequest' }
      responses:
        '201':
          description: Rotated DPoP-bound component session with direct-attestation provenance.
          headers:
            X-Latchway-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /client/v1/installation-families/current/components/{component_id}:
    delete:
      tags: [Components]
      operationId: revokeComponent
      summary: Revoke one delegated component without revoking its siblings.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/ComponentIDPath'
        - $ref: '#/components/parameters/CurrentProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      responses:
        '204': { description: The component and only its descendant credentials are revoked. }
        default: { $ref: '#/components/responses/Problem' }
  /client/v1/installation-families/current:
    delete:
      tags: [Components]
      operationId: revokeCurrentInstallationFamily
      summary: Revoke the current Installation Family and every component session beneath it.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/CurrentProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      responses:
        '204': { description: The family and all component sessions are revoked. }
        default: { $ref: '#/components/responses/Problem' }
  /client/v1/installations/current:
    delete:
      tags: [Installations]
      operationId: revokeCurrentInstallation
      summary: Revoke the current installation and all of its sessions.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      responses:
        '204':
          description: Installation revoked. No response body is returned.
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /client/v1/features/{feature}/quota:
    get:
      tags: [Features]
      operationId: getFeatureQuota
      summary: Return safe effective quota information for the current principal.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/FeaturePath'
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      responses:
        '200':
          description: Effective counters and reset/availability information; no policy internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaSnapshot'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /client/v1/diagnostics:
    get:
      tags: [Diagnostics]
      operationId: getClientDiagnostics
      summary: Return redacted session and capability diagnostics.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      responses:
        '200':
          description: Safe diagnostics without tokens, raw evidence, subjects or credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDiagnostics'
        default:
          $ref: '#/components/responses/Problem'
  /v1/responses:
    post:
      tags: [AI proxy]
      operationId: proxyOpenAIResponses
      summary: Proxy an OpenAI Responses-compatible request selected by feature.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/FeatureHeader'
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        $ref: '#/components/requestBodies/AIRequest'
      responses:
        '200':
          $ref: '#/components/responses/AIResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/chat/completions:
    post:
      tags: [AI proxy]
      operationId: proxyOpenAIChatCompletions
      summary: Proxy an OpenAI Chat Completions-compatible request selected by feature.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/FeatureHeader'
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        $ref: '#/components/requestBodies/AIRequest'
      responses:
        '200':
          $ref: '#/components/responses/AIResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/embeddings:
    post:
      tags: [AI proxy]
      operationId: proxyOpenAIEmbeddings
      summary: Proxy an OpenAI Embeddings-compatible request selected by feature.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/FeatureHeader'
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        $ref: '#/components/requestBodies/AIRequest'
      responses:
        '200':
          $ref: '#/components/responses/AIJSONResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/messages:
    post:
      tags: [AI proxy]
      operationId: proxyAnthropicMessages
      summary: Proxy an Anthropic Messages-compatible request selected by feature.
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/FeatureHeader'
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/SDK'
        - $ref: '#/components/parameters/SDKVersion'
        - $ref: '#/components/parameters/Framework'
        - $ref: '#/components/parameters/FrameworkVersion'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        $ref: '#/components/requestBodies/AIRequest'
      responses:
        '200':
          $ref: '#/components/responses/AIResponse'
        default:
          $ref: '#/components/responses/Problem'
  /proxy/{feature}/{remainingPath}:
    parameters:
      - $ref: '#/components/parameters/FeaturePath'
      - $ref: '#/components/parameters/RemainingPath'
      - $ref: '#/components/parameters/FeatureHeader'
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/SDK'
      - $ref: '#/components/parameters/SDKVersion'
      - $ref: '#/components/parameters/Framework'
      - $ref: '#/components/parameters/FrameworkVersion'
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/BrowserOrigin'
    get:
      tags: [AI proxy]
      operationId: proxyRestrictedOpaqueHttpGet
      summary: Proxy a restricted opaque GET request to a server-configured generic upstream.
      description: &OpaqueHTTPDescription |
        The path `feature` must exactly equal `X-Latchway-Feature`.
        `remainingPath` is interpreted only beneath the feature's configured
        exact-depth path templates or compatibility-only path prefixes.
        Template captures match one canonical segment and never select or
        rewrite a destination. Absolute URLs and client-selected upstream
        authorities are never interpreted as destinations; query strings are rejected.
        Deployments may use a router catch-all for additional segments. Request
        headers are forwarded only from the configured allowlist, and each
        route owns an explicit response byte bound and streaming policy.
      security: &OpaqueHTTPSecurity
        - DPoPAccessToken: []
          DPoPProof: []
      requestBody:
        $ref: '#/components/requestBodies/OpaqueRequest'
      responses: &OpaqueHTTPResponses
        '2XX':
          $ref: '#/components/responses/OpaqueResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [AI proxy]
      operationId: proxyRestrictedOpaqueHttpPost
      summary: Proxy a restricted opaque POST request to a server-configured generic upstream.
      description: *OpaqueHTTPDescription
      security: *OpaqueHTTPSecurity
      requestBody:
        $ref: '#/components/requestBodies/OpaqueRequest'
      responses: *OpaqueHTTPResponses
    put:
      tags: [AI proxy]
      operationId: proxyRestrictedOpaqueHttpPut
      summary: Proxy a restricted opaque PUT request to a server-configured generic upstream.
      description: *OpaqueHTTPDescription
      security: *OpaqueHTTPSecurity
      requestBody:
        $ref: '#/components/requestBodies/OpaqueRequest'
      responses: *OpaqueHTTPResponses
    patch:
      tags: [AI proxy]
      operationId: proxyRestrictedOpaqueHttpPatch
      summary: Proxy a restricted opaque PATCH request to a server-configured generic upstream.
      description: *OpaqueHTTPDescription
      security: *OpaqueHTTPSecurity
      requestBody:
        $ref: '#/components/requestBodies/OpaqueRequest'
      responses: *OpaqueHTTPResponses
    delete:
      tags: [AI proxy]
      operationId: proxyRestrictedOpaqueHttpDelete
      summary: Proxy a restricted opaque DELETE request to a server-configured generic upstream.
      description: *OpaqueHTTPDescription
      security: *OpaqueHTTPSecurity
      requestBody:
        $ref: '#/components/requestBodies/OpaqueRequest'
      responses: *OpaqueHTTPResponses
components:
  securitySchemes:
    DPoPAccessToken:
      type: http
      scheme: DPoP
      description: "Authorization uses `DPoP <access-token>` and the token contains `cnf.jkt`."
    DPoPProof:
      type: apiKey
      in: header
      name: DPoP
      description: RFC 9449 compact proof JWT signed by the installation P-256 key.
  parameters:
    ProtocolVersion:
      name: X-Latchway-Protocol-Version
      in: header
      required: true
      description: Wire protocol 2 is current; canonical version 1 remains accepted for legacy clients.
      schema: { type: integer, enum: [1, 2], default: 2 }
    CurrentProtocolVersion:
      name: X-Latchway-Protocol-Version
      in: header
      required: true
      description: Installation Family and Client Component operations require current wire protocol 2.
      schema: { type: integer, const: 2 }
    SDK:
      name: X-Latchway-SDK
      in: header
      required: true
      schema:
        type: string
        enum: [ios, android, javascript, react-native]
    SDKVersion:
      name: X-Latchway-SDK-Version
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'
    Framework:
      name: X-Latchway-Framework
      in: header
      required: false
      description: Must be supplied together with X-Latchway-Framework-Version.
      schema:
        type: string
        enum: [android-okhttp, foundation-models, koog-android, langchain-js, macpaw-openai, openai-js, react-native-fetch, swift-openai, vercel-ai-sdk]
    FrameworkVersion:
      name: X-Latchway-Framework-Version
      in: header
      required: false
      description: Must be supplied together with X-Latchway-Framework as canonical SemVer 2.0.0.
      schema:
        type: string
        maxLength: 128
        pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
    RequestID:
      name: X-Latchway-Request-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    BrowserOrigin:
      name: Origin
      in: header
      required: false
      description: |
        Browser user agents supply exactly one canonical HTTPS origin. It is
        required when the session platform is `web`, forbidden for native
        platforms, and never grants authority without the active policy and
        DPoP-bound session checks. Cookie credentials are not supported.
      schema:
        type: string
        minLength: 9
        maxLength: 2048
        format: uri
        pattern: '^https://[^/]+$'
    FeatureHeader:
      name: X-Latchway-Feature
      in: header
      required: true
      schema: { $ref: '#/components/schemas/FeatureID' }
    FeaturePath:
      name: feature
      in: path
      required: true
      schema: { $ref: '#/components/schemas/FeatureID' }
    ComponentIDPath:
      name: component_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ClientComponentID' }
    RemainingPath:
      name: remainingPath
      in: path
      required: true
      description: Canonical unescaped provider-relative path matched only against the selected feature's exact-depth template or legacy segment-bound prefix policy.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
        pattern: '^(?!.*(?:^|/)\.{1,2}(?:/|$))(?!https?:)(?!.*//)(?!.*[\\%?#])[!-~]+$'
  headers:
    RequestID:
      description: Server-selected correlation identifier.
      schema: { type: string, minLength: 8, maxLength: 128 }
  requestBodies:
    AIRequest:
      required: true
      description: Existing provider-compatible JSON. The server validates and rewrites protocol-owned fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FreeFormJSON'
    OpaqueRequest:
      required: false
      description: Opaque bytes bounded by the selected feature's maxBodyBytes policy.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FreeFormJSON' }
        application/octet-stream:
          schema: { type: string, contentEncoding: base64 }
        '*/*':
          schema: { type: string, contentEncoding: base64 }
  responses:
    Problem:
      description: RFC 9457 problem with a stable Latchway code and safe detail.
      headers:
        X-Latchway-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          schema: { type: string }
        DPoP-Nonce:
          schema: { type: string, minLength: 16, maxLength: 512 }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AIResponse:
      description: Provider-compatible JSON or incrementally forwarded SSE.
      headers:
        X-Latchway-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FreeFormJSON' }
        text/event-stream:
          schema:
            type: string
            description: Incremental SSE bytes; clients must not expect buffering by Latchway.
    AIJSONResponse:
      description: Provider-compatible JSON response.
      headers:
        X-Latchway-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FreeFormJSON' }
    OpaqueResponse:
      description: Restricted upstream response after response-header filtering and route byte/streaming enforcement.
      headers:
        X-Latchway-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FreeFormJSON' }
        text/event-stream:
          schema: { type: string }
        application/octet-stream:
          schema: { type: string, contentEncoding: base64 }
        '*/*':
          schema: { type: string, contentEncoding: base64 }
  schemas:
    Identifier:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,62}$'
    FeatureID:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: Stable application-owned feature identifier, not a provider model.
    InstallationFamilyID:
      type: string
      pattern: '^fam_[A-Za-z0-9_-]{16,128}$'
    ClientComponentID:
      type: string
      pattern: '^cmp_[A-Za-z0-9_-]{16,128}$'
    ComponentDelegationID:
      type: string
      pattern: '^dlg_[A-Za-z0-9_-]{16,128}$'
    Base64URL:
      type: string
      minLength: 1
      pattern: '^[A-Za-z0-9_-]+$'
    FreeFormJSON:
      description: JSON value whose provider-specific shape is preserved subject to protocol validation.
    SessionChallengeRequest:
      type: object
      additionalProperties: false
      required: [application_id, environment, identity_provider, identity_token, platform, sdk_version]
      properties:
        application_id: { type: string, minLength: 1, maxLength: 128 }
        environment: { $ref: '#/components/schemas/Identifier' }
        identity_provider: { $ref: '#/components/schemas/Identifier' }
        identity_token: { type: string, minLength: 16, maxLength: 65536, writeOnly: true }
        platform:
          type: string
          enum: [ios, android, web, react_native_ios, react_native_android, node]
        sdk_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'
    SessionChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, challenge_nonce, binding_version, issued_at, expires_at, attestation]
      properties:
        challenge_id: { type: string, pattern: '^chl_[A-Za-z0-9_-]{16,128}$' }
        challenge_nonce:
          type: string
          minLength: 43
          maxLength: 86
          pattern: '^[A-Za-z0-9_-]{43,86}$'
          description: Canonical unpadded base64url that decodes to 32 through 64 bytes; non-canonical encodings are rejected.
        binding_version: { type: integer, const: 1 }
        issued_at: { type: integer, minimum: 0, description: Unix seconds used in the canonical binding. }
        expires_at: { type: string, format: date-time }
        attestation:
          type: object
          additionalProperties: false
          required: [provider, mode, client_data_hash]
          properties:
            provider:
              type: string
              enum: [app_attest, play_integrity, firebase_app_check, turnstile, debug]
            mode: { type: string, enum: [required, preferred] }
            client_data_hash:
              type: string
              minLength: 43
              maxLength: 43
              pattern: '^[A-Za-z0-9_-]{43}$'
              description: Base64url SHA-256 of the server-constructed canonical attestation binding; use directly as the App Attest clientDataHash or Play Integrity requestHash input.
            provider_options:
              type: object
              description: Safe public provider parameters; never secrets or expected verdict internals.
              additionalProperties: true
    ComponentAttestationChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, challenge_nonce, binding_version, issued_at, expires_at, attestation]
      properties:
        challenge_id: { type: string, pattern: '^chl_[A-Za-z0-9_-]{16,128}$' }
        challenge_nonce:
          type: string
          minLength: 43
          maxLength: 86
          pattern: '^[A-Za-z0-9_-]{43,86}$'
          description: Canonical unpadded base64url that decodes to 32 through 64 bytes; non-canonical encodings are rejected.
        binding_version: { type: integer, const: 2 }
        issued_at: { type: integer, minimum: 0, maximum: 253402300799 }
        expires_at: { type: string, format: date-time }
        attestation:
          type: object
          additionalProperties: false
          required: [provider, mode, client_data_hash]
          properties:
            provider: { type: string, const: app_attest }
            mode: { type: string, const: required }
            client_data_hash:
              type: string
              minLength: 43
              maxLength: 43
              pattern: '^[A-Za-z0-9_-]{43}$'
            provider_options:
              type: object
              additionalProperties: true
              description: Safe App Attest public parameters for the configured component bundle.
    ComponentAttestationExchangeRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, attestation]
      properties:
        challenge_id: { type: string, pattern: '^chl_[A-Za-z0-9_-]{16,128}$' }
        attestation: { $ref: '#/components/schemas/AttestationEvidence' }
    SessionExchangeRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, attestation, installation]
      properties:
        challenge_id: { type: string, pattern: '^chl_[A-Za-z0-9_-]{16,128}$' }
        attestation:
          $ref: '#/components/schemas/AttestationEvidence'
        installation:
          type: object
          additionalProperties: false
          required: [app_version]
          properties:
            app_version: { type: string, minLength: 1, maxLength: 128 }
            os_version: { type: string, minLength: 1, maxLength: 128 }
            device_model: { type: string, minLength: 1, maxLength: 128 }
    AttestationEvidence:
      type: object
      additionalProperties: false
      required: [provider, evidence]
      properties:
        provider:
          type: string
          enum: [app_attest, play_integrity, firebase_app_check, turnstile, debug]
        evidence:
          type: object
          additionalProperties: true
          writeOnly: true
          description: Provider-specific evidence subject to strict server-side byte and shape limits.
    SessionRefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 32, maxLength: 2048, writeOnly: true }
    PublicP256JWK:
      type: object
      additionalProperties: false
      required: [kty, crv, x, y]
      properties:
        kty: { type: string, const: EC }
        crv: { type: string, const: P-256 }
        x: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        y: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
    ProvisionComponentRequest:
      type: object
      additionalProperties: false
      required: [component_definition_id, public_jwk, requested_features, client_metadata]
      properties:
        component_definition_id: { $ref: '#/components/schemas/Identifier' }
        public_jwk: { $ref: '#/components/schemas/PublicP256JWK' }
        requested_features:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { $ref: '#/components/schemas/FeatureID' }
        client_metadata:
          type: object
          additionalProperties: false
          required: [app_version, sdk_version]
          properties:
            app_version: { type: string, minLength: 1, maxLength: 128 }
            sdk_version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$' }
    ProvisionComponentResponse:
      type: object
      additionalProperties: false
      required: [component_id, installation_family_id, trust, granted_features, refresh_grant, refresh_grant_expires_at]
      properties:
        component_id: { $ref: '#/components/schemas/ClientComponentID' }
        installation_family_id: { $ref: '#/components/schemas/InstallationFamilyID' }
        trust:
          type: object
          additionalProperties: false
          required: [source, expires_at]
          properties:
            source: { type: string, enum: [delegated_from_attested_root, delegated_identity_only] }
            expires_at: { type: string, format: date-time }
        granted_features:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { $ref: '#/components/schemas/FeatureID' }
        refresh_grant: { type: string, minLength: 32, maxLength: 2048, x-sensitive: true }
        refresh_grant_expires_at: { type: string, format: date-time }
    ComponentSessionRequest:
      type: object
      additionalProperties: false
      required: [component_id, refresh_grant]
      properties:
        component_id: { $ref: '#/components/schemas/ClientComponentID' }
        refresh_grant: { type: string, minLength: 32, maxLength: 2048, writeOnly: true }
    ComponentSessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, expires_in, refresh_token, refresh_expires_at]
      properties:
        access_token: { type: string, minLength: 64, maxLength: 16384, x-sensitive: true }
        expires_in: { type: integer, minimum: 60, maximum: 3600 }
        refresh_token: { type: string, minLength: 32, maxLength: 2048, x-sensitive: true }
        refresh_expires_at: { type: string, format: date-time }
    SessionGrant:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in, installation, trust]
      properties:
        access_token: { type: string, minLength: 64, maxLength: 16384, x-sensitive: true }
        token_type: { type: string, const: DPoP }
        expires_in: { type: integer, minimum: 60, maximum: 3600 }
        refresh_token: { type: string, minLength: 32, maxLength: 2048, x-sensitive: true }
        refresh_expires_in: { type: integer, minimum: 300, maximum: 31536000 }
        installation:
          $ref: '#/components/schemas/InstallationSummary'
        trust:
          $ref: '#/components/schemas/TrustSummary'
        installation_family:
          $ref: '#/components/schemas/InstallationFamilySummary'
        component:
          $ref: '#/components/schemas/ClientComponentSummary'
    InstallationFamilySummary:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/InstallationFamilyID' }
        status: { type: string, enum: [active, revoked] }
    ClientComponentSummary:
      type: object
      additionalProperties: false
      required: [id, definition_id, kind, platform, is_root, status, dpop_jkt, granted_features]
      properties:
        id: { $ref: '#/components/schemas/ClientComponentID' }
        definition_id: { $ref: '#/components/schemas/Identifier' }
        kind:
          type: string
          enum: [main_app, widget, share_extension, app_intent_extension, notification_service_extension, action_extension, sso_extension, watch_extension, android_app, wear_app, browser, node_process]
        platform: { type: string, enum: [ios, android, web, react_native_ios, react_native_android, watchos, node] }
        is_root: { type: boolean }
        status: { type: string, enum: [active, revoked] }
        dpop_jkt: { $ref: '#/components/schemas/Base64URL' }
        granted_features:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { $ref: '#/components/schemas/FeatureID' }
    InstallationSummary:
      type: object
      additionalProperties: false
      required: [id, platform, dpop_jkt, status]
      properties:
        id: { type: string, pattern: '^ins_[A-Za-z0-9_-]{16,128}$' }
        platform: { type: string, enum: [ios, android, web, react_native_ios, react_native_android, watchos, node] }
        dpop_jkt: { $ref: '#/components/schemas/Base64URL' }
        status: { type: string, enum: [active, revoked] }
    TrustSummary:
      type: object
      additionalProperties: false
      required: [provider, level, verified_at, expires_at]
      properties:
        provider: { type: string }
        level:
          type: string
          enum: [none, identity_only, web_risk_verified, app_verified, device_verified, strong_device_verified, debug]
        verified_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        source:
          type: string
          enum: [direct_attested, delegated_from_attested_root, delegated_identity_only, delegated_direct_attested, identity_only, web_risk_verified, debug]
        parent_component_id: { $ref: '#/components/schemas/ClientComponentID' }
        parent_attestation_provider: { type: string }
        delegation_id: { $ref: '#/components/schemas/ComponentDelegationID' }
    QuotaSnapshot:
      type: object
      additionalProperties: false
      required: [feature, observed_at, limits]
      properties:
        feature: { $ref: '#/components/schemas/FeatureID' }
        observed_at: { type: string, format: date-time }
        limits:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metric, hard]
            properties:
              metric: { type: string }
              maximum: { type: integer, minimum: 0 }
              used: { type: integer, minimum: 0 }
              reserved: { type: integer, minimum: 0 }
              remaining: { type: integer, minimum: 0 }
              resets_at: { type: string, format: date-time }
              hard: { type: boolean }
    ClientDiagnostics:
      type: object
      additionalProperties: false
      required: [request_id, server_version, contract_version, protocol_version, installation, session, trust]
      properties:
        request_id: { type: string }
        server_version: { type: string }
        contract_version: { type: string, const: 1.0.0 }
        protocol_version: { type: integer, const: 2 }
        installation: { $ref: '#/components/schemas/InstallationSummary' }
        session:
          type: object
          additionalProperties: false
          required: [expires_at, refresh_available]
          properties:
            expires_at: { type: string, format: date-time }
            refresh_available: { type: boolean }
        trust: { $ref: '#/components/schemas/TrustSummary' }
    DiscoveryDocument:
      type: object
      additionalProperties: false
      required: [server_version, contract_version, current_protocol_version, supported_protocol_versions, session_endpoint, dpop_algorithms, maximum_clock_skew_seconds]
      properties:
        server_version: { type: string }
        contract_version: { type: string, const: 1.0.0 }
        current_protocol_version: { type: integer, const: 2 }
        supported_protocol_versions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          prefixItems:
            - { const: 1 }
            - { const: 2 }
          items: false
        session_endpoint: { type: string, format: uri-reference, const: /client/v1/sessions }
        dpop_algorithms:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [ES256] }
        maximum_clock_skew_seconds: { type: integer, minimum: 0, maximum: 300 }
        minimum_sdk_versions:
          type: object
          additionalProperties: false
          properties:
            ios: { type: string }
            android: { type: string }
            javascript: { type: string }
            react-native: { type: string }
    JsonWebKeySet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [kty, kid, use, alg]
            properties:
              kty: { type: string }
              kid: { type: string }
              use: { type: string, const: sig }
              alg: { type: string }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, request_id, retryable, documentation_url]
      properties:
        type: { type: string, format: uri }
        documentation_url:
          type: string
          format: uri
          pattern: '^https://docs\.latchway\.dev/errors/[a-z0-9-]+$'
        title: { type: string, minLength: 1, maxLength: 256 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, minLength: 1, maxLength: 2048 }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          enum:
            - request_invalid
            - identity_token_missing
            - identity_token_invalid
            - identity_token_expired
            - identity_reauthentication_required
            - attestation_required
            - attestation_unsupported
            - attestation_invalid
            - attestation_stale
            - attestation_step_up_required
            - dpop_missing
            - dpop_invalid
            - dpop_replayed
            - dpop_nonce_required
            - session_expired
            - session_revoked
            - refresh_token_reused
            - installation_revoked
            - installation_family_revoked
            - installation_family_not_found
            - component_definition_not_found
            - component_not_configured
            - component_not_provisioned
            - component_revoked
            - component_key_invalid
            - component_key_replaced
            - component_delegation_expired
            - component_feature_not_granted
            - component_parent_trust_expired
            - component_direct_attestation_required
            - containing_app_setup_required
            - framework_integration_unsupported
            - framework_version_unsupported
            - transport_destination_not_allowed
            - transport_request_not_replayable
            - feature_not_found
            - feature_not_allowed
            - model_not_allowed
            - quota_exceeded
            - concurrency_exceeded
            - output_limit_exceeded
            - pricing_unavailable
            - route_not_found
            - upstream_unavailable
            - upstream_timeout
            - upstream_protocol_error
            - configuration_invalid
            - server_not_ready
            - protocol_version_unsupported
            - authentication_required
            - permission_denied
            - resource_not_found
            - conflict
            - etag_required
            - etag_mismatch
            - bootstrap_disabled
            - rate_limited
            - operation_indeterminate
            - internal_error
        request_id: { type: string, minLength: 8, maxLength: 128 }
        retryable: { type: boolean }
        retry_after: { type: string, format: date-time }
        operation_id: { type: string, pattern: '^arq_[0-7][0-9A-HJKMNPQRSTVWXYZ]{25}$' }
        feature: { $ref: '#/components/schemas/FeatureID' }
        supported_protocol_versions:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [path, message]
            properties:
              path: { type: string, maxLength: 512 }
              message: { type: string, maxLength: 1024 }
      allOf:
        - if:
            properties:
              code: { const: operation_indeterminate }
            required: [code]
          then:
            required: [operation_id]
          else:
            not:
              required: [operation_id]
