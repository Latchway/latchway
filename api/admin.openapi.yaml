        user_id: { $ref: '#/components/schemas/UserID' }
        environment_id: { $ref: '#/components/schemas/EnvironmentID' }
        definition_id: { $ref: '#/components/schemas/Identifier' }
        kind: { $ref: '#/components/schemas/ClientComponentKind' }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        is_root: { type: boolean }
        status: { type: string, enum: [active, suspended, revoked, replaced] }
        component_key_id: { $ref: '#/components/schemas/ComponentKeyID' }
        dpop_jkt: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        key_storage_claim: { type: string, enum: [unknown, secure_enclave, keychain, strongbox, tee, software, webcrypto, memory] }
        trust_source: { $ref: '#/components/schemas/ComponentTrustSource' }
        attestation_provider: { $ref: '#/components/schemas/AttestationProvider' }
        parent_component_id: { $ref: '#/components/schemas/ClientComponentID' }
        parent_attestation_event_id: { $ref: '#/components/schemas/OpaqueID' }
        trust_verified_at: { type: string, format: date-time }
        trust_expires_at: { type: string, format: date-time }
        granted_features:
          type: array
          maxItems: 256
          uniqueItems: true
          items: { $ref: '#/components/schemas/Identifier' }
        app_version: { type: string, minLength: 1, maxLength: 128 }
        sdk_version: { type: string, minLength: 1, maxLength: 128 }
        session_family_id: { $ref: '#/components/schemas/ComponentSessionFamilyID' }
        session_status: { type: string, enum: [active, revoked, expired, replaced] }
        session_expires_at: { type: string, format: date-time }
        session_failure_count:
          type: integer
          minimum: 0
          description: Historical wire name for the count of this component's non-active revoked or expired session families; it is not a failed-request count.
        refresh_reuse_count: { type: integer, minimum: 0 }
        request_count: { type: integer, minimum: 0 }
        usage: { $ref: '#/components/schemas/UsageValues' }
        delegation: { $ref: '#/components/schemas/ComponentDelegation' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        revocation_reason: { type: string, minLength: 1, maxLength: 100 }
      allOf:
        - if:
            properties: { is_root: { const: true } }
            required: [is_root]
          then:
            not:
              anyOf:
                - required: [parent_component_id]
                - required: [delegation]
          else:
            required: [parent_component_id, delegation]
        - if:
            properties: { status: { enum: [revoked, replaced] } }
            required: [status]
          then:
            required: [revoked_at, revocation_reason]
          else:
            not:
              anyOf:
                - required: [revoked_at]
                - required: [revocation_reason]
    ClientComponentPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ClientComponent' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    InstallationFamily:
      type: object
      additionalProperties: false
      required: [id, user_id, environment_id, platform, status, root_component_id, root_trust_source, component_count, request_count, usage, created_at, updated_at, last_seen_at]
      properties:
        id: { $ref: '#/components/schemas/InstallationFamilyID' }
        user_id: { $ref: '#/components/schemas/UserID' }
        environment_id: { $ref: '#/components/schemas/EnvironmentID' }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        status: { type: string, enum: [active, suspended, revoked] }
        root_component_id: { $ref: '#/components/schemas/ClientComponentID' }
        root_trust_source: { $ref: '#/components/schemas/ComponentTrustSource' }
        root_trust_expires_at: { type: string, format: date-time }
        component_count: { type: integer, minimum: 1, maximum: 128 }
        request_count: { type: integer, minimum: 0 }
        usage: { $ref: '#/components/schemas/UsageValues' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        revocation_reason: { type: string, minLength: 1, maxLength: 100 }
        components:
          type: array
          minItems: 1
          maxItems: 128
          items: { $ref: '#/components/schemas/ClientComponent' }
      allOf:
        - if:
            properties: { status: { const: revoked } }
            required: [status]
          then:
            required: [revoked_at, revocation_reason]
          else:
            not:
              anyOf:
                - required: [revoked_at]
                - required: [revocation_reason]
    InstallationFamilyPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/InstallationFamily' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    UsageValues:
      type: object
      additionalProperties: false
      required: [logical_requests, input_tokens, output_tokens, total_tokens, cost_nano_usd]
      properties:
        logical_requests: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cost_nano_usd: { type: integer, minimum: 0 }
    UpstreamAttempt:
      type: object
      additionalProperties: false
      description: >-
        One redaction-safe physical attempt. Attempts are returned in contiguous
        attempt_number order. Terminal attempts have completed_at; succeeded attempts
        have a 2xx http_status and no failure_code; failed or canceled attempts have a
        sanitized failure_code. Unknown durable failure values map to unknown and raw
        provider or internal error text is never returned.
      required: [id, attempt_number, route, upstream, model, started_at, status, usage_provenance, cost_provenance]
      properties:
        id: { type: string, pattern: '^atm_[A-Za-z0-9_-]{16,128}$' }
        attempt_number: { type: integer, minimum: 1, maximum: 32 }
        route: { $ref: '#/components/schemas/Identifier' }
        upstream: { $ref: '#/components/schemas/Identifier' }
        model: { type: string, maxLength: 512 }
        started_at: { type: string, format: date-time }
        first_byte_at:
          type: string
          format: date-time
          description: First response byte observed by the gateway, when one was observed; never precedes started_at or follows completed_at.
        first_token_at:
          type: string
          format: date-time
          description: First protocol-validated generated content observed by the gateway, when one was observed; requires first_byte_at and never precedes it or follows completed_at.
        completed_at: { type: string, format: date-time }
        status: { type: string, enum: [succeeded, failed, canceled, unknown] }
        http_status:
          type: integer
          minimum: 100
          maximum: 599
          description: Upstream HTTP status when a valid status line was received.
        failure_code:
          type: string
          enum: [canceled, gateway_error, protocol_error, timeout, unavailable, upstream_rejected, unknown]
          description: Closed, sanitized public failure category. Omitted for successful and in-progress attempts.
        usage: { $ref: '#/components/schemas/UsageValues' }
        usage_provenance: { type: string, enum: [upstream_reported, calculated, configured, estimated, unknown] }
        cost_provenance:
          type: string
          enum: [upstream_reported, calculated, estimated, unknown]
          description: Provenance of this attempt's cost, independent of token-usage provenance.
        cost_source:
          type: string
          minLength: 1
          maxLength: 64
          description: Fixed provider report source or configured pricing catalog identity when cost is known.
    RequestDecisionStage:
      type: object
      additionalProperties: false
      required: [number, stage, outcome, config_revision_id, started_at, completed_at, duration_ms]
      properties:
        number: { type: integer, minimum: 1, maximum: 256 }
        stage:
          type: string
          enum: [identity_verified, client_trust_verified, client_context_validated, configuration_loaded, request_inspected, policy_evaluated, route_selected, quota_rule_evaluated, quota_reserved, lifecycle_recovered]
        outcome: { type: string, enum: [succeeded, denied, failed, cancelled] }
        failure_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,99}$'
          description: Stable registered problem code or `unknown`; omitted for a successful stage. Raw dependency or provider errors are never returned.
        config_revision_id: { $ref: '#/components/schemas/RevisionID' }
        policy_rule_key:
          type: string
          pattern: '^([a-z][a-z0-9_-]{0,62}|[A-Za-z0-9_-]{43})$'
        limit_plan_key: { $ref: '#/components/schemas/Identifier' }
        limit_rule_key: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        limit_metric: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        limit_algorithm: { type: string, enum: [calendar, token_bucket, per_request, concurrency] }
        limit_maximum: { type: integer, format: int64, minimum: 0 }
        route: { $ref: '#/components/schemas/Identifier' }
        upstream: { $ref: '#/components/schemas/Identifier' }
        model: { $ref: '#/components/schemas/Identifier' }
        physical_model: { type: string, minLength: 1, maxLength: 512, pattern: '^[^\r\n\x00]+$' }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64, minimum: 0 }
      dependentRequired:
        limit_rule_key: [limit_metric, limit_algorithm, limit_maximum]
        limit_metric: [limit_rule_key, limit_algorithm, limit_maximum]
        limit_algorithm: [limit_rule_key, limit_metric, limit_maximum]
        limit_maximum: [limit_rule_key, limit_metric, limit_algorithm]
        route: [upstream, model, physical_model]
        upstream: [route, model, physical_model]
        model: [route, upstream, physical_model]
        physical_model: [route, upstream, model]
    LogicalRequest:
      type: object
      additionalProperties: false
      required: [id, environment_id, user_id, installation_id, config_revision_id, selected_limit_plan, feature, protocol, started_at, status, decision_stages, attempts]
      properties:
        id: { $ref: '#/components/schemas/RequestID' }
        environment_id: { $ref: '#/components/schemas/EnvironmentID' }
        user_id: { $ref: '#/components/schemas/UserID' }
        installation_id: { $ref: '#/components/schemas/InstallationID' }
        installation_family_id: { $ref: '#/components/schemas/InstallationFamilyID' }
        client_component_id: { $ref: '#/components/schemas/ClientComponentID' }
        component_definition_id: { $ref: '#/components/schemas/Identifier' }
        component_kind: { $ref: '#/components/schemas/ClientComponentKind' }
        trust_source: { $ref: '#/components/schemas/ComponentTrustSource' }
        framework: { $ref: '#/components/schemas/Identifier' }
        framework_version:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[^\r\n\x00]+$'
        config_revision_id: { $ref: '#/components/schemas/RevisionID' }
        selected_limit_plan: { $ref: '#/components/schemas/Identifier' }
        selected_route: { $ref: '#/components/schemas/Identifier' }
        selected_upstream: { $ref: '#/components/schemas/Identifier' }
        selected_model: { $ref: '#/components/schemas/Identifier' }
        selected_physical_model: { type: string, minLength: 1, maxLength: 512, pattern: '^[^\r\n\x00]+$' }
        feature: { $ref: '#/components/schemas/Identifier' }
        protocol:
          type: string
          enum: [openai_responses, openai_chat, openai_embeddings, anthropic_messages, opaque_http]
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        status: { type: string, enum: [succeeded, failed, denied, canceled, unknown] }
        failure_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,99}$'
          description: Stable registered problem code or `unknown`; omitted when the logical request has no terminal failure.
        usage: { $ref: '#/components/schemas/UsageValues' }
        decision_stages:
          type: array
          maxItems: 256
          description: Redaction-safe append-only lifecycle ordered by contiguous stage number beginning at one. Legacy pre-schema-26 requests can have no stages.
          items: { $ref: '#/components/schemas/RequestDecisionStage' }
        attempts:
          type: array
          maxItems: 32
          description: Ordered by contiguous attempt_number beginning at one.
          items: { $ref: '#/components/schemas/UpstreamAttempt' }
      dependentRequired:
        installation_family_id: [client_component_id, component_definition_id, component_kind, trust_source]
        client_component_id: [installation_family_id, component_definition_id, component_kind, trust_source]
        component_definition_id: [installation_family_id, client_component_id, component_kind, trust_source]
        component_kind: [installation_family_id, client_component_id, component_definition_id, trust_source]
        trust_source: [installation_family_id, client_component_id, component_definition_id, component_kind]
        framework: [framework_version]
        framework_version: [framework]
        selected_route: [selected_upstream, selected_model, selected_physical_model]
        selected_upstream: [selected_route, selected_model, selected_physical_model]
        selected_model: [selected_route, selected_upstream, selected_physical_model]
        selected_physical_model: [selected_route, selected_upstream, selected_model]
    RequestPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/LogicalRequest' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    UsageFraction:
      type: object
      additionalProperties: false
      required: [numerator, denominator]
      properties:
        numerator: { type: integer, minimum: 0 }
        denominator: { type: integer, minimum: 0 }
    UsageRate:
      type: object
      additionalProperties: false
      required: [numerator, denominator, parts_per_million]
      properties:
        numerator: { type: integer, minimum: 0 }
        denominator: { type: integer, minimum: 0 }
        parts_per_million: { type: integer, minimum: 0, maximum: 1000000 }
    UsageDistribution:
      type: object
      additionalProperties: false
      required: [samples, p50_ms, p95_ms, p99_ms]
      properties:
        samples: { type: integer, minimum: 0 }
        p50_ms: { type: integer, minimum: 0 }
        p95_ms: { type: integer, minimum: 0 }
        p99_ms: { type: integer, minimum: 0 }
    UsageBreakdown:
      type: object
      additionalProperties: false
      required: [items, truncated, limit]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [key, active_users, request_count, values]
            properties:
              key: { type: string, minLength: 1, maxLength: 512 }
              active_users: { type: integer, minimum: 0 }
              request_count: { type: integer, minimum: 0 }
              values: { $ref: '#/components/schemas/UsageValues' }
        truncated: { type: boolean }
        limit: { type: integer, minimum: 1, maximum: 200 }
    UsageAnalytics:
      type: object
      additionalProperties: false
      required: [active_users, request_count, requests_per_active_user, cost_per_active_user_nano_usd, by_feature, by_model, by_selected_plan, request_latency, time_to_first_token, failure_rate, quota_denial_rate, attestation_failure_rate, fallback_rate, usage_by_provenance]
      properties:
        active_users: { type: integer, minimum: 0 }
        request_count: { type: integer, minimum: 0 }
        requests_per_active_user: { $ref: '#/components/schemas/UsageFraction' }
        cost_per_active_user_nano_usd: { $ref: '#/components/schemas/UsageFraction' }
        by_feature: { $ref: '#/components/schemas/UsageBreakdown' }
        by_model: { $ref: '#/components/schemas/UsageBreakdown' }
        by_selected_plan: { $ref: '#/components/schemas/UsageBreakdown' }
        request_latency: { $ref: '#/components/schemas/UsageDistribution' }
        time_to_first_token: { $ref: '#/components/schemas/UsageDistribution' }
        failure_rate: { $ref: '#/components/schemas/UsageRate' }
        quota_denial_rate: { $ref: '#/components/schemas/UsageRate' }
        attestation_failure_rate: { $ref: '#/components/schemas/UsageRate' }
        fallback_rate: { $ref: '#/components/schemas/UsageRate' }
        usage_by_provenance:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [provenance, values]
            properties:
              provenance: { type: string, enum: [upstream_reported, calculated, estimated, unknown] }
              cost_source:
                type: string
                minLength: 1
                maxLength: 64
                description: Present as openrouter_usage_cost when this window contains provider-reported cost.
              values: { $ref: '#/components/schemas/UsageValues' }
    UsageSummary:
      type: object
      additionalProperties: false
      required: [start, end, values, provenance, analytics]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        values: { $ref: '#/components/schemas/UsageValues' }
        provenance: { type: array, maxItems: 5, uniqueItems: true, items: { type: string, enum: [upstream_reported, calculated, configured, estimated, unknown] } }
        analytics: { $ref: '#/components/schemas/UsageAnalytics' }
    UsageTimeseries:
      type: object
      additionalProperties: false
      required: [interval, points]
      properties:
        interval: { type: string, enum: [hour, day] }
        points:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [timestamp, values]
            properties:
              timestamp: { type: string, format: date-time }
              values: { $ref: '#/components/schemas/UsageValues' }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, timestamp, actor, actor_kind, action, target, resource_type, resource_id, source, result, request_id, changes, summary]
      properties:
        id: { type: string, pattern: '^aud_[0-7][0-9A-HJKMNPQRSTVWXYZ]{25}$' }
        timestamp: { type: string, format: date-time }
        actor: { type: string, minLength: 1, maxLength: 256 }
        actor_kind: { type: string, enum: [admin_user, admin_api_token, system] }
        actor_id:
          type: string
          pattern: '^(adm|tok)_[0-7][0-9A-HJKMNPQRSTVWXYZ]{25}$'
        action: { type: string, pattern: '^[a-z][a-z0-9_.]{0,99}$' }
        target: { type: string, minLength: 1, maxLength: 256 }
        resource_type: { type: string, pattern: '^[a-z][a-z0-9_.]{0,63}$' }
        resource_id: { type: string, pattern: '^[a-z][a-z0-9]{1,15}_[0-7][0-9A-HJKMNPQRSTVWXYZ]{25}$' }
        environment_id: { $ref: '#/components/schemas/EnvironmentID' }
        source:
          type: string
          enum: [console, cli, api, system]
          description: Descriptive transport source, never an authorization fact. Console and system are server-derived; CLI versus API is client-claimed by an authenticated API token.
        reason: { $ref: '#/components/schemas/AuditReason' }
        result: { type: string, enum: [succeeded, denied, failed, indeterminate] }
        request_id: { type: string, maxLength: 30, pattern: '^(|arq_[0-7][0-9A-HJKMNPQRSTVWXYZ]{25})$' }
        changes:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AuditChange' }
        summary:
          type: object
          additionalProperties: false
          required: [changes]
          properties:
            changes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AuditChange' } }
          description: Compatibility wrapper around the canonical value-free field-level changes.
    AuditChange:
      type: object
      additionalProperties: false
      required: [field, operation, classification, redacted]
      properties:
        field: { type: string, pattern: '^[a-z][a-z0-9_.]{0,63}$' }
        operation: { type: string, enum: [set, clear, add, remove, rotate, consume, revoke] }
        classification: { type: string, enum: [public, sensitive] }
        redacted: { type: boolean, description: Always true for sensitive changes and false for public field markers. }
    AuditReason:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[a-z][a-z0-9._-]{0,99}$'
      not:
        pattern: '(password|secret|token|credential|authorization|cookie|private[._]key|ciphertext|proof|evidence)'
      description: Stable operational reason code. Free-form user text and secret-bearing labels are never copied into the audit ledger.
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AuditEvent' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    StartSelfTestRequest:
      type: object
      additionalProperties: false
      required: [kind, environment_id]
      properties:
        kind: { type: string, enum: [local, upstream, openrouter] }
        environment_id: { $ref: '#/components/schemas/EnvironmentID' }
        config_revision_id: { $ref: '#/components/schemas/RevisionID', description: Exact immutable active revision the server must bind before any provider dispatch. }
        upstream: { $ref: '#/components/schemas/Identifier', description: Active server-owned upstream identifier. }
        model: { $ref: '#/components/schemas/Identifier', description: Active configured model identifier, not a client-selected physical model string. }
        max_cost_nano_usd: { type: integer, minimum: 0, maximum: 1000000000 }
      oneOf:
        - properties:
            kind: { const: local }
          not:
            anyOf:
              - required: [config_revision_id]
              - required: [upstream]
              - required: [model]
              - required: [max_cost_nano_usd]
        - required: [config_revision_id, upstream, model, max_cost_nano_usd]
          properties:
            kind: { enum: [upstream, openrouter] }
            max_cost_nano_usd: { type: integer, minimum: 1, maximum: 1000000000 }
    CreateSelfTestScheduleRequest:
      type: object
      additionalProperties: false
      required: [kind, environment_id, upstream, model, max_cost_nano_usd, daily_cost_limit_nano_usd, interval_seconds]
      properties:
        kind: { type: string, enum: [upstream, openrouter] }
        environment_id: { $ref: '#/components/schemas/EnvironmentID' }
        upstream: { $ref: '#/components/schemas/Identifier', description: Active server-owned upstream identifier. }
        model: { $ref: '#/components/schemas/Identifier', description: Active configured logical model identifier. }
        max_cost_nano_usd: { type: integer, minimum: 1, maximum: 1000000000 }
        daily_cost_limit_nano_usd: { type: integer, minimum: 1, maximum: 10000000000 }
        interval_seconds: { type: integer, minimum: 3600, maximum: 2592000 }
    SelfTestSchedule:
      type: object
      additionalProperties: false
      required: [id, environment_id, application_id, config_revision_id, authorization_credential_id, kind, upstream, model, max_cost_nano_usd, daily_cost_limit_nano_usd, interval_seconds, status, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/SelfTestScheduleID' }
        environment_id: { $ref: '#/components/schemas/EnvironmentID' }
        application_id: { $ref: '#/components/schemas/ApplicationID' }
        config_revision_id: { $ref: '#/components/schemas/RevisionID' }
        authorization_credential_id: { $ref: '#/components/schemas/TokenID', description: Stable durable credential ID; never token plaintext. }
        kind: { type: string, enum: [upstream, openrouter] }
        upstream: { $ref: '#/components/schemas/Identifier' }
        model: { $ref: '#/components/schemas/Identifier' }
        max_cost_nano_usd: { type: integer, minimum: 1, maximum: 1000000000 }
        daily_cost_limit_nano_usd: { type: integer, minimum: 1, maximum: 10000000000 }
        interval_seconds: { type: integer, minimum: 3600, maximum: 2592000 }
        status: { type: string, enum: [active, disabled] }
        next_run_at: { type: string, format: date-time }
        last_enqueued_at: { type: string, format: date-time }
        last_self_test_id: { $ref: '#/components/schemas/SelfTestID' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        disabled_at: { type: string, format: date-time }
        disabled_reason_code: { $ref: '#/components/schemas/Identifier' }
      oneOf:
        - properties: { status: { const: active } }
          required: [next_run_at]
          not:
            anyOf:
              - required: [disabled_at]
              - required: [disabled_reason_code]
        - properties: { status: { const: disabled } }
          required: [disabled_at, disabled_reason_code]
          not: { required: [next_run_at] }
    SelfTestSchedulePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/SelfTestSchedule' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    SelfTestRun:
      type: object
      additionalProperties: false
      required: [id, environment_id, kind, state, created_at, checks]
      properties:
        id: { $ref: '#/components/schemas/SelfTestID' }
        environment_id: { $ref: '#/components/schemas/EnvironmentID', description: Exact environment that owns and contextualizes the self-test run. }
        schedule_id: { $ref: '#/components/schemas/SelfTestScheduleID' }
        config_revision_id: { $ref: '#/components/schemas/RevisionID', description: Exact immutable configuration revision used by the self-test. }
        kind: { type: string, enum: [local, upstream, openrouter] }
        state: { type: string, enum: [queued, running, passed, failed, canceled] }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        checks:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [name, state]
            properties:
              name: { type: string }
              state: { type: string, enum: [pending, passed, failed, skipped] }
              safe_detail: { type: string, maxLength: 2048 }
      oneOf:
        - properties:
            kind: { const: local }
          not: { required: [config_revision_id] }
        - properties:
            kind: { enum: [upstream, openrouter] }
          required: [config_revision_id]
    SystemStatus:
      type: object
      additionalProperties: false
      required: [server_version, contract_version, protocol_versions, role, database_schema_version, mutation_ready, ready, server_capabilities]
      properties:
        server_version: { type: string }
        contract_version: { type: string, const: 1.0.0 }
        protocol_versions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          prefixItems:
            - { const: 1 }
            - { const: 2 }
          items: false
        role: { type: string, enum: [all, api, worker] }
        database_schema_version: { type: string }
        mutation_ready: { type: boolean, description: True only when the regular administrative database pool is reachable and the schema is current. }
        ready: { type: boolean, description: Full traffic readiness using the exact same dependency evaluation as /readyz. }
        server_capabilities:
          type: array
          description: Exact ordered binary capabilities implemented by this server build; these are not administrator authorization grants.
          minItems: 14
          maxItems: 14
          uniqueItems: true
          prefixItems:
            - { const: app_attest }
            - { const: play_integrity }
            - { const: firebase_app_check }
            - { const: turnstile }
            - { const: component_delegation }
            - { const: cost_limits }
            - { const: openai_responses }
            - { const: openai_chat }
            - { const: openai_embeddings }
            - { const: anthropic_messages }
            - { const: opaque_http }
            - { const: configuration_import_export }
            - { const: admin_session_management }
            - { const: admin_event_stream }
          items: false
    DoctorCheck:
      type: object
      additionalProperties: false
      required: [id, state, summary]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        state: { type: string, enum: [passed, warning, failed, skipped] }
        summary: { type: string, minLength: 1, maxLength: 512 }
        remediation: { type: string, minLength: 1, maxLength: 512 }
    DoctorDatabaseFacts:
      type: object
      additionalProperties: false
      required: [reachable, latency_ms, schema_current, schema_available, pool_maximum, pool_total, pool_acquired, pool_idle, pool_utilization_ppm, size_bytes]
      properties:
        reachable: { type: boolean }
        latency_ms: { type: integer, minimum: 0 }
        schema_current: { type: integer, minimum: 0 }
        schema_available: { type: integer, minimum: 0 }
        pool_maximum: { type: integer, minimum: 0 }
        pool_total: { type: integer, minimum: 0 }
        pool_acquired: { type: integer, minimum: 0 }
        pool_idle: { type: integer, minimum: 0 }
        pool_utilization_ppm: { type: integer, minimum: 0, maximum: 1000000 }
        size_bytes: { type: integer, minimum: 0 }
    DoctorConfigurationFacts:
      type: object
      additionalProperties: false
      required: [active_environments, active_configurations, missing_active_configuration, revisions, draft_revisions, invalid_revisions, highest_revision_number, cache]
      properties:
        active_environments: { type: integer, minimum: 0 }
        active_configurations: { type: integer, minimum: 0 }
        missing_active_configuration: { type: integer, minimum: 0 }
        revisions: { type: integer, minimum: 0 }
        draft_revisions: { type: integer, minimum: 0 }
        invalid_revisions: { type: integer, minimum: 0 }
        highest_revision_number: { type: integer, minimum: 0 }
        cache: { $ref: '#/components/schemas/DoctorConfigurationCacheFacts' }
    DoctorConfigurationCacheFacts:
      type: object
      additionalProperties: false
      required: [available, entries, fresh_entries, stale_entries, refreshes_in_flight, estimated_bytes, maximum_entries, maximum_estimated_bytes, reconciliation_interval_seconds]
      properties:
        available: { type: boolean }
        entries: { type: integer, minimum: 0, maximum: 1024 }
        fresh_entries: { type: integer, minimum: 0, maximum: 1024 }
        stale_entries: { type: integer, minimum: 0, maximum: 1024 }
        refreshes_in_flight: { type: integer, minimum: 0, maximum: 1024 }
        estimated_bytes: { type: integer, minimum: 0, maximum: 25165824 }
        maximum_entries: { type: integer, minimum: 0, maximum: 1024 }
        maximum_estimated_bytes: { type: integer, minimum: 0, maximum: 25165824 }
        reconciliation_interval_seconds: { type: integer, minimum: 0, maximum: 3600 }
        newest_loaded_at: { type: string, format: date-time }
    DoctorVerificationDependencyFacts:
      type: object
      additionalProperties: false
      required: [configured_selections, required_selections, external_network_selections, credential_backed_selections, resolved_credential_records, registered_active_keys]
      properties:
        configured_selections: { type: integer, minimum: 0 }
        required_selections: { type: integer, minimum: 0 }
        external_network_selections: { type: integer, minimum: 0 }
        credential_backed_selections: { type: integer, minimum: 0 }
        resolved_credential_records: { type: integer, minimum: 0 }
        registered_active_keys: { type: integer, minimum: 0 }
    DoctorSecurityFacts:
      type: object
      additionalProperties: false
      required: [active_secret_records, active_signing_keys, pending_signing_keys, retiring_signing_keys, configured_external_jwks_providers, identity_providers, identity_provider_errors, stale_identity_provider_jwks, apple_verification, google_verification]
      properties:
        active_secret_records: { type: integer, minimum: 0 }
        active_signing_keys: { type: integer, minimum: 0 }
        pending_signing_keys: { type: integer, minimum: 0 }
        retiring_signing_keys: { type: integer, minimum: 0 }
        signing_key_expires_at: { type: string, format: date-time }
        configured_external_jwks_providers: { type: integer, minimum: 0 }
        identity_providers: { type: integer, minimum: 0 }
        identity_provider_errors: { type: integer, minimum: 0 }
        stale_identity_provider_jwks: { type: integer, minimum: 0 }
        apple_verification: { $ref: '#/components/schemas/DoctorVerificationDependencyFacts' }
        google_verification: { $ref: '#/components/schemas/DoctorVerificationDependencyFacts' }
    DoctorJobFacts:
      type: object
      additionalProperties: false
      required: [by_status, expired_locks, recent_self_tests, failed_self_tests, usage_settlement_backlog]
      properties:
        by_status:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [status, count]
            properties:
              status: { type: string, enum: [pending, running, succeeded, failed, dead] }
              count: { type: integer, minimum: 0 }
        oldest_pending_at: { type: string, format: date-time }
        expired_locks: { type: integer, minimum: 0 }
        recent_self_tests: { type: integer, minimum: 0 }
        failed_self_tests: { type: integer, minimum: 0 }
        usage_settlement_backlog: { type: integer, minimum: 0 }
        last_usage_rollup_at: { type: string, format: date-time }
        last_retention_at: { type: string, format: date-time }
        last_usage_reconciliation_at: { type: string, format: date-time }
        last_signing_key_rotation_at: { type: string, format: date-time }
        last_external_jwks_refresh_at: { type: string, format: date-time }
    DoctorReplicaFacts:
      type: object
      additionalProperties: false
      required: [fresh_by_role, fresh_apis, fresh_workers, stale_replicas]
      properties:
        fresh_by_role:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [role, count]
            properties:
              role: { type: string, enum: [all, api, worker] }
              count: { type: integer, minimum: 0 }
        fresh_apis: { type: integer, minimum: 0 }
        fresh_workers: { type: integer, minimum: 0 }
        stale_replicas: { type: integer, minimum: 0 }
        newest_heartbeat_at: { type: string, format: date-time }
    DoctorRuntimeFacts:
      type: object
      additionalProperties: false
      required: [server_version, latest_compatible_version, compatibility_source, commit, build_date, contract_version, protocol_versions, role, clock_offset_ms]
      properties:
        server_version: { type: string }
        latest_compatible_version: { type: string }
        compatibility_source: { type: string, enum: [embedded_self] }
        commit: { type: string }
        build_date: { type: string }
        contract_version: { type: string }
        protocol_versions: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: integer, minimum: 1 } }
        role: { type: string, enum: [all, api, worker] }
        clock_offset_ms: { type: integer }
    DoctorRetentionFacts:
      type: object
      additionalProperties: false
      required: [policy_mode, admin_session_retention_hours, job_history_retention_hours, runtime_instance_retention_hours]
      properties:
        policy_mode: { type: string, enum: [fixed_operational_operator_tenant_data] }
        admin_session_retention_hours: { type: integer, minimum: 1 }
        job_history_retention_hours: { type: integer, minimum: 1 }
        runtime_instance_retention_hours: { type: integer, minimum: 1 }
        oldest_request_at: { type: string, format: date-time }
        oldest_usage_at: { type: string, format: date-time }
        oldest_audit_at: { type: string, format: date-time }
    DoctorFacts:
      type: object
      additionalProperties: false
      required: [runtime, database, configuration, security, jobs, replicas, retention, expired_quota_reservations]
      properties:
        runtime: { $ref: '#/components/schemas/DoctorRuntimeFacts' }
        database: { $ref: '#/components/schemas/DoctorDatabaseFacts' }
        configuration: { $ref: '#/components/schemas/DoctorConfigurationFacts' }
        security: { $ref: '#/components/schemas/DoctorSecurityFacts' }
        jobs: { $ref: '#/components/schemas/DoctorJobFacts' }
        replicas: { $ref: '#/components/schemas/DoctorReplicaFacts' }
        retention: { $ref: '#/components/schemas/DoctorRetentionFacts' }
        expired_quota_reservations: { type: integer, minimum: 0 }
    DoctorReport:
      type: object
      additionalProperties: false
      required: [status, database, schema_version, role, report_schema, generated_at, overall_state, checks, facts]
      properties:
        status: { type: string, enum: [ok, error], description: Compatibility status for database/schema readiness. }
        database: { type: string, enum: [reachable, unreachable] }
        schema_version: { type: integer, minimum: 0 }
        role: { type: string, enum: [all, api, worker] }
        report_schema: { type: integer, const: 1 }
        generated_at: { type: string, format: date-time }
        overall_state: { type: string, enum: [healthy, degraded, unhealthy] }
        checks: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/DoctorCheck' } }
        facts: { $ref: '#/components/schemas/DoctorFacts' }
    SupportBundle:
      type: object
      additionalProperties: false
      required: [bundle_schema, generated_at, source, report, redaction]
      properties:
        bundle_schema: { type: integer, const: 1 }
        generated_at: { type: string, format: date-time }
        source: { type: string, enum: [admin_api, local_cli, unknown] }
        report: { $ref: '#/components/schemas/DoctorReport' }
        redaction:
          type: object
          additionalProperties: false
          required: [mode, excluded]
          properties:
            mode: { type: string, const: structural_allowlist }
            excluded:
              type: array
              minItems: 10
              maxItems: 32
              uniqueItems: true
              items: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, request_id, retryable, documentation_url]
      properties:
        type: { type: string, format: uri }
        documentation_url:
          type: string
          format: uri
          pattern: '^https://docs\.latchway\.dev/errors/[a-z0-9-]+$'
        title: { type: string, minLength: 1, maxLength: 256 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, minLength: 1, maxLength: 2048 }
        instance: { type: string, format: uri-reference }
        code:
          $ref: './client.openapi.yaml#/components/schemas/Problem/properties/code'
        request_id: { type: string, minLength: 8, maxLength: 128 }
        retryable: { type: boolean }
        retry_after: { type: string, format: date-time }
        operation_id: { type: string, pattern: '^arq_[0-7][0-9A-HJKMNPQRSTVWXYZ]{25}$' }
        errors: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ValidationIssue' } }
      allOf:
        - if:
            properties:
              code: { const: operation_indeterminate }
            required: [code]
          then:
            required: [operation_id]
          else:
            not:
              required: [operation_id]
