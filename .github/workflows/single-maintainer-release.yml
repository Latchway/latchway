name: Publish v1 core with single-maintainer profile

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact 40-character v1.0.0 core candidate commit
        required: true
        type: string
      candidate_run_id:
        description: Exact successful Release candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact successful Release candidate run attempt
        required: true
        type: string
      compose_run_id:
        description: Exact successful Compose deployment-evidence run ID
        required: true
        type: string
      compose_run_attempt:
        description: Exact successful Compose deployment-evidence run attempt
        required: true
        type: string
      cloud_run_run_id:
        description: Exact successful Cloud Run deployment-evidence run ID
        required: true
        type: string
      cloud_run_run_attempt:
        description: Exact successful Cloud Run deployment-evidence run attempt
        required: true
        type: string

permissions: {}

concurrency:
  # Serialize with the strict promotion path because both own moving OCI tags.
  group: promote-stable-oci-aliases
  cancel-in-progress: false

jobs:
  source-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run local core and additive release gates without publication authority
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/validate-contracts.py
          python3 -m unittest \
            scripts/test_release_candidate.py \
            scripts/test_release_profile.py \
            scripts/test_single_maintainer_release.py \
            scripts/test_single_maintainer_release_workflow.py
          make fmt
          git diff --exit-code
          go vet ./...
          go test -count=1 ./...

  plan:
    needs: source-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Validate fixed v1 coordinates and authenticate exact producer runs without a checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          COMPOSE_RUN_ID: ${{ inputs.compose_run_id }}
          COMPOSE_RUN_ATTEMPT: ${{ inputs.compose_run_attempt }}
          CLOUD_RUN_ID: ${{ inputs.cloud_run_run_id }}
          CLOUD_RUN_ATTEMPT: ${{ inputs.cloud_run_run_attempt }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          for value in "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" \
            "$COMPOSE_RUN_ID" "$COMPOSE_RUN_ATTEMPT" \
            "$CLOUD_RUN_ID" "$CLOUD_RUN_ATTEMPT"; do
            [[ "$value" =~ ^[1-9][0-9]{0,19}$ ]]
          done
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          mkdir -p "$RUNNER_TEMP/producer-runs"
          verify_run() {
            local label="$1" run_id="$2" run_attempt="$3" expected_path="$4"
            local run="$RUNNER_TEMP/producer-runs/$label-run.json"
            local workflow="$RUNNER_TEMP/producer-runs/$label-workflow.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$run_attempt" > "$run"
            jq --exit-status --arg commit "$CANDIDATE_COMMIT" --argjson attempt "$run_attempt" '
              .event == "workflow_dispatch" and .status == "completed" and
              .conclusion == "success" and .head_sha == $commit and
              .head_branch == "main" and .run_attempt == $attempt and
              (.workflow_id | type == "number" and . > 0)
            ' "$run" >/dev/null
            workflow_id=$(jq --raw-output .workflow_id "$run")
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$workflow"
            jq --exit-status --arg path "$expected_path" '
              .path == $path and .state == "active"
            ' "$workflow" >/dev/null
          }
          verify_run candidate "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" \
            .github/workflows/release.yml
          verify_run compose "$COMPOSE_RUN_ID" "$COMPOSE_RUN_ATTEMPT" \
            .github/workflows/deployment-evidence.yml
          verify_run cloud-run "$CLOUD_RUN_ID" "$CLOUD_RUN_ATTEMPT" \
            .github/workflows/deployment-evidence.yml
      - name: Download the exact immutable candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/inputs/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact Compose deployment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-deployment-compose-${{ inputs.candidate_commit }}-${{ inputs.compose_run_id }}-${{ inputs.compose_run_attempt }}
          path: ${{ runner.temp }}/inputs/compose
          run-id: ${{ inputs.compose_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact Cloud Run deployment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-deployment-cloud_run-${{ inputs.candidate_commit }}-${{ inputs.cloud_run_run_id }}-${{ inputs.cloud_run_run_attempt }}
          path: ${{ runner.temp }}/inputs/cloud_run
          run-id: ${{ inputs.cloud_run_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate Compose and Cloud Run attestations before candidate code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/inputs/candidate/latchway-candidate.json" \
            --bundle "$RUNNER_TEMP/inputs/candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          for platform in compose cloud_run; do
            gh attestation verify "$RUNNER_TEMP/inputs/$platform/$platform.tar.gz" \
              --bundle "$RUNNER_TEMP/inputs/$platform/$platform.attestation.json" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deployment-evidence.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done
      - name: Check out the exact authenticated candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Close exact source deployment and scan evidence into a mutation handoff
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          COMPOSE_RUN_ID: ${{ inputs.compose_run_id }}
          COMPOSE_RUN_ATTEMPT: ${{ inputs.compose_run_attempt }}
          CLOUD_RUN_ID: ${{ inputs.cloud_run_run_id }}
          CLOUD_RUN_ATTEMPT: ${{ inputs.cloud_run_run_attempt }}
        run: |
          set -Eeuo pipefail
          python3 scripts/single-maintainer-release.py prepare \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --compose-run-id "$COMPOSE_RUN_ID" \
            --compose-run-attempt "$COMPOSE_RUN_ATTEMPT" \
            --cloud-run-run-id "$CLOUD_RUN_ID" \
            --cloud-run-run-attempt "$CLOUD_RUN_ATTEMPT" \
            --candidate-dir "$RUNNER_TEMP/inputs/candidate" \
            --compose-dir "$RUNNER_TEMP/inputs/compose" \
            --cloud-run-dir "$RUNNER_TEMP/inputs/cloud_run" \
            --output-directory "$RUNNER_TEMP/single-maintainer-handoff" \
            > "$RUNNER_TEMP/single-maintainer-prepare.json"
      - name: Retain only the verified source-free mutation handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-single-maintainer-v1-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/single-maintainer-handoff
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  semantic-handoff:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out only the exact verifier source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the immutable source-free handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-single-maintainer-v1-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff
      - name: Re-run complete candidate and deployment semantics without publication authority
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          COMPOSE_RUN_ID: ${{ inputs.compose_run_id }}
          COMPOSE_RUN_ATTEMPT: ${{ inputs.compose_run_attempt }}
          CLOUD_RUN_ID: ${{ inputs.cloud_run_run_id }}
          CLOUD_RUN_ATTEMPT: ${{ inputs.cloud_run_run_attempt }}
        run: |
          set -Eeuo pipefail
          python3 scripts/single-maintainer-release.py verify-handoff \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --compose-run-id "$COMPOSE_RUN_ID" \
            --compose-run-attempt "$COMPOSE_RUN_ATTEMPT" \
            --cloud-run-run-id "$CLOUD_RUN_ID" \
            --cloud-run-run-attempt "$CLOUD_RUN_ATTEMPT" \
            --handoff-directory "$RUNNER_TEMP/handoff" \
            > "$RUNNER_TEMP/verified-handoff.json"

  supply-chain:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Download the immutable source-free handoff without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-single-maintainer-v1-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff
      - name: Authenticate exact local assets and producer attestations before registry access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/handoff"
          test -z "$(find "$root" -type l -print -quit)"
          test "$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 15
          test "$(wc -l < "$root/SHA256SUMS" | tr -d ' ')" = 14
          (cd "$root" && sha256sum --strict --check SHA256SUMS)
          manifest="$root/latchway-candidate.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" '
            .schema_version == 1 and .kind == "latchway_release_candidate" and
            .status == "passed" and .candidate_commit == $commit and
            .intended_tag == "v1.0.0" and .version == "1.0.0" and
            ([.artifacts[].path] | sort) == [
              "latchway-contract.tar.gz",
              "latchway-linux-amd64-license.json",
              "latchway-linux-amd64-vulnerability.json",
              "latchway-linux-amd64.spdx.json",
              "latchway-linux-arm64-license.json",
              "latchway-linux-arm64-vulnerability.json",
              "latchway-linux-arm64.spdx.json"
            ] and ([.artifacts[].path] | unique | length) == 7 and
            all(.artifacts[]; (.sha256 | test("^[0-9a-f]{64}$")))
          ' "$manifest" >/dev/null
          jq --exit-status --raw-output '.artifacts[] | [.path,.sha256] | @tsv' "$manifest" |
            while IFS=$'\t' read -r name expected; do
              test "$(sha256sum "$root/$name" | cut -d ' ' -f 1)" = "$expected"
            done
          for architecture in amd64 arm64; do
            jq --exit-status '
              .SchemaVersion >= 2 and (.Results | type == "array") and
              all(.Results[]; all((.Vulnerabilities // [])[]; .Severity != "HIGH" and .Severity != "CRITICAL"))
            ' "$root/latchway-linux-$architecture-vulnerability.json" >/dev/null
            jq --exit-status '
              .SchemaVersion >= 2 and (.Results | type == "array") and
              all(.Results[]; all((.Licenses // [])[]; .Severity != "HIGH" and .Severity != "CRITICAL"))
            ' "$root/latchway-linux-$architecture-license.json" >/dev/null
            jq --exit-status '
              .spdxVersion == "SPDX-2.3" and (.SPDXID | startswith("SPDXRef-")) and
              (.documentNamespace | type == "string" and length > 0) and
              (.creationInfo.created | type == "string" and length > 0) and
              (.packages | type == "array" and length > 0) and
              all(.packages[]; (.SPDXID | startswith("SPDXRef-")) and (.name | type == "string" and length > 0))
            ' "$root/latchway-linux-$architecture.spdx.json" >/dev/null
          done
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          gh attestation verify "$manifest" \
            --bundle "$root/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          for platform in compose cloud_run; do
            gh attestation verify "$root/$platform.tar.gz" \
              --bundle "$root/$platform.attestation.json" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deployment-evidence.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate only the fresh read-only registry verifier
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify exact multi-architecture digest signature provenance and SBOMs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/handoff"
          manifest="$root/latchway-candidate.json"
          image=$(jq --raw-output .image.repository "$manifest")
          index_digest=$(jq --raw-output .image.index_digest "$manifest")
          coordinate="$image@$index_digest"
          test "$image" = ghcr.io/latchway/latchway
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "$coordinate" > "$RUNNER_TEMP/candidate-index.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/candidate-index.json" | cut -d ' ' -f 1)" = "$index_digest"
          docker buildx imagetools inspect --raw "$image:candidate-$CANDIDATE_COMMIT" > "$RUNNER_TEMP/candidate-tag-index.json"
          cmp --silent "$RUNNER_TEMP/candidate-index.json" "$RUNNER_TEMP/candidate-tag-index.json"
          jq --exit-status --arg amd64 "$(jq -r '.image.platforms[\"linux/amd64\"]' "$manifest")" \
            --arg arm64 "$(jq -r '.image.platforms[\"linux/arm64\"]' "$manifest")" '
              .schemaVersion == 2 and (.manifests | length) == 2 and
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] == [$amd64]) and
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] == [$arm64])
            ' "$RUNNER_TEMP/candidate-index.json" >/dev/null
          cosign verify \
            --certificate-identity "https://github.com/Latchway/latchway/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$CANDIDATE_COMMIT" \
            "$coordinate" >/dev/null
          gh attestation verify "oci://$coordinate" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners \
            --bundle-from-oci --predicate-type https://slsa.dev/provenance/v1 >/dev/null
          for architecture in amd64 arm64; do
            child=$(jq --raw-output --arg platform "linux/$architecture" '.image.platforms[$platform]' "$manifest")
            gh attestation verify "oci://$image@$child" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners \
              --bundle-from-oci --predicate-type https://spdx.dev/Document/v2.3 \
              --format json > "$RUNNER_TEMP/$architecture-spdx-attestation.json"
            jq --exit-status --slurpfile expected "$root/latchway-linux-$architecture.spdx.json" \
              --arg digest "${child#sha256:}" '
                type == "array" and length >= 1 and
                any(.[].verificationResult.statement;
                  .predicateType == "https://spdx.dev/Document/v2.3" and
                  any(.subject[]; .digest.sha256 == $digest) and
                  .predicate == $expected[0])
              ' "$RUNNER_TEMP/$architecture-spdx-attestation.json" >/dev/null
          done
      - name: Remove the registry credential before leaving the verifier
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  attest-handoff:
    needs: [plan, semantic-handoff, supply-chain]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-evidence-signing
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Verify the exact single-maintainer release-evidence-signing policy
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_PROFILE_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-profile-v1:latchway:single_maintainer_v1:release-evidence-signing"
      - name: Download the exact source-free single-maintainer handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-single-maintainer-v1-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff
      - name: Revalidate exact authenticated semantic handoff before requesting OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          COMPOSE_RUN_ID: ${{ inputs.compose_run_id }}
          COMPOSE_RUN_ATTEMPT: ${{ inputs.compose_run_attempt }}
          CLOUD_RUN_ID: ${{ inputs.cloud_run_run_id }}
          CLOUD_RUN_ATTEMPT: ${{ inputs.cloud_run_run_attempt }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/handoff"
          test -d "$root" && test ! -L "$root"
          test -z "$(find "$root" -type l -print -quit)"
          printf '%s\n' \
            SHA256SUMS \
            cloud_run.attestation.json cloud_run.tar.gz \
            compose.attestation.json compose.tar.gz \
            latchway-candidate.attestation.sigstore.json latchway-candidate.json \
            latchway-contract.tar.gz \
            latchway-linux-amd64-license.json latchway-linux-amd64-vulnerability.json latchway-linux-amd64.spdx.json \
            latchway-linux-arm64-license.json latchway-linux-arm64-vulnerability.json latchway-linux-arm64.spdx.json \
            latchway-single-maintainer-v1.json | LC_ALL=C sort > "$RUNNER_TEMP/expected-files"
          find "$root" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          diff --unified=0 "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          test "$(wc -l < "$root/SHA256SUMS" | tr -d ' ')" = 14
          (cd "$root" && sha256sum --strict --check SHA256SUMS)
          manifest="$root/latchway-candidate.json"
          record="$root/latchway-single-maintainer-v1.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" '
            (keys | sort) == ["artifacts","candidate_commit","contract","created_at","image","intended_tag","kind","schema_version","status","version"] and
            .schema_version == 1 and .kind == "latchway_release_candidate" and
            .status == "passed" and .candidate_commit == $commit and
            .intended_tag == "v1.0.0" and .version == "1.0.0" and
            ([.artifacts[].path] | sort) == [
              "latchway-contract.tar.gz",
              "latchway-linux-amd64-license.json",
              "latchway-linux-amd64-vulnerability.json",
              "latchway-linux-amd64.spdx.json",
              "latchway-linux-arm64-license.json",
              "latchway-linux-arm64-vulnerability.json",
              "latchway-linux-arm64.spdx.json"
            ] and ([.artifacts[].path] | unique | length) == 7 and
            all(.artifacts[];
              (keys | sort) == ["path","sha256"] and
              (.sha256 | test("^[0-9a-f]{64}$")))
          ' "$manifest" >/dev/null
          jq --exit-status --raw-output '.artifacts[] | [.path,.sha256] | @tsv' "$manifest" |
            while IFS=$'\t' read -r name expected; do
              test "$(sha256sum "$root/$name" | cut -d ' ' -f 1)" = "$expected"
            done
          for architecture in amd64 arm64; do
            jq --exit-status '
              .SchemaVersion >= 2 and (.Results | type == "array") and
              all(.Results[]; all((.Vulnerabilities // [])[]; .Severity != "HIGH" and .Severity != "CRITICAL"))
            ' "$root/latchway-linux-$architecture-vulnerability.json" >/dev/null
            jq --exit-status '
              .SchemaVersion >= 2 and (.Results | type == "array") and
              all(.Results[]; all((.Licenses // [])[]; .Severity != "HIGH" and .Severity != "CRITICAL"))
            ' "$root/latchway-linux-$architecture-license.json" >/dev/null
            jq --exit-status '
              .spdxVersion == "SPDX-2.3" and (.SPDXID | startswith("SPDXRef-")) and
              (.documentNamespace | type == "string" and length > 0) and
              (.creationInfo.created | type == "string" and length > 0) and
              (.packages | type == "array" and length > 0) and
              all(.packages[]; (.SPDXID | startswith("SPDXRef-")) and (.name | type == "string" and length > 0))
            ' "$root/latchway-linux-$architecture.spdx.json" >/dev/null
          done
          jq --exit-status --slurpfile candidate "$manifest" \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg candidate_run "$CANDIDATE_RUN_ID" --argjson candidate_attempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg compose_run "$COMPOSE_RUN_ID" --argjson compose_attempt "$COMPOSE_RUN_ATTEMPT" \
            --arg cloud_run "$CLOUD_RUN_ID" --argjson cloud_attempt "$CLOUD_RUN_ATTEMPT" '
            (keys | sort) == ["assets","candidate_commit","candidate_run","claims","core_publication_gate","deferred_evidence","deployment_evidence","github_release","image","kind","profile","profile_status","release_policy","schema_version","supply_chain","tag","version"] and
            .schema_version == 1 and .kind == "latchway_single_maintainer_v1_core_release" and
            .profile == "single_maintainer_v1" and .profile_status == "incomplete" and
            .release_policy == {
              mode:"single_maintainer_v1",
              independent_reviewer_required:false,
              strict_full_controls_satisfied:false,
              environment_policy_ids:{
                release_evidence_signing:"latchway-release-profile-v1:latchway:single_maintainer_v1:release-evidence-signing",
                release_image_publishing:"latchway-release-profile-v1:latchway:single_maintainer_v1:release-image-publishing"
              }
            } and
            .core_publication_gate == "passed" and .candidate_commit == $commit and
            .tag == "v1.0.0" and .version == "1.0.0" and
            .image == {
              repository:"ghcr.io/latchway/latchway",
              index_digest:$candidate[0].image.index_digest,
              coordinate:("ghcr.io/latchway/latchway@" + $candidate[0].image.index_digest),
              platforms:$candidate[0].image.platforms
            } and
            .candidate_run == {run_id:$candidate_run,run_attempt:$candidate_attempt} and
            .deployment_evidence.compose.run_id == $compose_run and
            .deployment_evidence.compose.run_attempt == $compose_attempt and
            .deployment_evidence.cloud_run.run_id == $cloud_run and
            .deployment_evidence.cloud_run.run_attempt == $cloud_attempt and
            .claims == {fully_evidence_gated:false,independently_reviewed:false,release_qualified:false} and
            .supply_chain == {license_scan_verified:true,multi_arch_image_verified:true,provenance_verified:true,sbom_verified:true,signature_verified:true,vulnerability_scan_verified:true} and
            .deferred_evidence == [
              "independent_human_review",
              "live_sdk_conformance",
              "physical_devices",
              "apple_distribution_and_extensions",
              "play_integrity_and_android_device",
              "firebase_app_check",
              "turnstile",
              "live_provider",
              "cloud_deployments.aws_verified",
              "cloud_deployments.fly_io_verified",
              "cloud_deployments.cloudflare_containers_verified",
              "operational_resilience",
              "public_registries.documentation_production_verified",
              "mintlify_production"
            ] and
            ([.assets[].path] | sort) == [
              "cloud_run.attestation.json","cloud_run.tar.gz",
              "compose.attestation.json","compose.tar.gz",
              "latchway-candidate.attestation.sigstore.json","latchway-candidate.json",
              "latchway-contract.tar.gz",
              "latchway-linux-amd64-license.json","latchway-linux-amd64-vulnerability.json","latchway-linux-amd64.spdx.json",
              "latchway-linux-arm64-license.json","latchway-linux-arm64-vulnerability.json","latchway-linux-arm64.spdx.json"
            ] and ([.assets[].path] | unique | length) == 13 and
            all(.assets[]; (keys | sort) == ["path","sha256"] and (.sha256 | test("^[0-9a-f]{64}$")))
          ' "$record" >/dev/null
          jq --exit-status --raw-output '.assets[] | [.path,.sha256] | @tsv' "$record" |
            while IFS=$'\t' read -r name expected; do
              test "$(sha256sum "$root/$name" | cut -d ' ' -f 1)" = "$expected"
            done
          for platform in compose cloud_run; do
            archive_sha=$(sha256sum "$root/$platform.tar.gz" | cut -d ' ' -f 1)
            attestation_sha=$(sha256sum "$root/$platform.attestation.json" | cut -d ' ' -f 1)
            jq --exit-status --arg platform "$platform" --arg archive "$archive_sha" --arg attestation "$attestation_sha" '
              .deployment_evidence[$platform].platform == $platform and
              .deployment_evidence[$platform].archive_sha256 == $archive and
              .deployment_evidence[$platform].attestation_sha256 == $attestation and
              (.deployment_evidence[$platform].endpoint | type == "string" and length > 0) and
              (.deployment_evidence[$platform].provider_resource_id | type == "string" and length > 0)
            ' "$record" >/dev/null
          done
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          gh attestation verify "$manifest" \
            --bundle "$root/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          for platform in compose cloud_run; do
            gh attestation verify "$root/$platform.tar.gz" \
              --bundle "$root/$platform.attestation.json" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deployment-evidence.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done
      - name: Attest the exact source-free core publication handoff
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/handoff/*

  immutable-release-settings:
    needs: plan
    if: github.ref == 'refs/heads/main'
    environment: single-maintainer-v1-administration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify the exact single-maintainer administration policy
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_PROFILE_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-profile-v1:latchway:single_maintainer_v1:administration"
      - name: Preflight immutable-release settings for the complete product without a checkout
        shell: bash
        env:
          LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          test -n "$LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN"
          for repository in \
            Latchway/latchway \
            Latchway/latchway-js \
            Latchway/latchway-ios-sdk \
            Latchway/latchway-android \
            Latchway/latchway-react-native-sdk; do
            GH_TOKEN="$LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN" gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$repository/immutable-releases" \
              > "$RUNNER_TEMP/immutable-releases.json"
            jq --exit-status '
              type == "object" and
              (keys | sort) == ["enabled","enforced_by_owner"] and
              .enabled == true and (.enforced_by_owner | type) == "boolean"
            ' "$RUNNER_TEMP/immutable-releases.json" >/dev/null
          done

  stage-release:
    needs: [plan, attest-handoff, immutable-release-settings]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-evidence-signing
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Verify the exact single-maintainer release-evidence-signing policy
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_PROFILE_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-profile-v1:latchway:single_maintainer_v1:release-evidence-signing"
      - name: Download the exact source-free single-maintainer handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-single-maintainer-v1-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff
      - name: Revalidate exact closure attestations and honest profile record before GitHub mutation
        id: record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          COMPOSE_RUN_ID: ${{ inputs.compose_run_id }}
          COMPOSE_RUN_ATTEMPT: ${{ inputs.compose_run_attempt }}
          CLOUD_RUN_ID: ${{ inputs.cloud_run_run_id }}
          CLOUD_RUN_ATTEMPT: ${{ inputs.cloud_run_run_attempt }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/handoff"
          printf '%s\n' \
            SHA256SUMS \
            cloud_run.attestation.json cloud_run.tar.gz \
            compose.attestation.json compose.tar.gz \
            latchway-candidate.attestation.sigstore.json latchway-candidate.json \
            latchway-contract.tar.gz \
            latchway-linux-amd64-license.json latchway-linux-amd64-vulnerability.json latchway-linux-amd64.spdx.json \
            latchway-linux-arm64-license.json latchway-linux-arm64-vulnerability.json latchway-linux-arm64.spdx.json \
            latchway-single-maintainer-v1.json | LC_ALL=C sort > "$RUNNER_TEMP/expected-files"
          find "$root" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          diff --unified=0 "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          test -z "$(find "$root" -type l -print -quit)"
          test "$(wc -l < "$root/SHA256SUMS" | tr -d ' ')" = 14
          (cd "$root" && sha256sum --strict --check SHA256SUMS)
          for subject in SHA256SUMS latchway-single-maintainer-v1.json; do
            gh attestation verify "$root/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/single-maintainer-release.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done
          record="$root/latchway-single-maintainer-v1.json"
          candidate="$root/latchway-candidate.json"
          index_digest=$(jq --exit-status --raw-output '.image.index_digest | select(test("^sha256:[0-9a-f]{64}$"))' "$candidate")
          image="ghcr.io/latchway/latchway@$index_digest"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg image "$image" \
            --arg candidate_run "$CANDIDATE_RUN_ID" --argjson candidate_attempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg compose_run "$COMPOSE_RUN_ID" --argjson compose_attempt "$COMPOSE_RUN_ATTEMPT" \
            --arg cloud_run "$CLOUD_RUN_ID" --argjson cloud_attempt "$CLOUD_RUN_ATTEMPT" '
              (keys | sort) == ["assets","candidate_commit","candidate_run","claims","core_publication_gate","deferred_evidence","deployment_evidence","github_release","image","kind","profile","profile_status","release_policy","schema_version","supply_chain","tag","version"] and
              .schema_version == 1 and .kind == "latchway_single_maintainer_v1_core_release" and
              .profile == "single_maintainer_v1" and .profile_status == "incomplete" and
              .release_policy == {
                mode:"single_maintainer_v1",
                independent_reviewer_required:false,
                strict_full_controls_satisfied:false,
                environment_policy_ids:{
                  release_evidence_signing:"latchway-release-profile-v1:latchway:single_maintainer_v1:release-evidence-signing",
                  release_image_publishing:"latchway-release-profile-v1:latchway:single_maintainer_v1:release-image-publishing"
                }
              } and
              .core_publication_gate == "passed" and .candidate_commit == $commit and
              .tag == "v1.0.0" and .version == "1.0.0" and .image.coordinate == $image and
              .candidate_run == {run_id:$candidate_run,run_attempt:$candidate_attempt} and
              .deployment_evidence.compose.run_id == $compose_run and
              .deployment_evidence.compose.run_attempt == $compose_attempt and
              .deployment_evidence.cloud_run.run_id == $cloud_run and
              .deployment_evidence.cloud_run.run_attempt == $cloud_attempt and
              .claims == {fully_evidence_gated:false,independently_reviewed:false,release_qualified:false} and
              .supply_chain == {license_scan_verified:true,multi_arch_image_verified:true,provenance_verified:true,sbom_verified:true,signature_verified:true,vulnerability_scan_verified:true} and
              (.deferred_evidence | index("independent_human_review") != null) and
              (.deferred_evidence | index("cloud_deployments.aws_verified") != null) and
              (.github_release.title == "Latchway v1.0.0 — single_maintainer_v1") and
              (.github_release.body | contains("Profile status: incomplete")) and
              (.github_release.body | contains("not release-qualified")) and
              ([.assets[].path] | length) == 13 and
              ([.assets[].path] | unique | length) == 13 and
              all(.assets[]; (.sha256 | test("^[0-9a-f]{64}$")))
            ' "$record" >/dev/null
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg digest "$index_digest" '
            .schema_version == 1 and .kind == "latchway_release_candidate" and
            .status == "passed" and .candidate_commit == $commit and
            .intended_tag == "v1.0.0" and .version == "1.0.0" and
            .image.repository == "ghcr.io/latchway/latchway" and .image.index_digest == $digest and
            (.image.platforms | keys | sort) == ["linux/amd64","linux/arm64"]
          ' "$candidate" >/dev/null
          gh attestation verify "$candidate" \
            --bundle "$root/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          for platform in compose cloud_run; do
            gh attestation verify "$root/$platform.tar.gz" \
              --bundle "$root/$platform.attestation.json" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deployment-evidence.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Preflight exact annotated tag release record and every fixed asset
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          IMAGE: ${{ steps.record.outputs.image }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/handoff"
          tag=v1.0.0
          title=$(jq --raw-output .github_release.title "$root/latchway-single-maintainer-v1.json")
          body=$(jq --raw-output .github_release.body "$root/latchway-single-maintainer-v1.json")
          message=$(jq --raw-output .github_release.tag_message "$root/latchway-single-maintainer-v1.json")
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$RUNNER_TEMP/tag-ref.json" 2> "$RUNNER_TEMP/tag-error"
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
            tag_object=$(jq --raw-output .object.sha "$RUNNER_TEMP/tag-ref.json")
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
            jq --exit-status --arg tag "$tag" --arg commit "$CANDIDATE_COMMIT" --arg message "$message" '
              .tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message
            ' "$RUNNER_TEMP/tag-object.json" >/dev/null
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            test "$tag_status" = 1
            grep --fixed-strings --quiet "HTTP 404" "$RUNNER_TEMP/tag-error"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          set +e
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            jq --exit-status --arg tag "$tag" --arg title "$title" --arg body "$body" '
              .tag_name == $tag and .name == $title and .body == $body and
              .prerelease == false and
              ((.draft == true and .immutable == false) or
               (.draft == false and .immutable == true))
            ' "$RUNNER_TEMP/release.json" >/dev/null
            jq --raw-output '.assets[].name' "$RUNNER_TEMP/release.json" | while IFS= read -r name; do
              test -f "$root/$name"
            done
            if [[ "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" == false ]]; then
              test "$(jq '.assets | length' "$RUNNER_TEMP/release.json")" = 15
            fi
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            test "$release_status" = 1
            grep --fixed-strings --quiet "HTTP 404" "$RUNNER_TEMP/release-error"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the exact annotated v1.0.0 tag
        if: steps.preflight.outputs.tag_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          record="$RUNNER_TEMP/handoff/latchway-single-maintainer-v1.json"
          message=$(jq --raw-output .github_release.tag_message "$record")
          jq --null-input --arg tag v1.0.0 --arg message "$message" --arg object "$CANDIDATE_COMMIT" \
            '{tag:$tag,message:$message,object:$object,type:"commit"}' > "$RUNNER_TEMP/create-tag.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/create-tag.json" > "$RUNNER_TEMP/created-tag.json"
          tag_object=$(jq --raw-output '.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/created-tag.json")
          jq --null-input --arg ref refs/tags/v1.0.0 --arg sha "$tag_object" '{ref:$ref,sha:$sha}' > "$RUNNER_TEMP/create-ref.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input "$RUNNER_TEMP/create-ref.json" >/dev/null
      - name: Re-fetch the immutable annotated tag and stage an exact recoverable release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          RELEASE_EXISTS: ${{ steps.preflight.outputs.release_exists }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/handoff"
          record="$root/latchway-single-maintainer-v1.json"
          title=$(jq --raw-output .github_release.title "$record")
          body=$(jq --raw-output .github_release.body "$record")
          message=$(jq --raw-output .github_release.tag_message "$record")
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" > "$RUNNER_TEMP/final-tag-ref.json"
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/final-tag-ref.json")" = tag
          tag_object=$(jq --raw-output .object.sha "$RUNNER_TEMP/final-tag-ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/final-tag-object.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg message "$message" '
            .tag == "v1.0.0" and .object.type == "commit" and .object.sha == $commit and .message == $message
          ' "$RUNNER_TEMP/final-tag-object.json" >/dev/null
          if [[ "$RELEASE_EXISTS" != true ]]; then
            jq --null-input --arg tag v1.0.0 --arg commit "$CANDIDATE_COMMIT" --arg title "$title" --arg body "$body" \
              '{tag_name:$tag,target_commitish:$commit,name:$title,body:$body,draft:true,prerelease:false,generate_release_notes:false}' \
              > "$RUNNER_TEMP/create-release.json"
            gh api --method POST -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases" --input "$RUNNER_TEMP/create-release.json" >/dev/null
          fi
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > "$RUNNER_TEMP/staged-release.json"
          draft=$(jq --raw-output .draft "$RUNNER_TEMP/staged-release.json")
          for asset in "$root"/*; do
            name=${asset##*/}
            count=$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/staged-release.json")
            if [[ "$count" = 0 ]]; then
              test "$draft" = true
              gh release upload v1.0.0 "$asset" --repo "$GITHUB_REPOSITORY"
            else
              test "$count" = 1
              existing=$(jq --raw-output --arg name "$name" '[.assets[] | select(.name == $name)][0].digest // "digest-unavailable"' "$RUNNER_TEMP/staged-release.json")
              expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
              if [[ "$existing" != "$expected" ]]; then
                download=$(mktemp -d "$RUNNER_TEMP/existing-release-asset.XXXXXX")
                gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" \
                  --pattern "$name" --dir "$download"
                cmp --silent "$asset" "$download/$name"
              fi
            fi
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > "$RUNNER_TEMP/staged-release.json"
          done
          jq --exit-status --arg title "$title" --arg body "$body" '
            .tag_name == "v1.0.0" and .name == $title and .body == $body and
            .prerelease == false and
            ((.draft == true and .immutable == false) or
             (.draft == false and .immutable == true))
          ' "$RUNNER_TEMP/staged-release.json" >/dev/null
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/staged-release.json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/staged-release-assets"
          diff --unified=0 "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/staged-release-assets"
          while IFS= read -r name; do
            expected="sha256:$(sha256sum "$root/$name" | cut -d ' ' -f 1)"
            actual=$(jq --raw-output --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then (.[0].digest // "digest-unavailable")
              else error("staged core release asset missing or duplicated") end
            ' "$RUNNER_TEMP/staged-release.json")
            test "$actual" = "$expected"
          done < "$RUNNER_TEMP/expected-files"

  promote-oci:
    needs: [plan, stage-release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-image-publishing
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    steps:
      - name: Verify the exact single-maintainer release-image-publishing policy
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_PROFILE_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-profile-v1:latchway:single_maintainer_v1:release-image-publishing"
      - name: Download the exact source-free single-maintainer handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-single-maintainer-v1-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff
      - name: Revalidate handoff hashes producer attestations tag and draft before registry authentication
        id: record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/handoff"
          test -z "$(find "$root" -type l -print -quit)"
          test "$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 15
          test "$(wc -l < "$root/SHA256SUMS" | tr -d ' ')" = 14
          (cd "$root" && sha256sum --strict --check SHA256SUMS)
          for subject in SHA256SUMS latchway-single-maintainer-v1.json; do
            gh attestation verify "$root/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/single-maintainer-release.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done
          record="$root/latchway-single-maintainer-v1.json"
          candidate="$root/latchway-candidate.json"
          index_digest=$(jq --exit-status --raw-output '.image.index_digest | select(test("^sha256:[0-9a-f]{64}$"))' "$candidate")
          image="ghcr.io/latchway/latchway@$index_digest"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg image "$image" '
            .profile == "single_maintainer_v1" and .profile_status == "incomplete" and
            .release_policy == {
              mode:"single_maintainer_v1",independent_reviewer_required:false,strict_full_controls_satisfied:false,
              environment_policy_ids:{
                release_evidence_signing:"latchway-release-profile-v1:latchway:single_maintainer_v1:release-evidence-signing",
                release_image_publishing:"latchway-release-profile-v1:latchway:single_maintainer_v1:release-image-publishing"
              }
            } and
            .core_publication_gate == "passed" and .candidate_commit == $commit and
            .tag == "v1.0.0" and .image.coordinate == $image and
            .claims.release_qualified == false and .claims.fully_evidence_gated == false and
            .claims.independently_reviewed == false
          ' "$record" >/dev/null
          gh attestation verify "$candidate" --bundle "$root/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          for platform in compose cloud_run; do
            gh attestation verify "$root/$platform.tar.gz" --bundle "$root/$platform.attestation.json" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deployment-evidence.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done
          message=$(jq --raw-output .github_release.tag_message "$record")
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" > "$RUNNER_TEMP/tag-ref.json"
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
          tag_object=$(jq --raw-output .object.sha "$RUNNER_TEMP/tag-ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg message "$message" '
            .tag == "v1.0.0" and .object.type == "commit" and .object.sha == $commit and .message == $message
          ' "$RUNNER_TEMP/tag-object.json" >/dev/null
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > "$RUNNER_TEMP/release.json"
          jq --exit-status --arg title "$(jq -r .github_release.title "$record")" \
            --arg body "$(jq -r .github_release.body "$record")" '
              .tag_name == "v1.0.0" and .name == $title and .body == $body and
              .prerelease == false and (.draft == true or .draft == false) and (.assets | length) == 15
            ' "$RUNNER_TEMP/release.json" >/dev/null
          echo "image=ghcr.io/latchway/latchway" >> "$GITHUB_OUTPUT"
          echo "index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          echo "coordinate=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate only the exact GHCR promoter
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Preflight signed candidate provenance SBOMs and every stable coordinate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          IMAGE: ${{ steps.record.outputs.image }}
          INDEX_DIGEST: ${{ steps.record.outputs.index_digest }}
          COORDINATE: ${{ steps.record.outputs.coordinate }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/handoff"
          candidate="$root/latchway-candidate.json"
          docker buildx imagetools inspect --raw "$COORDINATE" > "$RUNNER_TEMP/candidate-index.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/candidate-index.json" | cut -d ' ' -f 1)" = "$INDEX_DIGEST"
          docker buildx imagetools inspect --raw "$IMAGE:candidate-$CANDIDATE_COMMIT" > "$RUNNER_TEMP/candidate-tag.json"
          cmp --silent "$RUNNER_TEMP/candidate-index.json" "$RUNNER_TEMP/candidate-tag.json"
          cosign verify \
            --certificate-identity "https://github.com/Latchway/latchway/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$CANDIDATE_COMMIT" "$COORDINATE" >/dev/null
          gh attestation verify "oci://$COORDINATE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --bundle-from-oci \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null
          for architecture in amd64 arm64; do
            child=$(jq --raw-output --arg platform "linux/$architecture" '.image.platforms[$platform]' "$candidate")
            gh attestation verify "oci://$IMAGE@$child" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners --bundle-from-oci \
              --predicate-type https://spdx.dev/Document/v2.3 --format json \
              > "$RUNNER_TEMP/$architecture-spdx.json"
            jq --exit-status --slurpfile expected "$root/latchway-linux-$architecture.spdx.json" \
              --arg digest "${child#sha256:}" '
                any(.[].verificationResult.statement;
                  .predicateType == "https://spdx.dev/Document/v2.3" and
                  any(.subject[]; .digest.sha256 == $digest) and .predicate == $expected[0])
              ' "$RUNNER_TEMP/$architecture-spdx.json" >/dev/null
          done
          inspect_tag() {
            local tag="$1" output="$2" error="$3"
            set +e
            docker buildx imagetools inspect --raw "$IMAGE:$tag" > "$output" 2> "$error"
            local status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              test "sha256:$(sha256sum "$output" | cut -d ' ' -f 1)" = "$INDEX_DIGEST"
              printf exact
              return
            fi
            grep --extended-regexp --ignore-case --quiet 'manifest unknown|name unknown|not found' "$error"
            printf absent
          }
          for tag in 1.0.0 1.0 1 latest; do
            state=$(inspect_tag "$tag" "$RUNNER_TEMP/$tag-preflight.json" "$RUNNER_TEMP/$tag-preflight.error")
            printf '%s\n' "$state" > "$RUNNER_TEMP/$tag.state"
          done
      - name: Promote only the exact candidate index to v1 stable tags
        shell: bash
        env:
          IMAGE: ${{ steps.record.outputs.image }}
          INDEX_DIGEST: ${{ steps.record.outputs.index_digest }}
          COORDINATE: ${{ steps.record.outputs.coordinate }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect --raw "$COORDINATE" > "$RUNNER_TEMP/candidate-reclosed.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/candidate-reclosed.json" | cut -d ' ' -f 1)" = "$INDEX_DIGEST"
          for tag in 1.0.0 1.0 1 latest; do
            state=$(cat "$RUNNER_TEMP/$tag.state")
            if [[ "$state" == absent ]]; then
              set +e
              docker buildx imagetools inspect --raw "$IMAGE:$tag" > "$RUNNER_TEMP/$tag-recheck.json" 2> "$RUNNER_TEMP/$tag-recheck.error"
              status=$?
              set -e
              if [[ "$status" -eq 0 ]]; then
                test "sha256:$(sha256sum "$RUNNER_TEMP/$tag-recheck.json" | cut -d ' ' -f 1)" = "$INDEX_DIGEST"
              else
                grep --extended-regexp --ignore-case --quiet 'manifest unknown|name unknown|not found' "$RUNNER_TEMP/$tag-recheck.error"
                docker buildx imagetools create --tag "$IMAGE:$tag" "$COORDINATE"
              fi
            else
              test "$state" = exact
            fi
            docker buildx imagetools inspect --raw "$IMAGE:$tag" > "$RUNNER_TEMP/$tag-final.json"
            test "sha256:$(sha256sum "$RUNNER_TEMP/$tag-final.json" | cut -d ' ' -f 1)" = "$INDEX_DIGEST"
          done
      - name: Remove the publisher registry credential
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  publish-release:
    needs: [plan, stage-release, promote-oci]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-evidence-signing
    permissions:
      actions: read
      attestations: read
      contents: write
      packages: read
    steps:
      - name: Verify the exact single-maintainer release-evidence-signing policy
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_PROFILE_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-profile-v1:latchway:single_maintainer_v1:release-evidence-signing"
      - name: Download the exact source-free single-maintainer handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-single-maintainer-v1-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff
      - name: Revalidate the exact handoff and producer attestations before publication
        id: record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          root="$RUNNER_TEMP/handoff"
          printf '%s\n' \
            SHA256SUMS \
            cloud_run.attestation.json cloud_run.tar.gz \
            compose.attestation.json compose.tar.gz \
            latchway-candidate.attestation.sigstore.json latchway-candidate.json \
            latchway-contract.tar.gz \
            latchway-linux-amd64-license.json latchway-linux-amd64-vulnerability.json latchway-linux-amd64.spdx.json \
            latchway-linux-arm64-license.json latchway-linux-arm64-vulnerability.json latchway-linux-arm64.spdx.json \
            latchway-single-maintainer-v1.json | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets"
          find "$root" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/handoff-assets"
          diff --unified=0 "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/handoff-assets"
          test -z "$(find "$root" -type l -print -quit)"
          test "$(wc -l < "$root/SHA256SUMS" | tr -d ' ')" = 14
          (cd "$root" && sha256sum --strict --check SHA256SUMS)
          for subject in SHA256SUMS latchway-single-maintainer-v1.json; do
            gh attestation verify "$root/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/single-maintainer-release.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done
          record="$root/latchway-single-maintainer-v1.json"
          candidate="$root/latchway-candidate.json"
          index_digest=$(jq --raw-output .image.index_digest "$candidate")
          coordinate="ghcr.io/latchway/latchway@$index_digest"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg image "$coordinate" '
            .profile == "single_maintainer_v1" and .profile_status == "incomplete" and
            .release_policy == {
              mode:"single_maintainer_v1",independent_reviewer_required:false,strict_full_controls_satisfied:false,
              environment_policy_ids:{
                release_evidence_signing:"latchway-release-profile-v1:latchway:single_maintainer_v1:release-evidence-signing",
                release_image_publishing:"latchway-release-profile-v1:latchway:single_maintainer_v1:release-image-publishing"
              }
            } and
            .candidate_commit == $commit and .tag == "v1.0.0" and .image.coordinate == $image and
            .claims == {fully_evidence_gated:false,independently_reviewed:false,release_qualified:false}
          ' "$record" >/dev/null
          gh attestation verify "$candidate" --bundle "$root/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          for platform in compose cloud_run; do
            gh attestation verify "$root/$platform.tar.gz" --bundle "$root/$platform.attestation.json" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deployment-evidence.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          done
          message=$(jq --raw-output .github_release.tag_message "$record")
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" > "$RUNNER_TEMP/tag-ref.json"
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
          tag_object=$(jq --raw-output .object.sha "$RUNNER_TEMP/tag-ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg message "$message" '
            .tag == "v1.0.0" and .object.type == "commit" and .object.sha == $commit and .message == $message
          ' "$RUNNER_TEMP/tag-object.json" >/dev/null
          echo "index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          echo "coordinate=$coordinate" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate only the final exact-coordinate verifier
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify signature provenance and all promoted v1 coordinates before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INDEX_DIGEST: ${{ steps.record.outputs.index_digest }}
          COORDINATE: ${{ steps.record.outputs.coordinate }}
        run: |
          set -Eeuo pipefail
          for tag in 1.0.0 1.0 1 latest; do
            docker buildx imagetools inspect --raw "ghcr.io/latchway/latchway:$tag" > "$RUNNER_TEMP/$tag-publication.json"
            test "sha256:$(sha256sum "$RUNNER_TEMP/$tag-publication.json" | cut -d ' ' -f 1)" = "$INDEX_DIGEST"
          done
          cosign verify \
            --certificate-identity "https://github.com/Latchway/latchway/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$CANDIDATE_COMMIT" "$COORDINATE" >/dev/null
          gh attestation verify "oci://$COORDINATE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --bundle-from-oci \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null
      - name: Publish and verify the profile-labeled GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/handoff"
          record="$root/latchway-single-maintainer-v1.json"
          tag=v1.0.0
          title=$(jq --raw-output .github_release.title "$record")
          body=$(jq --raw-output .github_release.body "$record")
          message=$(jq --raw-output .github_release.tag_message "$record")

          # Close the annotated tag and the complete mutable draft immediately
          # before the sole publication PATCH.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            > "$RUNNER_TEMP/pre-publish-tag-ref.json"
          jq --exit-status --arg ref "refs/tags/$tag" '
            .ref == $ref and .object.type == "tag" and
            (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/pre-publish-tag-ref.json" >/dev/null
          tag_object=$(jq --raw-output .object.sha "$RUNNER_TEMP/pre-publish-tag-ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            > "$RUNNER_TEMP/pre-publish-tag-object.json"
          jq --exit-status --arg tag "$tag" --arg commit "$CANDIDATE_COMMIT" --arg message "$message" '
            .tag == $tag and .object.type == "commit" and
            .object.sha == $commit and .message == $message
          ' "$RUNNER_TEMP/pre-publish-tag-object.json" >/dev/null

          gh api --include -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            > "$RUNNER_TEMP/pre-publish-release.http"
          head -n 1 "$RUNNER_TEMP/pre-publish-release.http" \
            | tr -d '\r' | grep --extended-regexp --quiet '^HTTP/[0-9.]+ 200( |$)'
          awk '
            {
              line=$0
              sub(/\r$/, "", line)
              if (body) print $0
              else if (line == "") body=1
            }
          ' "$RUNNER_TEMP/pre-publish-release.http" > "$RUNNER_TEMP/release.json"
          awk '
            {
              line=$0
              sub(/\r$/, "", line)
              if (tolower(line) ~ /^etag:[[:space:]]*/) {
                sub(/^[^:]+:[[:space:]]*/, "", line)
                print line
              }
            }
          ' "$RUNNER_TEMP/pre-publish-release.http" > "$RUNNER_TEMP/pre-publish-release.etag"
          test "$(wc -l < "$RUNNER_TEMP/pre-publish-release.etag" | tr -d ' ')" = 1
          grep --extended-regexp --quiet '^(W/)?"[^"]+"$' "$RUNNER_TEMP/pre-publish-release.etag"

          release_id=$(jq --raw-output '.id | select(type == "number" and . > 0 and floor == .)' "$RUNNER_TEMP/release.json")
          test -n "$release_id"
          release_mode=$(jq --raw-output '
            if .draft == true and .immutable == false then "draft"
            elif .draft == false and .immutable == true then "immutable"
            else "invalid" end
          ' "$RUNNER_TEMP/release.json")
          case "$release_mode" in
            draft|immutable) ;;
            *) echo "invalid immutable-release preflight mode" >&2; exit 1 ;;
          esac
          jq --exit-status --argjson id "$release_id" --arg tag "$tag" --arg title "$title" --arg body "$body" '
            .id == $id and .tag_name == $tag and .name == $title and .body == $body and
            .prerelease == false and
            ((.draft == true and .immutable == false) or
             (.draft == false and .immutable == true))
          ' "$RUNNER_TEMP/release.json" >/dev/null
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/release.json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/pre-publish-release-assets"
          diff --unified=0 "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/pre-publish-release-assets"
          while IFS= read -r name; do
            expected="sha256:$(sha256sum "$root/$name" | cut -d ' ' -f 1)"
            actual=$(jq --raw-output --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then (.[0].digest // "digest-unavailable")
              else error("pre-publication core asset missing or duplicated") end
            ' "$RUNNER_TEMP/release.json")
            test "$actual" = "$expected"
          done < "$RUNNER_TEMP/expected-release-assets"

          if [[ "$release_mode" == draft ]]; then
            jq --null-input '{draft:false}' > "$RUNNER_TEMP/publish-release.json"
            # GitHub does not document If-Match for this unsafe PATCH. Prove
            # the validated ETag is still current immediately before mutation.
            gh api --include \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "If-None-Match: $(cat "$RUNNER_TEMP/pre-publish-release.etag")" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              > "$RUNNER_TEMP/pre-publish-release-unchanged.http"
            head -n 1 "$RUNNER_TEMP/pre-publish-release-unchanged.http" \
              | tr -d '\r' | grep --extended-regexp --quiet '^HTTP/[0-9.]+ 304( |$)'
            gh api --method PATCH -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --input "$RUNNER_TEMP/publish-release.json" \
              > "$RUNNER_TEMP/published-release-response.json"
          fi

          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/published-release.json"
          jq --exit-status --argjson id "$release_id" --arg tag "$tag" --arg title "$title" --arg body "$body" '
            .id == $id and .tag_name == $tag and .name == $title and .body == $body and
            .draft == false and .prerelease == false and .immutable == true
          ' "$RUNNER_TEMP/published-release.json" >/dev/null
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/published-release-by-id.json"
          cmp --silent \
            <(jq --sort-keys . "$RUNNER_TEMP/published-release.json") \
            <(jq --sort-keys . "$RUNNER_TEMP/published-release-by-id.json")
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/published-release.json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/published-release-assets"
          diff --unified=0 "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/published-release-assets"
          while IFS= read -r name; do
            expected="sha256:$(sha256sum "$root/$name" | cut -d ' ' -f 1)"
            actual=$(jq --raw-output --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then (.[0].digest // "digest-unavailable")
              else error("immutable core release asset missing or duplicated") end
            ' "$RUNNER_TEMP/published-release.json")
            test "$actual" = "$expected"
            gh release verify-asset "$tag" "$root/$name" \
              --repo "$GITHUB_REPOSITORY" --format json \
              > "$RUNNER_TEMP/release-asset-$name.verification.json"
            test -s "$RUNNER_TEMP/release-asset-$name.verification.json"
          done < "$RUNNER_TEMP/expected-release-assets"
          gh release verify "$tag" --repo "$GITHUB_REPOSITORY" --format json \
            > "$RUNNER_TEMP/release-attestation.json"
          test -s "$RUNNER_TEMP/release-attestation.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            > "$RUNNER_TEMP/post-publish-tag-ref.json"
          cmp --silent \
            <(jq --sort-keys . "$RUNNER_TEMP/pre-publish-tag-ref.json") \
            <(jq --sort-keys . "$RUNNER_TEMP/post-publish-tag-ref.json")
      - name: Remove the final registry credential
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
