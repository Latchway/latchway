name: Security and supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact protected-main candidate commit to review
        required: true
        type: string
      intended_tag:
        description: Intended candidate tag, not required to exist
        required: true
        type: string
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact successful release-candidate workflow run attempt
        required: true
        type: string
      promotion_evidence_run_id:
        description: Exact successful promotion-scope cross-repository run ID
        required: true
        type: string
      promotion_evidence_run_attempt:
        description: Exact successful promotion-scope cross-repository run attempt
        required: true
        type: string
      independent_review_run_id:
        description: Exact successful allowlisted independent-review workflow run ID
        required: true
        type: string
      independent_review_run_attempt:
        description: Exact successful allowlisted independent-review run attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ inputs.candidate_commit || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  source:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      TRIVY_INCLUDE_DEV_DEPS: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: |
            deploy/cloudflare/pnpm-lock.yaml
            web/console/pnpm-lock.yaml
      - name: Install JavaScript dependency metadata without lifecycle scripts
        run: |
          pnpm --dir deploy/cloudflare install --frozen-lockfile --ignore-scripts
          pnpm --dir web/console install --frozen-lockfile --ignore-scripts
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/latchway-govulncheck" ./cmd/latchway
          govulncheck -mode=binary "${RUNNER_TEMP}/latchway-govulncheck"
      - name: Scan source, dependencies, secrets, and infrastructure
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore.yaml
          format: table
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Enforce dependency license policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore.yaml
          format: table
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: "1"

  container:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: latchway:security-scan
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan production container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: latchway:security-scan
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Enforce production-container license policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: latchway:security-scan
          format: table
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: latchway:security-scan
          format: spdx-json
          output-file: latchway.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-spdx-sbom
          path: latchway.spdx.json
          if-no-files-found: error
          retention-days: 30

  candidate-scans:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    services:
      postgres:
        image: docker.io/library/postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: latchway
          POSTGRES_USER: latchway
          POSTGRES_PASSWORD: latchway-security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latchway -d latchway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LATCHWAY_TEST_DATABASE_URL: postgres://latchway:latchway-security@127.0.0.1:5432/latchway?sslmode=disable
      TRIVY_INCLUDE_DEV_DEPS: "true"
    steps:
      - name: Check out the exact protected-main candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a safe GitHub CLI verifier without executing candidate code
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
      - name: Reject mutable or cross-candidate inputs
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_evidence_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_evidence_run_attempt }}
          REVIEW_RUN_ID: ${{ inputs.independent_review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ inputs.independent_review_run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENDED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROMOTION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROMOTION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require the exact successful candidate workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_RUN_ATTEMPT" > "$RUNNER_TEMP/candidate-run.json"
          workflow_id=$(jq --raw-output .workflow_id "$RUNNER_TEMP/candidate-run.json")
          jq --exit-status \
            --arg commit "$CANDIDATE_COMMIT" --argjson attempt "$CANDIDATE_RUN_ATTEMPT" \
            '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .run_attempt == $attempt' \
            "$RUNNER_TEMP/candidate-run.json" >/dev/null
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/candidate-workflow.json"
          jq --exit-status \
            '.path == ".github/workflows/release.yml" and .state == "active"' \
            "$RUNNER_TEMP/candidate-workflow.json" >/dev/null
      - name: Download the fixed immutable candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the candidate attestation without executing candidate code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --bundle "$RUNNER_TEMP/candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Validate the complete candidate artifact binding without credentials
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          test -z "${GH_TOKEN:-}"
          python3 scripts/release-candidate.py \
            --verify \
            --manifest "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --commit "$CANDIDATE_COMMIT" \
            --tag "$INTENDED_TAG" \
            --image ghcr.io/latchway/latchway
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: |
            deploy/cloudflare/pnpm-lock.yaml
            web/console/pnpm-lock.yaml
      - name: Install JavaScript dependency metadata without lifecycle scripts
        run: |
          pnpm --dir deploy/cloudflare install --frozen-lockfile --ignore-scripts
          pnpm --dir web/console install --frozen-lockfile --ignore-scripts
      - name: Validate the strict security evidence tooling
        run: >-
          python3 -m unittest
          scripts/test_security_evidence.py
          scripts/test_security_workflow.py
      - name: Capture fixed current-candidate Go security commands
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/security-raw"
          for check in \
            source_go_vulnerability \
            source_static_analysis \
            source_fuzz_smoke \
            source_race; do
            python3 scripts/security-evidence.py \
              --capture "$check" \
              --repository "$GITHUB_WORKSPACE" \
              --raw-directory "$RUNNER_TEMP/security-raw" \
              --commit "$CANDIDATE_COMMIT"
          done
      - name: Begin the fixed source scan window
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: >-
          python3 scripts/security-evidence.py
          --begin-scan
          --window "$RUNNER_TEMP/security-raw/scan-window.json"
          --commit "$CANDIDATE_COMMIT"
      - name: Capture current source vulnerability, secret, and static-policy output
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore.yaml
          format: json
          output: ${{ runner.temp }}/security-raw/source-trivy-policy.json
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
      - name: Capture current source dependency-license output
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore.yaml
          format: json
          output: ${{ runner.temp }}/security-raw/source-trivy-license.json
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Bind exact candidate image scans and close the scan window
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          for name in \
            latchway-linux-amd64-vulnerability.json \
            latchway-linux-arm64-vulnerability.json \
            latchway-linux-amd64-license.json \
            latchway-linux-arm64-license.json; do
            install -m 0600 -- "$RUNNER_TEMP/candidate/$name" "$RUNNER_TEMP/security-raw/$name"
          done
          python3 scripts/security-evidence.py \
            --finish-scan \
            --window "$RUNNER_TEMP/security-raw/scan-window.json" \
            --commit "$CANDIDATE_COMMIT"
      - name: Retain protected raw failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-security-raw-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-raw/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

  authenticate-candidate:
    needs: candidate-scans
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: security-evidence
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify the exact protected security-evidence environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:security-evidence"
      - name: Validate inputs and GitHub CLI without a checkout
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_evidence_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_evidence_run_attempt }}
          REVIEW_RUN_ID: ${{ inputs.independent_review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ inputs.independent_review_run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENDED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          for value in "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT" "$REVIEW_RUN_ID" "$REVIEW_RUN_ATTEMPT"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
      - name: Authenticate exact candidate and promotion producer runs without candidate code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_evidence_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_evidence_run_attempt }}
        run: |
          set -Eeuo pipefail
          verify_run() {
            local label="$1" run_id="$2" attempt="$3" expected_path="$4"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt" > "$RUNNER_TEMP/$label-run.json"
            workflow_id=$(jq --raw-output '.workflow_id | select(type == "number" and . > 0)' "$RUNNER_TEMP/$label-run.json")
            jq --exit-status --arg commit "$CANDIDATE_COMMIT" --argjson attempt "$attempt" \
              '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .run_attempt == $attempt' \
              "$RUNNER_TEMP/$label-run.json" >/dev/null
            [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/$label-workflow.json"
            jq --exit-status --arg path "$expected_path" '.path == $path and .state == "active"' "$RUNNER_TEMP/$label-workflow.json" >/dev/null
          }
          verify_run candidate "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" .github/workflows/release.yml
          verify_run promotion "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT" .github/workflows/cross-repository-conformance.yml
          mkdir -p "$RUNNER_TEMP/security-verification"
          jq -n --argjson run_id "$CANDIDATE_RUN_ID" --argjson run_attempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg head_sha "$CANDIDATE_COMMIT" '
              {schema_version:1,kind:"latchway_security_candidate_producer_verification",
                repository:"Latchway/latchway",workflow_path:".github/workflows/release.yml",
                run_id:$run_id,run_attempt:$run_attempt,event:"workflow_dispatch",status:"completed",
                conclusion:"success",head_sha:$head_sha,head_branch:"main"}
            ' > "$RUNNER_TEMP/security-verification/candidate-producer.json"
          jq -n --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg head_sha "$CANDIDATE_COMMIT" '
              {schema_version:1,kind:"latchway_security_raw_producer_verification",
                repository:"Latchway/latchway",workflow_path:".github/workflows/security.yml",
                run_id:$run_id,run_attempt:$run_attempt,event:"workflow_dispatch",status:"in_progress",
                head_sha:$head_sha,head_branch:"main",job:"candidate-scans"}
            ' > "$RUNNER_TEMP/security-verification/raw-producer.json"
          mkdir -p "$RUNNER_TEMP/promotion-verification"
          jq -n \
            --argjson run_id "$PROMOTION_RUN_ID" \
            --argjson run_attempt "$PROMOTION_RUN_ATTEMPT" \
            --arg head_sha "$CANDIDATE_COMMIT" \
            '{schema_version: 1,
              kind: "latchway_security_promotion_conformance_producer_verification",
              repository: "Latchway/latchway",
              workflow_path: ".github/workflows/cross-repository-conformance.yml",
              run_id: $run_id, run_attempt: $run_attempt,
              event: "workflow_dispatch", status: "completed", conclusion: "success",
              head_sha: $head_sha, head_branch: "main"}' \
            > "$RUNNER_TEMP/promotion-verification/producer-verification.json"
      - name: Authenticate the separately controlled independent-review producer
        id: review-producer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INDEPENDENT_SECURITY_REVIEW_TOKEN }}
          REVIEW_REPOSITORY: ${{ vars.INDEPENDENT_SECURITY_REVIEW_REPOSITORY }}
          REVIEW_WORKFLOW: ${{ vars.INDEPENDENT_SECURITY_REVIEW_WORKFLOW }}
          REVIEWER_IDENTITY: ${{ vars.INDEPENDENT_SECURITY_REVIEWER_IDENTITY }}
          REVIEWER_ORGANIZATION: ${{ vars.INDEPENDENT_SECURITY_REVIEWER_ORGANIZATION }}
          REVIEWER_LOGIN: ${{ vars.INDEPENDENT_SECURITY_REVIEWER_LOGIN }}
          REVIEW_RUN_ID: ${{ inputs.independent_review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ inputs.independent_review_run_attempt }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          [[ "$REVIEW_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,38}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$ ]]
          [[ "$REVIEW_WORKFLOW" =~ ^\.github/workflows/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}\.ya?ml$ ]]
          test -n "$REVIEWER_IDENTITY"
          test -n "$REVIEWER_ORGANIZATION"
          [[ "$REVIEWER_LOGIN" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          owner=${REVIEW_REPOSITORY%%/*}
          test "${owner,,}" != latchway
          test "${REVIEWER_ORGANIZATION,,}" != latchway
          gh api "repos/$REVIEW_REPOSITORY/actions/runs/$REVIEW_RUN_ID/attempts/$REVIEW_RUN_ATTEMPT" > "$RUNNER_TEMP/review-run.json"
          workflow_id=$(jq --raw-output '.workflow_id | select(type == "number" and . > 0)' "$RUNNER_TEMP/review-run.json")
          source_commit=$(jq --raw-output '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/review-run.json")
          jq --exit-status --argjson attempt "$REVIEW_RUN_ATTEMPT" --arg login "$REVIEWER_LOGIN" \
            '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_branch == "main" and .run_attempt == $attempt and .actor.login == $login and .triggering_actor.login == $login' \
            "$RUNNER_TEMP/review-run.json" >/dev/null
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ && "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$REVIEW_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/review-workflow.json"
          jq --exit-status --arg path "$REVIEW_WORKFLOW" '.path == $path and .state == "active"' "$RUNNER_TEMP/review-workflow.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/review-verification"
          jq -n \
            --arg repository "$REVIEW_REPOSITORY" \
            --arg workflow "$REVIEW_WORKFLOW" \
            --argjson run_id "$REVIEW_RUN_ID" \
            --argjson run_attempt "$REVIEW_RUN_ATTEMPT" \
            --arg head_sha "$source_commit" \
            --arg actor_login "$REVIEWER_LOGIN" \
            --arg reviewer_identity "$REVIEWER_IDENTITY" \
            --arg reviewer_organization "$REVIEWER_ORGANIZATION" \
            '{schema_version: 1,
              kind: "latchway_independent_security_review_producer_verification",
              repository: $repository, workflow_path: $workflow,
              run_id: $run_id, run_attempt: $run_attempt,
              event: "workflow_dispatch", status: "completed", conclusion: "success",
              head_sha: $head_sha, head_branch: "main",
              actor_login: $actor_login, triggering_actor_login: $actor_login,
              reviewer_identity: $reviewer_identity,
              reviewer_organization: $reviewer_organization}' \
            > "$RUNNER_TEMP/review-verification/producer-verification.json"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download the exact promotion-scope conformance artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-promotion-${{ inputs.promotion_evidence_run_id }}-${{ inputs.promotion_evidence_run_attempt }}
          path: ${{ runner.temp }}/promotion-download
          run-id: ${{ inputs.promotion_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Download the fresh raw security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-security-raw-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-raw
      - name: Download the exact independent-review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-independent-security-review-${{ inputs.candidate_commit }}-${{ inputs.independent_review_run_id }}-${{ inputs.independent_review_run_attempt }}
          path: ${{ runner.temp }}/independent-review
          repository: ${{ vars.INDEPENDENT_SECURITY_REVIEW_REPOSITORY }}
          run-id: ${{ inputs.independent_review_run_id }}
          github-token: ${{ secrets.INDEPENDENT_SECURITY_REVIEW_TOKEN }}
      - name: Verify candidate and promotion attestations before snapshotting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --bundle "$RUNNER_TEMP/candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          report="$RUNNER_TEMP/promotion-download/latchway-cross-repository.json"
          bundle="$RUNNER_TEMP/promotion-download/latchway-cross-repository.attestation.sigstore.json"
          gh attestation verify "$report" --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --format json \
            > "$RUNNER_TEMP/promotion-attestation-verification.raw.json"
          mkdir -p "$RUNNER_TEMP/promotion-conformance"
          install -m 0600 -- "$report" "$RUNNER_TEMP/promotion-conformance/latchway-cross-repository.json"
          install -m 0600 -- "$bundle" "$RUNNER_TEMP/promotion-conformance/latchway-cross-repository.attestation.sigstore.json"
          install -m 0600 -- "$RUNNER_TEMP/promotion-verification/producer-verification.json" "$RUNNER_TEMP/promotion-conformance/producer-verification.json"
          subject_sha256=$(sha256sum "$report" | awk '{print $1}')
          jq -n --arg source_digest "$CANDIDATE_COMMIT" --arg subject_sha256 "$subject_sha256" \
            '{schema_version: 1,
              kind: "latchway_security_promotion_conformance_attestation_verification",
              repository: "Latchway/latchway",
              signer_workflow: "Latchway/latchway/.github/workflows/cross-repository-conformance.yml",
              source_digest: $source_digest, source_ref: "refs/heads/main",
              subject_sha256: $subject_sha256, hosted_runner: true, verified: true}' \
            > "$RUNNER_TEMP/promotion-conformance/attestation-verification.json"
      - name: Verify the independent-review attestation before snapshotting
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INDEPENDENT_SECURITY_REVIEW_TOKEN }}
          REVIEW_REPOSITORY: ${{ vars.INDEPENDENT_SECURITY_REVIEW_REPOSITORY }}
          REVIEW_WORKFLOW: ${{ vars.INDEPENDENT_SECURITY_REVIEW_WORKFLOW }}
          REVIEW_SOURCE_COMMIT: ${{ steps.review-producer.outputs.source_commit }}
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/independent-review/independent-security-review.json"
          bundle="$RUNNER_TEMP/independent-review/independent-security-review.attestation.sigstore.json"
          test -f "$report" && test ! -L "$report" && test -s "$report"
          test -f "$bundle" && test ! -L "$bundle" && test -s "$bundle"
          test -d "$RUNNER_TEMP/independent-review/reviews" && test ! -L "$RUNNER_TEMP/independent-review/reviews"
          test ! -e "$RUNNER_TEMP/independent-review/producer-verification.json"
          test ! -e "$RUNNER_TEMP/independent-review/attestation-verification.json"
          gh attestation verify "$report" --bundle "$bundle" \
            --repo "$REVIEW_REPOSITORY" \
            --signer-workflow "$REVIEW_REPOSITORY/$REVIEW_WORKFLOW" \
            --source-digest "$REVIEW_SOURCE_COMMIT" --signer-digest "$REVIEW_SOURCE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --format json \
            > "$RUNNER_TEMP/review-attestation-verification.raw.json"
          install -m 0600 -- "$RUNNER_TEMP/review-verification/producer-verification.json" "$RUNNER_TEMP/independent-review/producer-verification.json"
          subject_sha256=$(sha256sum "$report" | awk '{print $1}')
          jq -n --arg repository "$REVIEW_REPOSITORY" --arg workflow "$REVIEW_REPOSITORY/$REVIEW_WORKFLOW" \
            --arg source_digest "$REVIEW_SOURCE_COMMIT" --arg subject_sha256 "$subject_sha256" \
            '{schema_version: 1,
              kind: "latchway_independent_security_review_attestation_verification",
              repository: $repository, signer_workflow: $workflow,
              source_digest: $source_digest, source_ref: "refs/heads/main",
              subject_sha256: $subject_sha256, hosted_runner: true, verified: true}' \
            > "$RUNNER_TEMP/independent-review/attestation-verification.json"
      - name: Package only authenticated evidence for candidate validation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${GH_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/security-inputs"
          cp -R -- \
            "$RUNNER_TEMP/candidate" \
            "$RUNNER_TEMP/independent-review" \
            "$RUNNER_TEMP/promotion-conformance" \
            "$RUNNER_TEMP/security-raw" \
            "$RUNNER_TEMP/security-verification" \
            "$RUNNER_TEMP/security-inputs/"
      - name: Retain authenticated inputs for the credential-free sealing runner
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-security-authenticated-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  candidate:
    needs: authenticate-candidate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact protected-main candidate on the fresh sealing runner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download only authenticated security inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-security-authenticated-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-inputs
      - name: Snapshot, validate, seal, and reverify without credentials or OIDC
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          inputs="$RUNNER_TEMP/security-inputs"
          review_report="$inputs/independent-review/independent-security-review.json"
          review_producer="$inputs/independent-review/producer-verification.json"
          promotion_producer="$inputs/promotion-conformance/producer-verification.json"
          REVIEW_REPOSITORY=$(jq --exit-status --raw-output '.repository | select(type == "string")' "$review_producer")
          REVIEW_WORKFLOW=$(jq --exit-status --raw-output '.workflow_path | select(type == "string")' "$review_producer")
          REVIEWER_IDENTITY=$(jq --exit-status --raw-output '.reviewer_identity | select(type == "string")' "$review_producer")
          REVIEWER_ORGANIZATION=$(jq --exit-status --raw-output '.reviewer_organization | select(type == "string")' "$review_producer")
          REVIEWER_LOGIN=$(jq --exit-status --raw-output '.actor_login | select(type == "string")' "$review_producer")
          REVIEW_RUN_ID=$(jq --exit-status --raw-output '.run_id | select(type == "number" and . > 0)' "$review_producer")
          REVIEW_RUN_ATTEMPT=$(jq --exit-status --raw-output '.run_attempt | select(type == "number" and . > 0)' "$review_producer")
          PROMOTION_RUN_ID=$(jq --exit-status --raw-output '.run_id | select(type == "number" and . > 0)' "$promotion_producer")
          PROMOTION_RUN_ATTEMPT=$(jq --exit-status --raw-output '.run_attempt | select(type == "number" and . > 0)' "$promotion_producer")
          python3 scripts/release-candidate.py --verify \
            --manifest "$inputs/candidate/latchway-candidate.json" \
            --commit "$CANDIDATE_COMMIT" --tag "$INTENDED_TAG" \
            --image ghcr.io/latchway/latchway
          python3 scripts/verify-promotion.py \
            --report "$inputs/promotion-conformance/latchway-cross-repository.json" \
            --candidate "$inputs/candidate/latchway-candidate.json" \
            --commit "$CANDIDATE_COMMIT" --tag "$INTENDED_TAG"
          common=(
            --candidate-manifest "$inputs/candidate/latchway-candidate.json"
            --review-directory "$inputs/independent-review"
            --promotion-directory "$inputs/promotion-conformance"
            --commit "$CANDIDATE_COMMIT" --tag "$INTENDED_TAG"
            --review-repository "$REVIEW_REPOSITORY" --review-workflow "$REVIEW_WORKFLOW"
            --reviewer-identity "$REVIEWER_IDENTITY" --reviewer-organization "$REVIEWER_ORGANIZATION"
            --reviewer-login "$REVIEWER_LOGIN"
            --review-run-id "$REVIEW_RUN_ID" --review-run-attempt "$REVIEW_RUN_ATTEMPT"
            --promotion-run-id "$PROMOTION_RUN_ID" --promotion-run-attempt "$PROMOTION_RUN_ATTEMPT"
          )
          python3 scripts/security-evidence.py --verify-review "${common[@]}"
          python3 scripts/security-evidence.py --seal "${common[@]}" \
            --raw-directory "$inputs/security-raw" --repository "$GITHUB_WORKSPACE" \
            --output-directory "$RUNNER_TEMP/security-final"
          python3 scripts/security-evidence.py --verify \
            --report "$RUNNER_TEMP/security-final/security-summary.json" \
            --candidate-manifest "$inputs/candidate/latchway-candidate.json" \
            --raw-directory "$RUNNER_TEMP/security-final/raw" \
            --review-directory "$RUNNER_TEMP/security-final/independent-review" \
            --promotion-directory "$RUNNER_TEMP/security-final/promotion-conformance" \
            --repository "$GITHUB_WORKSPACE" --commit "$CANDIDATE_COMMIT" --tag "$INTENDED_TAG"
      - name: Retain the sealed candidate evidence for the fresh attestation runner
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-security-sealed-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-final/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  candidate-attestation:
    needs: candidate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: release-evidence-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Verify the exact protected release-evidence-signing environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:release-evidence-signing"
      - name: Download the original authenticated security closure without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-security-authenticated-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-inputs
      - name: Download the sealed candidate evidence without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-security-sealed-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-final
      - name: Independently validate the authenticated closure and exact summary bytes without candidate code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_evidence_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_evidence_run_attempt }}
          REVIEW_RUN_ID: ${{ inputs.independent_review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ inputs.independent_review_run_attempt }}
          REVIEW_REPOSITORY: ${{ vars.INDEPENDENT_SECURITY_REVIEW_REPOSITORY }}
          REVIEW_WORKFLOW: ${{ vars.INDEPENDENT_SECURITY_REVIEW_WORKFLOW }}
          REVIEWER_IDENTITY: ${{ vars.INDEPENDENT_SECURITY_REVIEWER_IDENTITY }}
          REVIEWER_ORGANIZATION: ${{ vars.INDEPENDENT_SECURITY_REVIEWER_ORGANIZATION }}
          REVIEWER_LOGIN: ${{ vars.INDEPENDENT_SECURITY_REVIEWER_LOGIN }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/security-final"
          inputs="$RUNNER_TEMP/security-inputs"
          summary="$root/security-summary.json"
          test -f "$summary" && test ! -L "$summary" && test -s "$summary"
          test -z "$(find "$root" "$inputs" -type l -print -quit)"
          for directory in raw independent-review promotion-conformance; do
            test -d "$root/$directory" && test ! -L "$root/$directory"
            test -d "$inputs/$directory" && test ! -L "$inputs/$directory"
          done
          test -f "$root/latchway-candidate.json" && test ! -L "$root/latchway-candidate.json"
          cmp --silent "$inputs/candidate/latchway-candidate.json" "$root/latchway-candidate.json"
          hash_tree() {
            local tree="$1" destination="$2"
            find "$tree" -type f -print0 \
              | while IFS= read -r -d '' path; do
                  relative=${path#"$tree/"}
                  [[ "$relative" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
                  [[ "$relative" != *..* && "$relative" != */ && "$relative" != *//* ]]
                  printf '%s\t%s\n' "$relative" "$(sha256sum "$path" | awk '{print $1}')"
                done | LC_ALL=C sort > "$destination"
            test -s "$destination" && test -z "$(cut -f1 "$destination" | uniq -d)"
          }
          compare_tree() {
            local authenticated_tree="$1" sealed_tree="$2" label="$3"
            hash_tree "$authenticated_tree" "$RUNNER_TEMP/$label-authenticated.tsv"
            hash_tree "$sealed_tree" "$RUNNER_TEMP/$label-sealed.tsv"
            cmp --silent "$RUNNER_TEMP/$label-authenticated.tsv" "$RUNNER_TEMP/$label-sealed.tsv"
          }
          compare_tree "$inputs/security-raw" "$root/raw" raw
          compare_tree "$inputs/independent-review" "$root/independent-review" review
          compare_tree "$inputs/promotion-conformance" "$root/promotion-conformance" promotion
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          candidate="$inputs/candidate/latchway-candidate.json"
          candidate_bundle="$inputs/candidate/latchway-candidate.attestation.sigstore.json"
          promotion="$inputs/promotion-conformance/latchway-cross-repository.json"
          promotion_bundle="$inputs/promotion-conformance/latchway-cross-repository.attestation.sigstore.json"
          review="$inputs/independent-review/independent-security-review.json"
          review_bundle="$inputs/independent-review/independent-security-review.attestation.sigstore.json"
          for file in "$candidate" "$candidate_bundle" "$promotion" "$promotion_bundle" "$review" "$review_bundle"; do
            test -f "$file" && test ! -L "$file" && test -s "$file"
          done
          gh attestation verify "$candidate" --bundle "$candidate_bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --format json \
            > "$RUNNER_TEMP/signer-candidate-attestation.json"
          gh attestation verify "$promotion" --bundle "$promotion_bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --format json \
            > "$RUNNER_TEMP/signer-promotion-attestation.json"
          [[ "$REVIEW_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,38}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$ ]]
          [[ "$REVIEW_WORKFLOW" =~ ^\.github/workflows/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}\.ya?ml$ ]]
          [[ "$REVIEWER_LOGIN" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          test -n "$REVIEWER_IDENTITY" && test -n "$REVIEWER_ORGANIZATION"
          owner=${REVIEW_REPOSITORY%%/*}
          test "${owner,,}" != latchway && test "${REVIEWER_ORGANIZATION,,}" != latchway
          review_source_commit=$(jq --exit-status --raw-output '.producer.source_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$review")
          gh attestation verify "$review" --bundle "$review_bundle" \
            --repo "$REVIEW_REPOSITORY" --signer-workflow "$REVIEW_REPOSITORY/$REVIEW_WORKFLOW" \
            --source-digest "$review_source_commit" --signer-digest "$review_source_commit" \
            --source-ref refs/heads/main --deny-self-hosted-runners --format json \
            > "$RUNNER_TEMP/signer-review-attestation.json"
          jq --exit-status --argjson run_id "$CANDIDATE_RUN_ID" \
            --argjson run_attempt "$CANDIDATE_RUN_ATTEMPT" --arg head_sha "$CANDIDATE_COMMIT" '
              . == {schema_version:1,kind:"latchway_security_candidate_producer_verification",
                repository:"Latchway/latchway",workflow_path:".github/workflows/release.yml",
                run_id:$run_id,run_attempt:$run_attempt,event:"workflow_dispatch",status:"completed",
                conclusion:"success",head_sha:$head_sha,head_branch:"main"}
            ' "$inputs/security-verification/candidate-producer.json" >/dev/null
          jq --exit-status --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg head_sha "$CANDIDATE_COMMIT" '
              . == {schema_version:1,kind:"latchway_security_raw_producer_verification",
                repository:"Latchway/latchway",workflow_path:".github/workflows/security.yml",
                run_id:$run_id,run_attempt:$run_attempt,event:"workflow_dispatch",status:"in_progress",
                head_sha:$head_sha,head_branch:"main",job:"candidate-scans"}
            ' "$inputs/security-verification/raw-producer.json" >/dev/null
          review_producer="$inputs/independent-review/producer-verification.json"
          jq --exit-status \
            --arg repository "$REVIEW_REPOSITORY" --arg workflow "$REVIEW_WORKFLOW" \
            --arg identity "$REVIEWER_IDENTITY" --arg organization "$REVIEWER_ORGANIZATION" \
            --arg login "$REVIEWER_LOGIN" --arg head_sha "$review_source_commit" \
            --argjson run_id "$REVIEW_RUN_ID" --argjson run_attempt "$REVIEW_RUN_ATTEMPT" '
              . == {schema_version:1,kind:"latchway_independent_security_review_producer_verification",
                repository:$repository,workflow_path:$workflow,run_id:$run_id,run_attempt:$run_attempt,
                event:"workflow_dispatch",status:"completed",conclusion:"success",head_sha:$head_sha,
                head_branch:"main",actor_login:$login,triggering_actor_login:$login,
                reviewer_identity:$identity,reviewer_organization:$organization}
            ' "$review_producer" >/dev/null
          promotion_producer="$inputs/promotion-conformance/producer-verification.json"
          jq --exit-status --argjson run_id "$PROMOTION_RUN_ID" \
            --argjson run_attempt "$PROMOTION_RUN_ATTEMPT" --arg head_sha "$CANDIDATE_COMMIT" '
              . == {schema_version:1,kind:"latchway_security_promotion_conformance_producer_verification",
                repository:"Latchway/latchway",workflow_path:".github/workflows/cross-repository-conformance.yml",
                run_id:$run_id,run_attempt:$run_attempt,event:"workflow_dispatch",status:"completed",
                conclusion:"success",head_sha:$head_sha,head_branch:"main"}
            ' "$promotion_producer" >/dev/null
          expected_candidate_artifacts='["latchway-contract.tar.gz","latchway-linux-amd64-license.json","latchway-linux-amd64-vulnerability.json","latchway-linux-amd64.spdx.json","latchway-linux-arm64-license.json","latchway-linux-arm64-vulnerability.json","latchway-linux-arm64.spdx.json"]'
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --argjson artifacts "$expected_candidate_artifacts" '
              (keys | sort) == ["artifacts","candidate_commit","contract","created_at","image","intended_tag","kind","schema_version","status","version"] and
              .schema_version == 1 and .kind == "latchway_release_candidate" and .status == "passed" and
              .candidate_commit == $commit and .intended_tag == $tag and .version == ($tag | ltrimstr("v")) and
              .contract.status == "released" and .contract.version == .version and
              .contract.bundle_file_name == ("latchway-contract-" + .version + ".tar.gz") and
              (.contract.bundle_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
              .image.repository == "ghcr.io/latchway/latchway" and
              (.image.index_digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
              (.image.platforms | keys | sort) == ["linux/amd64","linux/arm64"] and
              all(.image.platforms[]; type == "string" and test("^sha256:[0-9a-f]{64}$")) and
              .image.platforms["linux/amd64"] != .image.platforms["linux/arm64"] and
              (.artifacts | map(.path) | sort) == $artifacts and
              all(.artifacts[]; (keys | sort) == ["path","sha256"] and (.sha256 | test("^[0-9a-f]{64}$")))
            ' "$candidate" >/dev/null
          while IFS=$'\t' read -r name expected_sha; do
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            file="$inputs/candidate/$name"
            test -f "$file" && test ! -L "$file"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected_sha"
          done < <(jq --raw-output '.artifacts[] | [.path,.sha256] | @tsv' "$candidate")
          contract_sha=$(jq --raw-output '.contract.bundle_sha256' "$candidate")
          test "$contract_sha" = "$(sha256sum "$inputs/candidate/latchway-contract.tar.gz" | awk '{print $1}')"
          promotion_sha=$(sha256sum "$promotion" | awk '{print $1}')
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" '
              (keys | sort) == ["checks","contract","documentation","evidence_domains","evidence_window","kind","promotion_ready","release_ready","repositories","schema_version","scope","source_conformance_passed","verdict"] and
              .schema_version == 1 and .kind == "latchway_cross_repository_conformance_evidence" and
              .scope == "promotion" and .verdict == "passed" and .source_conformance_passed == true and
              .promotion_ready == true and .release_ready == false and
              (.repositories | map(.id)) == ["core","javascript","ios","android","react_native"] and
              (.repositories[] | select(.id == "core") | .commit == $commit and .intended_tag == $tag) and
              (.documentation | keys | sort) == ["canonical_core_commit","commit","owned_file_count","repository","source_commit","source_manifest_sha256","source_tree_sha256"] and
              .documentation.repository == "https://github.com/Latchway/latchway-docs.git" and
              .documentation.canonical_core_commit == $commit and
              (.documentation.commit | test("^[0-9a-f]{40}$")) and
              (.documentation.source_commit | test("^[0-9a-f]{40}$")) and
              (.documentation.source_manifest_sha256 | test("^[0-9a-f]{64}$")) and
              (.documentation.source_tree_sha256 | test("^[0-9a-f]{64}$")) and
              (.documentation.owned_file_count | type == "number" and floor == . and . >= 1 and . <= 4096)
            ' "$promotion" >/dev/null
          jq -S --argjson run_id "$PROMOTION_RUN_ID" --argjson run_attempt "$PROMOTION_RUN_ATTEMPT" \
            --arg report_sha256 "$promotion_sha" '
              {scope:"promotion",run_id:$run_id,run_attempt:$run_attempt,report_sha256:$report_sha256,
                repositories:.repositories,documentation:.documentation}
            ' "$promotion" > "$RUNNER_TEMP/expected-promotion-binding.json"
          expected_reviews='["admin_auth_review","app_attest_review","browser_xss_review","cryptography_review","independent_p0_p2_review","play_integrity_review","quota_race_review","ssrf_review"]'
          jq --exit-status \
            --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --arg repository "$REVIEW_REPOSITORY" --arg workflow "$REVIEW_WORKFLOW" \
            --arg identity "$REVIEWER_IDENTITY" --arg organization "$REVIEWER_ORGANIZATION" \
            --arg login "$REVIEWER_LOGIN" --arg source_commit "$review_source_commit" \
            --argjson run_id "$REVIEW_RUN_ID" --argjson run_attempt "$REVIEW_RUN_ATTEMPT" \
            --argjson expected_reviews "$expected_reviews" '
              (keys | sort) == ["candidate","kind","producer","review_window","reviewer","reviews","schema_version","status"] and
              .schema_version == 1 and .kind == "latchway_independent_security_review" and .status == "passed" and
              .reviewer == {identity:$identity,organization:$organization,github_login:$login,
                independent_from:"Latchway",control:"separately_controlled"} and
              .producer == {repository:$repository,workflow_path:$workflow,run_id:$run_id,
                run_attempt:$run_attempt,source_commit:$source_commit} and
              .candidate.commit == $commit and .candidate.intended_tag == $tag and
              (.reviews | map(.id) | sort) == $expected_reviews and
              all(.reviews[];
                .status == "passed" and .artifact.path == ("reviews/" + .id + ".json") and
                (.artifact.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                .findings.unresolved.critical == 0 and .findings.unresolved.high == 0 and
                (.accepted_risks | length) ==
                  (.findings.unresolved.medium + .findings.unresolved.low + .findings.unresolved.informational) and
                ([.accepted_risks[].id] | length) == ([.accepted_risks[].id] | unique | length) and
                all(.accepted_risks[]; .severity == "medium" or .severity == "low" or .severity == "informational"))
            ' "$review" >/dev/null
          jq -S '.candidate.promotion_conformance' "$review" > "$RUNNER_TEMP/review-promotion-binding.json"
          cmp --silent "$RUNNER_TEMP/expected-promotion-binding.json" "$RUNNER_TEMP/review-promotion-binding.json"
          jq -S '.reviewer' "$review" > "$RUNNER_TEMP/reviewer-authority.json"
          while IFS=$'\t' read -r identifier expected_sha; do
            receipt="$inputs/independent-review/reviews/$identifier.json"
            test -f "$receipt" && test ! -L "$receipt"
            test "$(sha256sum "$receipt" | awk '{print $1}')" = "$expected_sha"
            jq -S --arg id "$identifier" '. as $report | .reviews[] | select(.id == $id) |
                {schema_version:1,kind:"latchway_independent_security_review_result",id:.id,
                  status:.status,candidate_commit:$report.candidate.commit,reviewer:$report.reviewer,
                  started_at:.started_at,finished_at:.finished_at,findings:.findings,
                  accepted_risks:.accepted_risks}
              ' "$review" > "$RUNNER_TEMP/expected-review-receipt.json"
            jq -S . "$receipt" > "$RUNNER_TEMP/actual-review-receipt.json"
            cmp --silent "$RUNNER_TEMP/expected-review-receipt.json" "$RUNNER_TEMP/actual-review-receipt.json"
          done < <(jq --raw-output '.reviews[] | [.id,.artifact.sha256] | @tsv' "$review")
      - name: Attest the exact redacted security summary
        id: security-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/security-final/security-summary.json
      - name: Retain the security attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.security-attestation.outputs.bundle-path }}
        run: install -m 0600 -- "$BUNDLE_PATH" "$RUNNER_TEMP/security-final/security-summary.attestation.sigstore.json"
      - name: Retain candidate-bound security evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-security-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-final/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
