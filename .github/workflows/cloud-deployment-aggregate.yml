name: Protected cloud-deployment aggregate

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact 40-character core candidate commit
        required: true
        type: string
      intended_tag:
        description: Intended core release tag bound by the candidate manifest
        required: true
        type: string
      candidate_run_id:
        description: Successful immutable-candidate workflow run
        required: true
        type: string
      source_conformance_run_id:
        description: Successful five-repository source-conformance workflow run
        required: true
        type: string
      compose_run_id:
        description: Successful protected Compose deployment-evidence run
        required: true
        type: string
      cloud_run_run_id:
        description: Successful protected Cloud Run deployment-evidence run
        required: true
        type: string
      aws_run_id:
        description: Successful protected AWS deployment-evidence run
        required: true
        type: string
      fly_io_run_id:
        description: Successful protected Fly.io deployment-evidence run
        required: true
        type: string
      cloudflare_containers_run_id:
        description: Successful protected Cloudflare Containers deployment-evidence run
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: cloud-deployment-aggregate-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  aggregate:
    if: github.ref == 'refs/heads/main'
    environment: release-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate finalizer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable candidate and run coordinates
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_conformance_run_id }}
          COMPOSE_RUN_ID: ${{ inputs.compose_run_id }}
          CLOUD_RUN_RUN_ID: ${{ inputs.cloud_run_run_id }}
          AWS_RUN_ID: ${{ inputs.aws_run_id }}
          FLY_IO_RUN_ID: ${{ inputs.fly_io_run_id }}
          CLOUDFLARE_CONTAINERS_RUN_ID: ${{ inputs.cloudflare_containers_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENDED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          for run_id in \
            "$CANDIDATE_RUN_ID" "$SOURCE_RUN_ID" "$COMPOSE_RUN_ID" \
            "$CLOUD_RUN_RUN_ID" "$AWS_RUN_ID" "$FLY_IO_RUN_ID" \
            "$CLOUDFLARE_CONTAINERS_RUN_ID"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          done
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain=v1)"
      - name: Verify every platform run belongs to the fixed producer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          COMPOSE_RUN_ID: ${{ inputs.compose_run_id }}
          CLOUD_RUN_RUN_ID: ${{ inputs.cloud_run_run_id }}
          AWS_RUN_ID: ${{ inputs.aws_run_id }}
          FLY_IO_RUN_ID: ${{ inputs.fly_io_run_id }}
          CLOUDFLARE_CONTAINERS_RUN_ID: ${{ inputs.cloudflare_containers_run_id }}
        run: |
          set -Eeuo pipefail
          verify_run() {
            local platform="$1" run_id="$2"
            local run="$RUNNER_TEMP/${platform}-run.json"
            local workflow="$RUNNER_TEMP/${platform}-workflow.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$run"
            jq --exit-status --arg commit "$CANDIDATE_COMMIT" \
              '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main"' \
              "$run" >/dev/null
            workflow_id=$(jq --raw-output '.workflow_id | select(type == "number" and . > 0)' "$run")
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$workflow"
            jq --exit-status \
              '.path == ".github/workflows/deployment-evidence.yml" and .state == "active"' \
              "$workflow" >/dev/null
          }
          verify_run compose "$COMPOSE_RUN_ID"
          verify_run cloud_run "$CLOUD_RUN_RUN_ID"
          verify_run aws "$AWS_RUN_ID"
          verify_run fly_io "$FLY_IO_RUN_ID"
          verify_run cloudflare_containers "$CLOUDFLARE_CONTAINERS_RUN_ID"
      - name: Download immutable candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download five-repository source conformance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-source
          path: ${{ runner.temp }}/source
          run-id: ${{ inputs.source_conformance_run_id }}
          github-token: ${{ github.token }}
      - name: Download signed Compose capture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-deployment-compose-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/captures/compose
          run-id: ${{ inputs.compose_run_id }}
          github-token: ${{ github.token }}
      - name: Download signed Cloud Run capture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-deployment-cloud_run-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/captures/cloud_run
          run-id: ${{ inputs.cloud_run_run_id }}
          github-token: ${{ github.token }}
      - name: Download signed AWS capture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-deployment-aws-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/captures/aws
          run-id: ${{ inputs.aws_run_id }}
          github-token: ${{ github.token }}
      - name: Download signed Fly.io capture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-deployment-fly_io-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/captures/fly_io
          run-id: ${{ inputs.fly_io_run_id }}
          github-token: ${{ github.token }}
      - name: Download signed Cloudflare Containers capture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-deployment-cloudflare_containers-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/captures/cloudflare_containers
          run-id: ${{ inputs.cloudflare_containers_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate and source-conformance attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/candidate/latchway-candidate.json"
          source="$RUNNER_TEMP/source/latchway-cross-repository.json"
          gh attestation verify "$candidate" \
            --bundle "$RUNNER_TEMP/candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "$source" \
            --bundle "$RUNNER_TEMP/source/latchway-cross-repository.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          python3 scripts/release-candidate.py \
            --verify \
            --manifest "$candidate" \
            --commit "$CANDIDATE_COMMIT" \
            --tag "$INTENDED_TAG" \
            --image ghcr.io/latchway/latchway
      - name: Build exact release coordinates and stage signed captures
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/cloud-final/artifacts/cloud-deployments"
          for platform in compose cloud_run aws fly_io cloudflare_containers; do
            install -m 0600 -- \
              "$RUNNER_TEMP/captures/$platform/$platform.tar.gz" \
              "$RUNNER_TEMP/cloud-final/artifacts/cloud-deployments/$platform.tar.gz"
            install -m 0600 -- \
              "$RUNNER_TEMP/captures/$platform/$platform.attestation.json" \
              "$RUNNER_TEMP/cloud-final/artifacts/cloud-deployments/$platform.attestation.json"
          done
          python3 - "$RUNNER_TEMP/source/latchway-cross-repository.json" "$RUNNER_TEMP/release-coordinates.json" "$CANDIDATE_COMMIT" "$INTENDED_TAG" <<'PY'
          import json, re, sys
          from pathlib import Path
          source_path, output_path, commit, intended_tag = sys.argv[1:]
          report = json.loads(Path(source_path).read_text(encoding="utf-8"))
          if report.get("scope") != "source" or report.get("verdict") != "passed" or report.get("source_conformance_passed") is not True:
              raise SystemExit("source conformance did not pass")
          repositories = report.get("repositories")
          if not isinstance(repositories, list) or len(repositories) != 5:
              raise SystemExit("repository coordinates are incomplete")
          result = {}
          for item in repositories:
              if not isinstance(item, dict) or set(item) != {"id", "commit", "version", "intended_tag"}:
                  raise SystemExit("repository coordinate shape is invalid")
              identifier, revision, version, tag = (item[key] for key in ("id", "commit", "version", "intended_tag"))
              if identifier in result or identifier not in {"core", "javascript", "ios", "android", "react_native"}:
                  raise SystemExit("repository coordinate identity is invalid")
              if not re.fullmatch(r"[0-9a-f]{40}", revision) or tag != f"v{version}":
                  raise SystemExit("repository coordinate value is invalid")
              result[identifier] = {"commit": revision, "tag": tag, "version": version}
          if set(result) != {"core", "javascript", "ios", "android", "react_native"} or result["core"] != {"commit": commit, "tag": intended_tag, "version": intended_tag[1:]}:
              raise SystemExit("core coordinate does not match the candidate")
          Path(output_path).write_text(json.dumps(result, sort_keys=True) + "\n", encoding="utf-8")
          PY
          gh attestation trusted-root > "$RUNNER_TEMP/github-attestation-trusted-root.jsonl"
      - name: Verify and finalize the five signed cloud captures
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/candidate/latchway-candidate.json"
          image=$(jq --raw-output '.image.repository + "@" + .image.index_digest' "$candidate")
          contract_version=$(jq --raw-output '.contract.version' "$candidate")
          bundle_sha256=$(jq --raw-output '.contract.bundle_sha256' "$candidate")
          python3 scripts/deployment-evidence.py finalize \
            --evidence-root "$RUNNER_TEMP/cloud-final" \
            --coordinates "$RUNNER_TEMP/release-coordinates.json" \
            --trusted-root "$RUNNER_TEMP/github-attestation-trusted-root.jsonl" \
            --core-commit "$CANDIDATE_COMMIT" \
            --core-release "$INTENDED_TAG" \
            --contract-version "$contract_version" \
            --bundle-sha256 "$bundle_sha256" \
            --image "$image"
      - name: Attest the finalized cloud-deployments domain
        id: cloud-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/cloud-final/cloud_deployments.json
      - name: Retain the cloud-domain attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.cloud-attestation.outputs.bundle-path }}
        run: install -m 0600 -- "$BUNDLE_PATH" "$RUNNER_TEMP/cloud-final/cloud_deployments.attestation.sigstore.json"
      - name: Retain only the authenticated cloud-deployment domain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-cloud_deployments-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/cloud-final
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
