name: Deployment evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Deployment platform to exercise
        type: choice
        required: true
        options: [compose, cloud_run, aws, fly_io, cloudflare_containers]
      candidate_commit:
        description: Exact untagged core candidate commit
        type: string
        required: true
      intended_tag:
        description: Intended public tag bound by the candidate manifest
        type: string
        required: true
      candidate_run_id:
        description: Release-candidate run containing the attested manifest and artifacts
        type: string
        required: true
      candidate_run_attempt:
        description: Exact release-candidate run attempt
        type: string
        required: true
      image:
        description: Exact candidate OCI index (ghcr.io/latchway/latchway@sha256:...)
        type: string
        required: true
      endpoint:
        description: Public origin under test (HTTPS except loopback Compose)
        type: string
        required: true
      gcp_project:
        description: Cloud Run project (cloud_run only)
        type: string
        required: false
      gcp_region:
        description: Cloud Run region (cloud_run only)
        type: string
        required: false
      gcp_service:
        description: Cloud Run service (cloud_run only)
        type: string
        required: false
      gcp_migration_job:
        description: Cloud Run migration job (cloud_run only)
        type: string
        required: false
      aws_region:
        description: AWS region (aws only)
        type: string
        required: false
      aws_cluster:
        description: ECS cluster name or ARN (aws only)
        type: string
        required: false
      aws_service:
        description: ECS service name or ARN (aws only)
        type: string
        required: false
      fly_app:
        description: Fly application name (fly_io only)
        type: string
        required: false
      cloudflare_mirror_image:
        description: Exact content-equivalent amd64 mirror in registry.cloudflare.com (Cloudflare only)
        type: string
        required: false

permissions:
  contents: read

env:
  TRUSTED_WRANGLER_PACKAGE_JSON_SHA256: e65b3bedef41e581a85b006f4cf8ce769bb61a1f71c53af6ee4680cc4c25d839
  TRUSTED_WRANGLER_PACKAGE_LOCK_SHA256: d506545cdc465df003f47903c17ffdff69bc88fe182b6b55a2313fe8d312f5a2
  TRUSTED_WRANGLER_ALLOWED_PACKAGES_SHA256: 1468b2214885fdd9f6013c1d636ecbe85e47c88989215383fffa5e3304a50217
  TRUSTED_WRANGLER_PACKAGE_COUNT: '91'

concurrency:
  group: deployment-evidence-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'static' }}
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate deployment specifications and evidence tooling
        run: scripts/validate-deployments.sh /tmp/latchway-deployment-static.json
      - name: Retain static deployment evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-deployment-static
          path: |
            /tmp/latchway-deployment-static.json
            /tmp/latchway-deployment-static.json.junit.xml
          if-no-files-found: error
          retention-days: 30

  authenticate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: deployment-evidence-authentication
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      INTENDED_TAG: ${{ inputs.intended_tag }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
      RELEASE_IMAGE: ${{ inputs.image }}
      DEPLOYMENT_ENVIRONMENT: deployment-evidence-${{ inputs.platform }}
    steps:
      - name: Verify the exact protected deployment-evidence-authentication environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:deployment-evidence-authentication"
      - name: Require a fixed GitHub CLI verifier without candidate code
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<<"$version"
          test -n "$patch"
          (( major > 2 || (major == 2 && minor >= 97) ))
          # Equivalent policy owner: scripts/require-gh-version.py
      - name: Authenticate the immutable candidate producer run with no checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENDED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_IMAGE" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          [[ "$DEPLOYMENT_ENVIRONMENT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          mkdir -p "$RUNNER_TEMP/authority"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_RUN_ATTEMPT" > "$RUNNER_TEMP/authority/candidate-run.json"
          workflow_id=$(jq --raw-output '.workflow_id | select(type == "number" and . > 0)' "$RUNNER_TEMP/authority/candidate-run.json")
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --argjson attempt "$CANDIDATE_RUN_ATTEMPT" \
            '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .run_attempt == $attempt' \
            "$RUNNER_TEMP/authority/candidate-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/authority/candidate-workflow.json"
          jq --exit-status '.path == ".github/workflows/release.yml" and .state == "active"' "$RUNNER_TEMP/authority/candidate-workflow.json" >/dev/null
      - name: Download the immutable candidate evidence on the no-checkout runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/authority/latchway-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify immutable prepublication candidate authority with no checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/authority/latchway-candidate/latchway-candidate.json"
          gh attestation verify "$candidate" \
            --bundle "$RUNNER_TEMP/authority/latchway-candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --format json \
            > "$RUNNER_TEMP/authority/candidate-attestation-verification.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" --arg image "$RELEASE_IMAGE" '
            .candidate_commit == $commit and .intended_tag == $tag and .status == "passed" and
            (.image.repository + "@" + .image.index_digest) == $image' "$candidate" >/dev/null
      - name: Set up Buildx for fixed registry data capture without candidate code
        if: inputs.platform == 'cloudflare_containers' || inputs.platform == 'compose'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Authenticate only the no-checkout registry-data runner
        if: inputs.platform == 'cloudflare_containers' || inputs.platform == 'compose'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Capture the canonical Cloudflare platform manifest without candidate tooling
        if: inputs.platform == 'cloudflare_containers'
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/authority/latchway-candidate/latchway-candidate.json"
          platform_digest=$(jq --exit-status --raw-output '.image.platforms["linux/amd64"] | select(test("^sha256:[0-9a-f]{64}$"))' "$candidate")
          reference="ghcr.io/latchway/latchway@$platform_digest"
          docker buildx imagetools inspect --raw "$reference" > "$RUNNER_TEMP/authority/cloudflare-canonical-manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/authority/cloudflare-canonical-manifest.json" | awk '{print $1}')" = "${platform_digest#sha256:}"
          jq --exit-status '.schemaVersion == 2 and (.config.digest | test("^sha256:[0-9a-f]{64}$")) and (.layers | type == "array" and length > 0) and all(.layers[]; (.digest | test("^sha256:[0-9a-f]{64}$")) and (.size | type == "number" and . > 0))' \
            "$RUNNER_TEMP/authority/cloudflare-canonical-manifest.json" >/dev/null
      - name: Export bounded exact Compose images without candidate code
        if: inputs.platform == 'compose'
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/authority/latchway-candidate/latchway-candidate.json"
          candidate_manifest_sha=$(sha256sum "$candidate" | awk '{print $1}')
          candidate_platform=$(jq --exit-status --raw-output '.image.repository + "@" + .image.platforms["linux/amd64"]' "$candidate")
          postgres_source=docker.io/library/postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          [[ "$candidate_platform" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          docker pull --platform linux/amd64 "$candidate_platform" >/dev/null
          docker pull --platform linux/amd64 "$postgres_source" >/dev/null
          candidate_id=$(docker image inspect --format '{{.Id}}' "$candidate_platform")
          postgres_id=$(docker image inspect --format '{{.Id}}' "$postgres_source")
          [[ "$candidate_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$postgres_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$candidate_id" != "$postgres_id"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate_platform")" = linux/amd64
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$postgres_source")" = linux/amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$candidate_platform")" = "$CANDIDATE_COMMIT"
          candidate_local="latchway-preloaded-compose-candidate:${candidate_id#sha256:}"
          postgres_local="latchway-preloaded-compose-postgres:${postgres_id#sha256:}"
          docker tag "$candidate_platform" "$candidate_local"
          docker tag "$postgres_source" "$postgres_local"
          root="$RUNNER_TEMP/compose-images"
          mkdir -p "$root"
          docker save --output "$root/preloaded-images.tar" "$candidate_local" "$postgres_local"
          archive_size=$(stat --format=%s "$root/preloaded-images.tar")
          (( archive_size >= 1024 && archive_size <= 2147483648 ))
          archive_sha=$(sha256sum "$root/preloaded-images.tar" | awk '{print $1}')
          jq -n --sort-keys \
            --arg candidate_manifest_sha256 "$candidate_manifest_sha" \
            --arg candidate_index_reference "$RELEASE_IMAGE" \
            --arg candidate_platform_reference "$candidate_platform" \
            --arg candidate_local_reference "$candidate_local" \
            --arg candidate_image_id "$candidate_id" \
            --arg candidate_revision "$CANDIDATE_COMMIT" \
            --arg postgres_source_reference "$postgres_source" \
            --arg postgres_local_reference "$postgres_local" \
            --arg postgres_image_id "$postgres_id" \
            --arg archive_sha256 "$archive_sha" \
            --argjson archive_size_bytes "$archive_size" '
              {
                schema_version: 1,
                kind: "latchway_compose_preloaded_images",
                candidate_manifest_sha256: $candidate_manifest_sha256,
                archive: {path:"preloaded-images.tar",sha256:$archive_sha256,size_bytes:$archive_size_bytes},
                images: {
                  candidate: {
                    oci_index_reference:$candidate_index_reference,
                    oci_platform_reference:$candidate_platform_reference,
                    local_reference:$candidate_local_reference,
                    image_id:$candidate_image_id,
                    revision:$candidate_revision,
                    platform:"linux/amd64"
                  },
                  postgres: {
                    source_reference:$postgres_source_reference,
                    local_reference:$postgres_local_reference,
                    image_id:$postgres_image_id,
                    platform:"linux/amd64"
                  }
                }
              }
            ' > "$root/preloaded-images.json"
          test "$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
      - name: Retain bounded exact Compose images for a credential-free runner
        if: inputs.platform == 'compose'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-deployment-compose-images-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compose-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove the no-checkout registry credential
        if: always() && (inputs.platform == 'cloudflare_containers' || inputs.platform == 'compose')
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
      - name: Retain authenticated candidate inputs for isolated consumers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-deployment-authority-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authority
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  cloudflare-toolchain-source:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Read only the committed Wrangler lock closure from the workflow revision
        if: inputs.platform == 'cloudflare_containers'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/toolchains/wrangler/package.json
            .github/toolchains/wrangler/package-lock.json
            .github/toolchains/wrangler/allowed-packages.json
          sparse-checkout-cone-mode: false
      - name: Verify and isolate the exact committed Wrangler lock closure
        if: inputs.platform == 'cloudflare_containers'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          source_root=.github/toolchains/wrangler
          output="$RUNNER_TEMP/trusted-wrangler-lock"
          test -z "$(find "$source_root" -type l -print -quit)"
          test -z "$(find "$source_root" -mindepth 1 ! -type f -print -quit)"
          test "$(find "$source_root" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(sha256sum "$source_root/package.json" | awk '{print $1}')" = "$TRUSTED_WRANGLER_PACKAGE_JSON_SHA256"
          test "$(sha256sum "$source_root/package-lock.json" | awk '{print $1}')" = "$TRUSTED_WRANGLER_PACKAGE_LOCK_SHA256"
          test "$(sha256sum "$source_root/allowed-packages.json" | awk '{print $1}')" = "$TRUSTED_WRANGLER_ALLOWED_PACKAGES_SHA256"
          jq --exit-status --argjson count "$TRUSTED_WRANGLER_PACKAGE_COUNT" '
            (keys | sort) == ["lockfileVersion","name","packages","requires","version"] and
            .name == "@latchway/trusted-wrangler-toolchain" and .version == "1.0.0" and
            .lockfileVersion == 3 and .requires == true and
            (.packages | type == "object" and length == ($count + 1)) and
            .packages[""] == {
              name:"@latchway/trusted-wrangler-toolchain",version:"1.0.0",
              dependencies:{wrangler:"4.127.1"},engines:{node:"24.19.0"}
            } and
            .packages["node_modules/wrangler"].version == "4.127.1" and
            .packages["node_modules/wrangler"].integrity == "sha512-OzsiNgaI8i681L/+KnAKc+uEZ5D57xK5JuNvCOpRKICF4/5Q3Cu1oTGuUiT/f3GDUqQb3gzXNT0tfOHGMEtknw==" and
            all(.packages | to_entries[];
              if .key == "" then true else
                (.key | startswith("node_modules/")) and
                (.key | startswith("/") | not) and
                (.key | contains("/../") | not) and
                (.value | type == "object") and
                (.value.version | type == "string" and length > 0) and
                (.value.resolved | type == "string" and test("^https://registry\\.npmjs\\.org/.+\\.tgz$") and (test("[?#[:space:]]") | not)) and
                (.value.integrity | type == "string" and test("^sha512-[A-Za-z0-9+/]{86}==$"))
              end
            )
          ' "$source_root/package-lock.json" >/dev/null
          jq --sort-keys '{
            schema_version:1,
            kind:"latchway_trusted_npm_package_allowlist",
            package_count:([.packages | to_entries[] | select(.key != "")] | length),
            packages:([.packages | to_entries[] | select(.key != "") |
              {path:.key,version:.value.version,resolved:.value.resolved,integrity:.value.integrity}] | sort_by(.path))
          }' "$source_root/package-lock.json" > "$RUNNER_TEMP/expected-wrangler-packages.json"
          cmp --silent "$source_root/allowed-packages.json" "$RUNNER_TEMP/expected-wrangler-packages.json"
          mkdir -p "$output"
          install -m 0444 "$source_root/package.json" "$output/package.json"
          install -m 0444 "$source_root/package-lock.json" "$output/package-lock.json"
          install -m 0444 "$source_root/allowed-packages.json" "$output/allowed-packages.json"
      - name: Retain only the verified Wrangler lock closure
        if: inputs.platform == 'cloudflare_containers'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-trusted-wrangler-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-wrangler-lock/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  trusted-cloudflare-tool:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [authenticate, cloudflare-toolchain-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Set up Node.js for the fixed source-free Wrangler distribution
        if: inputs.platform == 'cloudflare_containers'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Download the verified committed Wrangler lock closure
        if: inputs.platform == 'cloudflare_containers'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-trusted-wrangler-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-wrangler-lock
      - name: Build a lock-closed Wrangler distribution without candidate inputs
        if: inputs.platform == 'cloudflare_containers'
        shell: bash
        env:
          WRANGLER_WRITE_LOGS: 'false'
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_REPLACE_REGISTRY_HOST: never
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        run: |
          set -Eeuo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          lock_root="$RUNNER_TEMP/trusted-wrangler-lock"
          root="$RUNNER_TEMP/trusted-wrangler"
          output="$RUNNER_TEMP/trusted-wrangler-artifact"
          test -z "$(find "$lock_root" -type l -print -quit)"
          test -z "$(find "$lock_root" -mindepth 1 ! -type f -print -quit)"
          test "$(find "$lock_root" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(sha256sum "$lock_root/package.json" | awk '{print $1}')" = "$TRUSTED_WRANGLER_PACKAGE_JSON_SHA256"
          test "$(sha256sum "$lock_root/package-lock.json" | awk '{print $1}')" = "$TRUSTED_WRANGLER_PACKAGE_LOCK_SHA256"
          test "$(sha256sum "$lock_root/allowed-packages.json" | awk '{print $1}')" = "$TRUSTED_WRANGLER_ALLOWED_PACKAGES_SHA256"
          jq --exit-status --argjson count "$TRUSTED_WRANGLER_PACKAGE_COUNT" '
            (keys | sort) == ["lockfileVersion","name","packages","requires","version"] and
            .name == "@latchway/trusted-wrangler-toolchain" and .version == "1.0.0" and
            .lockfileVersion == 3 and .requires == true and
            (.packages | type == "object" and length == ($count + 1)) and
            .packages[""] == {
              name:"@latchway/trusted-wrangler-toolchain",version:"1.0.0",
              dependencies:{wrangler:"4.127.1"},engines:{node:"24.19.0"}
            } and
            .packages["node_modules/wrangler"].version == "4.127.1" and
            .packages["node_modules/wrangler"].integrity == "sha512-OzsiNgaI8i681L/+KnAKc+uEZ5D57xK5JuNvCOpRKICF4/5Q3Cu1oTGuUiT/f3GDUqQb3gzXNT0tfOHGMEtknw==" and
            all(.packages | to_entries[];
              if .key == "" then true else
                (.key | startswith("node_modules/")) and
                (.key | startswith("/") | not) and
                (.key | contains("/../") | not) and
                (.value | type == "object") and
                (.value.version | type == "string" and length > 0) and
                (.value.resolved | type == "string" and test("^https://registry\\.npmjs\\.org/.+\\.tgz$") and (test("[?#[:space:]]") | not)) and
                (.value.integrity | type == "string" and test("^sha512-[A-Za-z0-9+/]{86}==$"))
              end
            )
          ' "$lock_root/package-lock.json" >/dev/null
          jq --sort-keys '{
            schema_version:1,
            kind:"latchway_trusted_npm_package_allowlist",
            package_count:([.packages | to_entries[] | select(.key != "")] | length),
            packages:([.packages | to_entries[] | select(.key != "") |
              {path:.key,version:.value.version,resolved:.value.resolved,integrity:.value.integrity}] | sort_by(.path))
          }' "$lock_root/package-lock.json" > "$RUNNER_TEMP/expected-wrangler-packages.json"
          cmp --silent "$lock_root/allowed-packages.json" "$RUNNER_TEMP/expected-wrangler-packages.json"
          mkdir -p "$root" "$output"
          install -m 0444 "$lock_root/package.json" "$root/package.json"
          install -m 0444 "$lock_root/package-lock.json" "$root/package-lock.json"
          install -m 0444 "$lock_root/allowed-packages.json" "$root/allowed-packages.json"
          cd "$root"
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          test "$(npm config get replace-registry-host)" = never
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never
          npm ls --all --json >/dev/null
          test "$("$root/node_modules/.bin/wrangler" --version)" = 4.127.1
          tar --format=posix --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "$output/wrangler-4.127.1-linux-x64.tar.gz" -C "$root" \
            node_modules package.json package-lock.json allowed-packages.json
          archive="$output/wrangler-4.127.1-linux-x64.tar.gz"
          archive_size=$(stat --format=%s "$archive")
          (( archive_size >= 1024 && archive_size <= 536870912 ))
          jq -n --sort-keys \
            --arg archive_sha256 "$(sha256sum "$archive" | awk '{print $1}')" \
            --argjson archive_size_bytes "$archive_size" \
            --arg package_json_sha256 "$TRUSTED_WRANGLER_PACKAGE_JSON_SHA256" \
            --arg package_lock_sha256 "$TRUSTED_WRANGLER_PACKAGE_LOCK_SHA256" \
            --arg allowed_packages_sha256 "$TRUSTED_WRANGLER_ALLOWED_PACKAGES_SHA256" \
            --argjson package_count "$TRUSTED_WRANGLER_PACKAGE_COUNT" '
              {
                schema_version:1,
                kind:"latchway_trusted_wrangler_distribution",
                node_version:"24.19.0",
                wrangler_version:"4.127.1",
                wrangler_integrity:"sha512-OzsiNgaI8i681L/+KnAKc+uEZ5D57xK5JuNvCOpRKICF4/5Q3Cu1oTGuUiT/f3GDUqQb3gzXNT0tfOHGMEtknw==",
                package_json_sha256:$package_json_sha256,
                package_lock_sha256:$package_lock_sha256,
                allowed_packages_sha256:$allowed_packages_sha256,
                package_count:$package_count,
                archive:{path:"wrangler-4.127.1-linux-x64.tar.gz",sha256:$archive_sha256,size_bytes:$archive_size_bytes}
              }
            ' > "$output/trusted-wrangler.json"
          test "$(find "$output" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
      - name: Retain only the fixed Wrangler distribution and receipt
        if: inputs.platform == 'cloudflare_containers'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-trusted-wrangler-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-wrangler-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: authenticate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out candidate deployment inputs without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind credential-free preparation to the candidate commit
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          mkdir -p "$RUNNER_TEMP/provider-inputs/cloudflare"
          install -m 0644 deploy/compose/compose.release.yaml "$RUNNER_TEMP/provider-inputs/compose.review.yaml"
          install -m 0644 deploy/fly/fly.toml "$RUNNER_TEMP/provider-inputs/fly.toml"
      - name: Validate Fly configuration closure without provider credentials
        if: inputs.platform == 'fly_io'
        run: python3 scripts/deployment-evidence.py static --output "$RUNNER_TEMP/fly-static.json"
      - name: Set up pinned pnpm for credential-free Cloudflare preparation
        if: inputs.platform == 'cloudflare_containers'
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.15.0
          run_install: false
      - name: Set up pinned Node.js for credential-free Cloudflare preparation
        if: inputs.platform == 'cloudflare_containers'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: deploy/cloudflare/pnpm-lock.yaml
      - name: Build the candidate Cloudflare Worker without provider or OIDC credentials
        if: inputs.platform == 'cloudflare_containers'
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir deploy/cloudflare install --frozen-lockfile --ignore-scripts
          pnpm --dir deploy/cloudflare release:dry-run
          test -f deploy/cloudflare/.wrangler-dist/release/index.js
          test ! -L deploy/cloudflare/.wrangler-dist/release/index.js
          install -m 0644 deploy/cloudflare/.wrangler-dist/release/index.js "$RUNNER_TEMP/provider-inputs/cloudflare/index.js"
      - name: Hash-bind the bounded candidate provider inputs
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/provider-inputs"
          artifacts='[]'
          for relative in compose.review.yaml fly.toml; do
            path="$root/$relative"
            test -f "$path" && test ! -L "$path" && test -s "$path"
            size=$(stat --format=%s "$path")
            (( size > 0 && size <= 1048576 ))
            artifacts=$(jq --arg path "$relative" --arg sha "$(sha256sum "$path" | awk '{print $1}')" --argjson size "$size" \
              '. + [{path:$path,sha256:$sha,size_bytes:$size}]' <<< "$artifacts")
          done
          if [[ "$PLATFORM" == cloudflare_containers ]]; then
            path="$root/cloudflare/index.js"
            test -f "$path" && test ! -L "$path" && test -s "$path"
            size=$(stat --format=%s "$path")
            (( size > 0 && size <= 10485760 ))
            artifacts=$(jq --arg path cloudflare/index.js --arg sha "$(sha256sum "$path" | awk '{print $1}')" --argjson size "$size" \
              '. + [{path:$path,sha256:$sha,size_bytes:$size}]' <<< "$artifacts")
          fi
          jq -n --sort-keys --arg commit "$CANDIDATE_COMMIT" --arg platform "$PLATFORM" --argjson artifacts "$artifacts" '
            {schema_version:1,kind:"latchway_deployment_provider_inputs",candidate_commit:$commit,platform:$platform,artifacts:$artifacts}
          ' > "$root/provider-inputs.json"
      - name: Retain bounded provider inputs for no-checkout capture jobs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-deployment-provider-inputs-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-inputs
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  capture:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.platform != 'compose'
    needs: [authenticate, trusted-cloudflare-tool, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: deployment-evidence-${{ inputs.platform }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      PLATFORM: ${{ inputs.platform }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      INTENDED_TAG: ${{ inputs.intended_tag }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
      RELEASE_IMAGE: ${{ inputs.image }}
      ENDPOINT: ${{ inputs.endpoint }}
      DEPLOYMENT_ENVIRONMENT: deployment-evidence-${{ inputs.platform }}
      GCP_PROJECT: ${{ inputs.gcp_project }}
      GCP_REGION: ${{ inputs.gcp_region }}
      GCP_SERVICE: ${{ inputs.gcp_service }}
      GCP_MIGRATION_JOB: ${{ inputs.gcp_migration_job }}
      AWS_REGION: ${{ inputs.aws_region }}
      AWS_CLUSTER: ${{ inputs.aws_cluster }}
      AWS_SERVICE: ${{ inputs.aws_service }}
      FLY_APP: ${{ inputs.fly_app }}
      CLOUDFLARE_MIRROR_IMAGE: ${{ inputs.cloudflare_mirror_image }}
      AWS_PAGER: ''
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
      FLY_NO_UPDATE_CHECK: '1'
    steps:
      - name: Verify the exact protected deployment provider environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -Eeuo pipefail
          case "$PLATFORM" in
            aws) expected="latchway-release-controls-v1:latchway:deployment-evidence-aws" ;;
            cloud_run) expected="latchway-release-controls-v1:latchway:deployment-evidence-cloud_run" ;;
            cloudflare_containers) expected="latchway-release-controls-v1:latchway:deployment-evidence-cloudflare_containers" ;;
            fly_io) expected="latchway-release-controls-v1:latchway:deployment-evidence-fly_io" ;;
            *) exit 1 ;;
          esac
          test "$OBSERVED_POLICY_ID" = "$expected"
      - name: Download authenticated candidate inputs on the fresh provider runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-deployment-authority-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authority
      - name: Download credential-free provider inputs without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-deployment-provider-inputs-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-inputs
      - name: Download the source-free fixed Wrangler distribution
        if: inputs.platform == 'cloudflare_containers'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-trusted-wrangler-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-wrangler-artifact
      - name: Validate candidate provider inputs as data only
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/provider-inputs"
          receipt="$root/provider-inputs.json"
          test -z "$(find "$root" -type l -print -quit)"
          test -z "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)"
          jq --sort-keys . "$receipt" > "$RUNNER_TEMP/provider-inputs-canonical.json"
          cmp --silent "$receipt" "$RUNNER_TEMP/provider-inputs-canonical.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg platform "$PLATFORM" '
            (keys | sort) == ["artifacts","candidate_commit","kind","platform","schema_version"] and
            .schema_version == 1 and .kind == "latchway_deployment_provider_inputs" and
            .candidate_commit == $commit and .platform == $platform and
            (.artifacts | type == "array") and
            all(.artifacts[];
              (keys | sort) == ["path","sha256","size_bytes"] and
              (.path | test("^(compose\\.review\\.yaml|fly\\.toml|cloudflare/index\\.js)$")) and
              (.sha256 | test("^[0-9a-f]{64}$")) and
              (.size_bytes > 0 and .size_bytes <= 10485760)) and
            ([.artifacts[].path] | unique | length) == (.artifacts | length) and
            (if $platform == "cloudflare_containers" then
              ([.artifacts[].path] | sort) == ["cloudflare/index.js","compose.review.yaml","fly.toml"]
             else
              ([.artifacts[].path] | sort) == ["compose.review.yaml","fly.toml"]
             end)
          ' "$receipt" >/dev/null
          actual="$RUNNER_TEMP/provider-inputs-actual"
          expected="$RUNNER_TEMP/provider-inputs-expected"
          find "$root" -type f -print | while IFS= read -r path; do printf '%s\n' "${path#"$root/"}"; done | LC_ALL=C sort > "$actual"
          { printf '%s\n' provider-inputs.json; jq --raw-output '.artifacts[].path' "$receipt"; } | LC_ALL=C sort > "$expected"
          cmp --silent "$actual" "$expected"
          jq --exit-status --raw-output '.artifacts[] | [.path,.sha256,(.size_bytes|tostring)] | @tsv' "$receipt" |
            while IFS=$'\t' read -r relative sha size; do
              file="$root/$relative"
              test -f "$file" && test ! -L "$file" && test -s "$file"
              test "$(sha256sum "$file" | awk '{print $1}')" = "$sha"
              test "$(stat --format=%s "$file")" = "$size"
            done
      - name: Validate and unpack only the fixed-integrity Wrangler distribution
        if: inputs.platform == 'cloudflare_containers'
        shell: bash
        env:
          WRANGLER_WRITE_LOGS: 'false'
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/trusted-wrangler-artifact"
          receipt="$root/trusted-wrangler.json"
          archive="$root/wrangler-4.127.1-linux-x64.tar.gz"
          test -z "$(find "$root" -type l -print -quit)"
          test -z "$(find "$root" -mindepth 1 ! -type f -print -quit)"
          test "$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          jq --sort-keys . "$receipt" > "$RUNNER_TEMP/trusted-wrangler-canonical.json"
          cmp --silent "$receipt" "$RUNNER_TEMP/trusted-wrangler-canonical.json"
          archive_size=$(stat --format=%s "$archive")
          archive_sha=$(sha256sum "$archive" | awk '{print $1}')
          jq --exit-status \
            --arg archive_sha "$archive_sha" --argjson archive_size "$archive_size" \
            --arg package_json_sha "$TRUSTED_WRANGLER_PACKAGE_JSON_SHA256" \
            --arg package_lock_sha "$TRUSTED_WRANGLER_PACKAGE_LOCK_SHA256" \
            --arg allowed_packages_sha "$TRUSTED_WRANGLER_ALLOWED_PACKAGES_SHA256" \
            --argjson package_count "$TRUSTED_WRANGLER_PACKAGE_COUNT" '
            (keys | sort) == ["allowed_packages_sha256","archive","kind","node_version","package_count","package_json_sha256","package_lock_sha256","schema_version","wrangler_integrity","wrangler_version"] and
            .schema_version == 1 and .kind == "latchway_trusted_wrangler_distribution" and
            .node_version == "24.19.0" and .wrangler_version == "4.127.1" and
            .wrangler_integrity == "sha512-OzsiNgaI8i681L/+KnAKc+uEZ5D57xK5JuNvCOpRKICF4/5Q3Cu1oTGuUiT/f3GDUqQb3gzXNT0tfOHGMEtknw==" and
            .package_json_sha256 == $package_json_sha and
            .package_lock_sha256 == $package_lock_sha and
            .allowed_packages_sha256 == $allowed_packages_sha and
            .package_count == $package_count and
            .archive == {path:"wrangler-4.127.1-linux-x64.tar.gz",sha256:$archive_sha,size_bytes:$archive_size} and
            ($archive_size >= 1024 and $archive_size <= 536870912)
          ' "$receipt" >/dev/null
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            exit 1
          fi
          tool="$RUNNER_TEMP/cloudflare-tool"
          mkdir -p "$tool"
          tar --no-same-owner --no-same-permissions -xzf "$archive" -C "$tool"
          test "$(sha256sum "$tool/package.json" | awk '{print $1}')" = "$TRUSTED_WRANGLER_PACKAGE_JSON_SHA256"
          test "$(sha256sum "$tool/package-lock.json" | awk '{print $1}')" = "$TRUSTED_WRANGLER_PACKAGE_LOCK_SHA256"
          test "$(sha256sum "$tool/allowed-packages.json" | awk '{print $1}')" = "$TRUSTED_WRANGLER_ALLOWED_PACKAGES_SHA256"
          jq --exit-status --argjson count "$TRUSTED_WRANGLER_PACKAGE_COUNT" '
            (keys | sort) == ["lockfileVersion","name","packages","requires","version"] and
            .name == "@latchway/trusted-wrangler-toolchain" and .version == "1.0.0" and
            .lockfileVersion == 3 and .requires == true and
            (.packages | type == "object" and length == ($count + 1)) and
            .packages[""] == {
              name:"@latchway/trusted-wrangler-toolchain",version:"1.0.0",
              dependencies:{wrangler:"4.127.1"},engines:{node:"24.19.0"}
            } and
            .packages["node_modules/wrangler"].version == "4.127.1" and
            .packages["node_modules/wrangler"].integrity == "sha512-OzsiNgaI8i681L/+KnAKc+uEZ5D57xK5JuNvCOpRKICF4/5Q3Cu1oTGuUiT/f3GDUqQb3gzXNT0tfOHGMEtknw==" and
            all(.packages | to_entries[];
              if .key == "" then true else
                (.key | startswith("node_modules/")) and
                (.key | startswith("/") | not) and
                (.key | contains("/../") | not) and
                (.value | type == "object") and
                (.value.version | type == "string" and length > 0) and
                (.value.resolved | type == "string" and test("^https://registry\\.npmjs\\.org/.+\\.tgz$") and (test("[?#[:space:]]") | not)) and
                (.value.integrity | type == "string" and test("^sha512-[A-Za-z0-9+/]{86}==$"))
              end
            )
          ' "$tool/package-lock.json" >/dev/null
          jq --sort-keys '{
            schema_version:1,
            kind:"latchway_trusted_npm_package_allowlist",
            package_count:([.packages | to_entries[] | select(.key != "")] | length),
            packages:([.packages | to_entries[] | select(.key != "") |
              {path:.key,version:.value.version,resolved:.value.resolved,integrity:.value.integrity}] | sort_by(.path))
          }' "$tool/package-lock.json" > "$RUNNER_TEMP/expected-wrangler-packages.json"
          cmp --silent "$tool/allowed-packages.json" "$RUNNER_TEMP/expected-wrangler-packages.json"
          test "$("$tool/node_modules/.bin/wrangler" --version)" = 4.127.1
      - name: Bind the provider runner to the authenticated candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.image.repository + "@" + .image.index_digest' "$RUNNER_TEMP/authority/latchway-candidate/latchway-candidate.json")" = "$RELEASE_IMAGE"
          mkdir -p /tmp/latchway-deployment-capture
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/latchway-deployment-started-at
      - name: Authenticate to Google Cloud with GitHub OIDC
        if: inputs.platform == 'cloud_run'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install pinned Google Cloud action
        if: inputs.platform == 'cloud_run'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '540.0.0'
      - name: Authenticate to AWS with GitHub OIDC
        if: inputs.platform == 'aws'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: latchway-evidence-${{ github.run_id }}
      - name: Install pinned Fly CLI action
        if: inputs.platform == 'fly_io'
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
        with:
          version: '0.4.89'
      - name: Validate Fly configuration against the authenticated platform
        if: inputs.platform == 'fly_io'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl config validate --strict --app "$FLY_APP" --config "$RUNNER_TEMP/provider-inputs/fly.toml"
      - name: Set up pinned Node.js for Cloudflare evidence
        if: inputs.platform == 'cloudflare_containers'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Set up Docker Buildx for Cloudflare manifest verification
        if: inputs.platform == 'cloudflare_containers'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Capture Cloud Run migration, revision, secret, and rollout evidence
        if: inputs.platform == 'cloud_run'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GCP_PROJECT" = "latchway"
          test "$GCP_REGION" = "asia-southeast1"
          test "$GCP_SERVICE" = "latchway"
          test "$GCP_MIGRATION_JOB" = "latchway-migrate"
          capture=/tmp/latchway-deployment-capture
          gcloud version --format=json > /tmp/gcloud-version.json
          gcloud projects describe "$GCP_PROJECT" --format=json > /tmp/gcp-identity.json
          gcloud run services describe "$GCP_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json > /tmp/cloud-run-before.json
          before_revision=$(jq -er '.status.latestReadyRevisionName' /tmp/cloud-run-before.json)
          gcloud run revisions describe "$before_revision" --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json > /tmp/cloud-run-before-revision.json
          gcloud run jobs describe "$GCP_MIGRATION_JOB" --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json > /tmp/cloud-run-migration-job.json
          # Read-only preflight: no job execution or service mutation is allowed above this point.
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ.get("CLOUD_RUN_PREFLIGHT_ROOT", "/tmp"))
          load = lambda name: json.loads((root / name).read_text())
          project, region = "latchway", "asia-southeast1"
          runtime_account = "latchway-runtime@latchway.iam.gserviceaccount.com"
          migrator_account = "latchway-migrator@latchway.iam.gserviceaccount.com"
          cloud_sql_connection = "latchway:asia-southeast1:latchway-postgres"
          cloud_sql_annotations = {
              "run.googleapis.com/cloudsql-instances": cloud_sql_connection,
          }
          image, endpoint = os.environ["RELEASE_IMAGE"], os.environ["ENDPOINT"]
          service = load("cloud-run-before.json")
          revision = load("cloud-run-before-revision.json")
          job = load("cloud-run-migration-job.json")
          identity = load("gcp-identity.json")
          if (identity.get("projectId") != project or identity.get("lifecycleState") != "ACTIVE" or
                  not isinstance(identity.get("projectNumber"), str) or re.fullmatch(r"[1-9][0-9]*", identity["projectNumber"]) is None):
              raise ValueError("Cloud Run preflight project identity is invalid")
          def location(document):
              labels = document.get("metadata", {}).get("labels", {}) if isinstance(document, dict) else {}
              if labels.get("cloud.googleapis.com/location") != region:
                  raise ValueError("Cloud Run preflight resource location is invalid")
          def ready(document):
              conditions = document.get("status", {}).get("conditions", []) if isinstance(document, dict) else []
              return any(isinstance(item, dict) and item.get("type") == "Ready" and str(item.get("status")).lower() == "true" for item in conditions)
          def probe(value, path, expected):
              if not isinstance(value, dict) or any(key in value for key in ("tcpSocket", "grpc")):
