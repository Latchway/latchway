name: Protected release-domain observations

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Fixed external observation set to execute
        required: true
        type: choice
        options:
          - live_sdk_conformance
          - physical_devices
          - live_provider
          - supply_chain
          - public_tags
          - public_registries
      candidate_commit:
        description: Exact core candidate commit
        required: true
        type: string
      javascript_commit:
        description: Exact JavaScript SDK commit from source conformance
        required: true
        type: string
      ios_commit:
        description: Exact iOS SDK commit from source conformance
        required: true
        type: string
      android_commit:
        description: Exact Android SDK commit from source conformance
        required: true
        type: string
      react_native_commit:
        description: Exact React Native SDK commit from source conformance
        required: true
        type: string
      source_evidence_run_id:
        description: Successful attested source-conformance run ID
        required: true
        type: string
      source_evidence_run_attempt:
        description: Exact source-conformance run attempt
        required: true
        type: string
      candidate_run_id:
        description: Successful attested immutable-candidate run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact immutable-candidate run attempt
        required: true
        type: string
      ios_physical_run_id:
        description: Exact successful Physical App Attest evidence run ID (SDK/device domains only)
        required: false
        type: string
      ios_physical_run_attempt:
        description: Exact Physical App Attest run attempt (SDK/device domains only)
        required: false
        type: string
      android_physical_run_id:
        description: Exact successful Physical Play Integrity evidence run ID (SDK/device domains only)
        required: false
        type: string
      android_physical_run_attempt:
        description: Exact Physical Play Integrity run attempt (SDK/device domains only)
        required: false
        type: string
      react_native_physical_run_id:
        description: Exact successful Physical React Native evidence run ID (SDK/device domains only)
        required: false
        type: string
      react_native_physical_run_attempt:
        description: Exact Physical React Native run attempt (SDK/device domains only)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: release-domain-observations-${{ inputs.domain }}-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  authenticate:
    if: github.ref == 'refs/heads/main'
    environment: release-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate immutable inputs with no candidate checkout
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
          IOS_COMMIT: ${{ inputs.ios_commit }}
          ANDROID_COMMIT: ${{ inputs.android_commit }}
          REACT_NATIVE_COMMIT: ${{ inputs.react_native_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_evidence_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_evidence_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          EVIDENCE_DOMAIN: ${{ inputs.domain }}
          IOS_PHYSICAL_RUN_ID: ${{ inputs.ios_physical_run_id }}
          IOS_PHYSICAL_RUN_ATTEMPT: ${{ inputs.ios_physical_run_attempt }}
          ANDROID_PHYSICAL_RUN_ID: ${{ inputs.android_physical_run_id }}
          ANDROID_PHYSICAL_RUN_ATTEMPT: ${{ inputs.android_physical_run_attempt }}
          REACT_NATIVE_PHYSICAL_RUN_ID: ${{ inputs.react_native_physical_run_id }}
          REACT_NATIVE_PHYSICAL_RUN_ATTEMPT: ${{ inputs.react_native_physical_run_attempt }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          for value in "$CANDIDATE_COMMIT" "$JAVASCRIPT_COMMIT" "$IOS_COMMIT" "$ANDROID_COMMIT" "$REACT_NATIVE_COMMIT"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          for value in "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          if [[ "$EVIDENCE_DOMAIN" == live_sdk_conformance || "$EVIDENCE_DOMAIN" == physical_devices ]]; then
            for value in "$IOS_PHYSICAL_RUN_ID" "$ANDROID_PHYSICAL_RUN_ID" "$REACT_NATIVE_PHYSICAL_RUN_ID"; do
              [[ "$value" =~ ^[1-9][0-9]{0,19}$ ]]
            done
            for value in "$IOS_PHYSICAL_RUN_ATTEMPT" "$ANDROID_PHYSICAL_RUN_ATTEMPT" "$REACT_NATIVE_PHYSICAL_RUN_ATTEMPT"; do
              [[ "$value" =~ ^[1-9][0-9]{0,5}$ ]]
            done
          fi
      - name: Require a fixed GitHub CLI verifier without candidate code
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<<"$version"
          test -n "$patch"
          (( major > 2 || (major == 2 && minor >= 97) ))
          # Equivalent policy owner: scripts/require-gh-version.py
      - name: Authenticate exact source and candidate runs and attempts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_evidence_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_evidence_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/authority"
          verify_run() {
            local label="$1" run_id="$2" attempt="$3" path="$4"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt" > "$RUNNER_TEMP/authority/$label-run.json"
            jq --exit-status --arg commit "$CANDIDATE_COMMIT" --argjson attempt "$attempt" \
              '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .run_attempt == $attempt' \
              "$RUNNER_TEMP/authority/$label-run.json" >/dev/null
            workflow_id=$(jq --raw-output '.workflow_id | select(type == "number" and . > 0)' "$RUNNER_TEMP/authority/$label-run.json")
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/authority/$label-workflow.json"
            jq --exit-status --arg path "$path" '.path == $path and .state == "active"' "$RUNNER_TEMP/authority/$label-workflow.json" >/dev/null
          }
          verify_run source "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" .github/workflows/cross-repository-conformance.yml
          verify_run candidate "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" .github/workflows/release.yml
      - name: Download the exact source-conformance artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-source-${{ inputs.source_evidence_run_id }}-${{ inputs.source_evidence_run_attempt }}
          path: ${{ runner.temp }}/authority/source
          run-id: ${{ inputs.source_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Download the exact candidate artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/authority/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source and candidate bundle provenance without a checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" \
            --bundle "$RUNNER_TEMP/authority/source/latchway-cross-repository.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --format json \
            > "$RUNNER_TEMP/authority/source-attestation-verification.json"
          gh attestation verify "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" \
            --bundle "$RUNNER_TEMP/authority/candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --format json \
            > "$RUNNER_TEMP/authority/candidate-attestation-verification.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" \
            '.candidate_commit == $commit and .status == "passed" and .image.repository == "ghcr.io/latchway/latchway" and (.image.index_digest | test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" >/dev/null
      - name: Retain authenticated immutable inputs for isolated consumers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-domain-authority-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authority
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  live_provider_capture:
    if: github.ref == 'refs/heads/main' && inputs.domain == 'live_provider'
    needs: authenticate
    environment: release-evidence-live-provider
    runs-on: [self-hosted, linux, x64, latchway-live-provider, latchway-ephemeral-jit]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: none
    steps:
      - name: Download authenticated candidate coordinates without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-authority-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authority
      - name: Verify the signed fresh one-job live-provider collector lease
        shell: bash
        env:
          COLLECTOR_TRUST_ROOT_PEM: ${{ vars.LATCHWAY_LIVE_PROVIDER_COLLECTOR_TRUST_ROOT_PEM }}
          COLLECTOR_TRUST_ROOT_SHA256: ${{ vars.LATCHWAY_LIVE_PROVIDER_COLLECTOR_TRUST_ROOT_SHA256 }}
          GRANT_SHA256: ${{ vars.LATCHWAY_LIVE_PROVIDER_GRANT_SHA256 }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          LATCHWAY_BASE_URL: ${{ vars.LATCHWAY_LIVE_GATEWAY_BASE_URL }}
          LATCHWAY_PROVIDER_ENVIRONMENT_ID: ${{ vars.LATCHWAY_LIVE_PROVIDER_ENVIRONMENT_ID }}
          LATCHWAY_PROVIDER_UPSTREAM_ID: ${{ vars.LATCHWAY_LIVE_PROVIDER_UPSTREAM_ID }}
          LATCHWAY_PROVIDER_MODEL_ID: ${{ vars.LATCHWAY_LIVE_PROVIDER_MODEL_ID }}
          LATCHWAY_PROVIDER_MAX_COST_NANO_USD: ${{ vars.LATCHWAY_LIVE_PROVIDER_MAX_COST_NANO_USD }}
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_NAME" = "latchway-live-provider-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -print -quit)"
          lease=/etc/latchway/live-provider-collector/lease.json
          signature=/etc/latchway/live-provider-collector/lease.sig
          finalize_hook=/usr/local/libexec/latchway-live-provider-collector-finalize
          abort_hook=/usr/local/libexec/latchway-live-provider-collector-abort
          for path in "$lease" "$signature" "$finalize_hook" "$abort_hook"; do
            test -f "$path" && test ! -L "$path"
            test "$(stat -c '%U' "$path")" = root
            mode=$(stat -c '%a' "$path")
            (( (8#$mode & 0022) == 0 ))
          done
          capture="$RUNNER_TEMP/live-provider-capture"
          isolation="$capture/collector-isolation"
          install -d -m 0700 "$capture" "$isolation"
          trust_root="$RUNNER_TEMP/live-provider-collector-trust-root.pem"
          umask 077
          printf '%s\n' "$COLLECTOR_TRUST_ROOT_PEM" > "$trust_root"
          for value in "$COLLECTOR_TRUST_ROOT_SHA256" "$GRANT_SHA256"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          test "$(sha256sum "$trust_root" | awk '{print $1}')" = "$COLLECTOR_TRUST_ROOT_SHA256"
          openssl dgst -sha256 -verify "$trust_root" -signature "$signature" "$lease"
          base_url=${LATCHWAY_BASE_URL%/}
          [[ "$base_url" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*(:[1-9][0-9]{0,4})?$ ]]
          for value in "$LATCHWAY_PROVIDER_ENVIRONMENT_ID" "$LATCHWAY_PROVIDER_UPSTREAM_ID" "$LATCHWAY_PROVIDER_MODEL_ID"; do
            [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          done
          max_cost=${LATCHWAY_PROVIDER_MAX_COST_NANO_USD:-10000000}
          [[ "$max_cost" =~ ^[1-9][0-9]{0,8}$ ]]
          (( max_cost <= 100000000 ))
          jq --null-input --arg environment "$LATCHWAY_PROVIDER_ENVIRONMENT_ID" \
            --arg upstream "$LATCHWAY_PROVIDER_UPSTREAM_ID" --arg model "$LATCHWAY_PROVIDER_MODEL_ID" \
            --argjson max_cost "$max_cost" \
            '{kind:"openrouter",environment_id:$environment,upstream:$upstream,model:$model,max_cost_nano_usd:$max_cost}' \
            | jq --sort-keys . > "$RUNNER_TEMP/provider-request.json"
          request_sha=$(sha256sum "$RUNNER_TEMP/provider-request.json" | awk '{print $1}')
          source_sha=$(sha256sum "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" | awk '{print $1}')
          candidate_sha=$(sha256sum "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" | awk '{print $1}')
          now=$(date +%s)
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg commit "$CANDIDATE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" --arg runner "$RUNNER_NAME" --arg grant "$GRANT_SHA256" \
            --arg request "$request_sha" --arg source "$source_sha" --arg candidate "$candidate_sha" \
            --arg gateway "$base_url" --argjson now "$now" '
              .schema_version == "latchway.live-provider-collector-lease.v1" and
              .repository == $repository and .core_commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:$job,audience:"latchway-live-provider/self-test"} and
              .runner.name == $runner and .runner.ephemeral == true and .runner.jit == true and
              .runner.max_jobs == 1 and .runner.fresh_boot == true and
              .runner.clean_workspace == true and .runner.repository_scope == $repository and
              .runner.destroy_after_job == true and (.runner.image_digest | test("^sha256:[0-9a-f]{64}$")) and
              (.runner.boot_id_sha256 | test("^[0-9a-f]{64}$")) and
              .credentials == {long_lived:false,organization:false,administration:false,registry:false,oidc:false} and
              .supervisor == {private_key_isolated:true,caller_supplied_claims_accepted:false,
                gateway_egress_only:true,dns_pinned:true,tls_verified:true,
                grant_issuer_independent:true,one_use_verification:true,out_of_band_watchdog:true} and
              .grant.audience == "latchway-live-provider/self-test" and
              .grant.core_commit == $commit and .grant.run_id == $run_id and
              .grant.run_attempt == $run_attempt and .grant.sha256 == $grant and
              .grant.scope == "run_self_tests" and .grant.single_use == true and
              .grant.revocable == true and (.grant.jti_sha256 | test("^[0-9a-f]{64}$")) and
              .grant.request_sha256 == $request and
              (.grant.issued_at_unix | type == "number") and
              (.grant.expires_at_unix | type == "number") and
              .grant.issued_at_unix <= $now and .grant.expires_at_unix >= $now and
              (.grant.expires_at_unix - .grant.issued_at_unix) <= 300 and
              .candidate == {source_report_sha256:$source,candidate_manifest_sha256:$candidate} and
              .gateway == {origin:$gateway} and
              (.issued_at_unix | type == "number") and (.expires_at_unix | type == "number") and
              .issued_at_unix <= $now and .expires_at_unix >= $now and
              (.expires_at_unix - .issued_at_unix) <= 600
            ' "$lease" >/dev/null
          install -m 0600 "$lease" "$isolation/collector-lease.json"
          install -m 0600 "$signature" "$isolation/collector-lease.sig"
          install -m 0600 "$trust_root" "$isolation/collector-trust-root.pem"
      - name: Capture fixed responses with a run-bound one-use Admin grant
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
          IOS_COMMIT: ${{ inputs.ios_commit }}
          ANDROID_COMMIT: ${{ inputs.android_commit }}
          REACT_NATIVE_COMMIT: ${{ inputs.react_native_commit }}
          LATCHWAY_BASE_URL: ${{ vars.LATCHWAY_LIVE_GATEWAY_BASE_URL }}
          ONE_TIME_GRANT: ${{ secrets.LATCHWAY_ONE_TIME_LIVE_PROVIDER_GRANT }}
          GRANT_SHA256: ${{ vars.LATCHWAY_LIVE_PROVIDER_GRANT_SHA256 }}
          LATCHWAY_PROVIDER_ENVIRONMENT_ID: ${{ vars.LATCHWAY_LIVE_PROVIDER_ENVIRONMENT_ID }}
          LATCHWAY_PROVIDER_UPSTREAM_ID: ${{ vars.LATCHWAY_LIVE_PROVIDER_UPSTREAM_ID }}
          LATCHWAY_PROVIDER_MODEL_ID: ${{ vars.LATCHWAY_LIVE_PROVIDER_MODEL_ID }}
          LATCHWAY_PROVIDER_MAX_COST_NANO_USD: ${{ vars.LATCHWAY_LIVE_PROVIDER_MAX_COST_NANO_USD }}
        run: |
          set -Eeuo pipefail
          umask 077
          capture="$RUNNER_TEMP/live-provider-capture"
          mkdir -p "$capture"
          isolation="$capture/collector-isolation"
          lease=/etc/latchway/live-provider-collector/lease.json
          finalize_hook=/usr/local/libexec/latchway-live-provider-collector-finalize
          abort_hook=/usr/local/libexec/latchway-live-provider-collector-abort
          grant="$RUNNER_TEMP/live-provider-one-use-grant.json"
          test -n "$ONE_TIME_GRANT"
          printf '%s' "$ONE_TIME_GRANT" > "$grant"
          unset ONE_TIME_GRANT
          test "$(sha256sum "$grant" | awk '{print $1}')" = "$GRANT_SHA256"
          completed=false
          cleanup() {
            rm -f "$RUNNER_TEMP/provider-auth.curl"
            unset admin_token
            if [[ "$completed" != true ]]; then
              "$abort_hook" --lease "$lease" --grant "$grant" \
                --repository "$GITHUB_REPOSITORY" --core-commit "$CANDIDATE_COMMIT" \
                --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
                --runner-name "$RUNNER_NAME" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          base_url=${LATCHWAY_BASE_URL%/}
          [[ "$base_url" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*(:[1-9][0-9]{0,4})?$ ]]
          for value in "$LATCHWAY_PROVIDER_ENVIRONMENT_ID" "$LATCHWAY_PROVIDER_UPSTREAM_ID" "$LATCHWAY_PROVIDER_MODEL_ID"; do
            [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          done
          max_cost=${LATCHWAY_PROVIDER_MAX_COST_NANO_USD:-10000000}
          [[ "$max_cost" =~ ^[1-9][0-9]{0,8}$ ]]
          (( max_cost <= 100000000 ))
          jq --null-input --arg environment "$LATCHWAY_PROVIDER_ENVIRONMENT_ID" \
            --arg upstream "$LATCHWAY_PROVIDER_UPSTREAM_ID" --arg model "$LATCHWAY_PROVIDER_MODEL_ID" \
            --argjson max_cost "$max_cost" \
            '{kind:"openrouter",environment_id:$environment,upstream:$upstream,model:$model,max_cost_nano_usd:$max_cost}' \
            | jq --sort-keys . > "$RUNNER_TEMP/provider-request.json"
          request_sha=$(sha256sum "$RUNNER_TEMP/provider-request.json" | awk '{print $1}')
          now=$(date +%s)
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg commit "$CANDIDATE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg audience "latchway-live-provider/self-test" --arg gateway "$base_url" \
            --arg request "$request_sha" --argjson now "$now" \
            --slurpfile expected_request "$RUNNER_TEMP/provider-request.json" '
              (keys | sort) == ["admin_token","audience","core_commit","expires_at_unix",
                "issued_at_unix","jti_sha256","repository","request","run_attempt","run_id",
                "revocable","schema_version","scope","single_use"] and
              .schema_version == "latchway.live-provider-one-use-grant.v1" and
              .repository == $repository and .core_commit == $commit and
              .run_id == $run_id and .run_attempt == $run_attempt and
              .audience == $audience and .scope == "run_self_tests" and
              .single_use == true and .revocable == true and
              (.jti_sha256 | test("^[0-9a-f]{64}$")) and
              (.admin_token | test("^lwa_[A-Za-z0-9_-]{43}$")) and
              .request == $expected_request[0] and
              ((.request | tojson | @base64) | type == "string") and
              (.issued_at_unix | type == "number") and (.expires_at_unix | type == "number") and
              .issued_at_unix <= $now and .expires_at_unix >= $now and
              (.expires_at_unix - .issued_at_unix) <= 300
            ' "$grant" >/dev/null
          test "$(jq --sort-keys .request "$grant" | sha256sum | awk '{print $1}')" = "$request_sha"
          jq --exit-status --arg grant "$GRANT_SHA256" --arg request "$request_sha" \
            --slurpfile capability "$grant" '
              .grant.sha256 == $grant and .grant.request_sha256 == $request and
              .grant.jti_sha256 == $capability[0].jti_sha256 and
              .grant.issued_at_unix == $capability[0].issued_at_unix and
              .grant.expires_at_unix == $capability[0].expires_at_unix
            ' "$lease" >/dev/null
          admin_token=$(jq --exit-status --raw-output '.admin_token' "$grant")
          [[ "$admin_token" =~ ^lwa_[A-Za-z0-9_-]{43}$ ]]
          jq --exit-status --arg core "$CANDIDATE_COMMIT" --arg javascript "$JAVASCRIPT_COMMIT" \
            --arg ios "$IOS_COMMIT" --arg android "$ANDROID_COMMIT" --arg react_native "$REACT_NATIVE_COMMIT" '
            (.repositories | map({key:.id,value:.commit}) | from_entries) ==
            {core:$core,javascript:$javascript,ios:$ios,android:$android,react_native:$react_native}' \
            "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" >/dev/null
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" \
            '.candidate_commit == $commit and .status == "passed" and .image.repository == "ghcr.io/latchway/latchway" and (.image.index_digest | test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" >/dev/null
          jq --arg gateway "$base_url" --slurpfile candidate "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" '
            (.repositories | map({key:.id,value:{commit:.commit,tag:.intended_tag,version:.version}}) | from_entries) as $repositories |
            {core_commit:$repositories.core.commit,core_release:.contract.core_release,
             contract_version:.contract.version,bundle_sha256:.contract.bundle_sha256,
             oci_image_digest:($candidate[0].image.repository+"@"+$candidate[0].image.index_digest),
             repositories:$repositories}' \
            "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" > "$RUNNER_TEMP/provider-identity.json"
          auth_config="$RUNNER_TEMP/provider-auth.curl"
          printf 'header = "Authorization: Bearer %s"\n' "$admin_token" > "$auth_config"
          chmod 600 "$auth_config"
          test "$(stat --format=%a "$auth_config")" = 600
          capture_start=$(date -u +%s)
          health_start=$capture_start
          health_status=$(curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            --max-time 30 --max-filesize 2097152 --request GET --header 'Accept: application/json' \
            --output "$capture/health.json" --write-out '%{http_code}' "$base_url/healthz")
          health_finish=$(date -u +%s)
          while (( health_finish <= health_start )); do
            sleep 1
            health_finish=$(date -u +%s)
          done
          test "$health_status" = 200
          self_test_start=$(date -u +%s)
          self_test_status=$(curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            --max-time 120 --max-filesize 2097152 --request POST --header 'Accept: application/json' \
            --header 'Content-Type: application/json' --config "$auth_config" \
            --data-binary @"$RUNNER_TEMP/provider-request.json" --output "$capture/self-test.json" \
            --write-out '%{http_code}' "$base_url/admin/v1/self-tests")
          self_test_finish=$(date -u +%s)
          while (( self_test_finish <= self_test_start )); do
            sleep 1
            self_test_finish=$(date -u +%s)
          done
          test "$self_test_status" = 202
          capture_finish=$self_test_finish
          for file in "$capture/health.json" "$capture/self-test.json"; do
            test -f "$file" && test ! -L "$file"
            size=$(stat --format=%s "$file")
            (( size >= 1 && size <= 2097152 ))
            jq --exit-status . "$file" >/dev/null
            if grep --binary-files=text --fixed-strings --quiet -- "$admin_token" "$file"; then
              echo "live-provider response contained the one-use grant" >&2
              exit 1
            fi
            if grep --binary-files=text --extended-regexp --quiet 'lwa_[A-Za-z0-9_-]{43}' "$file"; then
              echo "live-provider response contained an Admin credential shape" >&2
              exit 1
            fi
          done
          grant_expires=$(jq --exit-status --raw-output '.expires_at_unix' "$grant")
          [[ "$grant_expires" =~ ^[1-9][0-9]*$ ]]
          (( capture_finish <= grant_expires ))
          rm -f "$auth_config"
          unset admin_token
          "$finalize_hook" \
            --lease "$lease" --grant "$grant" --request "$RUNNER_TEMP/provider-request.json" \
            --health "$capture/health.json" --self-test "$capture/self-test.json" \
            --repository "$GITHUB_REPOSITORY" --core-commit "$CANDIDATE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job "$GITHUB_JOB" --audience latchway-live-provider/self-test \
            --runner-name "$RUNNER_NAME" \
            --output-receipt "$isolation/grant-consumption-receipt.json" \
            --output-receipt-signature "$isolation/grant-consumption-receipt.sig" \
            --output-teardown "$isolation/collector-teardown.json" \
            --output-teardown-signature "$isolation/collector-teardown.sig"
          test ! -e "$grant"
          trust_root="$isolation/collector-trust-root.pem"
          openssl dgst -sha256 -verify "$trust_root" \
            -signature "$isolation/grant-consumption-receipt.sig" \
            "$isolation/grant-consumption-receipt.json"
          openssl dgst -sha256 -verify "$trust_root" \
            -signature "$isolation/collector-teardown.sig" "$isolation/collector-teardown.json"
          lease_sha=$(sha256sum "$isolation/collector-lease.json" | awk '{print $1}')
          receipt_sha=$(sha256sum "$isolation/grant-consumption-receipt.json" | awk '{print $1}')
          health_sha=$(sha256sum "$capture/health.json" | awk '{print $1}')
          self_test_sha=$(sha256sum "$capture/self-test.json" | awk '{print $1}')
          jti_sha=$(jq --exit-status --raw-output '.grant.jti_sha256' "$isolation/collector-lease.json")
          receipt_time=$(date +%s)
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg commit "$CANDIDATE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg grant "$GRANT_SHA256" --arg jti "$jti_sha" --arg request "$request_sha" \
            --arg health "$health_sha" --arg self_test "$self_test_sha" --argjson now "$receipt_time" '
              (keys | sort) == ["audience","consumed","consumed_at_unix","consumption_count",
                "core_commit","grant_sha256","health_sha256","jti_sha256","repository","request_sha256",
                "revoked","run_attempt","run_id","schema_version","scope","self_test_sha256","single_use"] and
              .schema_version == "latchway.live-provider-grant-consumption.v1" and
              .repository == $repository and .core_commit == $commit and
              .run_id == $run_id and .run_attempt == $run_attempt and
              .audience == "latchway-live-provider/self-test" and .scope == "run_self_tests" and
              .grant_sha256 == $grant and .jti_sha256 == $jti and
              .single_use == true and .consumption_count == 1 and .consumed == true and
              .revoked == true and .request_sha256 == $request and
              .health_sha256 == $health and .self_test_sha256 == $self_test and
              (.consumed_at_unix | type == "number") and .consumed_at_unix <= $now
            ' "$isolation/grant-consumption-receipt.json" >/dev/null
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg commit "$CANDIDATE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" --arg runner "$RUNNER_NAME" --arg lease "$lease_sha" \
            --arg receipt "$receipt_sha" --arg health "$health_sha" --arg self_test "$self_test_sha" \
            --argjson now "$receipt_time" '
              (keys | sort) == ["core_commit","evidence_eligible","grant","health_sha256",
                "lease_sha256","network","receipt_sha256","receipt_verified","repository","runner",
                "schema_version","self_test_sha256","workflow"] and
              .schema_version == "latchway.live-provider-collector-teardown.v1" and
              .repository == $repository and .core_commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:$job,audience:"latchway-live-provider/self-test"} and
              .runner.name == $runner and .runner.deregistered == true and
              .runner.accepts_more_jobs == false and .runner.destroy_scheduled == true and
              .runner.destroy_deadline_unix >= $now and .runner.destroy_deadline_unix <= ($now + 600) and
              .grant == {single_use:true,consumption_count:1,zeroized:true,revoked:true} and
              .network == {gateway_egress_only:true,dns_pinned:true,tls_verified:true} and
              .receipt_verified == true and .evidence_eligible == true and
              .lease_sha256 == $lease and .receipt_sha256 == $receipt and
              .health_sha256 == $health and .self_test_sha256 == $self_test
            ' "$isolation/collector-teardown.json" >/dev/null
          completed=true
          format_time() { date -u -d "@$1" +%Y-%m-%dT%H:%M:%SZ; }
          jq --null-input --sort-keys \
            --slurpfile identity "$RUNNER_TEMP/provider-identity.json" \
            --slurpfile request "$RUNNER_TEMP/provider-request.json" \
            --arg source_sha256 "$(sha256sum "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" | cut -d' ' -f1)" \
            --arg candidate_sha256 "$(sha256sum "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" | cut -d' ' -f1)" \
            --arg gateway "$base_url" --arg request_sha256 "$(sha256sum "$RUNNER_TEMP/provider-request.json" | cut -d' ' -f1)" \
            --arg started_at "$(format_time "$capture_start")" --arg finished_at "$(format_time "$capture_finish")" \
            --arg health_sha256 "$(sha256sum "$capture/health.json" | cut -d' ' -f1)" \
            --argjson health_bytes "$(stat --format=%s "$capture/health.json")" \
            --arg health_started_at "$(format_time "$health_start")" --arg health_finished_at "$(format_time "$health_finish")" \
            --arg self_test_sha256 "$(sha256sum "$capture/self-test.json" | cut -d' ' -f1)" \
            --argjson self_test_bytes "$(stat --format=%s "$capture/self-test.json")" \
            --arg self_test_started_at "$(format_time "$self_test_start")" --arg self_test_finished_at "$(format_time "$self_test_finish")" \
            --arg lease_sha256 "$lease_sha" \
            --arg lease_signature_sha256 "$(sha256sum "$isolation/collector-lease.sig" | awk '{print $1}')" \
            --arg trust_root_sha256 "$(sha256sum "$isolation/collector-trust-root.pem" | awk '{print $1}')" \
            --arg receipt_sha256 "$receipt_sha" \
            --arg receipt_signature_sha256 "$(sha256sum "$isolation/grant-consumption-receipt.sig" | awk '{print $1}')" \
            --arg teardown_sha256 "$(sha256sum "$isolation/collector-teardown.json" | awk '{print $1}')" \
            --arg teardown_signature_sha256 "$(sha256sum "$isolation/collector-teardown.sig" | awk '{print $1}')" '
            {schema_version:1,kind:"latchway_live_provider_capture",candidate:$identity[0],
             source_sha256:$source_sha256,candidate_sha256:$candidate_sha256,gateway_origin:$gateway,
             request:$request[0],request_sha256:$request_sha256,started_at:$started_at,finished_at:$finished_at,
             collector_isolation:{schema_version:"latchway.live-provider-collector-isolation.v1",
               lease_sha256:$lease_sha256,lease_signature_sha256:$lease_signature_sha256,
               trust_root_sha256:$trust_root_sha256,receipt_sha256:$receipt_sha256,
               receipt_signature_sha256:$receipt_signature_sha256,
               teardown_sha256:$teardown_sha256,teardown_signature_sha256:$teardown_signature_sha256},
             files:[
               {path:"health.json",bytes:$health_bytes,sha256:$health_sha256,status_code:200,started_at:$health_started_at,finished_at:$health_finished_at},
               {path:"self-test.json",bytes:$self_test_bytes,sha256:$self_test_sha256,status_code:202,started_at:$self_test_started_at,finished_at:$self_test_finished_at}
             ]}' > "$capture/manifest.json"
          test -z "$(find "$capture" -type l -print -quit)"
          test "$(find "$capture" -type f | wc -l | tr -d ' ')" = 10
      - name: Retain only the sealed one-use provider capture without its grant
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-live-provider-capture-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-provider-capture
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  github_authority:
    if: github.ref == 'refs/heads/main' && (inputs.domain == 'supply_chain' || inputs.domain == 'public_tags' || inputs.domain == 'public_registries')
    needs: authenticate
    environment: release-evidence-github-read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: none
    steps:
      - name: Download authenticated candidate coordinates without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-authority-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authority
      - name: Require the fixed GitHub CLI verifier before capture
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<<"$version"
          test -n "$patch"
          (( major > 2 || (major == 2 && minor >= 97) ))
      - name: Capture the fixed GitHub authority set without candidate code
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_RELEASE_EVIDENCE_GITHUB_READ_TOKEN }}
          EVIDENCE_DOMAIN: ${{ inputs.domain }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
          IOS_COMMIT: ${{ inputs.ios_commit }}
          ANDROID_COMMIT: ${{ inputs.android_commit }}
          REACT_NATIVE_COMMIT: ${{ inputs.react_native_commit }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "${GH_TOKEN:-}"
          capture="$RUNNER_TEMP/github-authority"
          rows="$RUNNER_TEMP/github-authority-files.jsonl"
          identity="$RUNNER_TEMP/github-authority-identity.json"
          mkdir -p "$capture"
          : > "$rows"
          capture_start=$(date -u +%s)
          last_finished=$capture_start
          format_time() { date -u -d "@$1" +%Y-%m-%dT%H:%M:%SZ; }
          record_file() {
            local relative="$1" started="$2" finished="$3" maximum="$4" path="$capture/$relative" size digest
            test -f "$path" && test ! -L "$path"
            size=$(stat --format=%s "$path")
            (( size >= 1 && size <= maximum ))
            digest=$(sha256sum "$path" | cut -d' ' -f1)
            jq --null-input --compact-output --arg path "$relative" --argjson bytes "$size" \
              --arg sha256 "$digest" --arg started_at "$(format_time "$started")" \
              --arg finished_at "$(format_time "$finished")" \
              '{path:$path,bytes:$bytes,sha256:$sha256,started_at:$started_at,finished_at:$finished_at}' >> "$rows"
          }
          capture_command() {
            local relative="$1" maximum="$2" started finished
            shift 2
            mkdir -p "$(dirname "$capture/$relative")"
            started=$(date -u +%s)
            "$@" > "$capture/$relative"
            finished=$(date -u +%s)
            while (( finished <= started )); do
              sleep 1
              finished=$(date -u +%s)
            done
            (( finished <= last_finished )) || last_finished=$finished
            record_file "$relative" "$started" "$finished" "$maximum"
          }
          repository_name() {
            case "$1" in
              core) printf '%s' latchway ;;
              javascript) printf '%s' latchway-js ;;
              ios) printf '%s' latchway-ios-sdk ;;
              android) printf '%s' latchway-android ;;
              react_native) printf '%s' latchway-react-native-sdk ;;
              *) return 1 ;;
            esac
          }
          coordinate() {
            jq --raw-output --arg id "$1" --arg field "$2" '.repositories[] | select(.id == $id) | .[$field]' \
              "$RUNNER_TEMP/authority/source/latchway-cross-repository.json"
          }
          jq --exit-status --arg core "$CANDIDATE_COMMIT" --arg javascript "$JAVASCRIPT_COMMIT" \
            --arg ios "$IOS_COMMIT" --arg android "$ANDROID_COMMIT" --arg react_native "$REACT_NATIVE_COMMIT" '
            (.repositories | length) == 5 and
            ((.repositories | map(.id) | sort) == ["android","core","ios","javascript","react_native"]) and
            ((.repositories | map({key:.id,value:.commit}) | from_entries) ==
             {core:$core,javascript:$javascript,ios:$ios,android:$android,react_native:$react_native}) and
            all(.repositories[]; (.commit | test("^[0-9a-f]{40}$")) and
              (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$")) and
              .intended_tag == ("v" + .version))' \
            "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" >/dev/null
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" \
            '.candidate_commit == $commit and .status == "passed" and .image.repository == "ghcr.io/latchway/latchway" and (.image.index_digest | test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" >/dev/null
          jq --slurpfile candidate "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" '
            (.repositories | map({key:.id,value:{commit:.commit,tag:.intended_tag,version:.version}}) | from_entries) as $repositories |
            {core_commit:$repositories.core.commit,core_release:.contract.core_release,
             contract_version:.contract.version,bundle_sha256:.contract.bundle_sha256,
             oci_image_digest:($candidate[0].image.repository+"@"+$candidate[0].image.index_digest),
             repositories:$repositories}' \
            "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" > "$identity"
          if [[ "$EVIDENCE_DOMAIN" == supply_chain ]]; then
            image=$(jq --raw-output '.oci_image_digest' "$identity")
            capture_command supply-chain/github-provenance.json 2097152 \
              gh attestation verify "oci://$image" --repo Latchway/latchway \
              --signer-workflow Latchway/latchway/.github/workflows/release.yml \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json
          elif [[ "$EVIDENCE_DOMAIN" == public_tags ]]; then
            for id in core javascript ios android react_native; do
              repository="Latchway/$(repository_name "$id")"
              tag=$(coordinate "$id" intended_tag)
              root="public-tags/$id"
              capture_command "$root/tag-ref.json" 2097152 gh api --method GET "repos/$repository/git/ref/tags/$tag"
              tag_sha=$(jq --raw-output --arg tag "$tag" \
                'select(.ref == ("refs/tags/"+$tag) and .object.type == "tag") | .object.sha | select(test("^[0-9a-f]{40}$"))' \
                "$capture/$root/tag-ref.json")
              test -n "$tag_sha"
              capture_command "$root/tag-object.json" 2097152 gh api --method GET "repos/$repository/git/tags/$tag_sha"
              capture_command "$root/release.json" 2097152 gh api --method GET \
                -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$repository/releases/tags/$tag"
              capture_command "$root/release-attestation.json" 2097152 \
                gh release verify "$tag" --repo "$repository" --format json
            done
          elif [[ "$EVIDENCE_DOMAIN" == public_registries ]]; then
            capture_run() {
              local id="$1" repository="$2" run_id="$3" attempt="$4" relative
              [[ "$run_id" =~ ^[1-9][0-9]{0,19}$ && "$attempt" =~ ^[1-9][0-9]{0,5}$ ]]
              relative="public-registries/$id/runs/$run_id-$attempt.json"
              test -e "$capture/$relative" && return 0
              capture_command "$relative" 2097152 gh api --method GET \
                "repos/$repository/actions/runs/$run_id/attempts/$attempt"
            }
            requires_subject_attestation() {
              local id="$1" name="$2"
              case "$id:$name" in
                javascript:latchway-client-*.tgz|javascript:package-evidence.json|javascript:build-reproducibility.json|javascript:npm-registry-version.json|javascript:npm-registry-view.json|javascript:npm-attestations.json|javascript:npm-audit-signatures.json|javascript:npm-registry-evidence-manifest.json|javascript:post-publish-evidence.json|javascript:npm-release-adoption-*.json) return 0 ;;
                react_native:latchway-react-native-*.tgz|react_native:package-evidence.json|react_native:build-reproducibility.json|react_native:published-dependency-evidence.json|react_native:npm-registry-version.json|react_native:npm-registry-view.json|react_native:npm-attestations.json|react_native:npm-audit-signatures.json|react_native:npm-registry-evidence-manifest.json|react_native:post-publish-evidence.json|react_native:npm-release-adoption-*.json) return 0 ;;
                ios:latchway-ios-sdk-*.tar.gz|ios:cocoapods-published-podspec.json|ios:cocoapods-reviewed-podspec.json|ios:cocoapods-release-evidence.json|ios:cocoapods-release-evidence.SHA256SUMS) return 0 ;;
                android:*) return 0 ;;
                *) return 1 ;;
              esac
            }
            for id in javascript react_native ios android; do
              repository="Latchway/$(repository_name "$id")"
              tag=$(coordinate "$id" intended_tag)
              commit=$(coordinate "$id" commit)
              root="public-registries/$id"
              capture_command "$root/release.json" 2097152 gh api --method GET \
                -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$repository/releases/tags/$tag"
              asset_count=$(jq '.assets | length' "$capture/$root/release.json")
              (( asset_count >= 1 && asset_count <= 64 ))
              while IFS= read -r asset; do
                name=$(jq --raw-output '.name' <<<"$asset")
                asset_id=$(jq --raw-output '.id' <<<"$asset")
                size=$(jq --raw-output '.size' <<<"$asset")
                digest=$(jq --raw-output '.digest' <<<"$asset")
                [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
                [[ "$asset_id" =~ ^[1-9][0-9]*$ && "$size" =~ ^[1-9][0-9]*$ && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                (( size <= 33554432 ))
                capture_command "$root/assets/$name" 33554432 gh api --method GET \
                  -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id"
                test "$(stat --format=%s "$capture/$root/assets/$name")" = "$size"
                test "sha256:$(sha256sum "$capture/$root/assets/$name" | cut -d' ' -f1)" = "$digest"
                capture_command "$root/immutable/$name.json" 2097152 \
                  gh release verify-asset "$tag" "$capture/$root/assets/$name" --repo "$repository" --format json
                if requires_subject_attestation "$id" "$name"; then
                  capture_command "$root/attestations/$name.json" 2097152 \
                    gh attestation verify "$capture/$root/assets/$name" --repo "$repository" \
                    --signer-workflow "$repository/.github/workflows/release.yml" \
                    --source-digest "$commit" --signer-digest "$commit" --source-ref refs/heads/main \
                    --deny-self-hosted-runners --format json
                fi
              done < <(jq --compact-output '.assets[]' "$capture/$root/release.json")
              if [[ "$id" == javascript || "$id" == react_native ]]; then
                attestation="$capture/$root/assets/npm-attestations.json"
                test -f "$attestation"
                provenance_count=$(jq '[.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1")] | length' "$attestation")
                test "$provenance_count" = 1
                invocation=$(jq --raw-output '.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle.dsseEnvelope.payload' "$attestation" \
                  | base64 --decode | jq --raw-output '.predicate.runDetails.metadata.invocationId')
                [[ "$invocation" =~ ^https://github.com/$repository/actions/runs/([1-9][0-9]*)/attempts/([1-9][0-9]*)$ ]]
                provenance_run_id=${BASH_REMATCH[1]}
                provenance_run_attempt=${BASH_REMATCH[2]}
                capture_run "$id" "$repository" "$provenance_run_id" "$provenance_run_attempt"
                shopt -s nullglob
                adoptions=("$capture/$root/assets"/npm-release-adoption-*.json)
                (( ${#adoptions[@]} >= 1 ))
                for adoption in "${adoptions[@]}"; do
                  name=$(basename "$adoption")
                  [[ "$name" =~ ^npm-release-adoption-([1-9][0-9]*)-([1-9][0-9]*)\.json$ ]]
                  asset_run_id=${BASH_REMATCH[1]}
                  asset_run_attempt=${BASH_REMATCH[2]}
                  run_id=$(jq --raw-output '.adoption.run_id' "$adoption")
                  attempt=$(jq --raw-output '.adoption.run_attempt' "$adoption")
                  test "$run_id" = "$asset_run_id" && test "$attempt" = "$asset_run_attempt"
                  capture_run "$id" "$repository" "$run_id" "$attempt"
                done
                shopt -u nullglob
              fi
            done
          else
            exit 1
          fi
          capture_finish=$(date -u +%s)
          while (( capture_finish <= capture_start )); do
            sleep 1
            capture_finish=$(date -u +%s)
          done
          (( capture_finish >= last_finished )) || capture_finish=$last_finished
          jq --slurp --sort-keys \
            --slurpfile identity "$identity" --arg domain "$EVIDENCE_DOMAIN" \
            --arg source_sha256 "$(sha256sum "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" | cut -d' ' -f1)" \
            --arg candidate_sha256 "$(sha256sum "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" | cut -d' ' -f1)" \
            --arg started_at "$(format_time "$capture_start")" --arg finished_at "$(format_time "$capture_finish")" '
            {schema_version:1,kind:"latchway_github_authority",domain:$domain,candidate:$identity[0],
             source_sha256:$source_sha256,candidate_sha256:$candidate_sha256,
             started_at:$started_at,finished_at:$finished_at,files:sort_by(.path)}' \
            "$rows" > "$capture/manifest.json"
          test -z "$(find "$capture" -type l -print -quit)"
          file_count=$(find "$capture" -type f | wc -l | tr -d ' ')
          manifest_count=$(jq '.files | length' "$capture/manifest.json")
          test "$file_count" = "$((manifest_count + 1))"
          (( file_count <= 257 ))
          total=$(du -sk "$capture" | cut -f1)
          (( total <= 131072 ))
      - name: Retain only the exact authenticated GitHub authority manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-github-authority-${{ inputs.domain }}-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-authority
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sources:
    if: github.ref == 'refs/heads/main'
    environment: release-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact core candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          path: latchway
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact JavaScript SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-js
          token: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
          ref: ${{ inputs.javascript_commit }}
          path: latchway-js
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact iOS SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-ios-sdk
          token: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
          ref: ${{ inputs.ios_commit }}
          path: latchway-ios-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact Android SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-android
          token: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
          ref: ${{ inputs.android_commit }}
          path: latchway-android
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-react-native-sdk
          token: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
          ref: ${{ inputs.react_native_commit }}
          path: latchway-react-native-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and archive exact credential-free source trees
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
          IOS_COMMIT: ${{ inputs.ios_commit }}
          ANDROID_COMMIT: ${{ inputs.android_commit }}
          REACT_NATIVE_COMMIT: ${{ inputs.react_native_commit }}
        run: |
          set -Eeuo pipefail
          test "$(git -C latchway rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C latchway-js rev-parse --verify HEAD)" = "$JAVASCRIPT_COMMIT"
          test "$(git -C latchway-ios-sdk rev-parse --verify HEAD)" = "$IOS_COMMIT"
          test "$(git -C latchway-android rev-parse --verify HEAD)" = "$ANDROID_COMMIT"
          test "$(git -C latchway-react-native-sdk rev-parse --verify HEAD)" = "$REACT_NATIVE_COMMIT"
          tar --format=posix -czf "$RUNNER_TEMP/source-inputs.tar.gz" \
            latchway latchway-js latchway-ios-sdk latchway-android latchway-react-native-sdk
      - name: Retain source trees without repository credentials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-domain-sources-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-inputs.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  physical_authority:
    if: github.ref == 'refs/heads/main' && (inputs.domain == 'live_sdk_conformance' || inputs.domain == 'physical_devices')
    needs: authenticate
    environment: release-evidence-physical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a fixed GitHub CLI verifier without candidate code
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<<"$version"
          test -n "$patch"
          (( major > 2 || (major == 2 && minor >= 97) ))
          # Equivalent policy owner: scripts/require-gh-version.py
      - name: Download exact iOS physical evidence receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-attest-physical-${{ inputs.ios_physical_run_id }}-${{ inputs.ios_physical_run_attempt }}
          path: ${{ runner.temp }}/physical/ios
          repository: Latchway/latchway-ios-sdk
          run-id: ${{ inputs.ios_physical_run_id }}
          github-token: ${{ secrets.LATCHWAY_RELEASE_EVIDENCE_ACTIONS_READ_TOKEN }}
      - name: Download exact Android physical evidence receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: play-integrity-physical-${{ inputs.android_physical_run_id }}-${{ inputs.android_physical_run_attempt }}
          path: ${{ runner.temp }}/physical/android
          repository: Latchway/latchway-android
          run-id: ${{ inputs.android_physical_run_id }}
          github-token: ${{ secrets.LATCHWAY_RELEASE_EVIDENCE_ACTIONS_READ_TOKEN }}
      - name: Download exact React Native iOS physical evidence receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: react-native-ios-physical-${{ inputs.react_native_physical_run_id }}-${{ inputs.react_native_physical_run_attempt }}
          path: ${{ runner.temp }}/physical/react-native-ios
          repository: Latchway/latchway-react-native-sdk
          run-id: ${{ inputs.react_native_physical_run_id }}
          github-token: ${{ secrets.LATCHWAY_RELEASE_EVIDENCE_ACTIONS_READ_TOKEN }}
      - name: Download exact React Native Android physical evidence receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: react-native-android-physical-${{ inputs.react_native_physical_run_id }}-${{ inputs.react_native_physical_run_attempt }}
          path: ${{ runner.temp }}/physical/react-native-android
          repository: Latchway/latchway-react-native-sdk
          run-id: ${{ inputs.react_native_physical_run_id }}
          github-token: ${{ secrets.LATCHWAY_RELEASE_EVIDENCE_ACTIONS_READ_TOKEN }}
      - name: Authenticate physical runs, artifacts, and subject attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_RELEASE_EVIDENCE_ACTIONS_READ_TOKEN }}
          IOS_COMMIT: ${{ inputs.ios_commit }}
          ANDROID_COMMIT: ${{ inputs.android_commit }}
          REACT_NATIVE_COMMIT: ${{ inputs.react_native_commit }}
          IOS_RUN_ID: ${{ inputs.ios_physical_run_id }}
          IOS_RUN_ATTEMPT: ${{ inputs.ios_physical_run_attempt }}
          ANDROID_RUN_ID: ${{ inputs.android_physical_run_id }}
          ANDROID_RUN_ATTEMPT: ${{ inputs.android_physical_run_attempt }}
          REACT_NATIVE_RUN_ID: ${{ inputs.react_native_physical_run_id }}
          REACT_NATIVE_RUN_ATTEMPT: ${{ inputs.react_native_physical_run_attempt }}
        run: |
          set -Eeuo pipefail
          authority="$RUNNER_TEMP/physical-authority"
          mkdir -p "$authority"
          authenticate_run() {
            local slug="$1" repository="$2" workflow="$3" commit="$4" run_id="$5" attempt="$6"
            gh api "repos/$repository/actions/runs/$run_id/attempts/$attempt" > "$authority/$slug-run.json"
            jq --exit-status --arg repository "$repository" --arg workflow "$workflow" --arg commit "$commit" \
              --argjson run_id "$run_id" --argjson attempt "$attempt" \
              '.id == $run_id and .run_attempt == $attempt and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .path == $workflow and .repository.full_name == $repository and .head_repository.full_name == $repository' \
              "$authority/$slug-run.json" >/dev/null
          }
          authenticate_artifact() {
            local slug="$1" repository="$2" commit="$3" run_id="$4" name="$5"
            gh api "repos/$repository/actions/runs/$run_id/artifacts?name=$name&per_page=100" > "$authority/$slug-artifact.json"
            jq --exit-status --arg repository "$repository" --arg commit "$commit" --arg name "$name" --argjson run_id "$run_id" \
              '.total_count == 1 and (.artifacts | length) == 1 and .artifacts[0].name == $name and .artifacts[0].expired == false and .artifacts[0].workflow_run.id == $run_id and .artifacts[0].workflow_run.head_sha == $commit and .artifacts[0].archive_download_url == ("https://api.github.com/repos/" + $repository + "/actions/artifacts/" + (.artifacts[0].id | tostring) + "/zip")' \
              "$authority/$slug-artifact.json" >/dev/null
          }
          verify_receipt() {
            local slug="$1" root="$2" repository="$3" workflow="$4" commit="$5" profile="$6" evidence="$7"
            for subject in "$profile" "$evidence" SHA256SUMS; do
              subject_slug=$(printf '%s' "$subject" | tr '[:upper:].' '[:lower:]-')
              gh attestation verify "$root/$subject" --bundle "$root/github-attestation.sigstore.json" \
                --repo "$repository" --signer-workflow "$repository/$workflow" \
                --source-digest "$commit" --signer-digest "$commit" --source-ref refs/heads/main \
                --format json > "$authority/$slug-$subject_slug-attestation.json"
            done
          }
          authenticate_run ios Latchway/latchway-ios-sdk .github/workflows/physical-app-attest.yml "$IOS_COMMIT" "$IOS_RUN_ID" "$IOS_RUN_ATTEMPT"
          authenticate_run android Latchway/latchway-android .github/workflows/physical-play-integrity.yml "$ANDROID_COMMIT" "$ANDROID_RUN_ID" "$ANDROID_RUN_ATTEMPT"
          authenticate_run react-native Latchway/latchway-react-native-sdk .github/workflows/physical-device-evidence.yml "$REACT_NATIVE_COMMIT" "$REACT_NATIVE_RUN_ID" "$REACT_NATIVE_RUN_ATTEMPT"
          authenticate_artifact ios Latchway/latchway-ios-sdk "$IOS_COMMIT" "$IOS_RUN_ID" "app-attest-physical-$IOS_RUN_ID-$IOS_RUN_ATTEMPT"
          authenticate_artifact android Latchway/latchway-android "$ANDROID_COMMIT" "$ANDROID_RUN_ID" "play-integrity-physical-$ANDROID_RUN_ID-$ANDROID_RUN_ATTEMPT"
          authenticate_artifact react-native-ios Latchway/latchway-react-native-sdk "$REACT_NATIVE_COMMIT" "$REACT_NATIVE_RUN_ID" "react-native-ios-physical-$REACT_NATIVE_RUN_ID-$REACT_NATIVE_RUN_ATTEMPT"
          authenticate_artifact react-native-android Latchway/latchway-react-native-sdk "$REACT_NATIVE_COMMIT" "$REACT_NATIVE_RUN_ID" "react-native-android-physical-$REACT_NATIVE_RUN_ID-$REACT_NATIVE_RUN_ATTEMPT"
          verify_receipt ios "$RUNNER_TEMP/physical/ios" Latchway/latchway-ios-sdk .github/workflows/physical-app-attest.yml "$IOS_COMMIT" app-attest-profile.json app-attest-evidence.json
          verify_receipt android "$RUNNER_TEMP/physical/android" Latchway/latchway-android .github/workflows/physical-play-integrity.yml "$ANDROID_COMMIT" play-integrity-profile.json play-integrity-evidence.json
          verify_receipt react-native-ios "$RUNNER_TEMP/physical/react-native-ios" Latchway/latchway-react-native-sdk .github/workflows/physical-device-evidence.yml "$REACT_NATIVE_COMMIT" react-native-ios-profile.json react-native-ios-evidence.json
          verify_receipt react-native-android "$RUNNER_TEMP/physical/react-native-android" Latchway/latchway-react-native-sdk .github/workflows/physical-device-evidence.yml "$REACT_NATIVE_COMMIT" react-native-android-profile.json react-native-android-evidence.json
      - name: Retain authenticated physical receipts without the read token
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-domain-physical-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/physical
            ${{ runner.temp }}/physical-authority
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  javascript_harness:
    if: github.ref == 'refs/heads/main' && inputs.domain == 'live_sdk_conformance'
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Download exact source trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-sources-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sources
      - name: Extract exact source trees
        run: tar -xzf "$RUNNER_TEMP/sources/source-inputs.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: latchway-js/pnpm-lock.yaml
      - name: Build the exact JavaScript SDK live harness
        working-directory: latchway-js
        env:
          CORE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --verify HEAD)" = "$JAVASCRIPT_COMMIT"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          tar --format=posix -czf "$RUNNER_TEMP/javascript-harness.tar.gz" .
          harness_sha=$(sha256sum "$RUNNER_TEMP/javascript-harness.tar.gz" | awk '{print $1}')
          source_sha=$(sha256sum "$RUNNER_TEMP/sources/source-inputs.tar.gz" | awk '{print $1}')
          jq --null-input --sort-keys \
            --arg repository Latchway/latchway-js \
            --arg core_commit "$CORE_COMMIT" --arg javascript_commit "$JAVASCRIPT_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_sha256 "$source_sha" --arg harness_sha256 "$harness_sha" \
            --argjson harness_bytes "$(stat --format=%s "$RUNNER_TEMP/javascript-harness.tar.gz")" \
            '{schema_version:"latchway.live-sdk-harness.v1",repository:$repository,
              core_commit:$core_commit,javascript_commit:$javascript_commit,
              workflow:{run_id:$run_id,run_attempt:$run_attempt},
              source_archive_sha256:$source_sha256,harness_archive_sha256:$harness_sha256,
              harness_bytes:$harness_bytes}' > "$RUNNER_TEMP/javascript-harness-manifest.json"
      - name: Retain the built harness for fresh provider runners
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-javascript-harness-${{ inputs.javascript_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/javascript-harness.tar.gz
            ${{ runner.temp }}/javascript-harness-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  javascript_collect:
    name: Isolated live JavaScript / ${{ matrix.provider }}
    if: github.ref == 'refs/heads/main' && inputs.domain == 'live_sdk_conformance'
    needs: [authenticate, javascript_harness]
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: firebase_app_check
            audience: firebase-app-check
            environment: release-evidence-firebase-app-check
            runner_label: latchway-live-sdk-firebase
            runner_slug: firebase
          - provider: turnstile
            audience: turnstile
            environment: release-evidence-turnstile
            runner_label: latchway-live-sdk-turnstile
            runner_slug: turnstile
    environment: ${{ matrix.environment }}
    runs-on: [self-hosted, linux, x64, latchway-live-sdk, latchway-ephemeral-jit, "${{ matrix.runner_label }}"]
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Download authenticated candidate inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-authority-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authority
      - name: Download the credential-free built JavaScript harness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-javascript-harness-${{ inputs.javascript_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness
      - name: Verify the signed fresh one-job collector lease before receiving the capability
        shell: bash
        env:
          COLLECTOR_TRUST_ROOT_PEM: ${{ vars.LATCHWAY_LIVE_SDK_COLLECTOR_TRUST_ROOT_PEM }}
          COLLECTOR_TRUST_ROOT_SHA256: ${{ vars.LATCHWAY_LIVE_SDK_COLLECTOR_TRUST_ROOT_SHA256 }}
          GATEWAY_RECEIPT_PUBLIC_KEY_PEM: ${{ vars.LATCHWAY_GATEWAY_EVIDENCE_PUBLIC_KEY_PEM }}
          GATEWAY_RECEIPT_PUBLIC_KEY_SHA256: ${{ vars.LATCHWAY_GATEWAY_EVIDENCE_PUBLIC_KEY_SHA256 }}
          GRANT_SHA256: ${{ vars.LATCHWAY_LIVE_SDK_GRANT_SHA256 }}
          CORE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
          PROVIDER: ${{ matrix.provider }}
          AUDIENCE: ${{ matrix.audience }}
          RUNNER_SLUG: ${{ matrix.runner_slug }}
          LATCHWAY_BASE_URL: ${{ vars.LATCHWAY_LIVE_GATEWAY_BASE_URL }}
          LATCHWAY_LIVE_SDK_APPLICATION_ID: ${{ vars.LATCHWAY_LIVE_SDK_APPLICATION_ID }}
          LATCHWAY_LIVE_SDK_ENVIRONMENT: ${{ vars.LATCHWAY_LIVE_SDK_ENVIRONMENT }}
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_NAME" = "latchway-live-sdk-${RUNNER_SLUG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -print -quit)"
          lease=/etc/latchway/live-sdk-collector/lease.json
          signature=/etc/latchway/live-sdk-collector/lease.sig
          run_hook=/usr/local/libexec/latchway-live-sdk-collector-run
          finalize_hook=/usr/local/libexec/latchway-live-sdk-collector-finalize
          for path in "$lease" "$signature" "$run_hook" "$finalize_hook"; do
            test -f "$path" && test ! -L "$path"
            test "$(stat -c '%U' "$path")" = root
            mode=$(stat -c '%a' "$path")
            (( (8#$mode & 0022) == 0 ))
          done
          root="$RUNNER_TEMP/javascript-capture"
          isolation="$root/${PROVIDER}-isolation"
          install -d -m 0700 "$root" "$isolation"
          trust_root="$RUNNER_TEMP/live-sdk-collector-trust-root.pem"
          gateway_key="$RUNNER_TEMP/live-sdk-gateway-receipt-key.pem"
          umask 077
          printf '%s\n' "$COLLECTOR_TRUST_ROOT_PEM" > "$trust_root"
          printf '%s\n' "$GATEWAY_RECEIPT_PUBLIC_KEY_PEM" > "$gateway_key"
          for value in "$COLLECTOR_TRUST_ROOT_SHA256" "$GATEWAY_RECEIPT_PUBLIC_KEY_SHA256" "$GRANT_SHA256"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          test "$(sha256sum "$trust_root" | awk '{print $1}')" = "$COLLECTOR_TRUST_ROOT_SHA256"
          test "$(sha256sum "$gateway_key" | awk '{print $1}')" = "$GATEWAY_RECEIPT_PUBLIC_KEY_SHA256"
          openssl dgst -sha256 -verify "$trust_root" -signature "$signature" "$lease"
          test "$(find "$RUNNER_TEMP/harness" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          test -z "$(find "$RUNNER_TEMP/harness" -mindepth 1 ! -type f -print -quit)"
          manifest="$RUNNER_TEMP/harness/javascript-harness-manifest.json"
          harness="$RUNNER_TEMP/harness/javascript-harness.tar.gz"
          harness_sha=$(sha256sum "$harness" | awk '{print $1}')
          manifest_sha=$(sha256sum "$manifest" | awk '{print $1}')
          source_sha=$(sha256sum "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" | awk '{print $1}')
          candidate_sha=$(sha256sum "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" | awk '{print $1}')
          jq --exit-status --arg core "$CORE_COMMIT" --arg javascript "$JAVASCRIPT_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg harness "$harness_sha" '
              .schema_version == "latchway.live-sdk-harness.v1" and
              .repository == "Latchway/latchway-js" and .core_commit == $core and
              .javascript_commit == $javascript and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt} and
              .harness_archive_sha256 == $harness and
              (.source_archive_sha256 | test("^[0-9a-f]{64}$")) and
              (.harness_bytes | type == "number" and . > 0 and . <= 536870912)
            ' "$manifest" >/dev/null
          now=$(date +%s)
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" --arg core "$CORE_COMMIT" \
            --arg javascript "$JAVASCRIPT_COMMIT" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg runner "$RUNNER_NAME" --arg provider "$PROVIDER" --arg audience "$AUDIENCE" \
            --arg grant "$GRANT_SHA256" --arg harness "$harness_sha" \
            --arg manifest "$manifest_sha" --arg source "$source_sha" \
            --arg candidate "$candidate_sha" --arg gateway "$LATCHWAY_BASE_URL" \
            --arg application "$LATCHWAY_LIVE_SDK_APPLICATION_ID" \
            --arg environment "$LATCHWAY_LIVE_SDK_ENVIRONMENT" --argjson now "$now" '
              .schema_version == "latchway.live-sdk-collector-lease.v1" and
              .repository == $repository and .core_commit == $core and
              .javascript_commit == $javascript and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:$job,audience:$audience} and
              .runner.name == $runner and .runner.ephemeral == true and .runner.jit == true and
              .runner.max_jobs == 1 and .runner.fresh_boot == true and
              .runner.clean_workspace == true and .runner.repository_scope == $repository and
              .runner.destroy_after_job == true and (.runner.image_digest | test("^sha256:[0-9a-f]{64}$")) and
              (.runner.boot_id_sha256 | test("^[0-9a-f]{64}$")) and
              .credentials == {long_lived:false,organization:false,administration:false,registry:false,oidc:false} and
              .supervisor == {private_key_isolated:true,caller_supplied_claims_accepted:false,
                gateway_egress_only:true,dns_pinned:true,tls_verified:true,
                gateway_run_receipt_verification:true,one_use_invocation:true} and
              .grant.audience == ("latchway-live-sdk/" + $provider) and
              .grant.core_commit == $core and .grant.javascript_commit == $javascript and
              .grant.run_id == $run_id and .grant.run_attempt == $run_attempt and
              .grant.provider == $provider and .grant.sha256 == $grant and
              .grant.single_use == true and (.grant.jti_sha256 | test("^[0-9a-f]{64}$")) and
              (.grant.request_sha256 | test("^[0-9a-f]{64}$")) and
              .candidate == {harness_archive_sha256:$harness,harness_manifest_sha256:$manifest,
                source_report_sha256:$source,candidate_manifest_sha256:$candidate} and
              .gateway == {origin:$gateway,application_id:$application,environment:$environment} and
              (.issued_at_unix | type == "number") and (.expires_at_unix | type == "number") and
              .issued_at_unix <= $now and .expires_at_unix >= $now and
              (.expires_at_unix - .issued_at_unix) <= 300
            ' "$lease" >/dev/null
          install -m 0600 "$lease" "$isolation/collector-lease.json"
          install -m 0600 "$signature" "$isolation/collector-lease.sig"
          install -m 0600 "$manifest" "$isolation/harness-manifest.json"
          install -m 0600 "$gateway_key" "$isolation/gateway-receipt-public-key.pem"
      - name: Execute the candidate only through the gateway-isolated one-use supervisor
        id: collect
        shell: bash
        env:
          ONE_TIME_GRANT: ${{ secrets.LATCHWAY_ONE_TIME_LIVE_SDK_GRANT }}
          GRANT_SHA256: ${{ vars.LATCHWAY_LIVE_SDK_GRANT_SHA256 }}
          CORE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
          PROVIDER: ${{ matrix.provider }}
          LATCHWAY_BASE_URL: ${{ vars.LATCHWAY_LIVE_GATEWAY_BASE_URL }}
          LATCHWAY_LIVE_SDK_APPLICATION_ID: ${{ vars.LATCHWAY_LIVE_SDK_APPLICATION_ID }}
          LATCHWAY_LIVE_SDK_FEATURE: ${{ vars.LATCHWAY_LIVE_SDK_FEATURE }}
          LATCHWAY_LIVE_SDK_ERROR_MAPPING_FEATURE: ${{ vars.LATCHWAY_LIVE_SDK_ERROR_MAPPING_FEATURE }}
          LATCHWAY_LIVE_SDK_ENVIRONMENT: ${{ vars.LATCHWAY_LIVE_SDK_ENVIRONMENT }}
          LATCHWAY_LIVE_SDK_IDENTITY_PROVIDER: ${{ vars.LATCHWAY_LIVE_SDK_IDENTITY_PROVIDER }}
          LATCHWAY_LIVE_SDK_MODEL: ${{ vars.LATCHWAY_LIVE_SDK_MODEL }}
        run: |
          set -Eeuo pipefail
          test -n "$ONE_TIME_GRANT"
          grant="$RUNNER_TEMP/latchway-live-sdk-grant.json"
          umask 077
          printf '%s' "$ONE_TIME_GRANT" > "$grant"
          unset ONE_TIME_GRANT
          test "$(sha256sum "$grant" | awk '{print $1}')" = "$GRANT_SHA256"
          request_sha=$(jq --sort-keys --compact-output '.request' "$grant" | sha256sum | awk '{print $1}')
          now=$(date +%s)
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" --arg core "$CORE_COMMIT" \
            --arg javascript "$JAVASCRIPT_COMMIT" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg provider "$PROVIDER" \
            --arg audience "latchway-live-sdk/$PROVIDER" --arg gateway "$LATCHWAY_BASE_URL" \
            --arg application "$LATCHWAY_LIVE_SDK_APPLICATION_ID" \
            --arg environment "$LATCHWAY_LIVE_SDK_ENVIRONMENT" \
            --arg identity_provider "$LATCHWAY_LIVE_SDK_IDENTITY_PROVIDER" \
            --arg feature "$LATCHWAY_LIVE_SDK_FEATURE" \
            --arg error_feature "$LATCHWAY_LIVE_SDK_ERROR_MAPPING_FEATURE" \
            --arg model "$LATCHWAY_LIVE_SDK_MODEL" --argjson now "$now" '
              (keys | sort) == ["attestation_token","audience","core_commit","expires_at_unix",
                "identity_token","issued_at_unix","javascript_commit","jti_sha256","provider",
                "repository","request","run_attempt","run_id","schema_version","single_use"] and
              .schema_version == "latchway.live-sdk-one-use-grant.v1" and
              .repository == $repository and .core_commit == $core and
              .javascript_commit == $javascript and .run_id == $run_id and
              .run_attempt == $run_attempt and .provider == $provider and
              .audience == $audience and .single_use == true and
              (.jti_sha256 | test("^[0-9a-f]{64}$")) and
              .request == {gateway_origin:$gateway,application_id:$application,
                environment:$environment,identity_provider:$identity_provider,
                feature:$feature,error_mapping_feature:$error_feature,model:$model,
                nonce_sha256:.request.nonce_sha256} and
              (.request.nonce_sha256 | test("^[0-9a-f]{64}$")) and
              (.identity_token | type == "string" and length > 0 and length <= 16384) and
              (.attestation_token | type == "string" and length > 0 and length <= 16384) and
              (.issued_at_unix | type == "number") and (.expires_at_unix | type == "number") and
              .issued_at_unix <= $now and .expires_at_unix >= $now and
              (.expires_at_unix - .issued_at_unix) <= 300
            ' "$grant" >/dev/null
          test "$(jq -r '.grant.request_sha256' /etc/latchway/live-sdk-collector/lease.json)" = "$request_sha"
          root="$RUNNER_TEMP/javascript-capture"
          isolation="$root/${PROVIDER}-isolation"
          jq -n -S --argjson started_at_unix "$now" '{started_at_unix:$started_at_unix}' > "$isolation/execution.json"
          /usr/local/libexec/latchway-live-sdk-collector-run \
            --lease /etc/latchway/live-sdk-collector/lease.json \
            --harness-archive "$RUNNER_TEMP/harness/javascript-harness.tar.gz" \
            --harness-manifest "$RUNNER_TEMP/harness/javascript-harness-manifest.json" \
            --source-report "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" \
            --candidate-manifest "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" \
            --grant "$grant" --provider "$PROVIDER" --gateway "$LATCHWAY_BASE_URL" \
            --output-report "$root/${PROVIDER}-report.json" \
            --output-gateway-receipt "$isolation/gateway-consumption-receipt.json" \
            --output-gateway-signature "$isolation/gateway-consumption-receipt.sig"
          finished=$(date +%s)
          while (( finished <= now )); do sleep 1; finished=$(date +%s); done
          jq --argjson finished_at_unix "$finished" '. + {finished_at_unix:$finished_at_unix}' \
            "$isolation/execution.json" > "$isolation/execution.updated.json"
          mv "$isolation/execution.updated.json" "$isolation/execution.json"
      - name: Unconditionally zero the grant, deregister, and arm collector destruction
        if: ${{ always() }}
        shell: bash
        env:
          CORE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
          PROVIDER: ${{ matrix.provider }}
          AUDIENCE: ${{ matrix.audience }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/javascript-capture"
          isolation="$root/${PROVIDER}-isolation"
          grant="$RUNNER_TEMP/latchway-live-sdk-grant.json"
          /usr/local/libexec/latchway-live-sdk-collector-finalize \
            --lease /etc/latchway/live-sdk-collector/lease.json \
            --repository "$GITHUB_REPOSITORY" --core-commit "$CORE_COMMIT" \
            --javascript-commit "$JAVASCRIPT_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --job "$GITHUB_JOB" --audience "$AUDIENCE" \
            --runner-name "$RUNNER_NAME" --provider "$PROVIDER" --grant "$grant" \
            --execution "$isolation/execution.json" --report "$root/${PROVIDER}-report.json" \
            --gateway-receipt "$isolation/gateway-consumption-receipt.json" \
            --gateway-signature "$isolation/gateway-consumption-receipt.sig" \
            --output-json "$isolation/collector-teardown.json" \
            --output-signature "$isolation/collector-teardown.sig"
          test ! -e "$grant"
          trust_root="$RUNNER_TEMP/live-sdk-collector-trust-root.pem"
          gateway_key="$RUNNER_TEMP/live-sdk-gateway-receipt-key.pem"
          openssl dgst -sha256 -verify "$trust_root" \
            -signature "$isolation/collector-teardown.sig" "$isolation/collector-teardown.json"
          openssl dgst -sha256 -verify "$gateway_key" \
            -signature "$isolation/gateway-consumption-receipt.sig" "$isolation/gateway-consumption-receipt.json"
          lease_sha=$(sha256sum "$isolation/collector-lease.json" | awk '{print $1}')
          receipt_sha=$(sha256sum "$isolation/gateway-consumption-receipt.json" | awk '{print $1}')
          report_sha=$(sha256sum "$root/${PROVIDER}-report.json" | awk '{print $1}')
          grant_sha=$(jq -r '.grant.sha256' "$isolation/collector-lease.json")
          jti_sha=$(jq -r '.grant.jti_sha256' "$isolation/collector-lease.json")
          now=$(date +%s)
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg core "$CORE_COMMIT" \
            --arg javascript "$JAVASCRIPT_COMMIT" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg provider "$PROVIDER" \
            --arg grant "$grant_sha" --arg jti "$jti_sha" --arg report "$report_sha" '
              .schema_version == "latchway.live-sdk-gateway-consumption.v1" and
              .repository == $repository and .core_commit == $core and
              .javascript_commit == $javascript and .run_id == $run_id and
              .run_attempt == $run_attempt and .provider == $provider and
              .grant_sha256 == $grant and .jti_sha256 == $jti and
              .single_use == true and .consumption_count == 1 and .consumed == true and
              .report_sha256 == $report and (.request_sha256 | test("^[0-9a-f]{64}$")) and
              (.consumed_at_unix | type == "number")
            ' "$isolation/gateway-consumption-receipt.json" >/dev/null
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg core "$CORE_COMMIT" \
            --arg javascript "$JAVASCRIPT_COMMIT" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg audience "$AUDIENCE" --arg runner "$RUNNER_NAME" --arg provider "$PROVIDER" \
            --arg lease "$lease_sha" --arg receipt "$receipt_sha" --arg report "$report_sha" \
            --argjson now "$now" '
              .schema_version == "latchway.live-sdk-collector-teardown.v1" and
              .repository == $repository and .core_commit == $core and .javascript_commit == $javascript and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:$job,audience:$audience} and
              .provider == $provider and .runner.name == $runner and .runner.deregistered == true and
              .runner.accepts_more_jobs == false and .runner.destroy_scheduled == true and
              .runner.destroy_deadline_unix >= $now and .runner.destroy_deadline_unix <= ($now + 600) and
              .grant == {single_use:true,consumption_count:1,zeroized:true,revoked:true} and
              .network == {gateway_egress_only:true,dns_pinned:true,tls_verified:true} and
              .gateway_receipt_verified == true and .evidence_eligible == true and
              .lease_sha256 == $lease and .gateway_receipt_sha256 == $receipt and
              .report_sha256 == $report
            ' "$isolation/collector-teardown.json" >/dev/null
          test "${{ steps.collect.outcome }}" = success
      - name: Build the bounded redacted capture and isolation manifest
        shell: bash
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/javascript-capture"
          isolation="$root/${PROVIDER}-isolation"
          started=$(jq -r '.started_at_unix' "$isolation/execution.json")
          finished=$(jq -r '.finished_at_unix' "$isolation/execution.json")
          (( started < finished ))
          format_time() { date -u -d "@$1" +%Y-%m-%dT%H:%M:%SZ; }
          lease_sha=$(sha256sum "$isolation/collector-lease.json" | awk '{print $1}')
          teardown_sha=$(sha256sum "$isolation/collector-teardown.json" | awk '{print $1}')
          receipt_sha=$(sha256sum "$isolation/gateway-consumption-receipt.json" | awk '{print $1}')
          harness_sha=$(sha256sum "$isolation/harness-manifest.json" | awk '{print $1}')
          report_sha=$(sha256sum "$root/${PROVIDER}-report.json" | awk '{print $1}')
          install -m 0600 "$root/${PROVIDER}-report.json" "$isolation/report.json"
          jq --null-input --sort-keys --arg provider "$PROVIDER" \
            --arg started_at "$(format_time "$started")" --arg finished_at "$(format_time "$finished")" \
            --arg lease "$lease_sha" --arg teardown "$teardown_sha" --arg receipt "$receipt_sha" \
            --arg harness "$harness_sha" --arg report_sha "$report_sha" \
            --slurpfile report "$root/${PROVIDER}-report.json" \
            '{schema_version:1,kind:"latchway_live_javascript_capture",attestation_provider:$provider,
              started_at:$started_at,finished_at:$finished_at,report:$report[0],collector_isolation:{
                schema_version:"latchway.live-sdk-collector-isolation.v1",lease_sha256:$lease,
                teardown_sha256:$teardown,gateway_receipt_sha256:$receipt,
                harness_manifest_sha256:$harness,report_sha256:$report_sha}}' \
            > "$root/${PROVIDER}.json"
          (cd "$isolation" && sha256sum \
            collector-lease.json collector-lease.sig collector-teardown.json collector-teardown.sig \
            execution.json gateway-consumption-receipt.json gateway-consumption-receipt.sig \
            gateway-receipt-public-key.pem harness-manifest.json report.json > ISOLATION_SHA256SUMS)
          rm "$root/${PROVIDER}-report.json"
          test -z "$(find "$root" -type l -print -quit)"
      - name: Retain only the one-use isolated JavaScript observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-javascript-${{ matrix.provider }}-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/javascript-capture/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  observe_non_sdk:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      inputs.domain != 'live_sdk_conformance' && inputs.domain != 'physical_devices' &&
      needs.authenticate.result == 'success' && needs.sources.result == 'success' &&
      ((inputs.domain == 'live_provider' && needs.live_provider_capture.result == 'success' && needs.github_authority.result == 'skipped') ||
       (inputs.domain != 'live_provider' && needs.github_authority.result == 'success' && needs.live_provider_capture.result == 'skipped'))
    needs: [authenticate, sources, live_provider_capture, github_authority]
    environment: release-evidence
    runs-on: ${{ inputs.domain == 'public_registries' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: none
    steps:
      - name: Download authenticated candidate inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-authority-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authority
      - name: Download exact source trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-sources-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sources
      - name: Download the sealed live-provider capture
        if: inputs.domain == 'live_provider'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-live-provider-capture-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-provider-capture
      - name: Download the exact GitHub authority manifest
        if: inputs.domain != 'live_provider'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-github-authority-${{ inputs.domain }}-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-authority
      - name: Refuse provider, GitHub, and OIDC credentials before candidate execution
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in GH_TOKEN GITHUB_TOKEN LATCHWAY_ADMIN_API_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL; do
            test -z "${!name:-}"
          done
      - name: Extract exact source trees
        run: tar -xzf "$RUNNER_TEMP/sources/source-inputs.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: inputs.domain == 'supply_chain'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.domain == 'supply_chain' || inputs.domain == 'public_registries'
      - name: Validate the isolated non-SDK observations offline
        shell: bash
        env:
          EVIDENCE_DOMAIN: ${{ inputs.domain }}
          LATCHWAY_RELEASE_EVIDENCE_ENVIRONMENT: release-evidence
          LATCHWAY_MAVEN_SIGNING_FINGERPRINT: ${{ vars.LATCHWAY_MAVEN_SIGNING_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/non-sdk/raw"
          capture=()
          if [[ "$EVIDENCE_DOMAIN" == live_provider ]]; then
            capture=(--live-provider-capture-directory "$RUNNER_TEMP/live-provider-capture")
          else
            capture=(--github-authority-directory "$RUNNER_TEMP/github-authority")
          fi
          python3 latchway/scripts/release-domain-observer.py \
            --domain "$EVIDENCE_DOMAIN" \
            --source-conformance "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" \
            --candidate-manifest "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" \
            --output-directory "$RUNNER_TEMP/non-sdk/raw" \
            --core-repo "$GITHUB_WORKSPACE/latchway" \
            --javascript-repo "$GITHUB_WORKSPACE/latchway-js" \
            --ios-repo "$GITHUB_WORKSPACE/latchway-ios-sdk" \
            --android-repo "$GITHUB_WORKSPACE/latchway-android" \
            --react-native-repo "$GITHUB_WORKSPACE/latchway-react-native-sdk" \
            "${capture[@]}"
      - name: Retain provider results for secret-free aggregation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-domain-non-sdk-${{ inputs.domain }}-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/non-sdk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  aggregate:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.authenticate.result == 'success' && needs.sources.result == 'success' &&
      ((inputs.domain == 'live_sdk_conformance' && needs.physical_authority.result == 'success' && needs.javascript_collect.result == 'success') ||
       (inputs.domain == 'physical_devices' && needs.physical_authority.result == 'success') ||
       (inputs.domain != 'live_sdk_conformance' && inputs.domain != 'physical_devices' && needs.observe_non_sdk.result == 'success'))
    needs: [authenticate, sources, physical_authority, javascript_collect, observe_non_sdk]
    environment: release-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: none
    steps:
      - name: Download authenticated candidate inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-authority-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authority
      - name: Download exact source trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-sources-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sources
      - name: Download authenticated physical inputs
        if: inputs.domain == 'live_sdk_conformance' || inputs.domain == 'physical_devices'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-physical-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk
      - name: Download Firebase App Check observation
        if: inputs.domain == 'live_sdk_conformance'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-javascript-firebase_app_check-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/javascript
      - name: Download Turnstile observation
        if: inputs.domain == 'live_sdk_conformance'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-javascript-turnstile-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/javascript
      - name: Download isolated non-SDK provider results
        if: inputs.domain != 'live_sdk_conformance' && inputs.domain != 'physical_devices'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-domain-non-sdk-${{ inputs.domain }}-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/non-sdk
      - name: Reverify live JavaScript issuer and gateway receipts without candidate code
        if: inputs.domain == 'live_sdk_conformance'
        shell: bash
        env:
          COLLECTOR_TRUST_ROOT_PEM: ${{ vars.LATCHWAY_LIVE_SDK_COLLECTOR_TRUST_ROOT_PEM }}
          COLLECTOR_TRUST_ROOT_SHA256: ${{ vars.LATCHWAY_LIVE_SDK_COLLECTOR_TRUST_ROOT_SHA256 }}
          GATEWAY_RECEIPT_PUBLIC_KEY_PEM: ${{ vars.LATCHWAY_GATEWAY_EVIDENCE_PUBLIC_KEY_PEM }}
          GATEWAY_RECEIPT_PUBLIC_KEY_SHA256: ${{ vars.LATCHWAY_GATEWAY_EVIDENCE_PUBLIC_KEY_SHA256 }}
          CORE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
        run: |
          set -Eeuo pipefail
          trust_root="$RUNNER_TEMP/live-sdk-collector-trust-root.pem"
          gateway_key="$RUNNER_TEMP/live-sdk-gateway-receipt-key.pem"
          umask 077
          printf '%s\n' "$COLLECTOR_TRUST_ROOT_PEM" > "$trust_root"
          printf '%s\n' "$GATEWAY_RECEIPT_PUBLIC_KEY_PEM" > "$gateway_key"
          for value in "$COLLECTOR_TRUST_ROOT_SHA256" "$GATEWAY_RECEIPT_PUBLIC_KEY_SHA256"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          test "$(sha256sum "$trust_root" | awk '{print $1}')" = "$COLLECTOR_TRUST_ROOT_SHA256"
          test "$(sha256sum "$gateway_key" | awk '{print $1}')" = "$GATEWAY_RECEIPT_PUBLIC_KEY_SHA256"
          validate_provider() {
            local provider="$1" audience="$2" runner_slug="$3" root capture lease teardown receipt report_sha
            root="$RUNNER_TEMP/javascript/${provider}-isolation"
            capture="$RUNNER_TEMP/javascript/$provider.json"
            test -d "$root" && test ! -L "$root" && test -f "$capture" && test ! -L "$capture"
            expected="$RUNNER_TEMP/$provider-expected-isolation"
            printf '%s\n' ISOLATION_SHA256SUMS collector-lease.json collector-lease.sig \
              collector-teardown.json collector-teardown.sig execution.json \
              gateway-consumption-receipt.json gateway-consumption-receipt.sig \
              gateway-receipt-public-key.pem harness-manifest.json report.json | LC_ALL=C sort > "$expected"
            find "$root" -mindepth 1 -maxdepth 1 -type f -print | sed "s#^$root/##" \
              | LC_ALL=C sort > "$RUNNER_TEMP/$provider-actual-isolation"
            cmp --silent "$expected" "$RUNNER_TEMP/$provider-actual-isolation"
            test -z "$(find "$root" -mindepth 1 ! -type f -print -quit)"
            (cd "$root" && sha256sum --check --strict ISOLATION_SHA256SUMS)
            cmp --silent "$gateway_key" "$root/gateway-receipt-public-key.pem"
            openssl dgst -sha256 -verify "$trust_root" \
              -signature "$root/collector-lease.sig" "$root/collector-lease.json"
            openssl dgst -sha256 -verify "$trust_root" \
              -signature "$root/collector-teardown.sig" "$root/collector-teardown.json"
            openssl dgst -sha256 -verify "$gateway_key" \
              -signature "$root/gateway-consumption-receipt.sig" "$root/gateway-consumption-receipt.json"
            lease=$(sha256sum "$root/collector-lease.json" | awk '{print $1}')
            teardown=$(sha256sum "$root/collector-teardown.json" | awk '{print $1}')
            receipt=$(sha256sum "$root/gateway-consumption-receipt.json" | awk '{print $1}')
            harness=$(sha256sum "$root/harness-manifest.json" | awk '{print $1}')
            report=$(sha256sum "$root/report.json" | awk '{print $1}')
            jq --exit-status --arg lease "$lease" --arg teardown "$teardown" \
              --arg receipt "$receipt" --arg harness "$harness" --arg report "$report" \
              --arg provider "$provider" '
                .schema_version == 1 and .kind == "latchway_live_javascript_capture" and
                .attestation_provider == $provider and
                .collector_isolation == {schema_version:"latchway.live-sdk-collector-isolation.v1",
                  lease_sha256:$lease,teardown_sha256:$teardown,
                  gateway_receipt_sha256:$receipt,harness_manifest_sha256:$harness,
                  report_sha256:$report}
              ' "$capture" >/dev/null
            runner="latchway-live-sdk-${runner_slug}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg core "$CORE_COMMIT" \
              --arg javascript "$JAVASCRIPT_COMMIT" --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg provider "$provider" \
              --arg audience "$audience" --arg runner "$runner" '
                .schema_version == "latchway.live-sdk-collector-lease.v1" and
                .repository == $repository and .core_commit == $core and
                .javascript_commit == $javascript and
                .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:"javascript_collect",audience:$audience} and
                .runner.name == $runner and .runner.ephemeral == true and .runner.jit == true and
                .runner.max_jobs == 1 and .runner.destroy_after_job == true and
                .credentials == {long_lived:false,organization:false,administration:false,registry:false,oidc:false} and
                .grant.provider == $provider and .grant.single_use == true and
                (.grant.sha256 | test("^[0-9a-f]{64}$")) and
                (.grant.jti_sha256 | test("^[0-9a-f]{64}$")) and
                (.grant.request_sha256 | test("^[0-9a-f]{64}$")) and
                (.expires_at_unix - .issued_at_unix) <= 300
              ' "$root/collector-lease.json" >/dev/null
            report_sha=$(jq -r '.report_sha256' "$root/collector-teardown.json")
            jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg core "$CORE_COMMIT" \
              --arg javascript "$JAVASCRIPT_COMMIT" --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg provider "$provider" \
              --arg report "$report_sha" '
                .schema_version == "latchway.live-sdk-gateway-consumption.v1" and
                .repository == $repository and .core_commit == $core and
                .javascript_commit == $javascript and .run_id == $run_id and
                .run_attempt == $run_attempt and .provider == $provider and
                .single_use == true and .consumption_count == 1 and .consumed == true and
                .report_sha256 == $report and (.request_sha256 | test("^[0-9a-f]{64}$"))
              ' "$root/gateway-consumption-receipt.json" >/dev/null
            jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg core "$CORE_COMMIT" \
              --arg javascript "$JAVASCRIPT_COMMIT" --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg provider "$provider" \
              --arg audience "$audience" --arg runner "$runner" --arg lease "$lease" \
              --arg receipt "$receipt" --arg report "$report_sha" '
                .schema_version == "latchway.live-sdk-collector-teardown.v1" and
                .repository == $repository and .core_commit == $core and .javascript_commit == $javascript and
                .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:"javascript_collect",audience:$audience} and
                .provider == $provider and .runner.name == $runner and .runner.deregistered == true and
                .runner.accepts_more_jobs == false and .runner.destroy_scheduled == true and
                .grant == {single_use:true,consumption_count:1,zeroized:true,revoked:true} and
                .network == {gateway_egress_only:true,dns_pinned:true,tls_verified:true} and
                .gateway_receipt_verified == true and .evidence_eligible == true and
                .lease_sha256 == $lease and .gateway_receipt_sha256 == $receipt and
                .report_sha256 == $report
              ' "$root/collector-teardown.json" >/dev/null
          }
          validate_provider firebase_app_check firebase-app-check firebase
          validate_provider turnstile turnstile turnstile
      - name: Extract exact source trees
        run: tar -xzf "$RUNNER_TEMP/sources/source-inputs.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Refuse provider, GitHub, and OIDC credentials before candidate validation
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in GH_TOKEN GITHUB_TOKEN LATCHWAY_ADMIN_API_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL; do
            test -z "${!name:-}"
          done
      - name: Validate SDK and device observations without credentials
        if: inputs.domain == 'live_sdk_conformance' || inputs.domain == 'physical_devices'
        shell: bash
        env:
          EVIDENCE_DOMAIN: ${{ inputs.domain }}
          LATCHWAY_RELEASE_EVIDENCE_ENVIRONMENT: release-evidence
          LATCHWAY_BASE_URL: ${{ vars.LATCHWAY_LIVE_GATEWAY_BASE_URL }}
          LATCHWAY_LIVE_SDK_ENVIRONMENT: ${{ vars.LATCHWAY_LIVE_SDK_ENVIRONMENT }}
          LATCHWAY_LIVE_SDK_ERROR_MAPPING_FEATURE: ${{ vars.LATCHWAY_LIVE_SDK_ERROR_MAPPING_FEATURE }}
          IOS_PHYSICAL_RUN_ID: ${{ inputs.ios_physical_run_id }}
          IOS_PHYSICAL_RUN_ATTEMPT: ${{ inputs.ios_physical_run_attempt }}
          ANDROID_PHYSICAL_RUN_ID: ${{ inputs.android_physical_run_id }}
          ANDROID_PHYSICAL_RUN_ATTEMPT: ${{ inputs.android_physical_run_attempt }}
          REACT_NATIVE_PHYSICAL_RUN_ID: ${{ inputs.react_native_physical_run_id }}
          REACT_NATIVE_PHYSICAL_RUN_ATTEMPT: ${{ inputs.react_native_physical_run_attempt }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned/raw"
          javascript=()
          if [[ "$EVIDENCE_DOMAIN" == live_sdk_conformance ]]; then
            javascript=(
              --javascript-firebase-app-check-capture "$RUNNER_TEMP/javascript/firebase_app_check.json"
              --javascript-turnstile-capture "$RUNNER_TEMP/javascript/turnstile.json"
            )
          fi
          python3 latchway/scripts/release-domain-observer.py \
            --domain "$EVIDENCE_DOMAIN" \
            --source-conformance "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" \
            --candidate-manifest "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" \
            --output-directory "$RUNNER_TEMP/unsigned/raw" \
            --core-repo "$GITHUB_WORKSPACE/latchway" \
            --javascript-repo "$GITHUB_WORKSPACE/latchway-js" \
            --ios-repo "$GITHUB_WORKSPACE/latchway-ios-sdk" \
            --android-repo "$GITHUB_WORKSPACE/latchway-android" \
            --react-native-repo "$GITHUB_WORKSPACE/latchway-react-native-sdk" \
            --physical-authority-directory "$RUNNER_TEMP/sdk/physical-authority" \
            --ios-receipt-directory "$RUNNER_TEMP/sdk/physical/ios" \
            --android-receipt-directory "$RUNNER_TEMP/sdk/physical/android" \
            --react-native-ios-receipt-directory "$RUNNER_TEMP/sdk/physical/react-native-ios" \
            --react-native-android-receipt-directory "$RUNNER_TEMP/sdk/physical/react-native-android" \
            --ios-run-id "$IOS_PHYSICAL_RUN_ID" --ios-run-attempt "$IOS_PHYSICAL_RUN_ATTEMPT" \
            --android-run-id "$ANDROID_PHYSICAL_RUN_ID" --android-run-attempt "$ANDROID_PHYSICAL_RUN_ATTEMPT" \
            --react-native-run-id "$REACT_NATIVE_PHYSICAL_RUN_ID" --react-native-run-attempt "$REACT_NATIVE_PHYSICAL_RUN_ATTEMPT" \
            "${javascript[@]}"
      - name: Adopt isolated non-SDK provider observations
        if: inputs.domain != 'live_sdk_conformance' && inputs.domain != 'physical_devices'
        run: mv "$RUNNER_TEMP/non-sdk/raw" "$RUNNER_TEMP/unsigned/raw"
      - name: Produce the exact machine-results manifest
        shell: bash
        env:
          EVIDENCE_DOMAIN: ${{ inputs.domain }}
          LATCHWAY_RELEASE_EVIDENCE_ENVIRONMENT: release-evidence
        run: |
          python3 latchway/scripts/release-domain-evidence.py \
            --produce \
            --domain "$EVIDENCE_DOMAIN" \
            --source-conformance "$RUNNER_TEMP/authority/source/latchway-cross-repository.json" \
            --candidate-manifest "$RUNNER_TEMP/authority/candidate/latchway-candidate.json" \
            --raw-directory "$RUNNER_TEMP/unsigned/raw" \
            --receipt "$RUNNER_TEMP/unsigned/machine-results-manifest.json"
      - name: Retain validated unsigned machine results for a fresh signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-${{ inputs.domain }}-unsigned-machine-results-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unsigned
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign:
    if: github.ref == 'refs/heads/main'
    needs: aggregate
    environment: release-evidence-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download validated machine results on a fresh no-checkout runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-${{ inputs.domain }}-unsigned-machine-results-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation-artifact
      - name: Refuse an unsafe unsigned artifact shape
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$RUNNER_TEMP/observation-artifact/machine-results-manifest.json"
          test -d "$RUNNER_TEMP/observation-artifact/raw"
          test -z "$(find "$RUNNER_TEMP/observation-artifact" -type l -print -quit)"
      - name: Reverify the retained live-provider collector closure without candidate code
        if: inputs.domain == 'live_provider'
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          COLLECTOR_TRUST_ROOT_SHA256: ${{ vars.LATCHWAY_LIVE_PROVIDER_COLLECTOR_TRUST_ROOT_SHA256 }}
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          artifact="$RUNNER_TEMP/observation-artifact"
          raw="$artifact/raw"
          container="$raw/artifacts/provider-gateway-identity/live-provider-isolation.json"
          machine="$artifact/machine-results-manifest.json"
          test -f "$container" && test ! -L "$container"
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COLLECTOR_TRUST_ROOT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          jq --exit-status '
            (keys | sort) == ["files","kind","observation","schema_version"] and
            .schema_version == 1 and
            .kind == "latchway_retained_live_provider_collector_isolation" and
            .observation == "provider.gateway-identity" and
            (.files | type == "array" and length == 10) and
            all(.files[];
              (keys | sort) == ["content_base64","name","sha256"] and
              (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
              (.content_base64 | type == "string" and test("^[A-Za-z0-9+/]*={0,2}$")) and
              (.sha256 | type == "string" and test("^[0-9a-f]{64}$")))
          ' "$container" >/dev/null
          expected="$RUNNER_TEMP/live-provider-expected-files"
          actual="$RUNNER_TEMP/live-provider-actual-files"
          printf '%s\n' \
            collector-lease.json collector-lease.sig collector-teardown.json \
            collector-teardown.sig collector-trust-root.pem \
            grant-consumption-receipt.json grant-consumption-receipt.sig \
            health.json manifest.json self-test.json | sort > "$expected"
          jq --raw-output '.files[].name' "$container" | sort > "$actual"
          test -z "$(uniq -d "$actual")"
          cmp --silent "$expected" "$actual"
          extracted="$RUNNER_TEMP/live-provider-authenticated-closure"
          mkdir -m 0700 "$extracted"
          while IFS=$'\t' read -r name encoded expected_sha; do
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            file="$extracted/$name"
            printf '%s' "$encoded" | base64 --decode > "$file"
            test -f "$file" && test ! -L "$file"
            size=$(stat --format='%s' "$file")
            (( size >= 1 && size <= 2097152 ))
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected_sha"
          done < <(jq --raw-output '.files[] | [.name,.content_base64,.sha256] | @tsv' "$container")
          test "$(find "$extracted" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 10
          test -z "$(find "$extracted" -mindepth 1 ! -type f -print -quit)"
          trust_root="$extracted/collector-trust-root.pem"
          test "$(sha256sum "$trust_root" | awk '{print $1}')" = "$COLLECTOR_TRUST_ROOT_SHA256"
          openssl pkey -pubin -in "$trust_root" -noout
          openssl dgst -sha256 -verify "$trust_root" \
            -signature "$extracted/collector-lease.sig" "$extracted/collector-lease.json"
          openssl dgst -sha256 -verify "$trust_root" \
            -signature "$extracted/grant-consumption-receipt.sig" \
            "$extracted/grant-consumption-receipt.json"
          openssl dgst -sha256 -verify "$trust_root" \
            -signature "$extracted/collector-teardown.sig" "$extracted/collector-teardown.json"
          manifest="$extracted/manifest.json"
          lease="$extracted/collector-lease.json"
          receipt="$extracted/grant-consumption-receipt.json"
          teardown="$extracted/collector-teardown.json"
          request_sha=$(jq --sort-keys '.request' "$manifest" | sha256sum | awk '{print $1}')
          lease_sha=$(sha256sum "$lease" | awk '{print $1}')
          receipt_sha=$(sha256sum "$receipt" | awk '{print $1}')
          health_sha=$(sha256sum "$extracted/health.json" | awk '{print $1}')
          self_test_sha=$(sha256sum "$extracted/self-test.json" | awk '{print $1}')
          started=$(date -u -d "$(jq --raw-output '.started_at' "$manifest")" +%s)
          finished=$(date -u -d "$(jq --raw-output '.finished_at' "$manifest")" +%s)
          [[ "$started" =~ ^[1-9][0-9]*$ && "$finished" =~ ^[1-9][0-9]*$ ]]
          (( started < finished && finished - started <= 600 ))
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg request "$request_sha" \
            --arg lease "$lease_sha" --arg receipt "$receipt_sha" \
            --arg trust_root "$COLLECTOR_TRUST_ROOT_SHA256" \
            --arg health "$health_sha" --arg self_test "$self_test_sha" \
            --arg lease_signature "$(sha256sum "$extracted/collector-lease.sig" | awk '{print $1}')" \
            --arg receipt_signature "$(sha256sum "$extracted/grant-consumption-receipt.sig" | awk '{print $1}')" \
            --arg teardown "$(sha256sum "$teardown" | awk '{print $1}')" \
            --arg teardown_signature "$(sha256sum "$extracted/collector-teardown.sig" | awk '{print $1}')" '
              .schema_version == 1 and .kind == "latchway_live_provider_capture" and
              .candidate.core_commit == $commit and .request_sha256 == $request and
              .collector_isolation == {
                schema_version:"latchway.live-provider-collector-isolation.v1",
                lease_sha256:$lease,lease_signature_sha256:$lease_signature,
                trust_root_sha256:$trust_root,receipt_sha256:$receipt,
                receipt_signature_sha256:$receipt_signature,teardown_sha256:$teardown,
                teardown_signature_sha256:$teardown_signature
              } and
              (.files | map(.path) | sort) == ["health.json","self-test.json"] and
              (.files[] | select(.path == "health.json") |
                .status_code == 200 and .sha256 == $health) and
              (.files[] | select(.path == "self-test.json") |
                .status_code == 202 and .sha256 == $self_test)
            ' "$manifest" >/dev/null
          source_sha=$(jq --raw-output '.source_sha256' "$manifest")
          candidate_sha=$(jq --raw-output '.candidate_sha256' "$manifest")
          gateway=$(jq --raw-output '.gateway_origin' "$manifest")
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg commit "$CANDIDATE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source "$source_sha" --arg candidate "$candidate_sha" --arg gateway "$gateway" \
            --arg request "$request_sha" --argjson started "$started" --argjson finished "$finished" '
              .schema_version == "latchway.live-provider-collector-lease.v1" and
              .repository == $repository and .core_commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:"live_provider_capture",audience:"latchway-live-provider/self-test"} and
              .runner.name == ("latchway-live-provider-" + $run_id + "-" + $run_attempt) and
              .runner.ephemeral == true and .runner.jit == true and .runner.max_jobs == 1 and
              .runner.fresh_boot == true and .runner.clean_workspace == true and
              .runner.repository_scope == $repository and .runner.destroy_after_job == true and
              (.runner.image_digest | test("^sha256:[0-9a-f]{64}$")) and
              (.runner.boot_id_sha256 | test("^[0-9a-f]{64}$")) and
              .credentials == {long_lived:false,organization:false,administration:false,registry:false,oidc:false} and
              .supervisor == {private_key_isolated:true,caller_supplied_claims_accepted:false,
                gateway_egress_only:true,dns_pinned:true,tls_verified:true,
                grant_issuer_independent:true,one_use_verification:true,out_of_band_watchdog:true} and
              .grant.audience == "latchway-live-provider/self-test" and .grant.core_commit == $commit and
              .grant.run_id == $run_id and .grant.run_attempt == $run_attempt and
              .grant.scope == "run_self_tests" and .grant.single_use == true and .grant.revocable == true and
              (.grant.sha256 | test("^[0-9a-f]{64}$")) and (.grant.jti_sha256 | test("^[0-9a-f]{64}$")) and
              .grant.request_sha256 == $request and
              (.grant.issued_at_unix | type == "number") and (.grant.expires_at_unix | type == "number") and
              .grant.issued_at_unix <= $started and .grant.expires_at_unix >= $finished and
              (.grant.expires_at_unix - .grant.issued_at_unix) <= 300 and
              .candidate == {source_report_sha256:$source,candidate_manifest_sha256:$candidate} and
              .gateway == {origin:$gateway} and .issued_at_unix <= $started and
              .expires_at_unix >= $finished and (.expires_at_unix - .issued_at_unix) <= 600
            ' "$lease" >/dev/null
          grant_sha=$(jq --raw-output '.grant.sha256' "$lease")
          jti_sha=$(jq --raw-output '.grant.jti_sha256' "$lease")
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg commit "$CANDIDATE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg grant "$grant_sha" --arg jti "$jti_sha" --arg request "$request_sha" \
            --arg health "$health_sha" --arg self_test "$self_test_sha" \
            --argjson started "$started" --argjson finished "$finished" '
              .schema_version == "latchway.live-provider-grant-consumption.v1" and
              .repository == $repository and .core_commit == $commit and
              .run_id == $run_id and .run_attempt == $run_attempt and
              .audience == "latchway-live-provider/self-test" and .scope == "run_self_tests" and
              .grant_sha256 == $grant and .jti_sha256 == $jti and .single_use == true and
              .consumption_count == 1 and .consumed == true and .revoked == true and
              .request_sha256 == $request and .health_sha256 == $health and
              .self_test_sha256 == $self_test and
              .consumed_at_unix >= $started and .consumed_at_unix <= $finished
            ' "$receipt" >/dev/null
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg commit "$CANDIDATE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg lease "$lease_sha" --arg receipt "$receipt_sha" \
            --arg health "$health_sha" --arg self_test "$self_test_sha" \
            --argjson finished "$finished" '
              .schema_version == "latchway.live-provider-collector-teardown.v1" and
              .repository == $repository and .core_commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:"live_provider_capture",audience:"latchway-live-provider/self-test"} and
              .runner.name == ("latchway-live-provider-" + $run_id + "-" + $run_attempt) and
              .runner.deregistered == true and .runner.accepts_more_jobs == false and
              .runner.destroy_scheduled == true and .runner.destroy_deadline_unix >= $finished and
              .runner.destroy_deadline_unix <= ($finished + 600) and
              .grant == {single_use:true,consumption_count:1,zeroized:true,revoked:true} and
              .network == {gateway_egress_only:true,dns_pinned:true,tls_verified:true} and
              .receipt_verified == true and .evidence_eligible == true and
              .lease_sha256 == $lease and .receipt_sha256 == $receipt and
              .health_sha256 == $health and .self_test_sha256 == $self_test
            ' "$teardown" >/dev/null
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" \
            '.candidate.core_commit == $commit and .domain == "live_provider" and
             (.observations | map(.id)) == ["provider.gateway-identity","provider.openrouter.error-normalization","provider.openrouter.non-streaming","provider.openrouter.output-clamp","provider.openrouter.streaming","provider.openrouter.usage"]' \
            "$machine" >/dev/null
          jq --sort-keys '.candidate' "$manifest" > "$RUNNER_TEMP/live-provider-manifest-candidate.json"
          jq --sort-keys '.candidate' "$machine" > "$RUNNER_TEMP/live-provider-machine-candidate.json"
          cmp --silent "$RUNNER_TEMP/live-provider-manifest-candidate.json" "$RUNNER_TEMP/live-provider-machine-candidate.json"
          if grep --binary-files=text --extended-regexp --quiet 'lwa_[A-Za-z0-9_-]{43}' \
            "$extracted/health.json" "$extracted/self-test.json"; then
            echo "live-provider evidence retained an Admin credential shape" >&2
            exit 1
          fi
      - name: Attest the exact machine-results manifest
        id: machine-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/observation-artifact/machine-results-manifest.json
      - name: Retain the machine-results attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.machine-attestation.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/observation-artifact/machine-results.attestation.sigstore.json"
      - name: Retain only the attested machine-result set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-${{ inputs.domain }}-machine-results-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
