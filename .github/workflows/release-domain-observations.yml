name: Protected release-domain observations

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Fixed external observation set to execute
        required: true
        type: choice
        options:
          - live_sdk_conformance
          - live_provider
          - supply_chain
          - public_tags
          - public_registries
      candidate_commit:
        description: Exact core candidate commit
        required: true
        type: string
      javascript_commit:
        description: Exact JavaScript SDK commit from source conformance
        required: true
        type: string
      ios_commit:
        description: Exact iOS SDK commit from source conformance
        required: true
        type: string
      android_commit:
        description: Exact Android SDK commit from source conformance
        required: true
        type: string
      react_native_commit:
        description: Exact React Native SDK commit from source conformance
        required: true
        type: string
      source_evidence_run_id:
        description: Successful attested source-conformance run ID
        required: true
        type: string
      candidate_run_id:
        description: Successful attested immutable-candidate run ID
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write
  packages: read

concurrency:
  group: release-domain-observations-${{ inputs.domain }}-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    environment: release-evidence
    runs-on: ${{ inputs.domain == 'public_registries' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - name: Check out the exact core candidate and producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          path: latchway
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact JavaScript SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-js
          ref: ${{ inputs.javascript_commit }}
          path: latchway-js
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact iOS SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-ios-sdk
          ref: ${{ inputs.ios_commit }}
          path: latchway-ios-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact Android SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-android
          ref: ${{ inputs.android_commit }}
          path: latchway-android
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-react-native-sdk
          ref: ${{ inputs.react_native_commit }}
          path: latchway-react-native-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable run and commit inputs
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          JAVASCRIPT_COMMIT: ${{ inputs.javascript_commit }}
          IOS_COMMIT: ${{ inputs.ios_commit }}
          ANDROID_COMMIT: ${{ inputs.android_commit }}
          REACT_NATIVE_COMMIT: ${{ inputs.react_native_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_evidence_run_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          for value in "$CANDIDATE_COMMIT" "$JAVASCRIPT_COMMIT" "$IOS_COMMIT" "$ANDROID_COMMIT" "$REACT_NATIVE_COMMIT"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git -C latchway rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C latchway-js rev-parse --verify HEAD)" = "$JAVASCRIPT_COMMIT"
          test "$(git -C latchway-ios-sdk rev-parse --verify HEAD)" = "$IOS_COMMIT"
          test "$(git -C latchway-android rev-parse --verify HEAD)" = "$ANDROID_COMMIT"
          test "$(git -C latchway-react-native-sdk rev-parse --verify HEAD)" = "$REACT_NATIVE_COMMIT"
      - name: Download the exact source-conformance artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-source
          path: ${{ runner.temp }}/source
          run-id: ${{ inputs.source_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Download the exact candidate artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source and candidate bundle provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          gh attestation verify "$RUNNER_TEMP/source/latchway-cross-repository.json" \
            --bundle "$RUNNER_TEMP/source/latchway-cross-repository.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/source-attestation-verification.json"
          gh attestation verify "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --bundle "$RUNNER_TEMP/candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/candidate-attestation-verification.json"
      - name: Refuse hosted substitution for live SDK physical evidence
        if: inputs.domain == 'live_sdk_conformance'
        run: |
          echo "live SDK evidence requires authenticated iOS, Android, and React Native physical-workflow receipts plus a real JavaScript live harness" >&2
          exit 1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: inputs.domain == 'supply_chain'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.domain == 'supply_chain' || inputs.domain == 'public_registries'
      - name: Build the exact CLI for the bounded live-provider self-test
        if: inputs.domain == 'live_provider'
        working-directory: latchway
        run: go build -trimpath -o "$RUNNER_TEMP/latchway" ./cmd/latchway
      - name: Execute only the fixed domain observation plan
        shell: bash
        env:
          EVIDENCE_DOMAIN: ${{ inputs.domain }}
          GH_TOKEN: ${{ github.token }}
          LATCHWAY_RELEASE_EVIDENCE_ENVIRONMENT: release-evidence
          LATCHWAY_BASE_URL: ${{ vars.LATCHWAY_LIVE_GATEWAY_BASE_URL }}
          LATCHWAY_ADMIN_API_TOKEN: ${{ secrets.LATCHWAY_LIVE_PROVIDER_ADMIN_API_TOKEN }}
          LATCHWAY_PROVIDER_ENVIRONMENT_ID: ${{ vars.LATCHWAY_LIVE_PROVIDER_ENVIRONMENT_ID }}
          LATCHWAY_PROVIDER_UPSTREAM_ID: ${{ vars.LATCHWAY_LIVE_PROVIDER_UPSTREAM_ID }}
          LATCHWAY_PROVIDER_MODEL_ID: ${{ vars.LATCHWAY_LIVE_PROVIDER_MODEL_ID }}
          LATCHWAY_PROVIDER_MAX_COST_NANO_USD: ${{ vars.LATCHWAY_LIVE_PROVIDER_MAX_COST_NANO_USD }}
          LATCHWAY_CLI_PATH: ${{ runner.temp }}/latchway
        run: |
          mkdir -p "$RUNNER_TEMP/observation-artifact"
          python3 latchway/scripts/release-domain-observer.py \
            --domain "$EVIDENCE_DOMAIN" \
            --source-conformance "$RUNNER_TEMP/source/latchway-cross-repository.json" \
            --candidate-manifest "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --output-directory "$RUNNER_TEMP/observation-artifact/raw" \
            --core-repo "$GITHUB_WORKSPACE/latchway" \
            --javascript-repo "$GITHUB_WORKSPACE/latchway-js" \
            --ios-repo "$GITHUB_WORKSPACE/latchway-ios-sdk" \
            --android-repo "$GITHUB_WORKSPACE/latchway-android" \
            --react-native-repo "$GITHUB_WORKSPACE/latchway-react-native-sdk"
      - name: Produce the exact machine-results manifest
        shell: bash
        env:
          EVIDENCE_DOMAIN: ${{ inputs.domain }}
          LATCHWAY_RELEASE_EVIDENCE_ENVIRONMENT: release-evidence
        run: |
          python3 latchway/scripts/release-domain-evidence.py \
            --produce \
            --domain "$EVIDENCE_DOMAIN" \
            --source-conformance "$RUNNER_TEMP/source/latchway-cross-repository.json" \
            --candidate-manifest "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --raw-directory "$RUNNER_TEMP/observation-artifact/raw" \
            --receipt "$RUNNER_TEMP/observation-artifact/machine-results-manifest.json"
      - name: Attest the exact machine-results manifest
        id: machine-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/observation-artifact/machine-results-manifest.json
      - name: Retain the machine-results attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.machine-attestation.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/observation-artifact/machine-results.attestation.sigstore.json"
      - name: Retain only the attested machine-result set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-${{ inputs.domain }}-machine-results-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/observation-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
