name: Public documentation

on:
  # This required context must exist on every PR and current main commit.
  # Path filters either leave a PR Pending or make main unobservable.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical Mintlify source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/public
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: docs/public/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose the pinned MDX parser
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prove deterministic generated public references
        working-directory: .
        run: |
          python3 -m unittest \
            scripts/test_docs_sdk_bundle.py \
            scripts/test_public_reference.py \
            scripts/test_framework_compatibility.py \
            scripts/test_sync_public_docs.py
          scripts/docs-sync-sdk --check
          python3 scripts/public_reference.py --check-generated

      - name: Lint public prose
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3
        with:
          fail_on_error: true
          files: .
          filter_mode: nofilter
          sync: false
          version: 3.17.0
          workdir: docs/public

      - name: Validate public documentation
        env:
          DO_NOT_TRACK: "1"
        # Vale already ran in the pinned action above. The action intentionally
        # does not install a `vale` executable into later steps, so repeat only
        # the remaining self-contained documentation gates here.
        run: pnpm check:generated && pnpm check:structure && pnpm check:metadata && pnpm validate && pnpm check:links && pnpm check:a11y
