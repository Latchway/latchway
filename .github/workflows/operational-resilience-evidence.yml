name: Operational resilience evidence

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact 40-character core candidate commit
        required: true
        type: string
      candidate_run_id:
        description: Release-candidate workflow run containing latchway-candidate-COMMIT
        required: true
        type: string
      source_conformance_run_id:
        description: Cross-repository source-conformance workflow run
        required: true
        type: string
      load_evidence_run_id:
        description: Run containing exact-release-image full load evidence
        required: true
        type: string
      failure_evidence_run_id:
        description: Run containing release-scope failure report and live-failure directory
        required: true
        type: string
      previous_image:
        description: Exact previously released ghcr.io/latchway/latchway OCI digest
        required: true
        type: string
      postgres_image:
        description: Exact docker.io/library/postgres OCI digest used by the isolated drills
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: operational-resilience-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: operational-resilience-evidence
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject mutable or cross-candidate inputs
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_conformance_run_id }}
          LOAD_RUN_ID: ${{ inputs.load_evidence_run_id }}
          FAILURE_RUN_ID: ${{ inputs.failure_evidence_run_id }}
          PREVIOUS_IMAGE: ${{ inputs.previous_image }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: |
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain=v1)"
          for run_id in "$CANDIDATE_RUN_ID" "$SOURCE_RUN_ID" "$LOAD_RUN_ID" "$FAILURE_RUN_ID"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          done
          [[ "$PREVIOUS_IMAGE" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          [[ "$POSTGRES_IMAGE" =~ ^docker\.io/library/postgres@sha256:[0-9a-f]{64}$ ]]
      - name: Download the immutable candidate manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download five-repository source conformance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-source
          path: ${{ runner.temp }}/source
          run-id: ${{ inputs.source_conformance_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact-release-image load evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-load-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/load
          run-id: ${{ inputs.load_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Download release-scope destructive failure evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-failure-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/failure
          run-id: ${{ inputs.failure_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate and source-conformance attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_MANIFEST: ${{ runner.temp }}/candidate/latchway-candidate.json
          SOURCE_REPORT: ${{ runner.temp }}/source/latchway-cross-repository.json
        run: |
          set -Eeuo pipefail
          gh attestation verify "$CANDIDATE_MANIFEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "$SOURCE_REPORT" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Authenticate for exact GHCR image pulls
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and verify the candidate image identity
        id: candidate
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          test -f "$RUNNER_TEMP/candidate/latchway-candidate.json"
          image="$(jq --raw-output '.image.repository + "@" + .image.index_digest' "$RUNNER_TEMP/candidate/latchway-candidate.json")"
          [[ "$image" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          python3 scripts/release-candidate.py \
            --verify \
            --manifest "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --commit "$CANDIDATE_COMMIT" \
            --tag "$(jq --raw-output .intended_tag "$RUNNER_TEMP/candidate/latchway-candidate.json")" \
            --image ghcr.io/latchway/latchway
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run isolated backup, restore, upgrade, and application rollback drills
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          PREVIOUS_IMAGE: ${{ inputs.previous_image }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: >-
          scripts/run-operational-resilience-drills.sh
          --acknowledge-isolated-destructive-drill
          --evidence-dir "$RUNNER_TEMP/operational-drills"
          --core-commit "$CANDIDATE_COMMIT"
          --previous-image "$PREVIOUS_IMAGE"
          --candidate-image "$CANDIDATE_IMAGE"
          --postgres-image "$POSTGRES_IMAGE"
      - name: Seal the operational-resilience domain
        run: >-
          python3 scripts/operational-resilience-evidence.py
          --candidate-manifest "$RUNNER_TEMP/candidate/latchway-candidate.json"
          --source-conformance "$RUNNER_TEMP/source/latchway-cross-repository.json"
          --load-report "$RUNNER_TEMP/load/load-v1.json"
          --failure-report "$RUNNER_TEMP/failure/failure-release.json"
          --failure-evidence-dir "$RUNNER_TEMP/failure/live-failures"
          --backup-restore-report "$RUNNER_TEMP/operational-drills/backup-restore.json"
          --upgrade-rollback-report "$RUNNER_TEMP/operational-drills/upgrade-rollback.json"
          --output-directory "$RUNNER_TEMP/operational-resilience"
      - name: Attest the hash-bound domain document
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/operational-resilience/operational_resilience.json
      - name: Retain the domain document and bounded reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-operational-resilience-${{ inputs.candidate_commit }}
          path: |
            ${{ runner.temp }}/operational-resilience/
            ${{ runner.temp }}/operational-drills/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
