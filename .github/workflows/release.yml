name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 1.1.3
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Latchway/latchway' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set build date
        id: build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "minor=${RELEASE_VERSION%.*}" >> "$GITHUB_OUTPUT"
      - name: Package the canonical contract
        run: python3 scripts/build-contract-bundle.py --output-directory dist/release
      - name: Publish multi-architecture image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/latchway/latchway:${{ inputs.version }}
            ghcr.io/latchway/latchway:${{ steps.build.outputs.minor }}
            ghcr.io/latchway/latchway:1
            ghcr.io/latchway/latchway:latest
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            SOURCE=https://github.com/${{ github.repository }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v$RELEASE_VERSION"
          "dist/release/latchway-contract-1.1.2.tar.gz"
          --target "$GITHUB_SHA"
          --title "Latchway server v$RELEASE_VERSION"
          --notes-file "docs/release/v$RELEASE_VERSION.md"
          --latest
