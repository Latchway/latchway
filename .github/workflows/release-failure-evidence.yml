name: Protected exact-candidate destructive-failure evidence

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact 40-character core candidate commit
        required: true
        type: string
      candidate_run_id:
        description: Successful immutable-candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact immutable-candidate workflow run attempt
        required: true
        type: string
      source_conformance_run_id:
        description: Successful source-conformance workflow run ID
        required: true
        type: string
      source_conformance_run_attempt:
        description: Exact source-conformance workflow run attempt
        required: true
        type: string
      postgres_image:
        description: Exact docker.io/library/postgres OCI digest for deterministic semantic checks
        required: true
        type: string

permissions: {}

concurrency:
  group: release-failure-evidence-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  authenticate:
    if: github.ref == 'refs/heads/main'
    environment: release-failure-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify the exact protected release-failure-evidence environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:release-failure-evidence"
      - name: Require a fixed GitHub CLI and immutable inputs without a checkout
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_conformance_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_conformance_run_attempt }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$POSTGRES_IMAGE" =~ ^docker\.io/library/postgres@sha256:[0-9a-f]{64}$ ]]
          test "$GITHUB_REPOSITORY" = Latchway/latchway
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
      - name: Authenticate the exact candidate and source runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_conformance_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_conformance_run_attempt }}
        run: |
          set -Eeuo pipefail
          for specification in \
            "$CANDIDATE_RUN_ID:$CANDIDATE_RUN_ATTEMPT:.github/workflows/release.yml" \
            "$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT:.github/workflows/cross-repository-conformance.yml"; do
            run_id=${specification%%:*}
            remainder=${specification#*:}
            attempt=${remainder%%:*}
            expected_path=${remainder#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt" > "$RUNNER_TEMP/run-$run_id.json"
            workflow_id=$(jq --raw-output .workflow_id "$RUNNER_TEMP/run-$run_id.json")
            jq --exit-status --arg commit "$CANDIDATE_COMMIT" --argjson attempt "$attempt" \
              '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .run_attempt == $attempt' \
              "$RUNNER_TEMP/run-$run_id.json" >/dev/null
            [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/workflow-$run_id.json"
            jq --exit-status --arg path "$expected_path" \
              '.path == $path and .state == "active"' "$RUNNER_TEMP/workflow-$run_id.json" >/dev/null
          done
      - name: Download exact candidate artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact source-conformance artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-source-${{ inputs.source_conformance_run_id }}-${{ inputs.source_conformance_run_attempt }}
          path: ${{ runner.temp }}/source
          run-id: ${{ inputs.source_conformance_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact candidate and source attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --bundle "$RUNNER_TEMP/candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "$RUNNER_TEMP/source/latchway-cross-repository.json" \
            --bundle "$RUNNER_TEMP/source/latchway-cross-repository.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Retain only authenticated candidate and source inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release-failure-authenticated"
          cp -R -- "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/source" \
            "$RUNNER_TEMP/release-failure-authenticated/"
      - name: Upload authenticated failure-producer inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-failure-inputs-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-failure-authenticated/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  failure:
    needs: authenticate
    if: github.ref == 'refs/heads/main'
    environment: release-failure-evidence
    runs-on: [self-hosted, linux, x64, latchway-release-failure]
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Verify the exact protected release-failure-evidence environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:release-failure-evidence"
      - name: Check out the exact candidate producer without retained credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download only authenticated failure-producer inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-failure-inputs-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated
      - name: Require the exact credential-free self-hosted checkout
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: |
          set -Eeuo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test "$GITHUB_REPOSITORY" = Latchway/latchway
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ "$POSTGRES_IMAGE" =~ ^docker\.io/library/postgres@sha256:[0-9a-f]{64}$ ]]
      - name: Resolve exact index and observed amd64 child
        id: candidate
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          manifest="$RUNNER_TEMP/authenticated/candidate/latchway-candidate.json"
          tag=$(jq --raw-output .intended_tag "$manifest")
          python3 scripts/release-candidate.py --verify \
            --manifest "$manifest" --commit "$CANDIDATE_COMMIT" --tag "$tag" \
            --image ghcr.io/latchway/latchway
          index="$(jq --raw-output '.image.repository + "@" + .image.index_digest' "$manifest")"
          amd64="$(jq --raw-output '.image.repository + "@" + .image.platforms["linux/amd64"]' "$manifest")"
          [[ "$index" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          [[ "$amd64" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          test "$index" != "$amd64"
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "amd64=$amd64" >> "$GITHUB_OUTPUT"
      - name: Authenticate only for exact immutable image pulls
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-failure-registry-auth
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull and bind the exact authenticated linux amd64 images
        id: preloaded
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-failure-registry-auth
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_AMD64: ${{ steps.candidate.outputs.amd64 }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=15s 600s docker pull --platform linux/amd64 "$CANDIDATE_AMD64" >/dev/null
          timeout --signal=TERM --kill-after=15s 600s docker pull --platform linux/amd64 "$POSTGRES_IMAGE" >/dev/null
          candidate_id=$(docker image inspect --format '{{.Id}}' "$CANDIDATE_AMD64")
          postgres_id=$(docker image inspect --format '{{.Id}}' "$POSTGRES_IMAGE")
          [[ "$candidate_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$postgres_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$candidate_id" != "$postgres_id"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate_id")" = linux/amd64
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$postgres_id")" = linux/amd64
          test "$(docker image inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' "$candidate_id")" = "$CANDIDATE_COMMIT"
          docker image inspect --format '{{json .RepoDigests}}' "$candidate_id" \
            | jq --exit-status --arg reference "$CANDIDATE_AMD64" 'index($reference) != null' >/dev/null
          docker image inspect --format '{{json .RepoDigests}}' "$postgres_id" \
            | jq --exit-status --arg reference "$POSTGRES_IMAGE" 'index($reference) != null' >/dev/null
          echo "candidate_id=$candidate_id" >> "$GITHUB_OUTPUT"
          echo "postgres_id=$postgres_id" >> "$GITHUB_OUTPUT"
      - name: Remove registry credentials before repo-owned topology code executes
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-failure-registry-auth
        run: |
          set -Eeuo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf -- "$DOCKER_CONFIG"
          mkdir -m 0700 "$RUNNER_TEMP/release-failure-empty-docker-config"
          printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/release-failure-empty-docker-config" >> "$GITHUB_ENV"
      - name: Initialize the repo-owned failure evidence directory
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          mkdir -p "$RUNNER_TEMP/failure/live-failures"
          test -z "$(find "$RUNNER_TEMP/failure/live-failures" -mindepth 1 -print -quit)"
          cp -- tests/failure/matrix.json "$RUNNER_TEMP/failure/failure-matrix.json"
      - name: Provision and execute the repo-owned bounded failure topology
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_INDEX: ${{ steps.candidate.outputs.index }}
          CANDIDATE_AMD64: ${{ steps.candidate.outputs.amd64 }}
          CANDIDATE_IMAGE_ID: ${{ steps.preloaded.outputs.candidate_id }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
          POSTGRES_IMAGE_ID: ${{ steps.preloaded.outputs.postgres_id }}
        run: |
          set -Eeuo pipefail
          scripts/run-release-failure-controller.sh \
            --acknowledge-disposable-target \
            --run-id "gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output-dir "$RUNNER_TEMP/failure/live-failures" \
            --commit "$CANDIDATE_COMMIT" \
            --image "$CANDIDATE_INDEX" \
            --platform-image "$CANDIDATE_AMD64" \
            --candidate-image-id "$CANDIDATE_IMAGE_ID" \
            --postgres-image "$POSTGRES_IMAGE" \
            --postgres-image-id "$POSTGRES_IMAGE_ID" \
            --operator "github-actions:$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Start an isolated exact PostgreSQL dependency
        id: postgres
        shell: bash
        env:
          POSTGRES_IMAGE_ID: ${{ steps.preloaded.outputs.postgres_id }}
        run: |
          set -Eeuo pipefail
          [[ "$POSTGRES_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{.Id}}' "$POSTGRES_IMAGE_ID")" = "$POSTGRES_IMAGE_ID"
          name="latchway-failure-postgres-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          password="$(openssl rand -hex 32)"
          umask 077
          printf '%s' "$password" > "$RUNNER_TEMP/failure-postgres-password"
          docker run --detach --name "$name" \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_DB=latchway \
            --env POSTGRES_USER=latchway \
            --env "POSTGRES_PASSWORD=$password" \
            "$POSTGRES_IMAGE_ID" >/dev/null
          port="$(docker port "$name" 5432/tcp | sed -n 's/.*://p')"
          [[ "$port" =~ ^[0-9]+$ ]]
          ready=false
          for _ in $(seq 1 60); do
            if docker exec "$name" pg_isready --username latchway --dbname latchway >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Execute the fixed release-scope failure validator
        shell: bash
        env:
          POSTGRES_PORT: ${{ steps.postgres.outputs.port }}
        run: |
          set -Eeuo pipefail
          password="$(<"$RUNNER_TEMP/failure-postgres-password")"
          export LATCHWAY_TEST_DATABASE_URL="postgres://latchway:$password@127.0.0.1:$POSTGRES_PORT/latchway?sslmode=disable"
          scripts/run-failure-gates.sh \
            -scope release \
            -external-evidence-dir "$RUNNER_TEMP/failure/live-failures" \
            -output "$RUNNER_TEMP/failure/failure-release.json"
      - name: Record exact non-secret failure configuration
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_INDEX: ${{ steps.candidate.outputs.index }}
          CANDIDATE_AMD64: ${{ steps.candidate.outputs.amd64 }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: |
          jq --null-input \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg index "$CANDIDATE_INDEX" \
            --arg platform "$CANDIDATE_AMD64" \
            --arg postgres "$POSTGRES_IMAGE" \
            '{schema_version: 1, core_commit: $commit, oci_index_reference: $index, platform: "linux/amd64", oci_platform_reference: $platform, postgres_oci_reference: $postgres, runner_environment: "self-hosted", runner_labels: ["linux", "x64", "latchway-release-failure"]}' \
            > "$RUNNER_TEMP/failure/failure-environment.json"
      - name: Seal the exact producer and every raw checksum
        shell: bash
        env:
          LATCHWAY_RELEASE_EVIDENCE_ENVIRONMENT: release-failure-evidence
        run: |
          python3 scripts/operational-producer-evidence.py \
            --domain failure \
            --source-conformance "$RUNNER_TEMP/authenticated/source/latchway-cross-repository.json" \
            --candidate-manifest "$RUNNER_TEMP/authenticated/candidate/latchway-candidate.json" \
            --evidence-directory "$RUNNER_TEMP/failure" \
            --report "$RUNNER_TEMP/failure/failure-release.json" \
            --output "$RUNNER_TEMP/failure/failure-producer.json"
      - name: Retain the unsigned failure producer for a fresh attestation runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-failure-unsigned-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove the isolated PostgreSQL dependency
        if: always()
        shell: bash
        env:
          POSTGRES_CONTAINER: latchway-failure-postgres-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          rm -f -- "$RUNNER_TEMP/failure-postgres-password"
          if [[ "$POSTGRES_CONTAINER" =~ ^latchway-failure-postgres-[0-9]+-[0-9]+$ ]]; then
            docker rm --force "$POSTGRES_CONTAINER" >/dev/null 2>&1 || true
          fi

  attest:
    needs: failure
    if: github.ref == 'refs/heads/main'
    environment: release-evidence-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Verify the exact protected release-evidence-signing environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:release-evidence-signing"
      - name: Download the unsigned failure producer without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-failure-unsigned-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure
      - name: Download the independently authenticated failure inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-failure-inputs-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated
      - name: Validate the complete failure producer without candidate code
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/failure"
          manifest="$root/failure-producer.json"
          candidate="$RUNNER_TEMP/authenticated/candidate/latchway-candidate.json"
          source="$RUNNER_TEMP/authenticated/source/latchway-cross-repository.json"
          test -f "$manifest" && test ! -L "$manifest" && test -s "$manifest"
          test -f "$candidate" && test ! -L "$candidate" && test -s "$candidate"
          test -f "$source" && test ! -L "$source" && test -s "$source"
          test -z "$(find "$root" -type l -print -quit)"
          test -z "$(find "$root" -mindepth 1 ! -type d ! -type f -print -quit)"
          candidate_sha=$(sha256sum "$candidate" | awk '{print $1}')
          source_sha=$(sha256sum "$source" | awk '{print $1}')
          jq --exit-status \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --arg candidate_sha "$candidate_sha" \
            --arg source_sha "$source_sha" \
            --slurpfile candidate "$candidate" \
            --slurpfile source "$source" '
              . as $manifest |
              (keys | sort) == ["artifacts","candidate","domain","finished_at","inputs","invocation","kind","primary_report","producer","schema_version","started_at","status"] and
              .schema_version == 1 and
              .kind == "latchway_release_operational_producer_manifest" and
              .domain == "failure" and .status == "passed" and
              (.started_at | type == "string") and (.finished_at | type == "string") and
              (.candidate | keys | sort) == ["contract_bundle_sha256","contract_version","core_commit","intended_tag","oci_index_reference","oci_platform_reference","platform"] and
              .candidate.core_commit == $commit and
              (.candidate.intended_tag | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$")) and
              (.candidate.contract_version | type == "string" and length > 0) and
              (.candidate.contract_bundle_sha256 | test("^[0-9a-f]{64}$")) and
              (.candidate.oci_index_reference | test("^ghcr\\.io/latchway/latchway@sha256:[0-9a-f]{64}$")) and
              (.candidate.oci_platform_reference | test("^ghcr\\.io/latchway/latchway@sha256:[0-9a-f]{64}$")) and
              .candidate.oci_index_reference != .candidate.oci_platform_reference and
              .candidate.platform == "linux/amd64" and
              (.inputs | keys | sort) == ["candidate_manifest_sha256","source_conformance_sha256"] and
              .inputs == {candidate_manifest_sha256:$candidate_sha,source_conformance_sha256:$source_sha} and
              $candidate[0].schema_version == 1 and
              $candidate[0].kind == "latchway_release_candidate" and
              $candidate[0].status == "passed" and
              $candidate[0].candidate_commit == $commit and
              $candidate[0].intended_tag == $manifest.candidate.intended_tag and
              $candidate[0].contract.version == $manifest.candidate.contract_version and
              $candidate[0].contract.bundle_sha256 == $manifest.candidate.contract_bundle_sha256 and
              ($candidate[0].image.repository + "@" + $candidate[0].image.index_digest) == $manifest.candidate.oci_index_reference and
              ($candidate[0].image.repository + "@" + $candidate[0].image.platforms["linux/amd64"]) == $manifest.candidate.oci_platform_reference and
              $source[0].schema_version == 1 and
              $source[0].scope == "source" and $source[0].verdict == "passed" and
              $source[0].source_conformance_passed == true and
              ($source[0].repositories | length) == 5 and
              ($source[0].repositories | map(.id) | sort) == ["android","core","ios","javascript","react_native"] and
              any($source[0].repositories[]; .id == "core" and .commit == $commit and .intended_tag == $manifest.candidate.intended_tag) and
              $source[0].contract.version == $manifest.candidate.contract_version and
              $source[0].contract.bundle_sha256 == $manifest.candidate.contract_bundle_sha256 and
              (.producer | keys | sort) == ["environment","repository","run_attempt","run_id","runner_arch","runner_environment","runner_name_sha256","runner_os","source_commit","workflow_ref"] and
              .producer.repository == "Latchway/latchway" and
              .producer.workflow_ref == "Latchway/latchway/.github/workflows/release-failure-evidence.yml@refs/heads/main" and
              .producer.source_commit == $commit and .producer.run_id == $run and
              .producer.run_attempt == $attempt and
              .producer.environment == "release-failure-evidence" and
              .producer.runner_environment == "self-hosted" and
              .producer.runner_os == "Linux" and .producer.runner_arch == "X64" and
              (.producer.runner_name_sha256 | test("^[0-9a-f]{64}$")) and
              (.invocation | keys | sort) == ["command","configuration"] and
              .invocation.command == ["scripts/run-failure-gates.sh","-scope","release","-external-evidence-dir","$EVIDENCE_DIRECTORY/live-failures","-output","$EVIDENCE_DIRECTORY/failure-release.json"] and
              (.invocation.configuration | map(.path)) == ["failure-matrix.json","failure-environment.json"] and
              all(.invocation.configuration[]; type == "object" and (keys | sort) == ["path","sha256"] and (.sha256 | test("^[0-9a-f]{64}$"))) and
              (.artifacts | type == "array" and length > 0 and length <= 128) and
              all(.artifacts[]; type == "object" and (keys | sort) == ["path","sha256"] and (.path | type == "string") and (.sha256 | test("^[0-9a-f]{64}$"))) and
              (.primary_report | keys | sort) == ["path","sha256"] and
              .primary_report.path == "failure-release.json" and
              any(.artifacts[]; . == $manifest.primary_report) and
              all(.invocation.configuration[]; . as $item | any($manifest.artifacts[]; . == $item))
            ' "$manifest" >/dev/null
          actual="$RUNNER_TEMP/failure-actual-files"
          expected="$RUNNER_TEMP/failure-expected-files"
          find "$root" -type f -print0 | while IFS= read -r -d '' path; do
            relative=${path#"$root/"}
            if [[ "$relative" != failure-producer.json ]]; then printf '%s\n' "$relative"; fi
          done | LC_ALL=C sort > "$actual"
          jq --exit-status --raw-output '.artifacts[] | [.path,.sha256] | @tsv' "$manifest" \
            | while IFS=$'\t' read -r relative expected_sha; do
                [[ "$relative" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
                [[ "/$relative/" != *"/../"* && "/$relative/" != *"/./"* && "$relative" != *"//"* ]]
                test -f "$root/$relative" && test ! -L "$root/$relative"
                test "$(sha256sum "$root/$relative" | awk '{print $1}')" = "$expected_sha"
                printf '%s\n' "$relative"
              done | LC_ALL=C sort > "$expected"
          test -z "$(uniq -d "$expected")"
          cmp --silent "$expected" "$actual"
      - name: Attest the exact failure producer manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/failure/failure-producer.json
      - name: Retain the failure producer attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/failure/failure-producer.attestation.sigstore.json"
      - name: Retain only exact attested destructive-failure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-failure-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
