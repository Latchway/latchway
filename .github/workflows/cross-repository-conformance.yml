name: Cross-repository conformance evidence

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Source alignment, prepublication promotion, or postpublication release proof
        required: true
        default: source
        type: choice
        options: [source, promotion, release]
      core_ref:
        description: Immutable core commit or annotated tag
        required: true
        default: main
        type: string
      javascript_ref:
        description: Immutable JavaScript SDK commit or annotated tag
        required: true
        default: main
        type: string
      ios_ref:
        description: Immutable iOS SDK commit or annotated tag
        required: true
        default: main
        type: string
      android_ref:
        description: Immutable Android SDK commit or annotated tag
        required: true
        default: main
        type: string
      react_native_ref:
        description: Immutable React Native SDK commit or annotated tag
        required: true
        default: main
        type: string
      documentation_ref:
        description: Immutable generated Mintlify documentation commit or annotated tag
        required: true
        default: main
        type: string
      core_release_tag:
        description: Intended core tag for promotion; existing annotated tag for release
        required: false
        type: string
      candidate_oci_image_digest:
        description: Exact ghcr.io/latchway/latchway@sha256 digest for promotion or release
        required: false
        type: string
      external_evidence_run_id:
        description: Required run ID containing combined evidence for promotion or release
        required: false
        type: string
      external_evidence_run_attempt:
        description: Exact combined evidence producer run attempt
        required: false
        type: string

permissions: {}

concurrency:
  group: cross-repository-conformance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  authenticate-inputs:
    if: github.ref == 'refs/heads/main'
    environment: private-sibling-read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      core_commit: ${{ steps.sources.outputs.core_commit }}
      javascript_commit: ${{ steps.sources.outputs.javascript_commit }}
      ios_commit: ${{ steps.sources.outputs.ios_commit }}
      android_commit: ${{ steps.sources.outputs.android_commit }}
      react_native_commit: ${{ steps.sources.outputs.react_native_commit }}
      documentation_commit: ${{ steps.sources.outputs.documentation_commit }}
    steps:
      - name: Validate immutable inputs and fixed GitHub CLI without a checkout
        shell: bash
        env:
          EVIDENCE_SCOPE: ${{ inputs.scope }}
          CORE_RELEASE_TAG: ${{ inputs.core_release_tag }}
          CANDIDATE_OCI_IMAGE_DIGEST: ${{ inputs.candidate_oci_image_digest }}
          EXTERNAL_EVIDENCE_RUN_ID: ${{ inputs.external_evidence_run_id }}
          EXTERNAL_EVIDENCE_RUN_ATTEMPT: ${{ inputs.external_evidence_run_attempt }}
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          case "$EVIDENCE_SCOPE" in source|promotion|release) ;; *) exit 1 ;; esac
          if [[ "$EVIDENCE_SCOPE" == source ]]; then
            test -z "$CORE_RELEASE_TAG"
            test -z "$CANDIDATE_OCI_IMAGE_DIGEST"
            test -z "$EXTERNAL_EVIDENCE_RUN_ID"
            test -z "$EXTERNAL_EVIDENCE_RUN_ATTEMPT"
          else
            [[ "$CORE_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
            [[ "$CANDIDATE_OCI_IMAGE_DIGEST" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
            [[ "$EXTERNAL_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXTERNAL_EVIDENCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi
      - name: Resolve and package authenticated repository objects without a checkout
        id: sources
        shell: bash
        env:
          CORE_REF: ${{ inputs.core_ref }}
          JAVASCRIPT_REF: ${{ inputs.javascript_ref }}
          IOS_REF: ${{ inputs.ios_ref }}
          ANDROID_REF: ${{ inputs.android_ref }}
          REACT_NATIVE_REF: ${{ inputs.react_native_ref }}
          DOCUMENTATION_REF: ${{ inputs.documentation_ref }}
          CORE_TOKEN: ${{ github.token }}
          SIBLING_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN }}
          EVIDENCE_SCOPE: ${{ inputs.scope }}
        run: |
          set -Eeuo pipefail
          umask 077
          archive_root="$RUNNER_TEMP/authenticated-inputs/source-archives"
          mkdir -p "$archive_root" "$RUNNER_TEMP/bare-sources"
          askpass="$RUNNER_TEMP/latchway-git-askpass"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$LATCHWAY_FETCH_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 0700 "$askpass"
          package_repository() {
            local id="$1" repository="$2" requested_ref="$3" token="$4"
            [[ "$requested_ref" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ ]]
            [[ "$requested_ref" != *..* && "$requested_ref" != */ && "$requested_ref" != *//* ]]
            local encoded metadata commit bare
            encoded=$(jq --null-input --raw-output --arg value "$requested_ref" '$value | @uri')
            metadata="$RUNNER_TEMP/$id-commit.json"
            bare="$RUNNER_TEMP/bare-sources/$id.git"
            git init --bare "$bare" >/dev/null
            if [[ -n "$token" ]]; then
              GH_TOKEN="$token" gh api "repos/$repository/commits/$encoded" > "$metadata"
              commit=$(jq --raw-output '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$metadata")
              test -n "$commit"
            else
              GIT_ASKPASS=/bin/false GIT_TERMINAL_PROMPT=0 \
                git -c credential.helper= -C "$bare" fetch --no-tags \
                  "https://github.com/$repository.git" "$requested_ref"
              commit=$(git -C "$bare" rev-parse --verify 'FETCH_HEAD^{commit}')
              [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
              jq --null-input --arg sha "$commit" '{sha: $sha}' > "$metadata"
            fi
            if [[ -n "$token" ]]; then
              GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 LATCHWAY_FETCH_TOKEN="$token" \
                git -C "$bare" fetch --no-tags \
                  "https://github.com/$repository.git" "$commit"
              GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 LATCHWAY_FETCH_TOKEN="$token" \
                git -C "$bare" fetch --force \
                  "https://github.com/$repository.git" '+refs/tags/*:refs/tags/*'
            else
              GIT_ASKPASS=/bin/false GIT_TERMINAL_PROMPT=0 \
                git -c credential.helper= -C "$bare" fetch --force \
                  "https://github.com/$repository.git" '+refs/tags/*:refs/tags/*'
            fi
            git -C "$bare" update-ref refs/heads/authenticated "$commit"
            git -C "$bare" symbolic-ref HEAD refs/heads/authenticated
            GIT_INDEX_FILE="$bare/index" git --git-dir="$bare" read-tree "$commit"
            git --git-dir="$bare" archive --format=tar "$commit" \
              | gzip -n > "$archive_root/$id.source.tar.gz"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -C "$bare" -czf "$archive_root/$id.git.tar.gz" .
            printf '%s_commit=%s\n' "$id" "$commit" >> "$GITHUB_OUTPUT"
          }
          package_repository core Latchway/latchway "$CORE_REF" "$CORE_TOKEN"
          package_repository javascript Latchway/latchway-js "$JAVASCRIPT_REF" "$SIBLING_TOKEN"
          package_repository ios Latchway/latchway-ios-sdk "$IOS_REF" "$SIBLING_TOKEN"
          package_repository android Latchway/latchway-android "$ANDROID_REF" "$SIBLING_TOKEN"
          package_repository react_native Latchway/latchway-react-native-sdk "$REACT_NATIVE_REF" "$SIBLING_TOKEN"
          package_repository documentation Latchway/latchway-docs "$DOCUMENTATION_REF" "$SIBLING_TOKEN"
          core_commit=$(jq --raw-output '.sha' "$RUNNER_TEMP/core-commit.json")
          if [[ "$EVIDENCE_SCOPE" != release ]]; then
            test "$GITHUB_SHA" = "$core_commit"
          fi
          (cd "$RUNNER_TEMP/authenticated-inputs" && \
            sha256sum source-archives/*.tar.gz | LC_ALL=C sort > source-archives.sha256)
      - name: Verify the fixed authenticated aggregate producer run
        if: inputs.scope != 'source'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ steps.sources.outputs.core_commit }}
          EXTERNAL_EVIDENCE_RUN_ID: ${{ inputs.external_evidence_run_id }}
          EXTERNAL_EVIDENCE_RUN_ATTEMPT: ${{ inputs.external_evidence_run_attempt }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXTERNAL_EVIDENCE_RUN_ID/attempts/$EXTERNAL_EVIDENCE_RUN_ATTEMPT" > "$RUNNER_TEMP/aggregate-run.json"
          workflow_id=$(jq --raw-output '.workflow_id | select(type == "number" and . > 0)' "$RUNNER_TEMP/aggregate-run.json")
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --argjson attempt "$EXTERNAL_EVIDENCE_RUN_ATTEMPT" \
            '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .run_attempt == $attempt' \
            "$RUNNER_TEMP/aggregate-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/aggregate-workflow.json"
          jq --exit-status '.path == ".github/workflows/aggregate-release-evidence.yml" and .state == "active"' \
            "$RUNNER_TEMP/aggregate-workflow.json" >/dev/null
      - name: Download independently produced external evidence
        if: inputs.scope != 'source'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-v1-external-evidence-${{ inputs.external_evidence_run_id }}-${{ inputs.external_evidence_run_attempt }}
          path: ${{ runner.temp }}/authenticated-inputs/latchway-external-evidence
          run-id: ${{ inputs.external_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Verify protected producer attestations for release-domain documents
        if: inputs.scope != 'source'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_SCOPE: ${{ inputs.scope }}
          CANDIDATE_COMMIT: ${{ steps.sources.outputs.core_commit }}
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/authenticated-inputs/latchway-external-evidence"
          manifest="$evidence/aggregate-manifest.json"
          gh attestation verify "$manifest" \
            --bundle "$evidence/aggregate-manifest.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aggregate-release-evidence.yml" \
            --source-digest "$CANDIDATE_COMMIT" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/aggregate-attestation-verification.json"
          jq --exit-status --arg scope "$EVIDENCE_SCOPE" --arg commit "$CANDIDATE_COMMIT" '
            .schema_version == 1 and .kind == "latchway_external_evidence_aggregate" and
            .scope == $scope and .candidate_commit == $commit and
            (if $scope == "release" then
              .domains == ["live_sdk_conformance", "physical_devices", "live_provider", "cloud_deployments", "operational_resilience", "supply_chain", "public_tags", "public_registries"]
            else
              .domains == ["live_sdk_conformance", "physical_devices", "live_provider", "cloud_deployments", "operational_resilience", "supply_chain"]
            end)
          ' "$manifest" >/dev/null
          domains=(live_sdk_conformance physical_devices live_provider cloud_deployments operational_resilience supply_chain)
          if [[ "$EVIDENCE_SCOPE" == release ]]; then domains+=(public_tags public_registries); fi
          for domain in "${domains[@]}"; do
            document="$evidence/$domain.json"
            bundle="$evidence/${domain}.attestation.sigstore.json"
            signer=.github/workflows/release-domain-evidence.yml
            if [[ "$domain" == cloud_deployments ]]; then
              signer=.github/workflows/cloud-deployment-aggregate.yml
            elif [[ "$domain" == operational_resilience ]]; then
              signer=.github/workflows/operational-resilience-evidence.yml
            fi
            test -f "$document"; test -f "$bundle"
            gh attestation verify "$document" --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/$signer" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners \
              --format json > "$RUNNER_TEMP/${domain}-attestation-verification.json"
          done
      - name: Seal authenticated conformance inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/authenticated-inputs/verifications"
          install -m 0600 -- "$RUNNER_TEMP"/*-commit.json \
            "$RUNNER_TEMP/authenticated-inputs/verifications/"
          if [[ -f "$RUNNER_TEMP/aggregate-run.json" ]]; then
            install -m 0600 -- "$RUNNER_TEMP/aggregate-run.json" "$RUNNER_TEMP/aggregate-workflow.json" \
              "$RUNNER_TEMP/aggregate-attestation-verification.json" \
              "$RUNNER_TEMP/authenticated-inputs/verifications/"
          fi
      - name: Retain only authenticated inputs for candidate-code execution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-cross-repository-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated-inputs
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  evidence:
    needs: authenticate-inputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download authenticated conformance inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated-inputs
      - name: Materialize exact repositories without repository credentials
        shell: bash
        env:
          CORE_COMMIT: ${{ needs.authenticate-inputs.outputs.core_commit }}
          JAVASCRIPT_COMMIT: ${{ needs.authenticate-inputs.outputs.javascript_commit }}
          IOS_COMMIT: ${{ needs.authenticate-inputs.outputs.ios_commit }}
          ANDROID_COMMIT: ${{ needs.authenticate-inputs.outputs.android_commit }}
          REACT_NATIVE_COMMIT: ${{ needs.authenticate-inputs.outputs.react_native_commit }}
          DOCUMENTATION_COMMIT: ${{ needs.authenticate-inputs.outputs.documentation_commit }}
        run: |
          set -Eeuo pipefail
          (cd "$RUNNER_TEMP/authenticated-inputs" && sha256sum --check source-archives.sha256)
          materialize() {
            local id="$1" destination="$2" expected="$3"
            mkdir -p "$destination/.git"
            tar -xzf "$RUNNER_TEMP/authenticated-inputs/source-archives/$id.source.tar.gz" -C "$destination"
            tar -xzf "$RUNNER_TEMP/authenticated-inputs/source-archives/$id.git.tar.gz" -C "$destination/.git"
            git -C "$destination" config core.bare false
            git -C "$destination" config core.worktree "$destination"
            test "$(git -C "$destination" rev-parse --verify HEAD)" = "$expected"
            test -z "$(git -C "$destination" status --porcelain=v1 --untracked-files=all)"
          }
          materialize core "$GITHUB_WORKSPACE/latchway" "$CORE_COMMIT"
          materialize javascript "$GITHUB_WORKSPACE/latchway-js" "$JAVASCRIPT_COMMIT"
          materialize ios "$GITHUB_WORKSPACE/latchway-ios-sdk" "$IOS_COMMIT"
          materialize android "$GITHUB_WORKSPACE/latchway-android" "$ANDROID_COMMIT"
          materialize react_native "$GITHUB_WORKSPACE/latchway-react-native-sdk" "$REACT_NATIVE_COMMIT"
          materialize documentation "$GITHUB_WORKSPACE/latchway-docs" "$DOCUMENTATION_COMMIT"
      - name: Produce source or release evidence
        shell: bash
        env:
          EVIDENCE_SCOPE: ${{ inputs.scope }}
          CORE_RELEASE_TAG: ${{ inputs.core_release_tag }}
          CANDIDATE_OCI_IMAGE_DIGEST: ${{ inputs.candidate_oci_image_digest }}
          AUTHENTICATED_CORE_COMMIT: ${{ needs.authenticate-inputs.outputs.core_commit }}
        run: |
          set -Eeuo pipefail
          core_commit=$(git -C "$GITHUB_WORKSPACE/latchway" rev-parse --verify HEAD)
          test "$core_commit" = "$AUTHENTICATED_CORE_COMMIT"
          arguments=(
            --workspace-root "$GITHUB_WORKSPACE"
            --core-repo "$GITHUB_WORKSPACE/latchway"
            --javascript-repo "$GITHUB_WORKSPACE/latchway-js"
            --ios-repo "$GITHUB_WORKSPACE/latchway-ios-sdk"
            --android-repo "$GITHUB_WORKSPACE/latchway-android"
            --react-native-repo "$GITHUB_WORKSPACE/latchway-react-native-sdk"
            --documentation-repo "$GITHUB_WORKSPACE/latchway-docs"
            --scope "$EVIDENCE_SCOPE"
            --output "$RUNNER_TEMP/latchway-cross-repository.json"
          )
          if [[ "$EVIDENCE_SCOPE" != source ]]; then
            arguments+=(--release-tag "$CORE_RELEASE_TAG" --oci-image-digest "$CANDIDATE_OCI_IMAGE_DIGEST" \
              --external-evidence-dir "$RUNNER_TEMP/authenticated-inputs/latchway-external-evidence")
          fi
          python3 latchway/scripts/framework_conformance.py \
            --aggregate \
            --report latchway-js/conformance/framework-report.json \
            --report latchway-ios-sdk/Conformance/framework-report.json \
            --report latchway-android/Conformance/framework-report.json \
            --report latchway-react-native-sdk/Conformance/framework-report.json
          python3 latchway/scripts/cross-repo-conformance.py "${arguments[@]}"
      - name: Retain unsigned conformance output for a fresh attestor
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-cross-repository-unsigned-${{ inputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/latchway-cross-repository.json
            ${{ runner.temp }}/latchway-cross-repository.json.junit.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  attest:
    needs: [authenticate-inputs, evidence]
    if: github.ref == 'refs/heads/main'
    environment: release-evidence-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download unsigned conformance output on a fresh no-checkout runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-unsigned-${{ inputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unsigned
      - name: Download authority-authenticated external evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated-inputs
      - name: Validate fixed conformance coordinates without candidate code or credentials
        shell: bash
        env:
          EVIDENCE_SCOPE: ${{ inputs.scope }}
          CORE_RELEASE_TAG: ${{ inputs.core_release_tag }}
          CANDIDATE_OCI_IMAGE_DIGEST: ${{ inputs.candidate_oci_image_digest }}
          CORE_COMMIT: ${{ needs.authenticate-inputs.outputs.core_commit }}
          JAVASCRIPT_COMMIT: ${{ needs.authenticate-inputs.outputs.javascript_commit }}
          IOS_COMMIT: ${{ needs.authenticate-inputs.outputs.ios_commit }}
          ANDROID_COMMIT: ${{ needs.authenticate-inputs.outputs.android_commit }}
          REACT_NATIVE_COMMIT: ${{ needs.authenticate-inputs.outputs.react_native_commit }}
          DOCUMENTATION_COMMIT: ${{ needs.authenticate-inputs.outputs.documentation_commit }}
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/unsigned/latchway-cross-repository.json"
          junit="$RUNNER_TEMP/unsigned/latchway-cross-repository.json.junit.xml"
          test -f "$report" && test ! -L "$report" && test -s "$report"
          test -f "$junit" && test ! -L "$junit" && test -s "$junit"
          test "$(find "$RUNNER_TEMP/unsigned" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          jq --exit-status \
            --arg scope "$EVIDENCE_SCOPE" \
            --arg core "$CORE_COMMIT" \
            --arg javascript "$JAVASCRIPT_COMMIT" \
            --arg ios "$IOS_COMMIT" \
            --arg android "$ANDROID_COMMIT" \
            --arg react_native "$REACT_NATIVE_COMMIT" \
            --arg documentation "$DOCUMENTATION_COMMIT" '
              .schema_version == 1 and
              .kind == "latchway_cross_repository_conformance_evidence" and
              .scope == $scope and .verdict == "passed" and
              .source_conformance_passed == true and
              (.repositories | type == "array" and length == 5) and
              ([.repositories[] | .id] | sort) == ["android", "core", "ios", "javascript", "react_native"] and
              ([.repositories[] | select(.id == "core" and .commit == $core)] | length == 1) and
              ([.repositories[] | select(.id == "javascript" and .commit == $javascript)] | length == 1) and
              ([.repositories[] | select(.id == "ios" and .commit == $ios)] | length == 1) and
              ([.repositories[] | select(.id == "android" and .commit == $android)] | length == 1) and
              ([.repositories[] | select(.id == "react_native" and .commit == $react_native)] | length == 1) and
              .documentation == {
                "repository": "https://github.com/Latchway/latchway-docs.git",
                "commit": $documentation,
                "canonical_core_commit": $core,
                "source_commit": .documentation.source_commit,
                "source_manifest_sha256": .documentation.source_manifest_sha256,
                "source_tree_sha256": .documentation.source_tree_sha256,
                "owned_file_count": .documentation.owned_file_count
              } and
              (.documentation.source_commit | type == "string" and test("^[0-9a-f]{40}$")) and
              (.documentation.source_manifest_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
              (.documentation.source_tree_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
              (.documentation.owned_file_count | type == "number" and floor == . and . >= 1 and . <= 4096) and
              ([.checks[] | select(.required == true and .status != "passed")] | length == 0)
            ' "$report" >/dev/null
          if [[ "$EVIDENCE_SCOPE" == source ]]; then
            jq --exit-status '.promotion_ready == false and .release_ready == false' "$report" >/dev/null
          elif [[ "$EVIDENCE_SCOPE" == promotion ]]; then
            jq --exit-status --arg tag "$CORE_RELEASE_TAG" --arg image "$CANDIDATE_OCI_IMAGE_DIGEST" '
              .promotion_ready == true and .release_ready == false and
              .contract.core_release == $tag and .contract.oci_image_digest == $image
            ' "$report" >/dev/null
          else
            jq --exit-status --arg tag "$CORE_RELEASE_TAG" --arg image "$CANDIDATE_OCI_IMAGE_DIGEST" '
              .promotion_ready == true and .release_ready == true and
              .contract.core_release == $tag and .contract.oci_image_digest == $image and
              ([.evidence_domains[] | select((.id == "public_tags" or .id == "public_registries") and .required == true and .status == "passed")] | length == 2)
            ' "$report" >/dev/null
          fi
      - name: Attest the exact conformance report
        id: conformance-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/unsigned/latchway-cross-repository.json
      - name: Retain the conformance attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.conformance-attestation.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/unsigned/latchway-cross-repository.attestation.sigstore.json"
      - name: Retain deterministic JSON and JUnit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-cross-repository-${{ inputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unsigned/latchway-cross-repository.json
            ${{ runner.temp }}/unsigned/latchway-cross-repository.json.junit.xml
            ${{ runner.temp }}/unsigned/latchway-cross-repository.attestation.sigstore.json
            ${{ runner.temp }}/authenticated-inputs/latchway-external-evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
