name: Protected exact-candidate load evidence

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact 40-character core candidate commit
        required: true
        type: string
      candidate_run_id:
        description: Successful immutable-candidate workflow run ID
        required: true
        type: string
      source_conformance_run_id:
        description: Successful source-conformance workflow run ID
        required: true
        type: string

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: read

concurrency:
  group: release-load-evidence-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  load:
    if: github.ref == 'refs/heads/main'
    environment: release-load-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact candidate producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact main source and fixed upstream runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_conformance_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REPOSITORY" = Latchway/latchway
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          for specification in \
            "$CANDIDATE_RUN_ID:.github/workflows/release.yml" \
            "$SOURCE_RUN_ID:.github/workflows/cross-repository-conformance.yml"; do
            run_id=${specification%%:*}
            expected_path=${specification#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/run-$run_id.json"
            workflow_id=$(jq --raw-output .workflow_id "$RUNNER_TEMP/run-$run_id.json")
            jq --exit-status --arg commit "$CANDIDATE_COMMIT" \
              '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main"' \
              "$RUNNER_TEMP/run-$run_id.json" >/dev/null
            [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/workflow-$run_id.json"
            jq --exit-status --arg path "$expected_path" \
              '.path == $path and .state == "active"' "$RUNNER_TEMP/workflow-$run_id.json" >/dev/null
          done
      - name: Download exact candidate artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact source-conformance artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-source
          path: ${{ runner.temp }}/source
          run-id: ${{ inputs.source_conformance_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact candidate and source attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --bundle "$RUNNER_TEMP/candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "$RUNNER_TEMP/source/latchway-cross-repository.json" \
            --bundle "$RUNNER_TEMP/source/latchway-cross-repository.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Resolve exact index and executed amd64 child
        id: candidate
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          manifest="$RUNNER_TEMP/candidate/latchway-candidate.json"
          tag=$(jq --raw-output .intended_tag "$manifest")
          python3 scripts/release-candidate.py --verify \
            --manifest "$manifest" --commit "$CANDIDATE_COMMIT" --tag "$tag" \
            --image ghcr.io/latchway/latchway
          index="$(jq --raw-output '.image.repository + "@" + .image.index_digest' "$manifest")"
          amd64="$(jq --raw-output '.image.repository + "@" + .image.platforms["linux/amd64"]' "$manifest")"
          [[ "$index" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          [[ "$amd64" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          test "$index" != "$amd64"
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "amd64=$amd64" >> "$GITHUB_OUTPUT"
      - name: Authenticate for immutable candidate pull
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute the fixed six-gate release load plan
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_INDEX: ${{ steps.candidate.outputs.index }}
          CANDIDATE_AMD64: ${{ steps.candidate.outputs.amd64 }}
        run: |
          set -Eeuo pipefail
          scripts/run-local-load-gates.sh \
            -acknowledge-load \
            -evidence-dir "$RUNNER_TEMP/release-load" \
            -release-image "$CANDIDATE_INDEX" \
            -release-platform-image "$CANDIDATE_AMD64" \
            -core-commit "$CANDIDATE_COMMIT"
      - name: Seal the exact producer and every raw checksum
        shell: bash
        env:
          LATCHWAY_RELEASE_EVIDENCE_ENVIRONMENT: release-load-evidence
        run: |
          python3 scripts/operational-producer-evidence.py \
            --domain load \
            --source-conformance "$RUNNER_TEMP/source/latchway-cross-repository.json" \
            --candidate-manifest "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --evidence-directory "$RUNNER_TEMP/release-load" \
            --report "$RUNNER_TEMP/release-load/load-v1.json" \
            --output "$RUNNER_TEMP/release-load/load-producer.json"
      - name: Attest the exact load producer manifest
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/release-load/load-producer.json
      - name: Retain the load producer attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/release-load/load-producer.attestation.sigstore.json"
      - name: Retain only exact attested release-load evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-load-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/release-load
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
