name: Protected exact-candidate load evidence

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact 40-character core candidate commit
        required: true
        type: string
      candidate_run_id:
        description: Successful immutable-candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact immutable-candidate workflow run attempt
        required: true
        type: string
      source_conformance_run_id:
        description: Successful source-conformance workflow run ID
        required: true
        type: string
      source_conformance_run_attempt:
        description: Exact source-conformance workflow run attempt
        required: true
        type: string

permissions: {}

concurrency:
  group: release-load-evidence-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  authenticate:
    if: github.ref == 'refs/heads/main'
    environment: release-load-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Require a fixed GitHub CLI and immutable inputs without a checkout
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_conformance_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_conformance_run_attempt }}
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REPOSITORY" = Latchway/latchway
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
      - name: Authenticate the exact candidate and source runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_conformance_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_conformance_run_attempt }}
        run: |
          set -Eeuo pipefail
          for specification in \
            "$CANDIDATE_RUN_ID:$CANDIDATE_RUN_ATTEMPT:.github/workflows/release.yml" \
            "$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT:.github/workflows/cross-repository-conformance.yml"; do
            run_id=${specification%%:*}
            remainder=${specification#*:}
            attempt=${remainder%%:*}
            expected_path=${remainder#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt" > "$RUNNER_TEMP/run-$run_id.json"
            workflow_id=$(jq --raw-output .workflow_id "$RUNNER_TEMP/run-$run_id.json")
            jq --exit-status --arg commit "$CANDIDATE_COMMIT" --argjson attempt "$attempt" \
              '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .run_attempt == $attempt' \
              "$RUNNER_TEMP/run-$run_id.json" >/dev/null
            [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/workflow-$run_id.json"
            jq --exit-status --arg path "$expected_path" \
              '.path == $path and .state == "active"' "$RUNNER_TEMP/workflow-$run_id.json" >/dev/null
          done
      - name: Download exact candidate artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact source-conformance artifact and bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-source-${{ inputs.source_conformance_run_id }}-${{ inputs.source_conformance_run_attempt }}
          path: ${{ runner.temp }}/source
          run-id: ${{ inputs.source_conformance_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact candidate and source attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/candidate/latchway-candidate.json" \
            --bundle "$RUNNER_TEMP/candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "$RUNNER_TEMP/source/latchway-cross-repository.json" \
            --bundle "$RUNNER_TEMP/source/latchway-cross-repository.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --signer-digest "$CANDIDATE_COMMIT" \
            --source-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Authenticate only this no-checkout runner for immutable image export
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Export a bounded candidate and PostgreSQL archive without candidate code
        id: image-export
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          manifest="$RUNNER_TEMP/candidate/latchway-candidate.json"
          candidate_manifest_sha=$(sha256sum "$manifest" | awk '{print $1}')
          candidate_platform=$(jq --exit-status --raw-output --arg commit "$CANDIDATE_COMMIT" '
            select(
              .schema_version == 1 and .kind == "latchway_release_candidate" and
              .status == "passed" and .candidate_commit == $commit and
              .image.repository == "ghcr.io/latchway/latchway" and
              (.image.platforms["linux/amd64"] | test("^sha256:[0-9a-f]{64}$"))
            ) |
            .image.repository + "@" + .image.platforms["linux/amd64"]
          ' "$manifest")
          [[ "$candidate_platform" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          postgres_source=docker.io/library/postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          docker pull --platform linux/amd64 "$candidate_platform" >/dev/null
          docker pull --platform linux/amd64 "$postgres_source" >/dev/null
          candidate_id=$(docker image inspect --format '{{.Id}}' "$candidate_platform")
          postgres_id=$(docker image inspect --format '{{.Id}}' "$postgres_source")
          [[ "$candidate_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$postgres_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$candidate_id" != "$postgres_id"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$candidate_platform")" = "$CANDIDATE_COMMIT"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate_platform")" = linux/amd64
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$postgres_source")" = linux/amd64
          candidate_local="latchway-preloaded-candidate:${candidate_id#sha256:}"
          postgres_local="latchway-preloaded-postgres:${postgres_id#sha256:}"
          docker tag "$candidate_platform" "$candidate_local"
          docker tag "$postgres_source" "$postgres_local"
          root="$RUNNER_TEMP/release-load-images"
          mkdir -p "$root"
          docker save --output "$root/preloaded-images.tar" "$candidate_local" "$postgres_local"
          archive="$root/preloaded-images.tar"
          archive_size=$(stat --format=%s "$archive")
          (( archive_size >= 1024 && archive_size <= 2147483648 ))
          archive_sha=$(sha256sum "$archive" | awk '{print $1}')
          jq -n \
            --arg candidate_manifest_sha256 "$candidate_manifest_sha" \
            --arg candidate_oci_platform_reference "$candidate_platform" \
            --arg candidate_local_reference "$candidate_local" \
            --arg candidate_image_id "$candidate_id" \
            --arg candidate_revision "$CANDIDATE_COMMIT" \
            --arg postgres_source_reference "$postgres_source" \
            --arg postgres_local_reference "$postgres_local" \
            --arg postgres_image_id "$postgres_id" \
            --arg archive_sha256 "$archive_sha" \
            --argjson archive_size_bytes "$archive_size" '
              {
                schema_version: 1,
                kind: "latchway_preloaded_image_archive",
                candidate_manifest_sha256: $candidate_manifest_sha256,
                archive: {
                  path: "preloaded-images.tar",
                  sha256: $archive_sha256,
                  size_bytes: $archive_size_bytes
                },
                images: {
                  candidate: {
                    oci_platform_reference: $candidate_oci_platform_reference,
                    local_reference: $candidate_local_reference,
                    image_id: $candidate_image_id,
                    revision: $candidate_revision,
                    platform: "linux/amd64"
                  },
                  postgres: {
                    source_reference: $postgres_source_reference,
                    local_reference: $postgres_local_reference,
                    image_id: $postgres_image_id,
                    platform: "linux/amd64"
                  }
                }
              }
            ' > "$root/preloaded-images.json"
          test "$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          chmod 0444 "$root/preloaded-images.json" "$archive"
      - name: Upload the bounded preloaded image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-load-images-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-load-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove the no-checkout runner registry credential
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
      - name: Retain only authenticated producer inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release-load-authenticated"
          cp -R -- "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/source" \
            "$RUNNER_TEMP/release-load-authenticated/"
      - name: Upload authenticated producer inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-load-inputs-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-load-authenticated/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  load:
    needs: authenticate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact candidate producer without retained credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download only authenticated producer inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-load-inputs-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated
      - name: Download the bounded preloaded image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-load-images-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preloaded-images
      - name: Require the exact credential-free candidate checkout
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test "$GITHUB_REPOSITORY" = Latchway/latchway
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Initialize an empty credential-free Docker client state
        shell: bash
        run: |
          set -Eeuo pipefail
          config="$RUNNER_TEMP/credential-free-docker"
          mkdir -p "$config"
          chmod 0700 "$config"
          test -z "$(find "$config" -mindepth 1 -print -quit)"
          printf 'DOCKER_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Import and verify exact images without a registry credential or pull
        id: preloaded
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/preloaded-images"
          receipt="$root/preloaded-images.json"
          archive="$root/preloaded-images.tar"
          manifest="$RUNNER_TEMP/authenticated/candidate/latchway-candidate.json"
          test -f "$receipt" && test ! -L "$receipt" && test -s "$receipt"
          test -f "$archive" && test ! -L "$archive" && test -s "$archive"
          test -z "$(find "$root" -type l -print -quit)"
          test -z "$(find "$root" -mindepth 1 ! -type f -print -quit)"
          test "$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          candidate_manifest_sha=$(sha256sum "$manifest" | awk '{print $1}')
          expected_platform=$(jq --raw-output '.image.repository + "@" + .image.platforms["linux/amd64"]' "$manifest")
          archive_size=$(stat --format=%s "$archive")
          archive_sha=$(sha256sum "$archive" | awk '{print $1}')
          jq --exit-status \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg manifest_sha "$candidate_manifest_sha" \
            --arg platform "$expected_platform" \
            --arg archive_sha "$archive_sha" \
            --argjson archive_size "$archive_size" '
              (keys | sort) == ["archive","candidate_manifest_sha256","images","kind","schema_version"] and
              .schema_version == 1 and .kind == "latchway_preloaded_image_archive" and
              .candidate_manifest_sha256 == $manifest_sha and
              .archive == {path:"preloaded-images.tar",sha256:$archive_sha,size_bytes:$archive_size} and
              ($archive_size >= 1024 and $archive_size <= 2147483648) and
              (.images | keys | sort) == ["candidate","postgres"] and
              (.images.candidate | keys | sort) == ["image_id","local_reference","oci_platform_reference","platform","revision"] and
              .images.candidate.oci_platform_reference == $platform and
              (.images.candidate.local_reference | test("^latchway-preloaded-candidate:[0-9a-f]{64}$")) and
              (.images.candidate.image_id | test("^sha256:[0-9a-f]{64}$")) and
              .images.candidate.revision == $commit and .images.candidate.platform == "linux/amd64" and
              (.images.postgres | keys | sort) == ["image_id","local_reference","platform","source_reference"] and
              .images.postgres.source_reference == "docker.io/library/postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2" and
              (.images.postgres.local_reference | test("^latchway-preloaded-postgres:[0-9a-f]{64}$")) and
              (.images.postgres.image_id | test("^sha256:[0-9a-f]{64}$")) and
              .images.postgres.platform == "linux/amd64" and
              .images.candidate.image_id != .images.postgres.image_id
            ' "$receipt" >/dev/null
          mkdir -p "$DOCKER_CONFIG"
          chmod 0700 "$DOCKER_CONFIG"
          if [[ -s "$DOCKER_CONFIG/config.json" ]]; then
            jq --exit-status '((.auths // {}) | length) == 0 and ((.credHelpers // {}) | length) == 0 and (.credsStore // "") == ""' "$DOCKER_CONFIG/config.json" >/dev/null
          fi
          docker load --input "$archive" >/dev/null
          candidate_id=$(jq --raw-output .images.candidate.image_id "$receipt")
          postgres_id=$(jq --raw-output .images.postgres.image_id "$receipt")
          test "$(docker image inspect --format '{{.Id}}' "$candidate_id")" = "$candidate_id"
          test "$(docker image inspect --format '{{.Id}}' "$postgres_id")" = "$postgres_id"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$candidate_id")" = "$CANDIDATE_COMMIT"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate_id")" = linux/amd64
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$postgres_id")" = linux/amd64
          echo "candidate_id=$candidate_id" >> "$GITHUB_OUTPUT"
          echo "postgres_id=$postgres_id" >> "$GITHUB_OUTPUT"
      - name: Resolve exact index and executed amd64 child
        id: candidate
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          manifest="$RUNNER_TEMP/authenticated/candidate/latchway-candidate.json"
          tag=$(jq --raw-output .intended_tag "$manifest")
          python3 scripts/release-candidate.py --verify \
            --manifest "$manifest" --commit "$CANDIDATE_COMMIT" --tag "$tag" \
            --image ghcr.io/latchway/latchway
          index="$(jq --raw-output '.image.repository + "@" + .image.index_digest' "$manifest")"
          amd64="$(jq --raw-output '.image.repository + "@" + .image.platforms["linux/amd64"]' "$manifest")"
          [[ "$index" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          [[ "$amd64" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          test "$index" != "$amd64"
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "amd64=$amd64" >> "$GITHUB_OUTPUT"
      - name: Execute the fixed six-gate release load plan
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_INDEX: ${{ steps.candidate.outputs.index }}
          CANDIDATE_AMD64: ${{ steps.candidate.outputs.amd64 }}
          CANDIDATE_LOCAL_IMAGE_ID: ${{ steps.preloaded.outputs.candidate_id }}
          POSTGRES_LOCAL_IMAGE_ID: ${{ steps.preloaded.outputs.postgres_id }}
        run: |
          set -Eeuo pipefail
          scripts/run-local-load-gates.sh \
            -acknowledge-load \
            -evidence-dir "$RUNNER_TEMP/release-load" \
            -release-image "$CANDIDATE_INDEX" \
            -release-platform-image "$CANDIDATE_AMD64" \
            -preloaded-platform-image-id "$CANDIDATE_LOCAL_IMAGE_ID" \
            -preloaded-postgres-image-id "$POSTGRES_LOCAL_IMAGE_ID" \
            -core-commit "$CANDIDATE_COMMIT"
      - name: Seal the exact producer and every raw checksum
        shell: bash
        env:
          LATCHWAY_RELEASE_EVIDENCE_ENVIRONMENT: release-load-evidence
        run: |
          python3 scripts/operational-producer-evidence.py \
            --domain load \
            --source-conformance "$RUNNER_TEMP/authenticated/source/latchway-cross-repository.json" \
            --candidate-manifest "$RUNNER_TEMP/authenticated/candidate/latchway-candidate.json" \
            --evidence-directory "$RUNNER_TEMP/release-load" \
            --report "$RUNNER_TEMP/release-load/load-v1.json" \
            --output "$RUNNER_TEMP/release-load/load-producer.json"
      - name: Retain the unsigned load producer for a fresh attestation runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-load-unsigned-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-load/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  attest:
    needs: load
    if: github.ref == 'refs/heads/main'
    environment: release-evidence-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download the unsigned load producer without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-load-unsigned-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-load
      - name: Download the independently authenticated load inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-release-load-inputs-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated
      - name: Validate the complete load producer without candidate code
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/release-load"
          manifest="$root/load-producer.json"
          candidate="$RUNNER_TEMP/authenticated/candidate/latchway-candidate.json"
          source="$RUNNER_TEMP/authenticated/source/latchway-cross-repository.json"
          test -f "$manifest" && test ! -L "$manifest" && test -s "$manifest"
          test -f "$candidate" && test ! -L "$candidate" && test -s "$candidate"
          test -f "$source" && test ! -L "$source" && test -s "$source"
          test -z "$(find "$root" -type l -print -quit)"
          test -z "$(find "$root" -mindepth 1 ! -type d ! -type f -print -quit)"
          candidate_sha=$(sha256sum "$candidate" | awk '{print $1}')
          source_sha=$(sha256sum "$source" | awk '{print $1}')
          jq --exit-status \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --arg candidate_sha "$candidate_sha" \
            --arg source_sha "$source_sha" \
            --slurpfile candidate "$candidate" \
            --slurpfile source "$source" '
              . as $manifest |
              (keys | sort) == ["artifacts","candidate","domain","finished_at","inputs","invocation","kind","primary_report","producer","schema_version","started_at","status"] and
              .schema_version == 1 and
              .kind == "latchway_release_operational_producer_manifest" and
              .domain == "load" and .status == "passed" and
              (.started_at | type == "string") and (.finished_at | type == "string") and
              (.candidate | keys | sort) == ["contract_bundle_sha256","contract_version","core_commit","intended_tag","oci_index_reference","oci_platform_reference","platform"] and
              .candidate.core_commit == $commit and
              (.candidate.intended_tag | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$")) and
              (.candidate.contract_version | type == "string" and length > 0) and
              (.candidate.contract_bundle_sha256 | test("^[0-9a-f]{64}$")) and
              (.candidate.oci_index_reference | test("^ghcr\\.io/latchway/latchway@sha256:[0-9a-f]{64}$")) and
              (.candidate.oci_platform_reference | test("^ghcr\\.io/latchway/latchway@sha256:[0-9a-f]{64}$")) and
              .candidate.oci_index_reference != .candidate.oci_platform_reference and
              .candidate.platform == "linux/amd64" and
              (.inputs | keys | sort) == ["candidate_manifest_sha256","source_conformance_sha256"] and
              .inputs == {candidate_manifest_sha256:$candidate_sha,source_conformance_sha256:$source_sha} and
              $candidate[0].schema_version == 1 and
              $candidate[0].kind == "latchway_release_candidate" and
              $candidate[0].status == "passed" and
              $candidate[0].candidate_commit == $commit and
              $candidate[0].intended_tag == $manifest.candidate.intended_tag and
              $candidate[0].contract.version == $manifest.candidate.contract_version and
              $candidate[0].contract.bundle_sha256 == $manifest.candidate.contract_bundle_sha256 and
              ($candidate[0].image.repository + "@" + $candidate[0].image.index_digest) == $manifest.candidate.oci_index_reference and
              ($candidate[0].image.repository + "@" + $candidate[0].image.platforms["linux/amd64"]) == $manifest.candidate.oci_platform_reference and
              $source[0].schema_version == 1 and
              $source[0].scope == "source" and $source[0].verdict == "passed" and
              $source[0].source_conformance_passed == true and
              ($source[0].repositories | length) == 5 and
              ($source[0].repositories | map(.id) | sort) == ["android","core","ios","javascript","react_native"] and
              any($source[0].repositories[]; .id == "core" and .commit == $commit and .intended_tag == $manifest.candidate.intended_tag) and
              $source[0].contract.version == $manifest.candidate.contract_version and
              $source[0].contract.bundle_sha256 == $manifest.candidate.contract_bundle_sha256 and
              (.producer | keys | sort) == ["environment","repository","run_attempt","run_id","runner_arch","runner_environment","runner_name_sha256","runner_os","source_commit","workflow_ref"] and
              .producer.repository == "Latchway/latchway" and
              .producer.workflow_ref == "Latchway/latchway/.github/workflows/release-load-evidence.yml@refs/heads/main" and
              .producer.source_commit == $commit and .producer.run_id == $run and
              .producer.run_attempt == $attempt and
              .producer.environment == "release-load-evidence" and
              .producer.runner_environment == "github-hosted" and
              .producer.runner_os == "Linux" and .producer.runner_arch == "X64" and
              (.producer.runner_name_sha256 | test("^[0-9a-f]{64}$")) and
              (.invocation | keys | sort) == ["command","configuration"] and
              .invocation.command == ["scripts/run-local-load-gates.sh","-acknowledge-load","-evidence-dir","$EVIDENCE_DIRECTORY","-release-image",$manifest.candidate.oci_index_reference,"-release-platform-image",$manifest.candidate.oci_platform_reference,"-core-commit",$commit] and
              (.invocation.configuration | map(.path)) == ["load-config.json","environment.json"] and
              all(.invocation.configuration[]; type == "object" and (keys | sort) == ["path","sha256"] and (.sha256 | test("^[0-9a-f]{64}$"))) and
              (.artifacts | type == "array" and length > 0 and length <= 128) and
              all(.artifacts[]; type == "object" and (keys | sort) == ["path","sha256"] and (.path | type == "string") and (.sha256 | test("^[0-9a-f]{64}$"))) and
              (.primary_report | keys | sort) == ["path","sha256"] and
              .primary_report.path == "load-v1.json" and
              any(.artifacts[]; . == $manifest.primary_report) and
              all(.invocation.configuration[]; . as $item | any($manifest.artifacts[]; . == $item))
            ' "$manifest" >/dev/null
          actual="$RUNNER_TEMP/load-actual-files"
          expected="$RUNNER_TEMP/load-expected-files"
          find "$root" -type f -print0 | while IFS= read -r -d '' path; do
            relative=${path#"$root/"}
            if [[ "$relative" != load-producer.json ]]; then printf '%s\n' "$relative"; fi
          done | LC_ALL=C sort > "$actual"
          jq --exit-status --raw-output '.artifacts[] | [.path,.sha256] | @tsv' "$manifest" \
            | while IFS=$'\t' read -r relative expected_sha; do
                [[ "$relative" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
                [[ "/$relative/" != *"/../"* && "/$relative/" != *"/./"* && "$relative" != *"//"* ]]
                test -f "$root/$relative" && test ! -L "$root/$relative"
                test "$(sha256sum "$root/$relative" | awk '{print $1}')" = "$expected_sha"
                printf '%s\n' "$relative"
              done | LC_ALL=C sort > "$expected"
          test -z "$(uniq -d "$expected")"
          cmp --silent "$expected" "$actual"
      - name: Attest the exact load producer manifest
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/release-load/load-producer.json
      - name: Retain the load producer attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/release-load/load-producer.attestation.sigstore.json"
      - name: Retain only exact attested release-load evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-release-load-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-load
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
