name: Promote proven release

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact candidate commit produced by the candidate workflow
        required: true
        type: string
      intended_tag:
        description: Exact public core tag bound into promotion evidence
        required: true
        type: string
      candidate_run_id:
        description: Candidate workflow run containing the attested candidate manifest
        required: true
        type: string
      candidate_run_attempt:
        description: Exact candidate workflow run attempt
        required: true
        type: string
      security_evidence_run_id:
        description: Exact successful security-evidence workflow run ID
        required: true
        type: string
      security_evidence_run_attempt:
        description: Exact successful security-evidence run attempt
        required: true
        type: string
      promotion_evidence_run_id:
        description: Cross-repository workflow run containing attested promotion evidence
        required: true
        type: string
      promotion_evidence_run_attempt:
        description: Exact cross-repository promotion-evidence run attempt
        required: true
        type: string

permissions: {}

concurrency:
  # Every stable release shares moving OCI aliases, so promotions must serialize
  # across versions rather than merely across retries of one tag.
  group: promote-stable-oci-aliases
  cancel-in-progress: false

jobs:
  authenticate-inputs:
    if: github.ref == 'refs/heads/main'
    environment: security-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Verify the exact protected security-evidence environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:security-evidence"
      - name: Validate immutable inputs and fixed GitHub CLI without a checkout
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          SECURITY_RUN_ID: ${{ inputs.security_evidence_run_id }}
          SECURITY_RUN_ATTEMPT: ${{ inputs.security_evidence_run_attempt }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_evidence_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_evidence_run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENDED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          for value in "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" \
            "$SECURITY_RUN_ID" "$SECURITY_RUN_ATTEMPT" \
            "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
      - name: Authenticate exact producer runs without candidate code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          SECURITY_RUN_ID: ${{ inputs.security_evidence_run_id }}
          SECURITY_RUN_ATTEMPT: ${{ inputs.security_evidence_run_attempt }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_evidence_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_evidence_run_attempt }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/authenticated-inputs/run-verification"
          verify_run() {
            local label="$1" run_id="$2" run_attempt="$3" expected_path="$4"
            local run="$RUNNER_TEMP/authenticated-inputs/run-verification/$label-run.json"
            local workflow="$RUNNER_TEMP/authenticated-inputs/run-verification/$label-workflow.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$run_attempt" > "$run"
            jq --exit-status --arg commit "$CANDIDATE_COMMIT" --argjson attempt "$run_attempt" \
              '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .run_attempt == $attempt' \
              "$run" >/dev/null
            workflow_id=$(jq --raw-output '.workflow_id | select(type == "number" and . > 0)' "$run")
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$workflow"
            jq --exit-status --arg path "$expected_path" '.path == $path and .state == "active"' "$workflow" >/dev/null
          }
          verify_run candidate "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" .github/workflows/release.yml
          verify_run security "$SECURITY_RUN_ID" "$SECURITY_RUN_ATTEMPT" .github/workflows/security.yml
          verify_run promotion "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT" .github/workflows/cross-repository-conformance.yml
      - name: Download the immutable candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-candidate-${{ inputs.candidate_commit }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/authenticated-inputs/latchway-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact current-candidate security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-security-${{ inputs.candidate_commit }}-${{ inputs.security_evidence_run_id }}-${{ inputs.security_evidence_run_attempt }}
          path: ${{ runner.temp }}/authenticated-inputs/latchway-security
          run-id: ${{ inputs.security_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Download the aggregate promotion evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-cross-repository-promotion-${{ inputs.promotion_evidence_run_id }}-${{ inputs.promotion_evidence_run_attempt }}
          path: ${{ runner.temp }}/authenticated-inputs/latchway-promotion
          run-id: ${{ inputs.promotion_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Verify top-level and nested Latchway attestations without candidate code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_evidence_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_evidence_run_attempt }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/authenticated-inputs"
          gh attestation verify "$root/latchway-candidate/latchway-candidate.json" \
            --bundle "$root/latchway-candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          gh attestation verify "$root/latchway-security/security-summary.json" \
            --bundle "$root/latchway-security/security-summary.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/security.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          promotion="$root/latchway-promotion/latchway-cross-repository.json"
          promotion_bundle="$root/latchway-promotion/latchway-cross-repository.attestation.sigstore.json"
          gh attestation verify "$promotion" --bundle "$promotion_bundle" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          nested="$root/latchway-security/promotion-conformance/latchway-cross-repository.json"
          nested_bundle="$root/latchway-security/promotion-conformance/latchway-cross-repository.attestation.sigstore.json"
          cmp --silent "$promotion" "$nested"
          cmp --silent "$promotion_bundle" "$nested_bundle"
          test "$(sha256sum "$promotion" | cut -d ' ' -f 1)" = \
            "$(jq --raw-output '.promotion_conformance.report_sha256' "$root/latchway-security/security-summary.json")"
          jq --exit-status --argjson run_id "$PROMOTION_RUN_ID" --argjson attempt "$PROMOTION_RUN_ATTEMPT" \
            '.promotion_conformance.scope == "promotion" and .promotion_conformance.run_id == $run_id and .promotion_conformance.run_attempt == $attempt' \
            "$root/latchway-security/security-summary.json" >/dev/null
          diff --unified=0 \
            <(jq --sort-keys '.repositories' "$promotion") \
            <(jq --sort-keys '.promotion_conformance.repositories' "$root/latchway-security/security-summary.json")
          diff --unified=0 \
            <(jq --sort-keys '.documentation' "$promotion") \
            <(jq --sort-keys '.promotion_conformance.documentation' "$root/latchway-security/security-summary.json")
          gh attestation verify "$nested" --bundle "$nested_bundle" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
      - name: Verify nested independent-review attestation on the credential-isolated runner
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INDEPENDENT_SECURITY_REVIEW_TOKEN }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          root="$RUNNER_TEMP/authenticated-inputs/latchway-security"
          summary="$root/security-summary.json"
          report="$root/independent-review/independent-security-review.json"
          bundle="$root/independent-review/independent-security-review.attestation.sigstore.json"
          repository=$(jq --raw-output '.review_authority.producer.repository' "$summary")
          workflow=$(jq --raw-output '.review_authority.producer.workflow_path' "$summary")
          source_commit=$(jq --raw-output '.review_authority.producer.source_commit' "$summary")
          run_id=$(jq --raw-output '.review_authority.producer.run_id' "$summary")
          run_attempt=$(jq --raw-output '.review_authority.producer.run_attempt' "$summary")
          reviewer_login=$(jq --raw-output '.review_authority.reviewer.github_login' "$summary")
          reviewer_organization=$(jq --raw-output '.review_authority.reviewer.organization' "$summary")
          [[ "$repository" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,38}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$ ]]
          [[ "$workflow" =~ ^\.github/workflows/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}\.ya?ml$ ]]
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$run_id" =~ ^[1-9][0-9]*$ && "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$reviewer_login" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          owner=${repository%%/*}
          test "${owner,,}" != latchway
          test "${reviewer_organization,,}" != latchway
          test "$(sha256sum "$report" | cut -d ' ' -f 1)" = \
            "$(jq --raw-output '.review_authority.report_sha256' "$summary")"
          diff --unified=0 \
            <(jq --sort-keys '.producer' "$report") \
            <(jq --sort-keys '.review_authority.producer' "$summary")
          diff --unified=0 \
            <(jq --sort-keys '.reviewer' "$report") \
            <(jq --sort-keys '.review_authority.reviewer' "$summary")
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" \
            '.candidate.commit == $commit and .status == "passed"' "$report" >/dev/null
          gh api "repos/$repository/actions/runs/$run_id/attempts/$run_attempt" \
            > "$RUNNER_TEMP/independent-review-run.json"
          workflow_id=$(jq --raw-output '.workflow_id | select(type == "number" and . > 0)' \
            "$RUNNER_TEMP/independent-review-run.json")
          jq --exit-status --arg commit "$source_commit" --arg login "$reviewer_login" --argjson attempt "$run_attempt" '
            .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and
            .head_sha == $commit and .head_branch == "main" and .run_attempt == $attempt and
            .actor.login == $login and .triggering_actor.login == $login
          ' "$RUNNER_TEMP/independent-review-run.json" >/dev/null
          gh api "repos/$repository/actions/workflows/$workflow_id" \
            > "$RUNNER_TEMP/independent-review-workflow.json"
          jq --exit-status --arg path "$workflow" '.path == $path and .state == "active"' \
            "$RUNNER_TEMP/independent-review-workflow.json" >/dev/null
          gh attestation verify "$report" --bundle "$bundle" \
            --repo "$repository" --signer-workflow "$repository/$workflow" \
            --source-digest "$source_commit" --signer-digest "$source_commit" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
      - name: Package exact candidate source objects without a checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          umask 077
          bare="$RUNNER_TEMP/latchway.git"
          git init --bare "$bare" >/dev/null
          gh auth setup-git
          git -C "$bare" fetch --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$CANDIDATE_COMMIT"
          git -C "$bare" update-ref refs/heads/authenticated "$CANDIDATE_COMMIT"
          git -C "$bare" symbolic-ref HEAD refs/heads/authenticated
          GIT_INDEX_FILE="$bare/index" git --git-dir="$bare" read-tree "$CANDIDATE_COMMIT"
          mkdir -p "$RUNNER_TEMP/authenticated-inputs/source"
          git --git-dir="$bare" archive --format=tar "$CANDIDATE_COMMIT" \
            | gzip -n > "$RUNNER_TEMP/authenticated-inputs/source/latchway.source.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$bare" -czf "$RUNNER_TEMP/authenticated-inputs/source/latchway.git.tar.gz" .
          (cd "$RUNNER_TEMP/authenticated-inputs" && sha256sum source/*.tar.gz | LC_ALL=C sort > source.sha256)
      - name: Retain authenticated promotion inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-promote-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated-inputs
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
      - name: Retain authenticated source-free promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-promote-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/authenticated-inputs/latchway-candidate
            ${{ runner.temp }}/authenticated-inputs/latchway-security
            ${{ runner.temp }}/authenticated-inputs/latchway-promotion
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  candidate-gates:
    needs: authenticate-inputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download only authority-authenticated candidate inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-promote-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated-inputs
      - name: Materialize exact candidate source without repository credentials
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          (cd "$RUNNER_TEMP/authenticated-inputs" && sha256sum --check source.sha256)
          mkdir -p "$GITHUB_WORKSPACE/latchway/.git"
          tar -xzf "$RUNNER_TEMP/authenticated-inputs/source/latchway.source.tar.gz" -C "$GITHUB_WORKSPACE/latchway"
          tar -xzf "$RUNNER_TEMP/authenticated-inputs/source/latchway.git.tar.gz" -C "$GITHUB_WORKSPACE/latchway/.git"
          git -C "$GITHUB_WORKSPACE/latchway" config core.bare false
          git -C "$GITHUB_WORKSPACE/latchway" config core.worktree "$GITHUB_WORKSPACE/latchway"
          test "$(git -C "$GITHUB_WORKSPACE/latchway" rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git -C "$GITHUB_WORKSPACE/latchway" status --porcelain=v1 --untracked-files=all)"
      - name: Recompute candidate promotion and security gates without credentials
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${DOCKER_AUTH_CONFIG:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          root="$RUNNER_TEMP/authenticated-inputs"
          python3 latchway/scripts/release-candidate.py --verify \
            --manifest "$root/latchway-candidate/latchway-candidate.json" \
            --commit "$CANDIDATE_COMMIT" --tag "$INTENDED_TAG" \
            --image ghcr.io/latchway/latchway
          python3 latchway/scripts/verify-promotion.py \
            --report "$root/latchway-promotion/latchway-cross-repository.json" \
            --candidate "$root/latchway-candidate/latchway-candidate.json" \
            --commit "$CANDIDATE_COMMIT" --tag "$INTENDED_TAG"
          python3 latchway/scripts/security-evidence.py --verify \
            --report "$root/latchway-security/security-summary.json" \
            --candidate-manifest "$root/latchway-candidate/latchway-candidate.json" \
            --raw-directory "$root/latchway-security/raw" \
            --review-directory "$root/latchway-security/independent-review" \
            --promotion-directory "$root/latchway-security/promotion-conformance" \
            --repository "$GITHUB_WORKSPACE/latchway" \
            --commit "$CANDIDATE_COMMIT" --tag "$INTENDED_TAG"

  immutable-release-settings:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify the exact protected release environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:release"
      - name: Preflight protected immutable-release settings without a checkout
        shell: bash
        env:
          LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN"
          for repository in Latchway/latchway Latchway/latchway-js Latchway/latchway-ios-sdk Latchway/latchway-android Latchway/latchway-react-native-sdk; do
            GH_TOKEN="$LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN" gh api \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$repository/immutable-releases" > "$RUNNER_TEMP/immutable-releases.json"
            jq --exit-status 'type == "object" and (keys | sort) == ["enabled", "enforced_by_owner"] and .enabled == true and (.enforced_by_owner | type) == "boolean"' \
              "$RUNNER_TEMP/immutable-releases.json" >/dev/null
          done

  plan-promotion:
    needs: [authenticate-inputs, candidate-gates, immutable-release-settings]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      report_sha256: ${{ steps.verified.outputs.report_sha256 }}
      oci_image_digest: ${{ steps.verified.outputs.oci_image_digest }}
    steps:
      - name: Download only authenticated source-free evidence on a fresh planner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-promote-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authenticated-evidence
      - name: Require the fixed GitHub CLI on the credential-free planner
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
      - name: Reverify candidate and promotion attestations on the credential-free planner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_MANIFEST: ${{ runner.temp }}/authenticated-evidence/latchway-candidate/latchway-candidate.json
          SECURITY_REPORT: ${{ runner.temp }}/authenticated-evidence/latchway-security/security-summary.json
          PROMOTION_REPORT: ${{ runner.temp }}/authenticated-evidence/latchway-promotion/latchway-cross-repository.json
        run: |
          set -Eeuo pipefail
          gh attestation verify "$CANDIDATE_MANIFEST" \
            --bundle "$RUNNER_TEMP/authenticated-evidence/latchway-candidate/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "${{ inputs.candidate_commit }}" \
            --signer-digest "${{ inputs.candidate_commit }}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "$SECURITY_REPORT" \
            --bundle "$RUNNER_TEMP/authenticated-evidence/latchway-security/security-summary.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/security.yml" \
            --source-digest "${{ inputs.candidate_commit }}" \
            --signer-digest "${{ inputs.candidate_commit }}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "$PROMOTION_REPORT" \
            --bundle "$RUNNER_TEMP/authenticated-evidence/latchway-promotion/latchway-cross-repository.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "${{ inputs.candidate_commit }}" \
            --signer-digest "${{ inputs.candidate_commit }}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Verify exact candidate security and aggregate bindings without source
        id: verified
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${DOCKER_AUTH_CONFIG:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          root="$RUNNER_TEMP/authenticated-evidence"
          candidate_dir="$root/latchway-candidate"
          security_dir="$root/latchway-security"
          promotion_dir="$root/latchway-promotion"
          candidate="$candidate_dir/latchway-candidate.json"
          security="$security_dir/security-summary.json"
          promotion="$promotion_dir/latchway-cross-repository.json"
          expected_candidate_files='["latchway-candidate.attestation.sigstore.json","latchway-candidate.json","latchway-contract.tar.gz","latchway-linux-amd64-license.json","latchway-linux-amd64-vulnerability.json","latchway-linux-amd64.spdx.json","latchway-linux-arm64-license.json","latchway-linux-arm64-vulnerability.json","latchway-linux-arm64.spdx.json"]'
          find "$candidate_dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort \
            > "$RUNNER_TEMP/candidate-actual-files.txt"
          jq --null-input --raw-output --argjson files "$expected_candidate_files" '$files[]' \
            > "$RUNNER_TEMP/candidate-expected-files.txt"
          diff --unified=0 "$RUNNER_TEMP/candidate-expected-files.txt" "$RUNNER_TEMP/candidate-actual-files.txt"
          test -z "$(find "$root" -type l -print -quit)"
          expected_artifacts='["latchway-contract.tar.gz","latchway-linux-amd64-license.json","latchway-linux-amd64-vulnerability.json","latchway-linux-amd64.spdx.json","latchway-linux-arm64-license.json","latchway-linux-arm64-vulnerability.json","latchway-linux-arm64.spdx.json"]'
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --argjson expected "$expected_artifacts" '
              (keys | sort) == ["artifacts","candidate_commit","contract","created_at","image","intended_tag","kind","schema_version","status","version"] and
              .schema_version == 1 and .kind == "latchway_release_candidate" and .status == "passed" and
              .candidate_commit == $commit and .intended_tag == $tag and .version == ($tag | ltrimstr("v")) and
              (.contract | keys | sort) == ["bundle_file_name","bundle_sha256","released_at","status","version"] and
              .contract.status == "released" and (.contract.bundle_sha256 | test("^[0-9a-f]{64}$")) and
              (.image | keys | sort) == ["index_digest","platforms","repository"] and
              .image.repository == "ghcr.io/latchway/latchway" and
              (.image.index_digest | test("^sha256:[0-9a-f]{64}$")) and
              (.image.platforms | keys | sort) == ["linux/amd64","linux/arm64"] and
              all(.image.platforms[]; test("^sha256:[0-9a-f]{64}$")) and
              .image.platforms["linux/amd64"] != .image.platforms["linux/arm64"] and
              ([.artifacts[].path] | sort) == $expected and
              ([.artifacts[].path] | unique | length) == 7 and
              all(.artifacts[]; (keys | sort) == ["path","sha256"] and (.sha256 | test("^[0-9a-f]{64}$"))) and
              ([.artifacts[] | select(.path == "latchway-contract.tar.gz") | .sha256] == [.contract.bundle_sha256])
            ' "$candidate" >/dev/null
          jq --exit-status --raw-output '.artifacts[] | [.path,.sha256] | @tsv' "$candidate" \
            | while IFS=$'\t' read -r relative expected_sha; do
                [[ "$relative" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
                test "$(sha256sum "$candidate_dir/$relative" | cut -d ' ' -f 1)" = "$expected_sha"
              done
          candidate_sha256=$(sha256sum "$candidate" | cut -d ' ' -f 1)
          report_sha256=$(sha256sum "$promotion" | cut -d ' ' -f 1)
          index_digest=$(jq --raw-output .image.index_digest "$candidate")
          image=$(jq --raw-output .image.repository "$candidate")
          oci_image_digest="$image@$index_digest"
          version=${INTENDED_TAG#v}
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --arg image "$oci_image_digest" '
              (keys | sort) == ["checks","contract","documentation","evidence_domains","evidence_window","kind","promotion_ready","release_ready","repositories","schema_version","scope","source_conformance_passed","verdict"] and
              .schema_version == 1 and .kind == "latchway_cross_repository_conformance_evidence" and
              .scope == "promotion" and .verdict == "passed" and
              .source_conformance_passed == true and .promotion_ready == true and .release_ready == false and
              .contract.core_release == $tag and .contract.oci_image_digest == $image and
              ([.repositories[].id] | sort) == ["android","core","ios","javascript","react_native"] and
              ([.repositories[] | select(.id == "core" and .commit == $commit and .intended_tag == $tag)] | length) == 1 and
              (.documentation | keys | sort) == ["canonical_core_commit","commit","owned_file_count","repository","source_commit","source_manifest_sha256","source_tree_sha256"] and
              .documentation.repository == "https://github.com/Latchway/latchway-docs.git" and
              .documentation.canonical_core_commit == $commit and
              (.documentation.commit | test("^[0-9a-f]{40}$")) and
              (.documentation.source_commit | test("^[0-9a-f]{40}$")) and
              (.documentation.source_manifest_sha256 | test("^[0-9a-f]{64}$")) and
              (.documentation.source_tree_sha256 | test("^[0-9a-f]{64}$")) and
              (.documentation.owned_file_count | type == "number" and floor == . and . >= 1 and . <= 4096) and
              all(.checks[]; (.required != true) or .status == "passed")
            ' "$promotion" >/dev/null
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --arg candidate_sha256 "$candidate_sha256" --arg image "$image" \
            --arg digest "$index_digest" --arg report_sha256 "$report_sha256" '
              .schema_version == 2 and .kind == "latchway_candidate_security_evidence" and
              .automated_gate == "passed" and .independent_review_gate == "passed" and
              .candidate.commit == $commit and .candidate.intended_tag == $tag and
              .candidate.candidate_manifest_sha256 == $candidate_sha256 and
              .candidate.image.repository == $image and .candidate.image.index_digest == $digest and
              .promotion_conformance.scope == "promotion" and
              .promotion_conformance.report_sha256 == $report_sha256
            ' "$security" >/dev/null
          diff --unified=0 \
            <(jq --sort-keys '.repositories' "$promotion") \
            <(jq --sort-keys '.promotion_conformance.repositories' "$security")
          diff --unified=0 \
            <(jq --sort-keys '.documentation' "$promotion") \
            <(jq --sort-keys '.promotion_conformance.documentation' "$security")
          echo "report_sha256=$report_sha256" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          echo "oci_image_digest=$oci_image_digest" >> "$GITHUB_OUTPUT"
          echo "core_version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the exact candidate image signature and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_DIGEST: ${{ steps.verified.outputs.oci_image_digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/Latchway/latchway/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "${{ inputs.candidate_commit }}" \
            "$OCI_IMAGE_DIGEST"
          gh attestation verify "oci://$OCI_IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "${{ inputs.candidate_commit }}" \
            --signer-digest "${{ inputs.candidate_commit }}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Preflight immutable releases and every fixed core release asset
        id: immutable-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPORT_SHA256: ${{ steps.verified.outputs.report_sha256 }}
          IMAGE: ${{ steps.verified.outputs.image }}
          INDEX_DIGEST: ${{ steps.verified.outputs.index_digest }}
          VERSION: ${{ steps.verified.outputs.core_version }}
          CANDIDATE_DIR: ${{ runner.temp }}/authenticated-evidence/latchway-candidate
          SECURITY_DIR: ${{ runner.temp }}/authenticated-evidence/latchway-security
          PROMOTION_REPORT: ${{ runner.temp }}/authenticated-evidence/latchway-promotion/latchway-cross-repository.json
        run: |
          set -Eeuo pipefail
          moving='[]'
          if [[ "$VERSION" != *-* ]]; then
            IFS=. read -r major minor patch <<< "$VERSION"
            moving=$(jq --null-input --compact-output \
              --arg mm "$major.$minor" --arg m "$major" '[ $mm, $m, "latest" ]')
          fi
          jq --null-input \
            --arg repository "$IMAGE" \
            --arg version "$VERSION" \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg digest "$INDEX_DIGEST" \
            --argjson moving "$moving" \
            '{schema_version: 1, kind: "latchway_oci_alias_promotion",
              repository: $repository, version: $version, source_commit: $commit,
              index_digest: $digest, immutable_version: $version,
              moving_aliases: $moving}' > "$RUNNER_TEMP/oci-alias-promotion.json"
          install -m 0600 -- \
            "$PROMOTION_REPORT" \
            "$RUNNER_TEMP/latchway-cross-repository-promotion.json"
          install -m 0600 -- \
            "$RUNNER_TEMP/authenticated-evidence/latchway-promotion/latchway-cross-repository.attestation.sigstore.json" \
            "$RUNNER_TEMP/latchway-cross-repository-promotion.attestation.sigstore.json"
          assets=(
            "$RUNNER_TEMP/latchway-cross-repository-promotion.json"
            "$RUNNER_TEMP/latchway-cross-repository-promotion.attestation.sigstore.json"
            "$CANDIDATE_DIR/latchway-candidate.json"
            "$CANDIDATE_DIR/latchway-candidate.attestation.sigstore.json"
            "$CANDIDATE_DIR/latchway-contract.tar.gz"
            "$CANDIDATE_DIR/latchway-linux-amd64.spdx.json"
            "$CANDIDATE_DIR/latchway-linux-arm64.spdx.json"
            "$CANDIDATE_DIR/latchway-linux-amd64-vulnerability.json"
            "$CANDIDATE_DIR/latchway-linux-arm64-vulnerability.json"
            "$CANDIDATE_DIR/latchway-linux-amd64-license.json"
            "$CANDIDATE_DIR/latchway-linux-arm64-license.json"
            "$SECURITY_DIR/security-summary.json"
            "$SECURITY_DIR/security-summary.attestation.sigstore.json"
            "$RUNNER_TEMP/oci-alias-promotion.json"
          )
          : > "$RUNNER_TEMP/fixed-core-release-assets.txt"
          declare -A names=()
          for asset in "${assets[@]}"; do
            test -f "$asset"
            test ! -L "$asset"
            test -s "$asset"
            name=${asset##*/}
            test -z "${names[$name]:-}"
            names[$name]=1
            printf '%s\n' "$asset" >> "$RUNNER_TEMP/fixed-core-release-assets.txt"
          done
          test "$(wc -l < "$RUNNER_TEMP/fixed-core-release-assets.txt" | tr -d ' ')" = 14

          set +e
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_TAG" \
            > "$RUNNER_TEMP/preflight-release.json" \
            2> "$RUNNER_TEMP/preflight-release-error.txt"
          release_status=$?
          set -e
          if [[ "$release_status" -ne 0 ]]; then
            test "$release_status" -eq 1
            grep --fixed-strings --quiet "HTTP 404" \
              "$RUNNER_TEMP/preflight-release-error.txt"
            echo "mode=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected_prerelease=false
          if [[ "$INTENDED_TAG" == *-* ]]; then expected_prerelease=true; fi
          expected_body="Immutable Latchway product release $INTENDED_TAG.

          Candidate commit: $CANDIDATE_COMMIT
          Promotion evidence SHA-256: $REPORT_SHA256"
          jq --exit-status \
            --arg tag "$INTENDED_TAG" \
            --arg title "Latchway $INTENDED_TAG" \
            --arg body "$expected_body" \
            --argjson prerelease "$expected_prerelease" \
            '.tag_name == $tag and .name == $title and .body == $body and
             .prerelease == $prerelease and
             ((.draft == true and .immutable == false) or
              (.draft == false and .immutable == true))' \
            "$RUNNER_TEMP/preflight-release.json" >/dev/null
          mode=draft
          if [[ "$(jq --raw-output .immutable "$RUNNER_TEMP/preflight-release.json")" == true ]]; then
            mode=immutable
          fi
          while IFS= read -r existing_name; do
            test -n "${names[$existing_name]:-}"
          done < <(jq --raw-output '.assets[].name' "$RUNNER_TEMP/preflight-release.json")
          while IFS= read -r asset; do
            name=${asset##*/}
            expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            existing=$(jq --raw-output --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 0 then "absent"
              elif length == 1 then (.[0].digest // "digest-unavailable")
              else error("duplicate fixed core release asset") end
            ' "$RUNNER_TEMP/preflight-release.json")
            if [[ "$mode" == immutable ]]; then test "$existing" = "$expected"; fi
            if [[ "$existing" != absent ]]; then
              test "$existing" = "$expected"
              download_dir=$(mktemp -d "$RUNNER_TEMP/product-asset-preflight.XXXXXX")
              gh release download "$INTENDED_TAG" --pattern "$name" --dir "$download_dir"
              cmp --silent "$asset" "$download_dir/$name"
            fi
          done < "$RUNNER_TEMP/fixed-core-release-assets.txt"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Build the exact source-free mutation handoff
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          REPORT_SHA256: ${{ steps.verified.outputs.report_sha256 }}
          IMAGE: ${{ steps.verified.outputs.image }}
          INDEX_DIGEST: ${{ steps.verified.outputs.index_digest }}
          OCI_IMAGE_DIGEST: ${{ steps.verified.outputs.oci_image_digest }}
          VERSION: ${{ steps.verified.outputs.core_version }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/promotion-handoff"
          mkdir -p "$root/release-assets"
          while IFS= read -r asset; do
            install -m 0600 -- "$asset" "$root/release-assets/${asset##*/}"
          done < "$RUNNER_TEMP/fixed-core-release-assets.txt"
          jq --null-input --sort-keys \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg tag "$INTENDED_TAG" \
            --arg report_sha256 "$REPORT_SHA256" \
            --arg image "$IMAGE" \
            --arg index_digest "$INDEX_DIGEST" \
            --arg oci_image_digest "$OCI_IMAGE_DIGEST" \
            --arg version "$VERSION" \
            '{schema_version: 1, kind: "latchway_release_promotion_handoff",
              candidate_commit: $commit, intended_tag: $tag,
              promotion_report_sha256: $report_sha256,
              image: $image, index_digest: $index_digest,
              oci_image_digest: $oci_image_digest, version: $version}' \
            > "$root/metadata.json"
          (cd "$root" && sha256sum metadata.json release-assets/* \
            | LC_ALL=C sort > handoff.sha256)
          test -z "$(find "$root" -type l -print -quit)"
          test "$(find "$root" -type f | wc -l | tr -d ' ')" = 16
          test "$(wc -l < "$root/handoff.sha256" | tr -d ' ')" = 15
      - name: Retain only the closed source-free mutation handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-promotion-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-handoff
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  stage-github-release:
    needs: [plan-promotion, immutable-release-settings]
