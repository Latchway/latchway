name: Promote proven release

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact candidate commit produced by the candidate workflow
        required: true
        type: string
      intended_tag:
        description: Exact public core tag bound into promotion evidence
        required: true
        type: string
      candidate_run_id:
        description: Candidate workflow run containing the attested candidate manifest
        required: true
        type: string
      candidate_artifact:
        description: Exact candidate artifact name
        required: true
        type: string
      security_evidence_run_id:
        description: Exact successful security-evidence workflow run ID
        required: true
        type: string
      promotion_evidence_run_id:
        description: Cross-repository workflow run containing attested promotion evidence
        required: true
        type: string
      promotion_evidence_artifact:
        description: Exact promotion evidence artifact name
        required: true
        default: latchway-cross-repository-promotion
        type: string

permissions:
  actions: read
  attestations: read
  contents: write
  packages: write

concurrency:
  group: promote-${{ inputs.intended_tag }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit }}
          path: latchway
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable workflow inputs and cross-repository authority
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SECURITY_RUN_ID: ${{ inputs.security_evidence_run_id }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_evidence_run_id }}
          DISPATCH_TOKEN: ${{ secrets.LATCHWAY_RELEASE_DISPATCH_TOKEN }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENDED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SECURITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROMOTION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git -C latchway rev-parse --verify HEAD)" = "$CANDIDATE_COMMIT"
          test -n "$DISPATCH_TOKEN"
          for repository in \
            Latchway/latchway-js \
            Latchway/latchway-ios-sdk \
            Latchway/latchway-android \
            Latchway/latchway-react-native-sdk; do
            GH_TOKEN="$DISPATCH_TOKEN" gh api "repos/$repository" --jq .full_name >/dev/null
          done
      - name: Require the fixed successful security workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          SECURITY_RUN_ID: ${{ inputs.security_evidence_run_id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SECURITY_RUN_ID" > "$RUNNER_TEMP/security-run.json"
          workflow_id=$(jq --raw-output .workflow_id "$RUNNER_TEMP/security-run.json")
          jq --exit-status \
            --arg commit "$CANDIDATE_COMMIT" \
            '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .head_branch == "main"' \
            "$RUNNER_TEMP/security-run.json" >/dev/null
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/security-workflow.json"
          jq --exit-status \
            '.path == ".github/workflows/security.yml" and .state == "active"' \
            "$RUNNER_TEMP/security-workflow.json" >/dev/null
      - name: Download the immutable candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/latchway-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact current-candidate security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-security-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/latchway-security
          run-id: ${{ inputs.security_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Download the aggregate promotion evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.promotion_evidence_artifact }}
          path: ${{ runner.temp }}/latchway-promotion
          run-id: ${{ inputs.promotion_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate and promotion attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_MANIFEST: ${{ runner.temp }}/latchway-candidate/latchway-candidate.json
          SECURITY_REPORT: ${{ runner.temp }}/latchway-security/security-summary.json
          PROMOTION_REPORT: ${{ runner.temp }}/latchway-promotion/latchway-cross-repository.json
        run: |
          gh attestation verify "$CANDIDATE_MANIFEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "${{ inputs.candidate_commit }}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "$SECURITY_REPORT" \
            --bundle "$RUNNER_TEMP/latchway-security/security-summary.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/security.yml" \
            --source-digest "${{ inputs.candidate_commit }}" \
            --signer-digest "${{ inputs.candidate_commit }}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "$PROMOTION_REPORT" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "${{ inputs.candidate_commit }}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Verify the candidate artifact and exact aggregate bindings
        id: verified
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_MANIFEST: ${{ runner.temp }}/latchway-candidate/latchway-candidate.json
          PROMOTION_REPORT: ${{ runner.temp }}/latchway-promotion/latchway-cross-repository.json
        run: |
          python3 latchway/scripts/release-candidate.py \
            --verify \
            --manifest "$CANDIDATE_MANIFEST" \
            --commit "$CANDIDATE_COMMIT" \
            --tag "$INTENDED_TAG" \
            --image ghcr.io/latchway/latchway
          python3 latchway/scripts/verify-promotion.py \
            --report "$PROMOTION_REPORT" \
            --candidate "$CANDIDATE_MANIFEST" \
            --commit "$CANDIDATE_COMMIT" \
            --tag "$INTENDED_TAG" \
            --github-output "$GITHUB_OUTPUT"
      - name: Recompute exact current-candidate security evidence
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          python3 latchway/scripts/security-evidence.py \
            --verify \
            --report "$RUNNER_TEMP/latchway-security/security-summary.json" \
            --candidate-manifest "$RUNNER_TEMP/latchway-candidate/latchway-candidate.json" \
            --raw-directory "$RUNNER_TEMP/latchway-security/raw" \
            --repository "$GITHUB_WORKSPACE/latchway" \
            --commit "$CANDIDATE_COMMIT" \
            --tag "$INTENDED_TAG"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the exact candidate image signature and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_DIGEST: ${{ steps.verified.outputs.oci_image_digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/Latchway/latchway/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$OCI_IMAGE_DIGEST"
          gh attestation verify "oci://$OCI_IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "${{ inputs.candidate_commit }}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Refuse an existing core release tag
        shell: bash
        env:
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set +e
          git -C latchway ls-remote --exit-code --tags origin "refs/tags/$INTENDED_TAG" >/dev/null 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "refusing to replace existing core tag $INTENDED_TAG" >&2
            exit 1
          fi
          test "$status" -eq 2
      - name: Promote only the verified index digest to stable OCI tags
        shell: bash
        env:
          IMAGE: ${{ steps.verified.outputs.image }}
          INDEX_DIGEST: ${{ steps.verified.outputs.index_digest }}
          VERSION: ${{ steps.verified.outputs.core_version }}
        run: |
          targets=("$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            IFS=. read -r major minor patch <<< "$VERSION"
            test -n "$major" && test -n "$minor" && test -n "$patch"
            targets+=("$major.$minor" "$major" latest)
          fi
          for tag in "${targets[@]}"; do
            target="$IMAGE:$tag"
            if docker buildx imagetools inspect --raw "$target" > "$RUNNER_TEMP/existing-index.json" 2>/dev/null; then
              actual="sha256:$(sha256sum "$RUNNER_TEMP/existing-index.json" | cut -d ' ' -f 1)"
              test "$actual" = "$INDEX_DIGEST"
            else
              docker buildx imagetools create --tag "$target" "$IMAGE@$INDEX_DIGEST"
            fi
            docker buildx imagetools inspect --raw "$target" > "$RUNNER_TEMP/promoted-index.json"
            actual="sha256:$(sha256sum "$RUNNER_TEMP/promoted-index.json" | cut -d ' ' -f 1)"
            test "$actual" = "$INDEX_DIGEST"
          done
      - name: Create the evidence-gated annotated core tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          REPORT_SHA256: ${{ steps.verified.outputs.report_sha256 }}
        run: |
          jq --null-input \
            --arg tag "$INTENDED_TAG" \
            --arg message "Latchway $INTENDED_TAG\n\nPromotion evidence SHA-256: $REPORT_SHA256" \
            --arg object "$CANDIDATE_COMMIT" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, message: $message, object: $object, type: "commit", tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com", date: $date}}' \
            > "$RUNNER_TEMP/tag-object.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/tags" \
            --input "$RUNNER_TEMP/tag-object.json" \
            > "$RUNNER_TEMP/tag-result.json"
          tag_object=$(jq --raw-output .sha "$RUNNER_TEMP/tag-result.json")
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]]
          jq --null-input \
            --arg ref "refs/tags/$INTENDED_TAG" \
            --arg sha "$tag_object" \
            '{ref: $ref, sha: $sha}' \
            > "$RUNNER_TEMP/tag-ref.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            --input "$RUNNER_TEMP/tag-ref.json" >/dev/null
      - name: Publish the immutable release record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_DIR: ${{ runner.temp }}/latchway-candidate
          SECURITY_DIR: ${{ runner.temp }}/latchway-security
          PROMOTION_REPORT: ${{ runner.temp }}/latchway-promotion/latchway-cross-repository.json
        run: |
          cp -- "$PROMOTION_REPORT" "$RUNNER_TEMP/latchway-cross-repository-promotion.json"
          gh release create "$INTENDED_TAG" \
            --verify-tag \
            --generate-notes \
            --title "Latchway $INTENDED_TAG" \
            "$RUNNER_TEMP/latchway-cross-repository-promotion.json" \
            "$CANDIDATE_DIR/latchway-candidate.json" \
            "$CANDIDATE_DIR/latchway-contract.tar.gz" \
            "$CANDIDATE_DIR/latchway-linux-amd64.spdx.json" \
            "$CANDIDATE_DIR/latchway-linux-arm64.spdx.json" \
            "$CANDIDATE_DIR/latchway-linux-amd64-vulnerability.json" \
            "$CANDIDATE_DIR/latchway-linux-arm64-vulnerability.json" \
            "$CANDIDATE_DIR/latchway-linux-amd64-license.json" \
            "$CANDIDATE_DIR/latchway-linux-arm64-license.json" \
            "$SECURITY_DIR/security-summary.json" \
            "$SECURITY_DIR/security-summary.attestation.sigstore.json"
      - name: Dispatch exact evidence-bound SDK publications
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_RELEASE_DISPATCH_TOKEN }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          PROMOTION_REPORT: ${{ runner.temp }}/latchway-promotion/latchway-cross-repository.json
          REPORT_SHA256: ${{ steps.verified.outputs.report_sha256 }}
          OCI_IMAGE_DIGEST: ${{ steps.verified.outputs.oci_image_digest }}
        run: |
          for mapping in \
            'javascript:latchway-js' \
            'ios:latchway-ios-sdk' \
            'android:latchway-android' \
            'react_native:latchway-react-native-sdk'; do
            repository_id=${mapping%%:*}
            repository_name=${mapping#*:}
            coordinate=$(jq --compact-output --arg id "$repository_id" '.repositories[] | select(.id == $id)' "$PROMOTION_REPORT")
            test -n "$coordinate"
            jq --null-input \
              --arg core_tag "$INTENDED_TAG" \
              --arg evidence_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$INTENDED_TAG/latchway-cross-repository-promotion.json" \
              --arg evidence_sha256 "$REPORT_SHA256" \
              --arg oci_image_digest "$OCI_IMAGE_DIGEST" \
              --argjson coordinate "$coordinate" \
              '{event_type: "latchway_release_promoted", client_payload: {core_tag: $core_tag, promotion_evidence_url: $evidence_url, promotion_evidence_sha256: $evidence_sha256, oci_image_digest: $oci_image_digest, repository: $coordinate}}' \
              > "$RUNNER_TEMP/sdk-dispatch.json"
            gh api \
              --method POST \
              "repos/Latchway/$repository_name/dispatches" \
              --input "$RUNNER_TEMP/sdk-dispatch.json"
          done
