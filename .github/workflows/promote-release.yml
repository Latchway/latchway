              .documentation.canonical_core_commit == $commit and
              (.documentation.commit | test("^[0-9a-f]{40}$")) and
              (.documentation.source_commit | test("^[0-9a-f]{40}$")) and
              (.documentation.source_manifest_sha256 | test("^[0-9a-f]{64}$")) and
              (.documentation.source_tree_sha256 | test("^[0-9a-f]{64}$")) and
              (.documentation.owned_file_count | type == "number" and floor == . and . >= 1 and . <= 4096) and
              all(.checks[]; (.required != true) or .status == "passed")
            ' "$promotion" >/dev/null
          security="$assets/security-summary.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --arg image "$image" --arg digest "$index_digest" --arg report_sha256 "$report_sha256" '
              .schema_version == 2 and .kind == "latchway_candidate_security_evidence" and
              .automated_gate == "passed" and .independent_review_gate == "passed" and
              .candidate.commit == $commit and .candidate.intended_tag == $tag and
              .candidate.image.repository == $image and .candidate.image.index_digest == $digest and
              .promotion_conformance.scope == "promotion" and
              .promotion_conformance.report_sha256 == $report_sha256
            ' "$security" >/dev/null
          diff --unified=0 \
            <(jq --sort-keys '.documentation' "$promotion") \
            <(jq --sort-keys '.promotion_conformance.documentation' "$security")
          moving='[]'
          if [[ "$version" != *-* ]]; then
            IFS=. read -r major minor patch <<< "$version"
            moving=$(jq --null-input --compact-output --arg mm "$major.$minor" --arg m "$major" '[ $mm, $m, "latest" ]')
          fi
          jq --exit-status --arg image "$image" --arg version "$version" \
            --arg commit "$CANDIDATE_COMMIT" --arg digest "$index_digest" --argjson moving "$moving" '
              (keys | sort) == ["index_digest","immutable_version","kind","moving_aliases","repository","schema_version","source_commit","version"] and
              .schema_version == 1 and .kind == "latchway_oci_alias_promotion" and
              .repository == $image and .version == $version and .source_commit == $commit and
              .index_digest == $digest and .immutable_version == $version and .moving_aliases == $moving
            ' "$assets/oci-alias-promotion.json" >/dev/null
          cli_version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$cli_version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          gh attestation verify "$candidate" \
            --bundle "$assets/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          gh attestation verify "$security" \
            --bundle "$assets/security-summary.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/security.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          gh attestation verify "$promotion" \
            --bundle "$assets/latchway-cross-repository-promotion.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          find "$assets" -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort \
            > "$RUNNER_TEMP/fixed-core-release-assets.txt"
          test "$(wc -l < "$RUNNER_TEMP/fixed-core-release-assets.txt" | tr -d ' ')" = 14
          echo "report_sha256=$report_sha256" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          echo "oci_image_digest=$oci_image_digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Preflight immutable release and every fixed asset before staging
        id: immutable-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPORT_SHA256: ${{ steps.validated.outputs.report_sha256 }}
        run: |
          set -Eeuo pipefail
          set +e
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_TAG" \
            > "$RUNNER_TEMP/preflight-release.json" 2> "$RUNNER_TEMP/preflight-release-error.txt"
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            test "$status" -eq 1
            grep --fixed-strings --quiet "HTTP 404" "$RUNNER_TEMP/preflight-release-error.txt"
            echo "mode=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected_body="Immutable Latchway product release $INTENDED_TAG.

          Candidate commit: $CANDIDATE_COMMIT
          Promotion evidence SHA-256: $REPORT_SHA256"
          expected_prerelease=false
          if [[ "$INTENDED_TAG" == *-* ]]; then expected_prerelease=true; fi
          jq --exit-status --arg tag "$INTENDED_TAG" --arg title "Latchway $INTENDED_TAG" \
            --arg body "$expected_body" --argjson prerelease "$expected_prerelease" '
              .tag_name == $tag and .name == $title and .body == $body and
              .prerelease == $prerelease and
              ((.draft == true and .immutable == false) or (.draft == false and .immutable == true))
            ' "$RUNNER_TEMP/preflight-release.json" >/dev/null
          mode=draft
          if [[ "$(jq --raw-output .immutable "$RUNNER_TEMP/preflight-release.json")" == true ]]; then mode=immutable; fi
          while IFS= read -r existing_name; do
            matches=0
            while IFS= read -r asset; do
              if [[ "${asset##*/}" == "$existing_name" ]]; then ((matches += 1)); fi
            done < "$RUNNER_TEMP/fixed-core-release-assets.txt"
            test "$matches" = 1
          done < <(jq --raw-output '.assets[].name' "$RUNNER_TEMP/preflight-release.json")
          while IFS= read -r asset; do
            name=${asset##*/}
            expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            existing=$(jq --raw-output --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 0 then "absent" elif length == 1 then (.[0].digest // "digest-unavailable") else error("duplicate fixed core release asset") end' "$RUNNER_TEMP/preflight-release.json")
            if [[ "$mode" == immutable ]]; then test "$existing" = "$expected"; fi
            if [[ "$existing" != absent ]]; then test "$existing" = "$expected"; fi
          done < "$RUNNER_TEMP/fixed-core-release-assets.txt"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Verify any existing core release tag
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          REPORT_SHA256: ${{ steps.validated.outputs.report_sha256 }}
        run: |
          set -Eeuo pipefail
          message="Latchway $INTENDED_TAG

          Promotion evidence SHA-256: $REPORT_SHA256"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INTENDED_TAG" \
            > "$RUNNER_TEMP/existing-tag-ref.json" 2> "$RUNNER_TEMP/existing-tag-error.txt"
          lookup_status=$?
          set -e
          if [[ "$lookup_status" -ne 0 ]]; then
            test "$lookup_status" -eq 1
            grep --fixed-strings --quiet "HTTP 404" "$RUNNER_TEMP/existing-tag-error.txt"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/existing-tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/existing-tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/existing-tag-object.json"
          jq --exit-status \
            --arg tag "$INTENDED_TAG" \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg message "$message" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message' \
            "$RUNNER_TEMP/existing-tag-object.json" >/dev/null
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
      - name: Create the evidence-gated annotated core tag
        if: steps.release-state.outputs.tag_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          REPORT_SHA256: ${{ steps.validated.outputs.report_sha256 }}
        run: |
          set -Eeuo pipefail
          jq --null-input \
            --arg tag "$INTENDED_TAG" \
            --arg message "Latchway $INTENDED_TAG\n\nPromotion evidence SHA-256: $REPORT_SHA256" \
            --arg object "$CANDIDATE_COMMIT" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, message: $message, object: $object, type: "commit", tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com", date: $date}}' \
            > "$RUNNER_TEMP/tag-object.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/tags" \
            --input "$RUNNER_TEMP/tag-object.json" \
            > "$RUNNER_TEMP/tag-result.json"
          tag_object=$(jq --raw-output .sha "$RUNNER_TEMP/tag-result.json")
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]]
          jq --null-input \
            --arg ref "refs/tags/$INTENDED_TAG" \
            --arg sha "$tag_object" \
            '{ref: $ref, sha: $sha}' \
            > "$RUNNER_TEMP/tag-ref.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            --input "$RUNNER_TEMP/tag-ref.json" >/dev/null
      - name: Re-fetch and verify the immutable annotated core tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          REPORT_SHA256: ${{ steps.validated.outputs.report_sha256 }}
        run: |
          set -Eeuo pipefail
          expected_message="Latchway $INTENDED_TAG

          Promotion evidence SHA-256: $REPORT_SHA256"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INTENDED_TAG" > "$RUNNER_TEMP/final-tag-ref.json"
          jq --exit-status \
            --arg ref "refs/tags/$INTENDED_TAG" \
            '.ref == $ref and .object.type == "tag" and (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/final-tag-ref.json" >/dev/null
          tag_object=$(jq --raw-output .object.sha "$RUNNER_TEMP/final-tag-ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/final-tag-object.json"
          jq --exit-status \
            --arg tag "$INTENDED_TAG" \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg message "$expected_message" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message' \
            "$RUNNER_TEMP/final-tag-object.json" >/dev/null
      - name: Prepare the recoverable product release draft and exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPORT_SHA256: ${{ steps.validated.outputs.report_sha256 }}
          RELEASE_MODE: ${{ steps.immutable-release.outputs.mode }}
        run: |
          set -Eeuo pipefail
          case "$RELEASE_MODE" in
            absent|draft|immutable) ;;
            *) echo "invalid immutable-release preflight mode" >&2; exit 1 ;;
          esac
          expected_body="Immutable Latchway product release $INTENDED_TAG.

          Candidate commit: $CANDIDATE_COMMIT
          Promotion evidence SHA-256: $REPORT_SHA256"
          if [[ "$RELEASE_MODE" == absent ]]; then
            create=(gh release create "$INTENDED_TAG" --draft --verify-tag --title "Latchway $INTENDED_TAG" --notes "$expected_body")
            if [[ "$INTENDED_TAG" == *-* ]]; then create+=(--prerelease); fi
            "${create[@]}"
          fi
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_TAG" \
            > "$RUNNER_TEMP/product-release-draft.json"
          expected_prerelease=false
          if [[ "$INTENDED_TAG" == *-* ]]; then expected_prerelease=true; fi
          if [[ "$RELEASE_MODE" == immutable ]]; then
            expected_draft=false
            expected_immutable=true
          else
            expected_draft=true
            expected_immutable=false
          fi
          jq --exit-status \
            --arg tag "$INTENDED_TAG" \
            --arg title "Latchway $INTENDED_TAG" \
            --arg body "$expected_body" \
            --argjson prerelease "$expected_prerelease" \
            --argjson draft "$expected_draft" \
            --argjson immutable "$expected_immutable" \
            '.tag_name == $tag and .name == $title and .body == $body and
             .prerelease == $prerelease and .draft == $draft and
             .immutable == $immutable and (.id | type == "number" and . > 0)' \
            "$RUNNER_TEMP/product-release-draft.json" >/dev/null
          if [[ "$RELEASE_MODE" != immutable ]]; then
            while IFS= read -r asset; do
              name=${asset##*/}
              expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
              existing=$(jq --raw-output --arg name "$name" '
                [.assets[] | select(.name == $name)] |
                if length == 0 then "absent"
                elif length == 1 then (.[0].digest // "digest-unavailable")
                else error("duplicate fixed core release asset") end
              ' "$RUNNER_TEMP/product-release-draft.json")
              if [[ "$existing" == absent ]]; then
                gh release upload "$INTENDED_TAG" "$asset"
              else
                test "$existing" = "$expected"
              fi
            done < "$RUNNER_TEMP/fixed-core-release-assets.txt"
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_TAG" \
              > "$RUNNER_TEMP/product-release-draft.json"
          fi
          while IFS= read -r asset; do basename "$asset"; done \
            < "$RUNNER_TEMP/fixed-core-release-assets.txt" \
            | LC_ALL=C sort > "$RUNNER_TEMP/product-expected-assets.txt"
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/product-release-draft.json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/product-actual-assets.txt"
          diff --unified=0 \
            "$RUNNER_TEMP/product-expected-assets.txt" \
            "$RUNNER_TEMP/product-actual-assets.txt"
          while IFS= read -r asset; do
            name=${asset##*/}
            expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            actual=$(jq --raw-output --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then (.[0].digest // "digest-unavailable")
              else error("fixed core release asset missing or duplicated") end
            ' "$RUNNER_TEMP/product-release-draft.json")
            test "$actual" = "$expected"
          done < "$RUNNER_TEMP/fixed-core-release-assets.txt"

  promote-oci:
    needs: [plan-promotion, stage-github-release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    steps:
      - name: Verify the exact protected release environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:release"
      - name: Download the exact source-free mutation handoff on a fresh OCI runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-promotion-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-handoff
      - name: Validate exact closure hashes attestations tag and draft before registry authentication
        id: validated
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          test -z "${DOCKER_AUTH_CONFIG:-}"
          root="$RUNNER_TEMP/promotion-handoff"
          assets="$root/release-assets"
          test -z "$(find "$root" -type l -print -quit)"
          printf '%s\n' \
            handoff.sha256 metadata.json \
            release-assets/latchway-candidate.attestation.sigstore.json \
            release-assets/latchway-candidate.json \
            release-assets/latchway-contract.tar.gz \
            release-assets/latchway-cross-repository-promotion.attestation.sigstore.json \
            release-assets/latchway-cross-repository-promotion.json \
            release-assets/latchway-linux-amd64-license.json \
            release-assets/latchway-linux-amd64-vulnerability.json \
            release-assets/latchway-linux-amd64.spdx.json \
            release-assets/latchway-linux-arm64-license.json \
            release-assets/latchway-linux-arm64-vulnerability.json \
            release-assets/latchway-linux-arm64.spdx.json \
            release-assets/oci-alias-promotion.json \
            release-assets/security-summary.attestation.sigstore.json \
            release-assets/security-summary.json \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-handoff-files.txt"
          find "$root" -type f -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-handoff-files.txt"
          diff --unified=0 "$RUNNER_TEMP/expected-handoff-files.txt" "$RUNNER_TEMP/actual-handoff-files.txt"
          grep --fixed-strings --invert-match --line-regexp handoff.sha256 \
            "$RUNNER_TEMP/expected-handoff-files.txt" > "$RUNNER_TEMP/expected-handoff-hashes.txt"
          sed -nE 's/^[0-9a-f]{64}  (.+)$/\1/p' "$root/handoff.sha256" \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-handoff-hashes.txt"
          diff --unified=0 "$RUNNER_TEMP/expected-handoff-hashes.txt" "$RUNNER_TEMP/actual-handoff-hashes.txt"
          (cd "$root" && sha256sum --strict --check handoff.sha256)
          metadata="$root/metadata.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" '
            (keys | sort) == ["candidate_commit","image","index_digest","intended_tag","kind","oci_image_digest","promotion_report_sha256","schema_version","version"] and
            .schema_version == 1 and .kind == "latchway_release_promotion_handoff" and
            .candidate_commit == $commit and .intended_tag == $tag and .version == ($tag | ltrimstr("v")) and
            .image == "ghcr.io/latchway/latchway" and (.index_digest | test("^sha256:[0-9a-f]{64}$")) and
            .oci_image_digest == (.image + "@" + .index_digest) and
            (.promotion_report_sha256 | test("^[0-9a-f]{64}$"))
          ' "$metadata" >/dev/null
          report_sha256=$(jq --raw-output .promotion_report_sha256 "$metadata")
          image=$(jq --raw-output .image "$metadata")
          index_digest=$(jq --raw-output .index_digest "$metadata")
          oci_image_digest=$(jq --raw-output .oci_image_digest "$metadata")
          version=$(jq --raw-output .version "$metadata")
          candidate="$assets/latchway-candidate.json"
          promotion="$assets/latchway-cross-repository-promotion.json"
          security="$assets/security-summary.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --arg image "$image" --arg digest "$index_digest" '
              .schema_version == 1 and .kind == "latchway_release_candidate" and .status == "passed" and
              .candidate_commit == $commit and .intended_tag == $tag and .version == ($tag | ltrimstr("v")) and
              .image.repository == $image and .image.index_digest == $digest and
              ([.artifacts[].path] | sort) == ["latchway-contract.tar.gz","latchway-linux-amd64-license.json","latchway-linux-amd64-vulnerability.json","latchway-linux-amd64.spdx.json","latchway-linux-arm64-license.json","latchway-linux-arm64-vulnerability.json","latchway-linux-arm64.spdx.json"]
            ' "$candidate" >/dev/null
          jq --exit-status --raw-output '.artifacts[] | [.path,.sha256] | @tsv' "$candidate" \
            | while IFS=$'\t' read -r relative expected_sha; do
                [[ "$relative" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
                [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
                test "$(sha256sum "$assets/$relative" | cut -d ' ' -f 1)" = "$expected_sha"
              done
          test "$(sha256sum "$promotion" | cut -d ' ' -f 1)" = "$report_sha256"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" --arg image "$oci_image_digest" '
            .schema_version == 1 and .kind == "latchway_cross_repository_conformance_evidence" and
            .scope == "promotion" and .verdict == "passed" and .promotion_ready == true and .release_ready == false and
            .contract.core_release == $tag and .contract.oci_image_digest == $image and
            ([.repositories[] | select(.id == "core" and .commit == $commit and .intended_tag == $tag)] | length) == 1 and
            .documentation.repository == "https://github.com/Latchway/latchway-docs.git" and
            .documentation.canonical_core_commit == $commit and
            (.documentation.commit | test("^[0-9a-f]{40}$")) and
            (.documentation.source_commit | test("^[0-9a-f]{40}$")) and
            (.documentation.source_manifest_sha256 | test("^[0-9a-f]{64}$")) and
            (.documentation.source_tree_sha256 | test("^[0-9a-f]{64}$")) and
            (.documentation.owned_file_count | type == "number" and floor == . and . >= 1 and . <= 4096)
          ' "$promotion" >/dev/null
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --arg digest "$index_digest" --arg report_sha256 "$report_sha256" '
              .schema_version == 2 and .kind == "latchway_candidate_security_evidence" and
              .automated_gate == "passed" and .independent_review_gate == "passed" and
              .candidate.commit == $commit and .candidate.intended_tag == $tag and
              .candidate.image.index_digest == $digest and
              .promotion_conformance.report_sha256 == $report_sha256
            ' "$security" >/dev/null
          diff --unified=0 \
            <(jq --sort-keys '.documentation' "$promotion") \
            <(jq --sort-keys '.promotion_conformance.documentation' "$security")
          moving='[]'
          if [[ "$version" != *-* ]]; then
            IFS=. read -r major minor patch <<< "$version"
            moving=$(jq --null-input --compact-output --arg mm "$major.$minor" --arg m "$major" '[ $mm, $m, "latest" ]')
          fi
          jq --exit-status --arg image "$image" --arg version "$version" --arg commit "$CANDIDATE_COMMIT" \
            --arg digest "$index_digest" --argjson moving "$moving" '
              .schema_version == 1 and .kind == "latchway_oci_alias_promotion" and
              .repository == $image and .version == $version and .source_commit == $commit and
              .index_digest == $digest and .immutable_version == $version and .moving_aliases == $moving
            ' "$assets/oci-alias-promotion.json" >/dev/null
          cli_version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$cli_version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          gh attestation verify "$candidate" --bundle "$assets/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          gh attestation verify "$security" --bundle "$assets/security-summary.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/security.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          gh attestation verify "$promotion" --bundle "$assets/latchway-cross-repository-promotion.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          expected_message="Latchway $INTENDED_TAG

          Promotion evidence SHA-256: $report_sha256"
          expected_body="Immutable Latchway product release $INTENDED_TAG.

          Candidate commit: $CANDIDATE_COMMIT
          Promotion evidence SHA-256: $report_sha256"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INTENDED_TAG" > "$RUNNER_TEMP/staged-tag-ref.json"
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/staged-tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/staged-tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/staged-tag.json"
          jq --exit-status --arg tag "$INTENDED_TAG" --arg commit "$CANDIDATE_COMMIT" --arg message "$expected_message" '
            .tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message
          ' "$RUNNER_TEMP/staged-tag.json" >/dev/null
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_TAG" > "$RUNNER_TEMP/staged-release.json"
          expected_prerelease=false
          if [[ "$INTENDED_TAG" == *-* ]]; then expected_prerelease=true; fi
          jq --exit-status --arg tag "$INTENDED_TAG" --arg title "Latchway $INTENDED_TAG" --arg body "$expected_body" \
            --argjson prerelease "$expected_prerelease" '
              .tag_name == $tag and .name == $title and .body == $body and .prerelease == $prerelease and
              ((.draft == true and .immutable == false) or (.draft == false and .immutable == true)) and
              ([.assets[].name] | sort) == ["latchway-candidate.attestation.sigstore.json","latchway-candidate.json","latchway-contract.tar.gz","latchway-cross-repository-promotion.attestation.sigstore.json","latchway-cross-repository-promotion.json","latchway-linux-amd64-license.json","latchway-linux-amd64-vulnerability.json","latchway-linux-amd64.spdx.json","latchway-linux-arm64-license.json","latchway-linux-arm64-vulnerability.json","latchway-linux-arm64.spdx.json","oci-alias-promotion.json","security-summary.attestation.sigstore.json","security-summary.json"]
            ' "$RUNNER_TEMP/staged-release.json" >/dev/null
          for asset in "$assets"/*; do
            name=${asset##*/}
            expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            actual=$(jq --raw-output --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then (.[0].digest // "digest-unavailable") else error("staged asset missing or duplicated") end' "$RUNNER_TEMP/staged-release.json")
            test "$actual" = "$expected"
          done
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          echo "oci_image_digest=$oci_image_digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Promote only the verified index digest to stable OCI tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.validated.outputs.image }}
          INDEX_DIGEST: ${{ steps.validated.outputs.index_digest }}
          VERSION: ${{ steps.validated.outputs.version }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          umask 077
          export LC_ALL=C
          docker_config=$(mktemp -d "$RUNNER_TEMP/latchway-promotion-docker.XXXXXX")
          export DOCKER_CONFIG="$docker_config"
          test -z "$(find "$DOCKER_CONFIG" -mindepth 1 -print -quit)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          inspect_reference() {
            local reference="$1" output="$2" error="$3"
            set +e
            docker buildx imagetools inspect --raw "$reference" > "$output" 2> "$error"
            local status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              grep --extended-regexp --ignore-case --quiet \
                'manifest unknown|name unknown|not found' \
                "$error"
              return 1
            fi
          }
          digest_of() {
            printf 'sha256:%s\n' "$(sha256sum "$1" | cut -d ' ' -f 1)"
          }
          component_less() {
            local left="$1" right="$2"
            if (( ${#left} != ${#right} )); then
              (( ${#left} < ${#right} ))
            else
              [[ "$left" < "$right" ]]
            fi
          }
          require_alias_transition() {
            local alias="$1" current="$2" candidate="$3"
            [[ "$current" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            local current_major=${BASH_REMATCH[1]}
            local current_minor=${BASH_REMATCH[2]}
            local current_patch=${BASH_REMATCH[3]}
            [[ "$candidate" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            local candidate_major=${BASH_REMATCH[1]}
            local candidate_minor=${BASH_REMATCH[2]}
            local candidate_patch=${BASH_REMATCH[3]}
            case "$alias" in
              latest) ;;
              "$candidate_major") test "$current_major" = "$candidate_major" ;;
              "$candidate_major.$candidate_minor")
                test "$current_major" = "$candidate_major"
                test "$current_minor" = "$candidate_minor"
                ;;
              *) echo "invalid OCI alias transition scope" >&2; return 1 ;;
            esac
            if [[ "$current_major" != "$candidate_major" ]]; then
              component_less "$current_major" "$candidate_major"
            elif [[ "$current_minor" != "$candidate_minor" ]]; then
              component_less "$current_minor" "$candidate_minor"
            else
              test "$current_patch" != "$candidate_patch"
              component_less "$current_patch" "$candidate_patch"
            fi
          }

          # The exact version coordinate is immutable: create once or require
          # byte identity forever. It is never overwritten by a retry.
          version_target="$IMAGE:$VERSION"
          if inspect_reference "$version_target" \
            "$RUNNER_TEMP/oci-version-existing.json" \
            "$RUNNER_TEMP/oci-version-existing.error"; then
            test "$(digest_of "$RUNNER_TEMP/oci-version-existing.json")" = "$INDEX_DIGEST"
          else
            docker buildx imagetools create --tag "$version_target" "$IMAGE@$INDEX_DIGEST"
          fi
          docker buildx imagetools inspect --raw "$version_target" \
            > "$RUNNER_TEMP/oci-version-final.json"
          test "$(digest_of "$RUNNER_TEMP/oci-version-final.json")" = "$INDEX_DIGEST"

          if [[ "$VERSION" != *-* ]]; then
            IFS=. read -r major minor patch <<< "$VERSION"
            [[ "$major" =~ ^(0|[1-9][0-9]*)$ ]]
            [[ "$minor" =~ ^(0|[1-9][0-9]*)$ ]]
            [[ "$patch" =~ ^(0|[1-9][0-9]*)$ ]]
            aliases=("$major.$minor" "$major" latest)
            declare -A alias_state=()
            declare -A alias_digest=()
            declare -A finalized_versions=()
            jq --null-input \
              --arg mm "$major.$minor" --arg m "$major" \
              '{
                aliases: {($mm): null, ($m): null, latest: null},
                stable_predecessors: {}
              }' \
              > "$RUNNER_TEMP/oci-alias-transition-plan.json"

            require_finalized_version() {
              local prior_version="$1" prior_commit="$2"
              local prefix="$RUNNER_TEMP/prior-final-$prior_version"
              local evidence_tag="evidence/v$prior_version"
              local expected_title="Latchway v$prior_version final evidence"
              local expected_body="Authoritative final evidence for immutable product release v$prior_version at $prior_commit."
              local expected_message
              printf -v expected_message \
                'Latchway v%s final evidence\n\nProduct release: v%s\nCandidate commit: %s' \
                "$prior_version" "$prior_version" "$prior_commit"
              if [[ -n "${finalized_versions[$prior_version]:-}" ]]; then
                test "${finalized_versions[$prior_version]}" = "$prior_commit"
                return
              fi
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$evidence_tag" \
                > "$prefix-tag-ref.json"
              jq --exit-status --arg ref "refs/tags/$evidence_tag" \
                '.ref == $ref and .object.type == "tag" and
                 (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))' \
                "$prefix-tag-ref.json" >/dev/null
              local evidence_tag_object
              evidence_tag_object=$(jq --raw-output .object.sha "$prefix-tag-ref.json")
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$evidence_tag_object" \
                > "$prefix-tag-object.json"
              jq --exit-status \
                --arg tag "$evidence_tag" \
                --arg commit "$prior_commit" \
                --arg message "$expected_message" \
                '.tag == $tag and .object.type == "commit" and
                 .object.sha == $commit and .message == $message' \
                "$prefix-tag-object.json" >/dev/null
              gh api -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/$GITHUB_REPOSITORY/releases/tags/$evidence_tag" \
                > "$prefix-release.json"
              jq --exit-status \
                --arg tag "$evidence_tag" \
                --arg title "$expected_title" \
                --arg body "$expected_body" \
                --argjson assets '[
                  "COMPLETION_REPORT.attestation.sigstore.json",
                  "COMPLETION_REPORT.md",
                  "SHA256SUMS",
                  "latchway-cross-repository-release.attestation.sigstore.json",
                  "latchway-cross-repository-release.json",
                  "latchway-product-release-attestation.json",
                  "latchway-public-registry-byte-proof.json",
                  "latchway-publication-state.json",
                  "latchway-release-evidence-v1.tar.gz"
                ]' \
                '.tag_name == $tag and .name == $title and .body == $body and
                 .draft == false and .prerelease == false and .immutable == true and
                 ([.assets[].name] | sort) == $assets and
                 all(.assets[]; (.id | type == "number" and . > 0) and
                   (.size | type == "number" and . > 0) and
                   (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))' \
                "$prefix-release.json" >/dev/null
              gh release verify "$evidence_tag" --format json \
                > "$prefix-release-attestation.json"
              test -s "$prefix-release-attestation.json"
              mkdir "$prefix-assets"
              gh release download "$evidence_tag" --dir "$prefix-assets"
              gh attestation verify "$prefix-assets/COMPLETION_REPORT.md" \
                --bundle "$prefix-assets/COMPLETION_REPORT.attestation.sigstore.json" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/finalize-release-record.yml" \
                --source-digest "$prior_commit" \
                --signer-digest "$prior_commit" \
                --source-ref refs/heads/main \
                --deny-self-hosted-runners >/dev/null
              test -z "$(find "$prefix-assets" -type l -print -quit)"
              printf '%s\n' \
                COMPLETION_REPORT.attestation.sigstore.json \
                COMPLETION_REPORT.md \
                SHA256SUMS \
                latchway-cross-repository-release.attestation.sigstore.json \
                latchway-cross-repository-release.json \
                latchway-product-release-attestation.json \
                latchway-public-registry-byte-proof.json \
                latchway-publication-state.json \
                latchway-release-evidence-v1.tar.gz \
                | LC_ALL=C sort > "$prefix-expected-assets.txt"
              find "$prefix-assets" -maxdepth 1 -type f -printf '%f\n' \
                | LC_ALL=C sort > "$prefix-actual-assets.txt"
              diff --unified=0 "$prefix-expected-assets.txt" "$prefix-actual-assets.txt"
              while IFS= read -r name; do
                file="$prefix-assets/$name"
                test -s "$file"
                expected_size=$(jq --raw-output --arg name "$name" \
                  '[.assets[] | select(.name == $name)] | if length == 1 then .[0].size else error("prior evidence asset missing or duplicated") end' \
                  "$prefix-release.json")
                expected_digest=$(jq --raw-output --arg name "$name" \
                  '[.assets[] | select(.name == $name)] | if length == 1 then .[0].digest else error("prior evidence asset missing or duplicated") end' \
                  "$prefix-release.json")
                [[ "$expected_size" =~ ^[1-9][0-9]*$ ]]
                (( expected_size <= 1073741824 ))
                test "$(stat --format=%s "$file")" = "$expected_size"
                test "sha256:$(sha256sum "$file" | cut -d ' ' -f 1)" = "$expected_digest"
              done < "$prefix-expected-assets.txt"
              (( $(stat --format=%s "$prefix-assets/SHA256SUMS") <= 65536 ))
              (( $(stat --format=%s "$prefix-assets/COMPLETION_REPORT.md") <= 33554432 ))
              sed -nE 's/^[0-9a-f]{64}  ([A-Za-z0-9][A-Za-z0-9._-]{0,127})$/\1/p' \
                "$prefix-assets/SHA256SUMS" | LC_ALL=C sort \
                > "$prefix-checksum-assets.txt"
              grep --fixed-strings --invert-match --line-regexp SHA256SUMS \
                "$prefix-expected-assets.txt" > "$prefix-expected-checksum-assets.txt"
              diff --unified=0 "$prefix-expected-checksum-assets.txt" "$prefix-checksum-assets.txt"
              (cd "$prefix-assets" && sha256sum --strict --check SHA256SUMS)
              identity="| Core repository commit and tag | \`$prior_commit\` / \`v$prior_version\` |"
              target="Evidence publication target: [\`evidence/v$prior_version\`]"
              test "$(grep --fixed-strings --count --line-regexp "$identity" "$prefix-assets/COMPLETION_REPORT.md")" = 1
              test "$(grep --fixed-strings --count "$target" "$prefix-assets/COMPLETION_REPORT.md")" = 1
              for name in \
                latchway-cross-repository-release.attestation.sigstore.json \
                latchway-cross-repository-release.json \
                latchway-product-release-attestation.json \
                latchway-public-registry-byte-proof.json \
                latchway-publication-state.json \
                latchway-release-evidence-v1.tar.gz; do
                expected=$(sha256sum "$prefix-assets/$name" | cut -d ' ' -f 1)
                reported=$(awk -F '`' -v expected_name="$name" '
                  $2 == expected_name && $4 ~ /^[0-9a-f]{64}$/ { print $4 }
                ' "$prefix-assets/COMPLETION_REPORT.md")
                test "$reported" = "$expected"
              done
              finalized_versions[$prior_version]="$prior_commit"
            }

            # A failed promotion can leave its immutable product tag and exact
            # OCI version before it reaches the moving-alias phase. Enumerate
            # every stable product tag so a later release cannot skip that
            # unfinished version merely because no moving alias reached it.
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '.[] | [.ref, .object.type, .object.sha] | @tsv' \
              > "$RUNNER_TEMP/stable-product-tag-refs.tsv"
            candidate_tag_seen=false
            while IFS=$'\t' read -r stable_ref object_type object_sha; do
              if [[ ! "$stable_ref" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                continue
              fi
              prior_version="${stable_ref#refs/tags/v}"
              if [[ "$prior_version" == "$VERSION" ]]; then
                candidate_tag_seen=true
                continue
              fi
              test "$object_type" = tag
              [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]
              # This also rejects an older candidate when any newer stable tag
              # already exists; stable promotions never skip or roll back.
              require_alias_transition latest "$prior_version" "$VERSION"
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                > "$RUNNER_TEMP/prior-product-$prior_version-tag.json"
              prior_commit=$(jq --exit-status --raw-output \
                '.object.sha | select(
                  type == "string" and test("^[0-9a-f]{40}$")
                )' "$RUNNER_TEMP/prior-product-$prior_version-tag.json")
              jq --exit-status \
                --arg tag "v$prior_version" \
                --arg commit "$prior_commit" \
                '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
                "$RUNNER_TEMP/prior-product-$prior_version-tag.json" >/dev/null
              require_finalized_version "$prior_version" "$prior_commit"
              jq \
                --arg version "$prior_version" \
                --arg commit "$prior_commit" \
                '.stable_predecessors[$version] = {
                  commit: $commit,
                  finalized: true
                }' "$RUNNER_TEMP/oci-alias-transition-plan.json" \
                > "$RUNNER_TEMP/oci-alias-transition-plan.next.json"
              mv -- "$RUNNER_TEMP/oci-alias-transition-plan.next.json" \
                "$RUNNER_TEMP/oci-alias-transition-plan.json"
            done < "$RUNNER_TEMP/stable-product-tag-refs.tsv"
            test "$candidate_tag_seen" = true

            # Preflight every moving alias and its predecessor's immutable final
            # evidence before changing any alias. This prevents a newer release
            # from making an unfinished older release impossible to finalize.
            for alias in "${aliases[@]}"; do
              target="$IMAGE:$alias"
              if inspect_reference "$target" \
                "$RUNNER_TEMP/oci-alias-$alias-existing.json" \
                "$RUNNER_TEMP/oci-alias-$alias-existing.error"; then
                current_digest="$(digest_of "$RUNNER_TEMP/oci-alias-$alias-existing.json")"
                alias_state[$alias]=present
                alias_digest[$alias]="$current_digest"
                predecessor_finalized=false
                if [[ "$current_digest" != "$INDEX_DIGEST" ]]; then
                  # Authenticate the prior alias state before authorizing a
                  # monotonic move. The version label alone is never trusted.
                  docker pull --platform linux/amd64 "$target" >/dev/null
                  current_version=$(docker image inspect --format \
                    '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$target")
                  current_commit=$(docker image inspect --format \
                    '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$target")
                  current_source=$(docker image inspect --format \
                    '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$target")
                  test "$current_source" = "https://github.com/Latchway/latchway"
                  [[ "$current_commit" =~ ^[0-9a-f]{40}$ ]]
                  require_alias_transition "$alias" "$current_version" "$VERSION"
                  docker buildx imagetools inspect --raw "$IMAGE:$current_version" \
                    > "$RUNNER_TEMP/oci-alias-$alias-current-version.json"
                  test "$(digest_of "$RUNNER_TEMP/oci-alias-$alias-current-version.json")" = "$current_digest"
                  gh api -H "X-GitHub-Api-Version: 2026-03-10" \
                    "repos/$GITHUB_REPOSITORY/releases/tags/v$current_version" \
                    > "$RUNNER_TEMP/oci-alias-$alias-current-release.json"
                  jq --exit-status --arg tag "v$current_version" \
                    '.tag_name == $tag and .draft == false and .prerelease == false and .immutable == true' \
                    "$RUNNER_TEMP/oci-alias-$alias-current-release.json" >/dev/null
                  gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$current_version" \
                    > "$RUNNER_TEMP/oci-alias-$alias-current-tag-ref.json"
                  tag_object=$(jq --raw-output \
                    '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
                    "$RUNNER_TEMP/oci-alias-$alias-current-tag-ref.json")
                  test "$(jq --raw-output .object.type "$RUNNER_TEMP/oci-alias-$alias-current-tag-ref.json")" = tag
                  gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
                    > "$RUNNER_TEMP/oci-alias-$alias-current-tag.json"
                  jq --exit-status --arg tag "v$current_version" --arg commit "$current_commit" \
                    '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
                    "$RUNNER_TEMP/oci-alias-$alias-current-tag.json" >/dev/null
                  cosign verify \
                    --certificate-identity "https://github.com/Latchway/latchway/.github/workflows/release.yml@refs/heads/main" \
                    --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                    --certificate-github-workflow-sha "$current_commit" \
                    "$IMAGE@$current_digest" >/dev/null
                  gh attestation verify "oci://$IMAGE@$current_digest" \
                    --repo "$GITHUB_REPOSITORY" \
                    --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                    --source-digest "$current_commit" \
                    --signer-digest "$current_commit" \
                    --source-ref refs/heads/main \
                    --deny-self-hosted-runners >/dev/null
                  require_finalized_version "$current_version" "$current_commit"
                  predecessor_finalized=true
                else
                  current_version="$VERSION"
                fi
                jq \
                  --arg alias "$alias" \
                  --arg current "$current_version" \
                  --argjson finalized "$predecessor_finalized" \
                  '.aliases[$alias] = {
                    current_version: $current,
                    predecessor_finalized: $finalized
                  }' "$RUNNER_TEMP/oci-alias-transition-plan.json" \
                  > "$RUNNER_TEMP/oci-alias-transition-plan.next.json"
                mv -- "$RUNNER_TEMP/oci-alias-transition-plan.next.json" \
                  "$RUNNER_TEMP/oci-alias-transition-plan.json"
              else
                alias_state[$alias]=absent
              fi
            done
            jq --exit-status --arg mm "$major.$minor" --arg m "$major" '
              (keys | sort) == ["aliases","stable_predecessors"] and
              (.aliases | keys | sort) == [$m, $mm, "latest"] and
              all(.aliases[]; . == null or
                ((keys | sort) == ["current_version","predecessor_finalized"] and
                 (.current_version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) and
                 (.predecessor_finalized | type) == "boolean")) and
              all(.stable_predecessors[];
                (keys | sort) == ["commit","finalized"] and
                (.commit | test("^[0-9a-f]{40}$")) and .finalized == true)
            ' "$RUNNER_TEMP/oci-alias-transition-plan.json" >/dev/null
            jq --sort-keys . "$RUNNER_TEMP/oci-alias-transition-plan.json" \
              > "$RUNNER_TEMP/oci-alias-transition-authorization.json"

            # Re-close each preflight state immediately before its controlled
            # create/advance. The shared concurrency group excludes another
            # Latchway promotion or finalizer throughout this phase.
            for alias in "${aliases[@]}"; do
              target="$IMAGE:$alias"
              if [[ "${alias_state[$alias]}" == present ]]; then
                docker buildx imagetools inspect --raw "$target" \
                  > "$RUNNER_TEMP/oci-alias-$alias-pre-update.json"
                test "$(digest_of "$RUNNER_TEMP/oci-alias-$alias-pre-update.json")" = "${alias_digest[$alias]}"
                if [[ "${alias_digest[$alias]}" != "$INDEX_DIGEST" ]]; then
                  docker buildx imagetools create --tag "$target" "$IMAGE@$INDEX_DIGEST"
                fi
              else
                if inspect_reference "$target" \
                  "$RUNNER_TEMP/oci-alias-$alias-pre-create.json" \
                  "$RUNNER_TEMP/oci-alias-$alias-pre-create.error"; then
                  echo "OCI alias appeared after absent preflight: $alias" >&2
                  exit 1
                fi
                docker buildx imagetools create --tag "$target" "$IMAGE@$INDEX_DIGEST"
              fi
              docker buildx imagetools inspect --raw "$target" \
                > "$RUNNER_TEMP/oci-alias-$alias-final.json"
              actual="$(digest_of "$RUNNER_TEMP/oci-alias-$alias-final.json")"
              test "$actual" = "$INDEX_DIGEST"
            done
          fi

          jq --exit-status \
            --arg repository "$IMAGE" --arg version "$VERSION" \
            --arg commit "$CANDIDATE_COMMIT" --arg digest "$INDEX_DIGEST" \
            '.schema_version == 1 and .kind == "latchway_oci_alias_promotion" and
             .repository == $repository and .version == $version and
             .source_commit == $commit and .index_digest == $digest and
             .immutable_version == $version' \
            "$RUNNER_TEMP/promotion-handoff/release-assets/oci-alias-promotion.json" >/dev/null

  publish-github-release:
    needs: [plan-promotion, stage-github-release, promote-oci]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      attestations: read
      contents: write
    outputs:
      report_sha256: ${{ steps.validated.outputs.report_sha256 }}
      oci_image_digest: ${{ steps.validated.outputs.oci_image_digest }}
    steps:
      - name: Verify the exact protected release environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:release"
      - name: Download the exact source-free mutation handoff on a fresh publication runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-promotion-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-handoff
      - name: Validate exact closure hashes and attestations before release publication
        id: validated
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          set -Eeuo pipefail
          test -z "${DOCKER_AUTH_CONFIG:-}"
          root="$RUNNER_TEMP/promotion-handoff"
          assets="$root/release-assets"
          test -z "$(find "$root" -type l -print -quit)"
          printf '%s\n' \
            handoff.sha256 metadata.json \
            release-assets/latchway-candidate.attestation.sigstore.json \
            release-assets/latchway-candidate.json \
            release-assets/latchway-contract.tar.gz \
            release-assets/latchway-cross-repository-promotion.attestation.sigstore.json \
            release-assets/latchway-cross-repository-promotion.json \
            release-assets/latchway-linux-amd64-license.json \
            release-assets/latchway-linux-amd64-vulnerability.json \
            release-assets/latchway-linux-amd64.spdx.json \
            release-assets/latchway-linux-arm64-license.json \
            release-assets/latchway-linux-arm64-vulnerability.json \
            release-assets/latchway-linux-arm64.spdx.json \
            release-assets/oci-alias-promotion.json \
            release-assets/security-summary.attestation.sigstore.json \
            release-assets/security-summary.json \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-handoff-files.txt"
          find "$root" -type f -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-handoff-files.txt"
          diff --unified=0 "$RUNNER_TEMP/expected-handoff-files.txt" "$RUNNER_TEMP/actual-handoff-files.txt"
          grep --fixed-strings --invert-match --line-regexp handoff.sha256 \
            "$RUNNER_TEMP/expected-handoff-files.txt" > "$RUNNER_TEMP/expected-handoff-hashes.txt"
          sed -nE 's/^[0-9a-f]{64}  (.+)$/\1/p' "$root/handoff.sha256" \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-handoff-hashes.txt"
          diff --unified=0 "$RUNNER_TEMP/expected-handoff-hashes.txt" "$RUNNER_TEMP/actual-handoff-hashes.txt"
          (cd "$root" && sha256sum --strict --check handoff.sha256)
          metadata="$root/metadata.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" '
            (keys | sort) == ["candidate_commit","image","index_digest","intended_tag","kind","oci_image_digest","promotion_report_sha256","schema_version","version"] and
            .schema_version == 1 and .kind == "latchway_release_promotion_handoff" and
            .candidate_commit == $commit and .intended_tag == $tag and .version == ($tag | ltrimstr("v")) and
            .image == "ghcr.io/latchway/latchway" and (.index_digest | test("^sha256:[0-9a-f]{64}$")) and
            .oci_image_digest == (.image + "@" + .index_digest) and
            (.promotion_report_sha256 | test("^[0-9a-f]{64}$"))
          ' "$metadata" >/dev/null
          report_sha256=$(jq --raw-output .promotion_report_sha256 "$metadata")
          image=$(jq --raw-output .image "$metadata")
          index_digest=$(jq --raw-output .index_digest "$metadata")
          oci_image_digest=$(jq --raw-output .oci_image_digest "$metadata")
          version=$(jq --raw-output .version "$metadata")
          candidate="$assets/latchway-candidate.json"
          promotion="$assets/latchway-cross-repository-promotion.json"
          security="$assets/security-summary.json"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --arg image "$image" --arg digest "$index_digest" '
              .schema_version == 1 and .kind == "latchway_release_candidate" and .status == "passed" and
              .candidate_commit == $commit and .intended_tag == $tag and .version == ($tag | ltrimstr("v")) and
              .image.repository == $image and .image.index_digest == $digest and
              ([.artifacts[].path] | sort) == ["latchway-contract.tar.gz","latchway-linux-amd64-license.json","latchway-linux-amd64-vulnerability.json","latchway-linux-amd64.spdx.json","latchway-linux-arm64-license.json","latchway-linux-arm64-vulnerability.json","latchway-linux-arm64.spdx.json"]
            ' "$candidate" >/dev/null
          jq --exit-status --raw-output '.artifacts[] | [.path,.sha256] | @tsv' "$candidate" \
            | while IFS=$'\t' read -r relative expected_sha; do
                [[ "$relative" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
                [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
                test "$(sha256sum "$assets/$relative" | cut -d ' ' -f 1)" = "$expected_sha"
              done
          test "$(sha256sum "$promotion" | cut -d ' ' -f 1)" = "$report_sha256"
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" --arg image "$oci_image_digest" '
            .schema_version == 1 and .kind == "latchway_cross_repository_conformance_evidence" and
            .scope == "promotion" and .verdict == "passed" and .promotion_ready == true and .release_ready == false and
            .contract.core_release == $tag and .contract.oci_image_digest == $image and
            ([.repositories[] | select(.id == "core" and .commit == $commit and .intended_tag == $tag)] | length) == 1 and
            .documentation.repository == "https://github.com/Latchway/latchway-docs.git" and
            .documentation.canonical_core_commit == $commit and
            (.documentation.commit | test("^[0-9a-f]{40}$")) and
            (.documentation.source_commit | test("^[0-9a-f]{40}$")) and
            (.documentation.source_manifest_sha256 | test("^[0-9a-f]{64}$")) and
            (.documentation.source_tree_sha256 | test("^[0-9a-f]{64}$")) and
            (.documentation.owned_file_count | type == "number" and floor == . and . >= 1 and . <= 4096)
          ' "$promotion" >/dev/null
          jq --exit-status --arg commit "$CANDIDATE_COMMIT" --arg tag "$INTENDED_TAG" \
            --arg digest "$index_digest" --arg report_sha256 "$report_sha256" '
              .schema_version == 2 and .kind == "latchway_candidate_security_evidence" and
              .automated_gate == "passed" and .independent_review_gate == "passed" and
              .candidate.commit == $commit and .candidate.intended_tag == $tag and
              .candidate.image.index_digest == $digest and
              .promotion_conformance.report_sha256 == $report_sha256
            ' "$security" >/dev/null
          diff --unified=0 \
            <(jq --sort-keys '.documentation' "$promotion") \
            <(jq --sort-keys '.promotion_conformance.documentation' "$security")
          cli_version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$cli_version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          gh attestation verify "$candidate" --bundle "$assets/latchway-candidate.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          gh attestation verify "$security" --bundle "$assets/security-summary.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/security.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          gh attestation verify "$promotion" --bundle "$assets/latchway-cross-repository-promotion.attestation.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cross-repository-conformance.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          find "$assets" -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort > "$RUNNER_TEMP/fixed-core-release-assets.txt"
          while IFS= read -r asset; do basename "$asset"; done < "$RUNNER_TEMP/fixed-core-release-assets.txt" \
            | LC_ALL=C sort > "$RUNNER_TEMP/product-expected-assets.txt"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_TAG" > "$RUNNER_TEMP/publication-preflight-release.json"
          release_mode=$(jq --raw-output 'if .immutable == true and .draft == false then "immutable" elif .immutable == false and .draft == true then "draft" else "invalid" end' "$RUNNER_TEMP/publication-preflight-release.json")
          case "$release_mode" in draft|immutable) ;; *) exit 1 ;; esac
          echo "report_sha256=$report_sha256" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          echo "oci_image_digest=$oci_image_digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_mode=$release_mode" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify both immutable and moving OCI coordinates before publication
        shell: bash
        env:
          IMAGE: ${{ steps.validated.outputs.image }}
          INDEX_DIGEST: ${{ steps.validated.outputs.index_digest }}
          OCI_IMAGE_DIGEST: ${{ steps.validated.outputs.oci_image_digest }}
          VERSION: ${{ steps.validated.outputs.version }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          test -z "${DOCKER_AUTH_CONFIG:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          public_docker_config=$(mktemp -d "$RUNNER_TEMP/latchway-public-docker.XXXXXX")
          chmod 0700 "$public_docker_config"
          printf '{"auths":{}}\n' > "$public_docker_config/config.json"
          chmod 0600 "$public_docker_config/config.json"
          export DOCKER_CONFIG="$public_docker_config"
          jq --exit-status '. == {"auths":{}}' "$DOCKER_CONFIG/config.json" >/dev/null
          verify_coordinate() {
            local coordinate="$1" output="$2"
            docker buildx imagetools inspect --raw "$coordinate" > "$output"
            test "sha256:$(sha256sum "$output" | cut -d ' ' -f 1)" = "$INDEX_DIGEST"
          }
          verify_coordinate "$IMAGE:$VERSION" "$RUNNER_TEMP/oci-version-publication.json"
          if [[ "$VERSION" != *-* ]]; then
            IFS=. read -r major minor patch <<< "$VERSION"
            verify_coordinate "$IMAGE:$major.$minor" "$RUNNER_TEMP/oci-minor-publication.json"
            verify_coordinate "$IMAGE:$major" "$RUNNER_TEMP/oci-major-publication.json"
            verify_coordinate "$IMAGE:latest" "$RUNNER_TEMP/oci-latest-publication.json"
          fi
          candidate="$RUNNER_TEMP/promotion-handoff/release-assets/latchway-candidate.json"
          for architecture in amd64 arm64; do
            child_digest=$(jq --raw-output --arg platform "linux/$architecture" '.image.platforms[$platform]' "$candidate")
            [[ "$child_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            reference="$IMAGE@$child_digest"
            docker pull --platform "linux/$architecture" "$reference" >/dev/null
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$reference")" = "linux/$architecture"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$reference")" = "https://github.com/$GITHUB_REPOSITORY"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$reference")" = "$CANDIDATE_COMMIT"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$reference")" = "$VERSION"
            docker image inspect --format '{{json .RepoDigests}}' "$reference" \
              | jq --exit-status --arg reference "$reference" 'index($reference) != null' >/dev/null
            docker image inspect --format '{{json .RootFS.Layers}}' "$reference" \
              | jq --exit-status 'type == "array" and length > 0 and all(.[]; test("^sha256:[0-9a-f]{64}$"))' >/dev/null
            gh attestation verify "oci://$reference" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
              --source-ref refs/heads/main --deny-self-hosted-runners --bundle-from-oci \
              --predicate-type https://spdx.dev/Document/v2.3 --format json \
              > "$RUNNER_TEMP/$architecture-public-spdx.json"
            jq --exit-status --slurpfile expected \
              "$RUNNER_TEMP/promotion-handoff/release-assets/latchway-linux-$architecture.spdx.json" \
              --arg digest "${child_digest#sha256:}" '
              type == "array" and length >= 1 and
              all(.[].verificationResult.statement;
                .predicateType == "https://spdx.dev/Document/v2.3" and
                any(.subject[]; .digest.sha256 == $digest)) and
              any(.[].verificationResult.statement;
                .predicateType == "https://spdx.dev/Document/v2.3" and
                any(.subject[]; .digest.sha256 == $digest) and .predicate == $expected[0])
            ' "$RUNNER_TEMP/$architecture-public-spdx.json" >/dev/null
          done
          cosign verify \
            --certificate-identity "https://github.com/Latchway/latchway/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$CANDIDATE_COMMIT" \
            "$OCI_IMAGE_DIGEST" >/dev/null
          gh attestation verify "oci://$OCI_IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$CANDIDATE_COMMIT" --signer-digest "$CANDIDATE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners --bundle-from-oci \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null
          jq --exit-status '. == {"auths":{}}' "$DOCKER_CONFIG/config.json" >/dev/null
      - name: Publish the immutable release record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          REPORT_SHA256: ${{ steps.validated.outputs.report_sha256 }}
          RELEASE_MODE: ${{ steps.validated.outputs.release_mode }}
        run: |
          set -Eeuo pipefail
          case "$RELEASE_MODE" in
            draft|immutable) ;;
            *) echo "invalid immutable-release preflight mode" >&2; exit 1 ;;
          esac
          expected_message="Latchway $INTENDED_TAG

          Promotion evidence SHA-256: $REPORT_SHA256"
          expected_body="Immutable Latchway product release $INTENDED_TAG.

          Candidate commit: $CANDIDATE_COMMIT
          Promotion evidence SHA-256: $REPORT_SHA256"
          expected_prerelease=false
          if [[ "$INTENDED_TAG" == *-* ]]; then expected_prerelease=true; fi

          # Close both mutable objects again immediately before publication.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INTENDED_TAG" \
            > "$RUNNER_TEMP/pre-publish-product-tag-ref.json"
          jq --exit-status --arg ref "refs/tags/$INTENDED_TAG" \
            '.ref == $ref and .object.type == "tag" and
             (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/pre-publish-product-tag-ref.json" >/dev/null
          tag_object=$(jq --raw-output .object.sha \
            "$RUNNER_TEMP/pre-publish-product-tag-ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            > "$RUNNER_TEMP/pre-publish-product-tag-object.json"
          jq --exit-status \
            --arg tag "$INTENDED_TAG" \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg message "$expected_message" \
            '.tag == $tag and .object.type == "commit" and
             .object.sha == $commit and .message == $message' \
            "$RUNNER_TEMP/pre-publish-product-tag-object.json" >/dev/null
          gh api --include -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_TAG" \
            > "$RUNNER_TEMP/pre-publish-release-snapshot.http"
          head -n 1 "$RUNNER_TEMP/pre-publish-release-snapshot.http" \
            | tr -d '\r' | grep --extended-regexp --quiet '^HTTP/[0-9.]+ 200( |$)'
          awk '
            {
              line=$0
              sub(/\r$/, "", line)
              if (body) print $0
              else if (line == "") body=1
            }
          ' "$RUNNER_TEMP/pre-publish-release-snapshot.http" > "$RUNNER_TEMP/release.json"
          awk '
            {
              line=$0
              sub(/\r$/, "", line)
              if (tolower(line) ~ /^etag:[[:space:]]*/) {
                sub(/^[^:]+:[[:space:]]*/, "", line)
                print line
              }
            }
          ' "$RUNNER_TEMP/pre-publish-release-snapshot.http" \
            > "$RUNNER_TEMP/pre-publish-release.etag"
          test "$(wc -l < "$RUNNER_TEMP/pre-publish-release.etag" | tr -d ' ')" = 1
          grep --extended-regexp --quiet '^(W/)?"[^"]+"$' "$RUNNER_TEMP/pre-publish-release.etag"
          jq --exit-status 'type == "object"' "$RUNNER_TEMP/release.json" >/dev/null
          release_id=$(jq --raw-output '.id | select(type == "number" and . > 0)' \
            "$RUNNER_TEMP/release.json")
          if [[ "$RELEASE_MODE" == immutable ]]; then
            expected_draft=false
            expected_immutable=true
          else
            expected_draft=true
            expected_immutable=false
          fi
          jq --exit-status \
            --arg tag "$INTENDED_TAG" \
            --arg title "Latchway $INTENDED_TAG" \
            --arg body "$expected_body" \
            --argjson prerelease "$expected_prerelease" \
            --argjson draft "$expected_draft" \
            --argjson immutable "$expected_immutable" \
            --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .name == $title and .body == $body and
             .prerelease == $prerelease and .draft == $draft and
             .immutable == $immutable' "$RUNNER_TEMP/release.json" >/dev/null
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/release.json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/product-pre-publish-assets.txt"
          diff --unified=0 \
            "$RUNNER_TEMP/product-expected-assets.txt" \
            "$RUNNER_TEMP/product-pre-publish-assets.txt"
          while IFS= read -r asset; do
            name=${asset##*/}
            expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            actual=$(jq --raw-output --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then (.[0].digest // "digest-unavailable")
              else error("pre-publication core asset missing or duplicated") end
            ' "$RUNNER_TEMP/release.json")
            test "$actual" = "$expected"
          done < "$RUNNER_TEMP/fixed-core-release-assets.txt"
          if [[ "$RELEASE_MODE" != immutable ]]; then
            release_id=$(jq --raw-output '.id | select(type == "number" and . > 0)' \
              "$RUNNER_TEMP/release.json")
            jq --null-input '{draft: false}' > "$RUNNER_TEMP/publish-release.json"
            # GitHub does not document If-Match for this unsafe PATCH. Use the
            # strongest supported guard: prove the exact validated ETag is still
            # current with a conditional GET immediately before the one PATCH.
            gh api --include \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "If-None-Match: $(cat "$RUNNER_TEMP/pre-publish-release.etag")" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_TAG" \
              > "$RUNNER_TEMP/pre-publish-release-unchanged.http"
            head -n 1 "$RUNNER_TEMP/pre-publish-release-unchanged.http" \
              | tr -d '\r' | grep --extended-regexp --quiet '^HTTP/[0-9.]+ 304( |$)'
            gh api --method PATCH \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --input "$RUNNER_TEMP/publish-release.json" \
              > "$RUNNER_TEMP/published-release.json"
          fi
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_TAG" \
            > "$RUNNER_TEMP/release.json"
          jq --exit-status \
            --arg tag "$INTENDED_TAG" \
            --arg title "Latchway $INTENDED_TAG" \
            --arg body "$expected_body" \
            --argjson prerelease "$expected_prerelease" \
            --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .name == $title and .body == $body and
             .draft == false and .prerelease == $prerelease and
             .immutable == true' "$RUNNER_TEMP/release.json" >/dev/null
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/release-by-id.json"
          cmp --silent \
            <(jq --sort-keys . "$RUNNER_TEMP/release.json") \
            <(jq --sort-keys . "$RUNNER_TEMP/release-by-id.json")
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/release.json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/product-final-assets.txt"
          diff --unified=0 \
            "$RUNNER_TEMP/product-expected-assets.txt" \
            "$RUNNER_TEMP/product-final-assets.txt"
          while IFS= read -r asset; do
            name=${asset##*/}
            expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            existing=$(jq --raw-output --arg name "$name" \
              '[.assets[] | select(.name == $name)] |
               if length == 1 then (.[0].digest // "digest-unavailable")
               else error("immutable core release asset missing or duplicated") end' \
              "$RUNNER_TEMP/release.json")
            test "$existing" = "$expected"
            gh release verify-asset "$INTENDED_TAG" "$asset" --format json \
              > "$RUNNER_TEMP/product-release-asset-${name}.json"
          done < "$RUNNER_TEMP/fixed-core-release-assets.txt"
          gh release verify "$INTENDED_TAG" --format json \
            > "$RUNNER_TEMP/product-release-attestation.json"
          test -s "$RUNNER_TEMP/product-release-attestation.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INTENDED_TAG" \
            > "$RUNNER_TEMP/post-publish-product-tag-ref.json"
          cmp --silent \
            <(jq --sort-keys . "$RUNNER_TEMP/pre-publish-product-tag-ref.json") \
            <(jq --sort-keys . "$RUNNER_TEMP/post-publish-product-tag-ref.json")

  dispatch-sdk-publications:
    needs: [authenticate-inputs, promote-oci, publish-github-release]
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify the exact protected release environment
        shell: bash
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway:release"
      - name: Download the source-free promotion handoff after both mutations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-promotion-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-handoff
      - name: Dispatch exact evidence-bound SDK publications without a checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_RELEASE_DISPATCH_TOKEN }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          PROMOTION_REPORT: ${{ runner.temp }}/promotion-handoff/release-assets/latchway-cross-repository-promotion.json
          REPORT_SHA256: ${{ needs.publish-github-release.outputs.report_sha256 }}
          OCI_IMAGE_DIGEST: ${{ needs.publish-github-release.outputs.oci_image_digest }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OCI_IMAGE_DIGEST" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          test "$(sha256sum "$PROMOTION_REPORT" | cut -d ' ' -f 1)" = "$REPORT_SHA256"
          for mapping in \
            'javascript:latchway-js' \
            'ios:latchway-ios-sdk' \
            'android:latchway-android' \
            'react_native:latchway-react-native-sdk'; do
            repository_id=${mapping%%:*}
            repository_name=${mapping#*:}
            coordinate=$(jq --compact-output --arg id "$repository_id" \
              '[.repositories[] | select(.id == $id)] | if length == 1 then .[0] else error("SDK coordinate missing or duplicated") end' \
              "$PROMOTION_REPORT")
            jq --null-input \
              --arg core_tag "$INTENDED_TAG" \
              --arg evidence_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$INTENDED_TAG/latchway-cross-repository-promotion.json" \
              --arg evidence_sha256 "$REPORT_SHA256" \
              --arg oci_image_digest "$OCI_IMAGE_DIGEST" \
              --argjson coordinate "$coordinate" \
              '{event_type: "latchway_release_promoted", client_payload: {core_tag: $core_tag, promotion_evidence_url: $evidence_url, promotion_evidence_sha256: $evidence_sha256, oci_image_digest: $oci_image_digest, repository: $coordinate}}' \
              > "$RUNNER_TEMP/sdk-dispatch.json"
            gh api --method POST "repos/Latchway/$repository_name/dispatches" \
              --input "$RUNNER_TEMP/sdk-dispatch.json"
          done
