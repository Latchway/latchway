name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate normative contracts
        run: python3 scripts/validate-contracts.py
      - name: Prove deterministic contract bundle
        run: |
          python3 scripts/build-contract-bundle.py --output-directory /tmp/contract-a
          python3 scripts/build-contract-bundle.py --output-directory /tmp/contract-b
          cmp /tmp/contract-a/latchway-contract-0.1.0.tar.gz /tmp/contract-b/latchway-contract-0.1.0.tar.gz

  core:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: latchway
          POSTGRES_USER: latchway
          POSTGRES_PASSWORD: latchway-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latchway -d latchway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LATCHWAY_TEST_DATABASE_URL: postgres://latchway:latchway-ci@127.0.0.1:5432/latchway?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: make fmt
      - name: Verify sqlc output
        run: make check-generated
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL integration tests
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -count=1 ./...

  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/console/pnpm-lock.yaml
      - name: Enable pinned package manager
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Install
        working-directory: web/console
        run: pnpm install --frozen-lockfile
      - name: Check console
        working-directory: web/console
        run: pnpm check
      - name: Prove reproducible embedded assets
        working-directory: web/console
        run: pnpm verify:reproducible

  image:
    runs-on: ubuntu-24.04
    needs: [contracts, core, console]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build production OCI image
        run: docker build --pull --tag latchway:ci .
      - name: Assert non-root runtime identity
        run: test "$(docker image inspect --format '{{.Config.User}}' latchway:ci)" = "65532"
