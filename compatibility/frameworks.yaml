schema_version: 1
frameworks:
  - id: android-okhttp
    name: Android OkHttp ecosystem
    tier: tier_1
    ecosystem: android
    package: com.squareup.okhttp3:okhttp
    integration: interceptor_authenticator
    latchway_package: dev.latchway:latchway-okhttp
    support: experimental
    tested:
      minimum: 4.9.2
      latest: 5.3.0
    capabilities:
      responses: true
      chat_completions: true
      text: true
      streaming: true
      tools: conditional
      structured_output: conditional
      embeddings: true
      audio: conditional
      images: conditional
      cancellation: true
      app_extensions: false
    security:
      dpop: full
      native_key_isolation: partial
    limitations:
      - Local source, route, replay, streaming, and cancellation tests pass on 4.9.2 and 5.3.0; hosted gateway conformance and physical Play-distributed key proof remain release gates.
  - id: foundation-models
    name: Apple Foundation Models
    tier: tier_1
    ecosystem: apple
    package: FoundationModels
    integration: language_model_executor
    latchway_package: LatchwayFoundationModels
    support: experimental
    tested:
      minimum: 27.0.0
      latest: 27.0.0
    capabilities:
      responses: true
      chat_completions: false
      text: true
      streaming: true
      tools: false
      structured_output: false
      embeddings: false
      audio: false
      images: false
      cancellation: true
      app_extensions: conditional
    security:
      dpop: partial
      native_key_isolation: partial
    limitations:
      - Twelve iOS 27.0 simulator tests pass text, transcript, incremental usage, cancellation, quota/unavailable mapping, refresh, header and provider-placeholder isolation, logger redaction, and explicit tools/schema rejection; physical framework execution and delegated-extension runtime remain pending.
  - id: koog-android
    name: Koog OpenAI client
    tier: tier_1
    ecosystem: android
    package: ai.koog:prompt-executor-openai-client
    integration: preconfigured_okhttp_absolute_path
    latchway_package: dev.latchway:latchway-okhttp
    support: experimental
    tested:
      minimum: 1.1.1
      latest: 1.1.1
    capabilities:
      responses: false
      chat_completions: true
      text: true
      streaming: true
      tools: true
      structured_output: true
      embeddings: false
      audio: false
      images: false
      cancellation: true
      app_extensions: false
    security:
      dpop: full
      native_key_isolation: partial
    limitations:
      - Full local Koog 1.1.1 conformance passes only with OkHttp/okhttp-sse 5.3.0, explicit utils-jvm 1.1.1, Kotlin Logging 8.0.01, and an absolute chat path; 4.9.2 passes the four non-streaming cases but is incompatible with Koog SSE.
      - Hosted gateway, live-provider, physical Play-distributed key, exact-image, and versions beyond the exact tested tuple remain release gates.
  - id: langchain-js
    name: LangChain JavaScript
    tier: tier_1
    ecosystem: javascript
    package: "@langchain/openai"
    integration: underlying_client
    latchway_package: "@latchway/langchain"
    support: experimental
    tested:
      minimum: 1.5.10
      latest: 1.5.10
    capabilities:
      responses: false
      chat_completions: true
      text: true
      streaming: true
      tools: conditional
      structured_output: conditional
      embeddings: true
      audio: false
      images: false
      cancellation: true
      app_extensions: false
    security:
      dpop: full
      native_key_isolation: not_applicable
    limitations:
      - Local @langchain/openai 1.5.10 case-ID tests pass Chat, embeddings, streaming usage, tools, structured output, cancellation, error mapping, retry/refresh, and transport security; hosted/exact-image, live-provider, and revocation evidence remain release gates.
  - id: macpaw-openai
    name: MacPaw OpenAI
    tier: tier_1
    ecosystem: apple
    package: MacPaw/OpenAI
    integration: url_protocol_via_injected_session
    latchway_package: LatchwayOpenAI
    support: unsupported
    tested:
      minimum: 0.5.1
      latest: 0.5.1
    capabilities:
      responses: false
      chat_completions: false
      text: false
      streaming: false
      tools: false
      structured_output: false
      embeddings: false
      audio: false
      images: false
      cancellation: false
      app_extensions: false
    security:
      dpop: not_applicable
      native_key_isolation: not_applicable
    limitations:
      - Published MacPaw/OpenAI 0.5.1 remains unsupported because streams discard the injected URLSession configuration. An unreleased configuration-propagation patch passes 213 upstream tests and a URLProtocol interception/cancellation probe, but no adapter ships and the patch is not accepted or released.
  - id: openai-js
    name: OpenAI JavaScript SDK
    tier: tier_1
    ecosystem: javascript
    package: openai
    integration: custom_fetch
    latchway_package: "@latchway/openai"
    support: experimental
    tested:
      minimum: 7.8.0
      latest: 7.8.0
    capabilities:
      responses: true
      chat_completions: true
      text: true
      streaming: true
      tools: conditional
      structured_output: conditional
      embeddings: true
      audio: conditional
      images: conditional
      cancellation: true
      app_extensions: false
    security:
      dpop: full
      native_key_isolation: not_applicable
    limitations:
      - Local OpenAI 7.8.0 case-ID tests pass Responses, Chat, embeddings, Responses/Chat streaming usage, tools, structured output, cancellation, error mapping, retry/refresh, and transport security; media, hosted/exact-image, live-provider, and revocation evidence remain release gates.
  - id: react-native-fetch
    name: React Native framework fetch
    tier: tier_1
    ecosystem: react_native
    package: react-native
    integration: native_backed_fetch
    latchway_package: "@latchway/react-native"
    support: experimental
    tested:
      minimum: 0.82.0
      latest: 0.82.0
    capabilities:
      responses: true
      chat_completions: true
      text: true
      streaming: true
      tools: conditional
      structured_output: conditional
      embeddings: true
      audio: false
      images: false
      cancellation: true
      app_extensions: false
    security:
      dpop: partial
      native_key_isolation: partial
    limitations:
      - React Native 0.82.0 New Architecture local gates pass. A real iPad running iPadOS 26.5 built commit 6de46e1c7264e1d45cdd31174e4ea040a8c24acf in Debug configuration with automatic Apple Development signing.
      - That development run proved production App Attest registration and same-key assertion, Secure Enclave DPoP, gateway traffic, quota, typed component denial, bridge behavior, and cleanup.
      - Android physical-device evidence, delegated-extension Release-candidate evidence, and protected Apple distribution-derived evidence remain pending.
  - id: swift-openai
    name: SwiftOpenAI
    tier: tier_1
    ecosystem: apple
    package: SwiftOpenAI/SwiftOpenAI
    integration: async_http_client
    latchway_package: LatchwaySwiftOpenAI
    support: experimental
    tested:
      minimum: 4.6.0
      latest: 4.6.0
    capabilities:
      responses: true
      chat_completions: true
      text: true
      streaming: true
      tools: conditional
      structured_output: conditional
      embeddings: conditional
      audio: conditional
      images: conditional
      cancellation: conditional
      app_extensions: conditional
    security:
      dpop: full
      native_key_isolation: partial
    limitations:
      - Buffered and line-stream HTTP pass exact SwiftOpenAI 4.6.0 tests; WebSocket Realtime bypasses the injectable HTTP client and is unsupported, while physical cancellation proof is pending.
  - id: vercel-ai-sdk
    name: Vercel AI SDK
    tier: tier_1
    ecosystem: javascript
    package: ai
    integration: custom_provider
    latchway_package: "@latchway/vercel-ai"
    support: experimental
    tested:
      minimum: 7.0.85
      latest: 7.0.85
    capabilities:
      responses: true
      chat_completions: true
      text: true
      streaming: true
      tools: conditional
      structured_output: conditional
      embeddings: true
      audio: false
      images: conditional
      cancellation: true
      app_extensions: false
    security:
      dpop: full
      native_key_isolation: not_applicable
    limitations:
      - Local AI SDK 7.0.85/@ai-sdk/openai 4.0.52 case-ID tests pass Responses, Chat, embeddings, both streams, tools, typed output, cancellation, errors, retry/refresh, and transport security; images, hosted/exact-image, live-provider, and revocation evidence remain release gates.
