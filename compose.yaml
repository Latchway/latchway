name: latchway

services:
  postgres:
    image: docker.io/library/postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-latchway}
      POSTGRES_USER: ${POSTGRES_USER:-latchway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-latchway-local-development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${LATCHWAY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  latchway:
    build:
      context: .
      args:
        VERSION: 1.0.0-rc.1
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 35s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LATCHWAY_DATABASE_URL: ${LATCHWAY_DATABASE_URL:-postgres://latchway:latchway-local-development@postgres:5432/latchway?sslmode=disable}
      LATCHWAY_ROLE: ${LATCHWAY_ROLE:-all}
      LATCHWAY_LOG_LEVEL: ${LATCHWAY_LOG_LEVEL:-info}
      LATCHWAY_PUBLIC_ORIGIN: ${LATCHWAY_PUBLIC_ORIGIN:-http://localhost:8080}
      LATCHWAY_MASTER_KEY: ${LATCHWAY_MASTER_KEY:?generate and persist a base64-encoded 32-byte LATCHWAY_MASTER_KEY in .env}
      LATCHWAY_ADMIN_BOOTSTRAP_TOKEN: ${LATCHWAY_ADMIN_BOOTSTRAP_TOKEN:-}
      LATCHWAY_ADMIN_SESSION_LIFETIME: ${LATCHWAY_ADMIN_SESSION_LIFETIME:-12h}
      PORT: 8080
    ports:
      - "${LATCHWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/latchway", "doctor", "--output", "json"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
