name: latchway

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-latchway}
      POSTGRES_USER: ${POSTGRES_USER:-latchway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-latchway-local-development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${LATCHWAY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  latchway:
    build:
      context: .
      args:
        VERSION: 0.1.0-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LATCHWAY_DATABASE_URL: ${LATCHWAY_DATABASE_URL:-postgres://latchway:latchway-local-development@postgres:5432/latchway?sslmode=disable}
      LATCHWAY_ROLE: ${LATCHWAY_ROLE:-all}
      LATCHWAY_LOG_LEVEL: ${LATCHWAY_LOG_LEVEL:-info}
      LATCHWAY_PUBLIC_ORIGIN: ${LATCHWAY_PUBLIC_ORIGIN:-http://localhost:8080}
      LATCHWAY_ADMIN_BOOTSTRAP_TOKEN: ${LATCHWAY_ADMIN_BOOTSTRAP_TOKEN:-}
      LATCHWAY_ADMIN_SESSION_LIFETIME: ${LATCHWAY_ADMIN_SESSION_LIFETIME:-12h}
      PORT: 8080
    ports:
      - "${LATCHWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/latchway", "doctor", "--output", "json"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
