name: latchway-release

services:
  postgres:
    image: docker.io/library/postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-latchway}
      POSTGRES_USER: ${POSTGRES_USER:-latchway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          result=$$(PGPASSWORD="$${POSTGRES_PASSWORD}" PGCONNECT_TIMEOUT=2 PGOPTIONS="-c statement_timeout=2000" psql -X -w -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -At -v ON_ERROR_STOP=1 -c "SELECT 1" 2>/dev/null) && [ "$$result" = 1 ]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    image: ${LATCHWAY_IMAGE:?set LATCHWAY_IMAGE to the verified release image by digest}
    pull_policy: always
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LATCHWAY_DATABASE_URL: ${LATCHWAY_DATABASE_URL:?set the PostgreSQL URL with sslmode appropriate for this network}
    command: ["migrate", "up"]

  latchway:
    image: ${LATCHWAY_IMAGE:?set LATCHWAY_IMAGE to the verified release image by digest}
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    stop_grace_period: 35s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      LATCHWAY_DATABASE_URL: ${LATCHWAY_DATABASE_URL:?set the PostgreSQL URL with sslmode appropriate for this network}
      LATCHWAY_MASTER_KEY: ${LATCHWAY_MASTER_KEY:?set a persisted base64-encoded 32-byte master key}
      LATCHWAY_PUBLIC_ORIGIN: ${LATCHWAY_PUBLIC_ORIGIN:?set the final HTTPS origin}
      LATCHWAY_ADMIN_BOOTSTRAP_TOKEN: ${LATCHWAY_ADMIN_BOOTSTRAP_TOKEN:-}
      LATCHWAY_ROLE: all
      LATCHWAY_LOG_LEVEL: ${LATCHWAY_LOG_LEVEL:-info}
      LATCHWAY_MIGRATE_ON_START: "false"
      LATCHWAY_DB_MAX_CONNECTIONS: ${LATCHWAY_DB_MAX_CONNECTIONS:-20}
      LATCHWAY_DB_COMPLETION_CONNECTIONS: ${LATCHWAY_DB_COMPLETION_CONNECTIONS:-5}
      LATCHWAY_SHUTDOWN_TIMEOUT: 30s
      PORT: "8080"
    ports:
      - "127.0.0.1:${LATCHWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/latchway", "--server", "http://127.0.0.1:8080", "--output", "json", "readiness"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
