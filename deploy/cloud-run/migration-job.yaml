# Cloud Run does not support Kubernetes securityContext. The immutable
# Latchway image explicitly runs as UID/GID 65532.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: latchway-migrate
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: ${CLOUD_SQL_CONNECTION_NAME}
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: ${MIGRATOR_SERVICE_ACCOUNT}
          maxRetries: 0
          timeoutSeconds: "900"
          containers:
            - name: latchway-migrate
              image: ${LATCHWAY_IMAGE}
              command: ["/latchway"]
              args: ["migrate", "up"]
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: LATCHWAY_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: latchway-database-url
                      key: ${DATABASE_SECRET_VERSION}
