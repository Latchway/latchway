apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: latchway
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: ${CLOUD_SQL_CONNECTION_NAME}
    spec:
      serviceAccountName: ${RUNTIME_SERVICE_ACCOUNT}
      containerConcurrency: 100
      timeoutSeconds: 3600
      containers:
        - name: latchway
          image: ${LATCHWAY_IMAGE}
          command: ["/latchway"]
          args: ["serve", "--role", "all"]
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: LATCHWAY_ROLE
              value: all
            - name: LATCHWAY_LOG_LEVEL
              value: info
            - name: LATCHWAY_MIGRATE_ON_START
              value: "false"
            - name: LATCHWAY_PUBLIC_ORIGIN
              value: "${LATCHWAY_PUBLIC_ORIGIN}"
            - name: LATCHWAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: latchway-database-url
                  key: ${DATABASE_SECRET_VERSION}
            - name: LATCHWAY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: latchway-master-key
                  key: ${MASTER_KEY_SECRET_VERSION}
            # Cloud Run sends SIGTERM only 10 seconds before forced shutdown.
            - name: LATCHWAY_SHUTDOWN_TIMEOUT
              value: "8s"
            - name: LATCHWAY_DB_MAX_CONNECTIONS
              value: "20"
            - name: LATCHWAY_DB_COMPLETION_CONNECTIONS
              value: "5"
          startupProbe:
            initialDelaySeconds: 1
            timeoutSeconds: 3
            periodSeconds: 3
            failureThreshold: 40
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            timeoutSeconds: 3
            periodSeconds: 15
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
