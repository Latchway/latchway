version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/database/queries
    gen:
      go:
        package: dbsql
        out: internal/database/dbsql
        sql_package: pgx/v5
        emit_db_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: false
        query_parameter_limit: 4
        overrides:
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
